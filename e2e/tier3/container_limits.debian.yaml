---
# Debian and Ubuntu only. Applied on top of container_limits.yaml, which container.sh reads first.
#
# balenaEtcher's vendor .deb declares an alternative dependency on a graphical authentication agent,
# polkit-1-auth-agent | policykit-1-gnome | polkit-kde-1, and a container with no desktop satisfies
# none of them. Measured on debian:trixie in the defaults scenario on 2026-08-17: the download
# succeeded, the file was staged correctly, and apt refused the install with
# "Dependency is not satisfiable: polkit-1-auth-agent|policykit-1-gnome|polkit-kde-1".
#
# This is the package's own requirement rather than a defect in the playbook, and it is satisfied on
# any real machine that installed KDE or GNOME. It is suppressed here rather than everywhere for two
# reasons. Fedora's rpm carries no such dependency and installs the same application cleanly, which
# the same run proved, so suppressing it globally would throw away that coverage. And a desktop
# scenario on Debian would satisfy the dependency, so this file is the wrong place to decide it for
# a scenario that installs a desktop.
#
# Worth knowing outside the harness: on a headless Debian or Ubuntu, this application cannot be
# installed by any means, so a user running the playbook on a server will see the same failure and
# it is honest for them to see it.
install_balena_etcher: false
