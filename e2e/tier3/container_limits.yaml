---
# Toggles a container provably cannot satisfy on any distribution, applied on top of
# every scenario.
#
# This list is deliberately short. Anything merely slow, awkward or likely to fail
# stays enabled, because pre-suppressing it would turn a real defect into a silent
# gap and the whole point of this harness is to stop doing that. Only things that
# need hardware or a kernel facility a container does not have are listed, with the
# reason, and the runner prints the list on every run so nobody mistakes a scenario
# for full coverage.
#
# A limitation that holds on one distribution and not another belongs in
# container_limits.<os>.yaml instead, which container.sh appends after this file.
# See container_limits.fedora.yaml for the case that established the need: the same
# DKMS failure is fatal to an RPM transaction and harmless to a pacman one.
#
# This block used to say that container artefacts not suppressed here were recorded
# per scenario in an `e2e_expected_failures` key. No scenario ever declared one and
# nothing ever read one, so it described a mechanism that did not exist, which is
# the same "a comment claiming an implementation" trap as the install_gradle entry
# in docs/regression_ledger.md. The per-distribution file above is the real answer.

# Needs a real swap device and a resume= kernel parameter on the running kernel.
setup_hibernate: false

# Needs an EFI system partition and a block device to install a bootloader onto.
setup_systemd_boot: false
setup_grub: false
remove_distro_grub: false
remove_distro_systemd_boot: false

# Needs the binder and ashmem kernel modules, which belong to the host kernel.
install_waydroid: false

# Both build kernel modules against the running kernel, which is the host's.
install_virtualbox: false
install_vmware: false

# Needs a btrfs filesystem to snapshot. The container's overlayfs is not one.
install_snapper: false

# JetBrains Toolbox installs the Toolbox application itself fine, and then cannot install a single
# IDE in a container. Measured on the Debian and Fedora defaults runs of 2026-08-17, where the new
# collector correctly reported all five as absent: idea, pycharm, webstorm, datagrip and rider.
#
# Three reasons, none of which a container can satisfy. Each IDE is roughly a gigabyte, so five of
# them is more disk than a scenario image is given. Toolbox drives its installs through a background
# service that expects a desktop session. And a licensed product wants a JetBrains account to be
# logged in, which an unattended run has no way to provide.
#
# Suppressed as a whole rather than per IDE, because the toggle is one switch and the Toolbox install
# on its own proves nothing worth the twenty minutes it costs. On a real machine this is one of the
# most valuable things the playbook does, so this suppression is a statement about containers and not
# about the feature.
install_jetbrains_toolbox: false
