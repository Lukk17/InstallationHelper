---
# Wizard path: setup.sh --software all, which is Step 2 "customise" with every entry in the
# checklist selected except opencode_use_v1, see below.
#
# The toggle list is the wizard's own checklist, resolved at run time out of setup.sh
# rather than written out here, so it can never fall behind a newly added toggle. That
# matters: a hand maintained copy of the list would quietly stop covering new software,
# which is the same silent-gap failure this suite exists to catch. The runner appends one
# `<key>: true` line per toggle the checklist offers and writes the result into the run
# directory, so the exact input is always recoverable from the run record.
#
# The checklist is not the same thing as every install_ toggle, and until 2026-08-29 this
# scenario used the latter. It leaves out install_kde_plasma and install_gnome, which the
# wizard puts on a screen of their own where exactly one environment is chosen, so this
# scenario no longer installs both desktops onto one machine. It adds the four system
# settings whose names do not begin with install_. The 300 minute ceiling below has not
# been re-measured since, and is deliberately left where it was rather than lowered on an
# expectation.
#
# What setup.sh --software all leaves off stays off here too, because container.sh reads
# ALL_SOFTWARE_KEEPS_OFF out of setup.sh and writes those keys false. Today that is
# opencode_use_v1, so this scenario installs OpenCode version 2 and removes nothing, which
# the owner decided on 2026-10-15. No container scenario selects OpenCode version 1 since
# then, see e2e/manual_test_matrix.md.
e2e_scenario_name: "all-software"
e2e_scenario_description: "every checklist toggle forced true except what setup.sh --software all leaves off, as --software all produces"
e2e_generate: all_software
e2e_timeout_minutes: 300
e2e_expect_desktop: none

# Excluded from the generated list. Not a convenience: this one clones the
# AUTOMATIC1111 repository and pulls gigabytes of model weights, and group_vars ships
# it false for the same reason. Enable it by hand if you specifically want to test it.
e2e_generate_except:
  - stable_diffusion
