---
# Not a wizard path. This is the fast gate meant to run before every commit, so it
# turns almost everything off and keeps only the toggles that sit on top of a defect
# this project has actually shipped. It finishes in minutes instead of hours, which
# is the difference between a check that gets run and one that does not.
#
# Each toggle below earns its place by naming the regression it covers. Adding a
# toggle here without a reason makes the gate slower for nothing, so do not.
e2e_scenario_name: "smoke"
e2e_scenario_description: "fast pre-commit gate over the toggles that have historically broken"
e2e_timeout_minutes: 45
e2e_expect_desktop: none

# Everything off, then a short allow-list back on.
e2e_generate: no_software

# Stated rather than left to the generator. install_system_core gates the whole system_core
# role, and the generator used to sweep it false along with the software toggles, so this
# scenario skipped the bootstrap entirely and reported a pass over far less than it looked
# like. That hid a bug where flatpak was never installed on Arch, which killed every real
# Arch run fifteen minutes in. The generator now excludes it, and stating it here as well
# means the coverage is declared instead of depending on that exclusion staying correct.
install_system_core: true

# OpenRazer: the plugdev group did not exist on Arch, which failed every run, and no
# kernel headers were installed so the DKMS driver never built.
install_openrazer: true
# Tailscale: the playbook enables tailscaled in system scope, so this covers the
# systemd unit path and needs real systemd to mean anything.
install_tailscale: true
# Syncthing: covers the systemd USER unit path and the no-login-session branch.
install_syncthing: true
# Steam lives in multilib, so it covers arch_core enabling multilib before the
# batched pacman install, and the could-not-find failure path if it does not.
install_steam: true
# One AUR package, to cover arch_core building an AUR helper from source at all.
install_chkrootkit: true
# One flatpak, which needs system_core to have installed flatpak and added the Flathub
# remote first. Flatpak itself is not a toggle, so verification asserts the remote exists
# rather than a package being present. That assertion is what catches a distribution the
# flatpak install forgot, and Arch was that distribution.
install_polychromatic: true
# Docker, because virtualization_config adds the user to the docker group and starts
# the daemon, and group membership is exactly the class of bug that started this.
install_docker: true
