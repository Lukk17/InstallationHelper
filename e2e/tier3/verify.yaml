---
# Tier 3 verification. A wrapper, nothing more: every assertion it makes lives in
# setup/ansible/verify_install.yaml, which is the play a person runs on a real machine and the play
# the wizard runs as its last step. One implementation, two callers, so a container run and a real
# install assert exactly the same things and neither can drift from the other.
#
# This file used to be that implementation, with /work paths written into it, which meant the only
# proven post-install check in the repository could not be run on the machine it was written for.
#
# The path is decided by which copy exists, and that is what makes the same file work in both
# places. container.sh copies the working tree's setup/ to /work/setup and this file to
# /work/verify.yaml, so inside the container the play sits at an absolute path that has nothing to
# do with where this wrapper landed. Outside the container that path does not exist and the
# repository copy two directories up is the right one, which is what tier 1's syntax check of this
# file resolves. A relative path cannot serve both: import_playbook resolves it against this file's
# own directory and nothing else, measured, so from /work/verify.yaml `../../setup` is /setup.
#
# The imported play locates group_vars and vars from its own position, so there is nothing else for
# this wrapper to tell it. playbook_dir inside an imported playbook is that playbook's directory,
# also measured, which is /work/setup/ansible for the container copy.
- name: Verify the state the playbook was supposed to produce, from the container's copy
  ansible.builtin.import_playbook: >-
    {{ '/work/setup/ansible/verify_install.yaml'
       if '/work/setup/ansible/verify_install.yaml' is exists
       else '../../setup/ansible/verify_install.yaml' }}
