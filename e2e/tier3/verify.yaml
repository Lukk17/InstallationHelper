---
# Tier 3 verification. Asserts observable system state only: what is installed, what
# systemd thinks, what groups the user is in. No log-substring matching, because log
# wording drifts between versions and tells you nothing about whether the machine
# ended up in the right shape.
#
# Every check collects the full list of problems before failing, so one run reports
# everything wrong rather than stopping at the first thing.
#
# Toggle resolution mirrors site.yaml on purpose: group_vars loaded here, then the
# scenario's own values arriving as extra-vars, which outrank everything.

- name: Verify the state the playbook was supposed to produce
  hosts: all
  connection: local
  gather_facts: true

  pre_tasks:
    # The same derivation the playbook runs, and for the same reason: Ansible answers with the
    # distribution's own name for anything its table has never heard of, so on Nobara this play would
    # look for vars/Nobara.yaml and fail for a reason that has nothing to do with the software it is
    # supposed to be checking. Importing the shipped file rather than copying its expressions is the
    # point, because a second copy of the derivation would drift from the one under test and this play
    # exists to check the playbook, not to agree with it.
    #
    # include_tasks rather than import_tasks, and that is not a style choice. import resolves at parse
    # time, so tier 1's syntax check of this file would go looking for /work on the machine running the
    # gate, where nothing is mounted, and fail. include resolves when the play runs, which is inside the
    # container where that path exists. The file is still syntax-checked, because site.yaml imports it.
    - name: Derive the same family facts the playbook derives
      ansible.builtin.include_tasks: /work/setup/ansible/tasks/derive_os_facts.yaml

    - name: Load cross-platform toggles
      ansible.builtin.include_vars:
        file: /work/setup/ansible/group_vars/all.yaml

    - name: Load Linux toggles
      ansible.builtin.include_vars:
        file: /work/setup/ansible/group_vars/linux.yaml
      when: ansible_facts['system'] == 'Linux'

    # site.yaml loads this as a vars_file and so must this play. Two things here need it. The URL
    # collector below resolves <key>_url and <key>_rpm_url out of this file through lookup('vars'),
    # and any OS dictionary entry that templates a pinned value would otherwise fail to render at all.
    #
    # The second reason is why this load exists: Debian used to map appimagelauncher to
    # `{ manager: apt_url, package: "{{ appimage_launcher_url }}" }`, so rendering software_mapping
    # through dict2items failed with "'appimage_launcher_url' is undefined" and took the whole
    # verification with it. Arch never showed it, because it maps the same application to the AUR by
    # name with no URL to dereference, so five green Arch runs proved nothing about it. Found by the
    # first Debian and Ubuntu smoke runs, recorded in docs/regression_ledger.md. That mapping now
    # holds a literal package name, so this particular trigger is gone and the load is not.
    - name: Load the pinned versions the OS dictionaries template against
      ansible.builtin.include_vars:
        file: /work/setup/ansible/group_vars/versions.yaml

    - name: Load the OS translation dictionary
      ansible.builtin.include_vars:
        file: "/work/setup/ansible/vars/{{ ih_family }}.yaml"
        name: os_dict

  tasks:
    # --- what the toggles asked for -----------------------------------------
    - name: Determine which mapped software this run enabled
      ansible.builtin.set_fact:
        enabled_mapped: "{{ enabled_mapped | default([]) + [item.key] }}"
      loop: "{{ os_dict.software_mapping | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: lookup('vars', 'install_' ~ item.key, default=false) | bool

    # apt_url and dnf_url belong in this list even though nothing about them goes through an
    # ordinary repository, because the end state is the same: dpkg or rpm records the package and
    # `package` in the OS dictionary is the name it records. Leaving them out meant nine mappings
    # across Debian, Ubuntu and Fedora were installed by the playbook and checked by nothing, and
    # the way they fail is silent by construction: both dispatch tasks are guarded by
    # `when: item_url | length > 0`, so a URL variable that renders empty skips the download and
    # the install without a warning and the run stays green. Minikube, TeamViewer, VeraCrypt,
    # AppImageLauncher and balenaEtcher all sit in that path.
    - name: Split the enabled software by package manager
      ansible.builtin.set_fact:
        expected_native: >-
          {{ os_dict.software_mapping | dict2items
             | selectattr('key', 'in', enabled_mapped | default([]))
             | selectattr('value.manager', 'in', ['pacman', 'aur', 'apt', 'dnf', 'apt_url', 'dnf_url'])
             | map(attribute='value.package') | list }}
        expected_flatpak: >-
          {{ os_dict.software_mapping | dict2items
             | selectattr('key', 'in', enabled_mapped | default([]))
             | selectattr('value.manager', 'equalto', 'flatpak')
             | map(attribute='value.package') | list }}

    # The missing-package comparison below catches a URL install that did not happen, but it cannot
    # say why. This names the one cause that produces no output anywhere: a rendered download
    # location of zero length, which both dispatch paths treat as "nothing to do". The two candidate
    # orders mirror dynamic_install.yaml, per manager, rather than merging them, because on Debian
    # several of these keys also have an unrelated <key>_rpm_url and reading that one would report a
    # location the apt path never looks at. Both sides also trim before measuring length, so a
    # variable holding nothing but whitespace is an absent location to the check and to the playbook
    # alike rather than one to each.
    # Named as its own fact so the assertion below can prove it examined something. An assertion over
    # an empty candidate list passes and reads exactly like an assertion that found no problem, which
    # is the trap the native-package assertion already guards against forty lines above by requiring
    # a non-empty expected set.
    - name: Record which URL-installed packages this run examined
      ansible.builtin.set_fact:
        url_candidates: >-
          {{ os_dict.software_mapping | dict2items
             | selectattr('key', 'in', enabled_mapped | default([]))
             | selectattr('value.manager', 'in', ['apt_url', 'dnf_url'])
             | map(attribute='key') | list }}

    - name: Collect any enabled URL-installed package with no download location
      ansible.builtin.set_fact:
        url_without_location: "{{ url_without_location | default([]) + [item.key] }}"
      loop: >-
        {{ os_dict.software_mapping | dict2items
           | selectattr('key', 'in', enabled_mapped | default([]))
           | selectattr('value.manager', 'in', ['apt_url', 'dnf_url']) | list }}
      loop_control:
        label: "{{ item.key }}"
      vars:
        deb_url: "{{ item.value.url | default(lookup('vars', item.key ~ '_url', default='')) }}"
        rpm_url: >-
          {{ item.value.url
             | default(lookup('vars', item.key ~ '_rpm_url', default=''))
             | default(lookup('vars', item.key ~ '_url', default=''), true) }}
        item_url: "{{ rpm_url if item.value.manager == 'dnf_url' else deb_url }}"
      when: item_url | trim | length == 0

    # --- what is actually there ---------------------------------------------
    # One command per family, each printing one bare package name per line so the
    # comparison below is family-independent. Ubuntu is not listed separately because
    # Ansible reports it as the Debian family, which is also why it shares
    # vars/Debian.yaml and why it needs its own container to catch the cases where that
    # sharing is wrong.
    #
    # Set as a fact once, because this mapping used to be written out twice: once as task vars for
    # the query below and once again as task vars for the plausibility assertion further down, whose
    # failure message quotes the command it ran. Two copies of the same per-family fact is the
    # two-lists problem the wizards already had, and here the drift would be invisible in the worst
    # way: the assertion would keep passing or failing on the real query while telling the reader to
    # go and check a different command. The doubled backslash before n is deliberate and is explained
    # in the next comment.
    - name: Define the per-family installed-package query
      ansible.builtin.set_fact:
        native_query:
          Archlinux: "pacman -Qq"
          Debian: "dpkg-query -W -f='${Package}\\n'"
          RedHat: "rpm -qa --qf '%{NAME}\\n'"

    # `shell` rather than `command`, and the single quotes around each format string are
    # load-bearing. dpkg-query and rpm interpret `\n` in a format string themselves, so the two
    # characters backslash and n have to reach them, and `command` cannot deliver them: it splits
    # its argument with shlex in POSIX mode, which consumes a backslash as an escape. Measured in a
    # clean debian:trixie container with real Ansible:
    #
    #   command, -f=${Package}\n       1 line,   adduseransibleansible-coreapt...
    #   shell,   -f='${Package}\n'     201 lines, adduser / ansible / ansible-core / apt
    #
    # The single quotes also stop the shell expanding ${Package} and %{NAME} itself, which would
    # substitute empty strings and print nothing at all.
    #
    # Splitting that one concatenated line on newline produced a single enormous pseudo-package, so
    # the difference against the expected set reported every expected package as missing. Arch was
    # unaffected because `pacman -Qq` needs no format string, which meant the largest assertion in
    # this play could not pass on Debian, Ubuntu or Fedora and always passed on Arch: the worst
    # available arrangement, because it looked proven.
    - name: List installed native packages
      ansible.builtin.shell: "{{ native_query[ih_family] }}"
      register: installed_native_raw
      changed_when: false
      failed_when: false
      when: ih_family in ['Archlinux', 'Debian', 'RedHat']

    - name: List installed flatpak applications
      ansible.builtin.command: flatpak list --app --columns=application
      register: installed_flatpak_raw
      changed_when: false
      failed_when: false

    - name: Normalise the installed sets
      ansible.builtin.set_fact:
        installed_native: "{{ (installed_native_raw.stdout | default('')).split('\n') | map('trim') | select() | list }}"
        installed_flatpak: "{{ (installed_flatpak_raw.stdout | default('')).split('\n') | map('trim') | select() | list }}"

    # A query that answers wrongly is worse than one that errors, because the comparison below
    # still runs and reports every expected package as missing, which reads exactly like a
    # playbook that installed nothing. That is what the eaten newline produced. Both queries carry
    # failed_when: false, so nothing else would have caught it.
    #
    # Any Linux installation has hundreds of packages, and the lightest container here reported
    # 194. Fifty is far below anything real and far above anything a broken format string produces,
    # which is one. This asserts the input to the comparison before trusting the comparison.
    #
    # The expected side is asserted too, because an assertion over an empty set passes and looks
    # exactly like an assertion that found everything. The tally task below prints both counts, but
    # the dual_logger callback does not show a debug message on an ok task, so a set of zero was
    # invisible in the log and in result.txt alike. Every scenario in the suite expects at least one
    # native package, including live-profile whose whole point is turning most of them off, so zero
    # means the expected-set computation broke rather than that a scenario has nothing to check.
    - name: Assert the installed-package query returned a plausible list
      ansible.builtin.assert:
        that:
          - installed_native | length > 50
          - expected_native | length > 0
        fail_msg: >-
          Installed {{ installed_native | length }} entries, expected set {{ expected_native | length }}.
          Fewer than fifty installed cannot be right for a working
          {{ ih_family }} system, and an expected set of zero means nothing was
          going to be checked, so either way every comparison below would be meaningless. The query
          was "{{ native_query[ih_family] | default('none') }}". If the installed
          count is the problem, check that the format string still reaches the tool intact: it must
          run through `shell` with the format single-quoted, because `command` shlex-splits its
          argument and eats the backslash, which makes every package name come back concatenated
          into one line. If the expected count is the problem, the fault is in the toggle resolution
          or the OS dictionary rather than in the query.
        success_msg: >-
          installed-package query returned {{ installed_native | length }} entries, expected set is
          {{ expected_native | length }}
      when: ih_family in ['Archlinux', 'Debian', 'RedHat']

    - name: Work out what is missing
      ansible.builtin.set_fact:
        missing_native: "{{ expected_native | difference(installed_native) }}"
        missing_flatpak: "{{ expected_flatpak | difference(installed_flatpak) }}"

    - name: Report the software tally
      ansible.builtin.debug:
        msg:
          - "native expected {{ expected_native | length }}, missing {{ missing_native | length }}"
          - "flatpak expected {{ expected_flatpak | length }}, missing {{ missing_flatpak | length }}"
          - "missing native: {{ missing_native | default([]) | join(', ') | default('none', true) }}"
          - "missing flatpak: {{ missing_flatpak | default([]) | join(', ') | default('none', true) }}"
          - "URL-installed candidates examined {{ url_candidates | default([]) | length }}, without a download location {{ (url_without_location | default([])) | length }}"

    # --- systemd units -------------------------------------------------------
    # Only asserted when the toggle that owns the unit was on, so a scenario that
    # never asked for Tailscale is not marked down for not having it.
    - name: Check the tailscaled unit
      ansible.builtin.command: systemctl is-enabled tailscaled.service
      register: tailscaled_enabled
      changed_when: false
      failed_when: false
      when: install_tailscale | default(false) | bool

    - name: Check the docker unit
      ansible.builtin.command: systemctl is-enabled docker.service
      register: docker_enabled
      changed_when: false
      failed_when: false
      when: install_docker | default(false) | bool

    # --- flatpak and the Flathub remote --------------------------------------
    # system_core installs flatpak and adds the Flathub remote on every Linux, so both are
    # asserted whenever that role ran. This is the check that would have caught flatpak never
    # being installed on Arch: the remote-add shelled out to a missing binary and the play
    # died, but nothing downstream ever asserted the remote existed.
    - name: List the configured flatpak remotes
      ansible.builtin.command: flatpak remotes --columns=name
      register: flatpak_remotes
      changed_when: false
      failed_when: false
      become: true
      when: install_system_core | default(false) | bool

    # --- group membership ----------------------------------------------------
    # The OpenRazer group is the regression that started this harness: the name is a
    # per-distribution fact and was hardcoded to Debian's answer.
    - name: Read the invoking user's groups
      ansible.builtin.command: "id -nG {{ ansible_facts['user_id'] }}"
      register: user_groups
      changed_when: false

    # --- the temporary sudoers entry must be gone ---------------------------
    # become is required: /etc/sudoers.d is mode 0750 and root-owned, so an unprivileged
    # stat fails with Permission denied rather than reporting the file's absence.
    - name: Check that the temporary passwordless sudoers entry was removed
      ansible.builtin.stat:
        path: /etc/sudoers.d/99-ansible-user
      become: true
      register: temp_sudoers

    # --- desktop environment ------------------------------------------------
    # Probes for the binary rather than a package name. The package names differ per
    # family and are not even packages everywhere: KDE is kde-standard on Debian,
    # plasma-meta on Arch and the "@KDE Plasma Workspaces" group on Fedora. The shell
    # binary is the same path on all three, and its presence is what actually determines
    # whether the user gets a desktop. gnome_setup already stats this exact path.
    - name: Check for the expected desktop environment
      ansible.builtin.stat:
        path: "{{ '/usr/bin/plasmashell' if (e2e_expect_desktop | default('none')) == 'kde' else '/usr/bin/gnome-shell' }}"
      register: de_probe
      when: (e2e_expect_desktop | default('none')) in ['kde', 'gnome']

    # --- assertions ----------------------------------------------------------
    - name: Assert every enabled native package is installed
      ansible.builtin.assert:
        that: missing_native | length == 0
        success_msg: "PASS native packages: all {{ expected_native | length }} present"
        fail_msg: "FAIL native packages missing: {{ missing_native | join(', ') }}"
        quiet: true

    # The second condition is family-dependent, and deliberately so. Arch installs nothing from a
    # vendor URL, so an empty candidate list is the correct answer there, while on Debian, Ubuntu and
    # Fedora it means the selection above broke and the check is reporting on nothing.
    - name: Assert every enabled URL-installed package resolved a download location
      ansible.builtin.assert:
        that:
          - (url_without_location | default([])) | length == 0
          - url_candidates | length > 0 or ih_family not in ['Debian', 'RedHat']
        success_msg: >-
          PASS URL-installed packages: all {{ url_candidates | length }} enabled ones have a download
          location
        # Both conditions get a sentence, because a message describing only the first one would send
        # the reader looking for a broken URL when what actually broke was the selection.
        fail_msg: >-
          FAIL URL-installed packages. Examined {{ url_candidates | length }} candidates, of which
          {{ (url_without_location | default([])) | length }} have no download location:
          {{ (url_without_location | default([])) | join(', ') | default('none', true) }}. A location
          comes from <key>_url in group_vars/versions.yaml, or <key>_rpm_url on Fedora, or an inline
          url: field on the mapping itself, and when it renders empty the playbook skips both the
          download and the install without saying so. If instead the candidate count is zero on
          {{ ih_family }}, nothing was examined at all and the fault is in the
          manager selection or in the toggle resolution rather than in any one URL.
        quiet: true

    - name: Assert every enabled flatpak application is installed
      ansible.builtin.assert:
        that: missing_flatpak | length == 0
        success_msg: "PASS flatpak applications: all {{ expected_flatpak | length }} present"
        fail_msg: "FAIL flatpak applications missing: {{ missing_flatpak | join(', ') }}"
        quiet: true

    - name: Assert tailscaled is enabled when Tailscale was requested
      ansible.builtin.assert:
        that: tailscaled_enabled.rc == 0
        success_msg: "PASS tailscaled is enabled"
        fail_msg: "FAIL tailscaled is not enabled, systemctl said: {{ tailscaled_enabled.stdout | default('') }} {{ tailscaled_enabled.stderr | default('') }}"
        quiet: true
      when: install_tailscale | default(false) | bool

    - name: Assert the user is in the OpenRazer device group when OpenRazer was requested
      ansible.builtin.assert:
        that: os_dict.openrazer_device_group in user_groups.stdout.split()
        success_msg: "PASS user is in {{ os_dict.openrazer_device_group }}"
        fail_msg: "FAIL user is not in {{ os_dict.openrazer_device_group }}, groups are: {{ user_groups.stdout }}"
        quiet: true
      when: install_openrazer | default(false) | bool

    - name: Assert the user is in the docker group when Docker was requested
      ansible.builtin.assert:
        that: "'docker' in user_groups.stdout.split()"
        success_msg: "PASS user is in docker"
        fail_msg: "FAIL user is not in docker, groups are: {{ user_groups.stdout }}"
        quiet: true
      when: install_docker | default(false) | bool

    # The unit state was registered but never asserted, so a Docker install that left
    # its service disabled would have passed. Collected-but-unchecked is the same
    # shape of defect as a toggle nothing consumes.
    - name: Assert docker.service is enabled when Docker was requested
      ansible.builtin.assert:
        that: docker_enabled.rc == 0
        success_msg: "PASS docker.service is enabled"
        fail_msg: "FAIL docker.service is not enabled, systemctl said: {{ docker_enabled.stdout | default('') }} {{ docker_enabled.stderr | default('') }}"
        quiet: true
      when: install_docker | default(false) | bool

    - name: Assert flatpak is installed and the Flathub remote is configured
      ansible.builtin.assert:
        that:
          - flatpak_remotes.rc == 0
          - "'flathub' in flatpak_remotes.stdout"
        success_msg: "PASS flatpak is installed and flathub is a configured remote"
        fail_msg: >-
          FAIL flatpak or the Flathub remote is missing. rc={{ flatpak_remotes.rc | default('unknown') }}
          remotes={{ flatpak_remotes.stdout | default('(none)') | trim }}
          stderr={{ flatpak_remotes.stderr | default('') | trim }}
          A non-zero rc usually means flatpak itself was never installed for this
          distribution, which is what happened on Arch.
        quiet: true
      when: install_system_core | default(false) | bool

    - name: Assert the temporary passwordless sudoers entry was removed
      ansible.builtin.assert:
        that: not temp_sudoers.stat.exists
        success_msg: "PASS /etc/sudoers.d/99-ansible-user is gone"
        fail_msg: "FAIL /etc/sudoers.d/99-ansible-user still exists, which leaves NOPASSWD sudo in place permanently"
        quiet: true

    - name: Assert the expected desktop environment is installed
      ansible.builtin.assert:
        that: de_probe.stat.exists
        success_msg: "PASS {{ e2e_expect_desktop }} shell binary is present"
        fail_msg: "FAIL {{ e2e_expect_desktop }} was requested but its shell binary is not on disk"
        quiet: true
      when: (e2e_expect_desktop | default('none')) in ['kde', 'gnome']
