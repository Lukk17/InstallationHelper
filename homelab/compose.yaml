networks:
  proxy-tier:
    driver: bridge

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.15.1
    container_name: nginx-proxy-manager
    restart: unless-stopped
    networks:
      - proxy-tier
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - /opt/docker-stack/nginx/data:/data
      - /opt/docker-stack/nginx/letsencrypt:/etc/letsencrypt

  adguard-home:
    image: adguard/adguardhome:v0.107.78
    container_name: adguard-home
    restart: unless-stopped
    networks:
      - proxy-tier
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "784:784/udp"
      - "853:853/tcp"
      - "853:853/udp"
      - "7776:3000/tcp"
      - "7777:7777/tcp"
    volumes:
      - /opt/docker-stack/adguard/work:/opt/adguardhome/work
      - /opt/docker-stack/adguard/conf:/opt/adguardhome/conf

  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2
    container_name: homepage
    restart: unless-stopped
    networks:
      - proxy-tier
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=dashboard.internal
    ports:
      - "7778:3000/tcp"
    volumes:
      - /opt/docker-stack/homepage/config:/app/config

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.0
    container_name: uptime-kuma
    restart: unless-stopped
    networks:
      - proxy-tier
    ports:
      - "7779:3001/tcp"
    volumes:
      - /opt/docker-stack/uptime-kuma/data:/app/data

  syncthing:
    image: lscr.io/linuxserver/syncthing:2.1.2
    container_name: syncthing
    restart: unless-stopped
    networks:
      - proxy-tier
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
    ports:
      - "7780:8384/tcp"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - /opt/docker-stack/syncthing/config:/config
      - /opt/docker-stack/syncthing/data:/data

  perlite:
    image: sec77/perlite:1.6.1
    container_name: perlite
    restart: unless-stopped
    networks:
      - proxy-tier
    environment:
      - NOTES_PATH=notes
      - HOME_FILE=README
      - SITE_TITLE=Notes
      - SITE_NAME=Notes
      - SHOW_TOC=true
      - SHOW_LOCAL_GRAPH=false
      - LINE_BREAKS=true
      - HTML_SAFE_MODE=true
      - FONT_SIZE=17
      - TEMP_PATH=/tmp
    volumes:
      - /opt/docker-stack/syncthing/data/notes:/var/www/perlite/notes:ro

  perlite-web:
    image: nginx:1.30.4
    container_name: perlite-web
    restart: unless-stopped
    networks:
      - proxy-tier
    ports:
      - "7781:80"
    volumes:
      - /opt/docker-stack/perlite/perlite.conf:/etc/nginx/conf.d/default.conf:ro
    volumes_from:
      - perlite
    depends_on:
      - perlite
