networks:
  proxy-tier:
    name: proxy-tier
    driver: bridge

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.15.1
    container_name: nginx-proxy-manager
    restart: unless-stopped
    networks:
      - proxy-tier
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - /opt/docker-stack/nginx/data:/data
      - /opt/docker-stack/nginx/letsencrypt:/etc/letsencrypt

  adguard-home:
    image: adguard/adguardhome:v0.107.78
    container_name: adguard-home
    restart: unless-stopped
    networks:
      - proxy-tier
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "784:784/udp"
      - "853:853/tcp"
      - "853:853/udp"
      - "7776:3000/tcp"
      - "7777:7777/tcp"
    volumes:
      - /opt/docker-stack/adguard/work:/opt/adguardhome/work
      - /opt/docker-stack/adguard/conf:/opt/adguardhome/conf

  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2
    container_name: homepage
    restart: unless-stopped
    networks:
      - proxy-tier
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=dashboard-proxmox.internal
    ports:
      - "7778:3000/tcp"
    volumes:
      - /opt/docker-stack/homepage/config:/app/config

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5
    container_name: uptime-kuma
    restart: unless-stopped
    networks:
      - proxy-tier
    ports:
      - "7779:3001/tcp"
    volumes:
      - /opt/docker-stack/uptime-kuma/data:/app/data

  syncthing:
    image: lscr.io/linuxserver/syncthing:2.1.2
    container_name: syncthing
    restart: unless-stopped
    networks:
      - proxy-tier
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
    ports:
      - "7780:8384/tcp"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - /opt/docker-stack/syncthing/config:/config
      - /opt/docker-stack/syncthing/data:/data

  perlite:
    image: sec77/perlite:1.6.1
    container_name: perlite
    restart: unless-stopped
    networks:
      - proxy-tier
    environment:
      - NOTES_PATH=notes
      - HOME_FILE=README
      - SITE_TITLE=Notes
      - SITE_NAME=Notes
      - SHOW_TOC=true
      - SHOW_LOCAL_GRAPH=false
      - LINE_BREAKS=true
      - HTML_SAFE_MODE=true
      - FONT_SIZE=17
      - TEMP_PATH=/tmp
    volumes:
      - /opt/docker-stack/syncthing/data/notes:/var/www/perlite/notes:ro

  perlite-web:
    image: nginx:1.30.4
    container_name: perlite-web
    restart: unless-stopped
    networks:
      - proxy-tier
    ports:
      - "7781:80"
    volumes:
      - /opt/docker-stack/perlite/perlite.conf:/etc/nginx/conf.d/default.conf:ro
    volumes_from:
      - perlite
    depends_on:
      - perlite

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - proxy-tier
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  filebrowser:
    image: gtstef/filebrowser:2.0.0-stable-slim
    container_name: filebrowser
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - proxy-tier
    environment:
      - TZ=Europe/Warsaw
    ports:
      - "7782:80/tcp"
    volumes:
      - /opt/docker-stack/filebrowser/data:/home/filebrowser/data
      - type: bind
        source: /mnt/data/files
        target: /srv
        bind:
          create_host_path: false

  samba:
    image: dockurr/samba:4.23.10
    container_name: samba
    restart: unless-stopped
    environment:
      - NAME=files
      - USER=${SAMBA_USER:?set SAMBA_USER in /opt/docker-stack/.env}
      - PASS=${SAMBA_PASS:?set SAMBA_PASS in /opt/docker-stack/.env}
      - UID=1000
      - GID=1000
    ports:
      - "445:445/tcp"
    volumes:
      - type: bind
        source: /mnt/data/files
        target: /shared
        bind:
          create_host_path: false

  plex:
    image: plexinc/pms-docker:1.43.4.10903-e5521bd8c
    container_name: plex
    restart: unless-stopped
    network_mode: host
    cpus: 1.5
    environment:
      - TZ=Europe/Warsaw
      - PLEX_UID=1000
      - PLEX_GID=1000
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      - /opt/docker-stack/plex/config:/config
      - /opt/docker-stack/plex/transcode:/transcode
      - type: bind
        source: /mnt/data/files/media
        target: /data
        read_only: true
        bind:
          create_host_path: false

  telegraf:
    image: telegraf:1.40.1
    container_name: telegraf
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    environment:
      - TZ=Europe/Warsaw
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /opt/docker-stack/syncthing/data/network-watch:/network-watch
