[agent]
  flush_interval = "1s"

[[inputs.ping]]
  urls = ["192.168.1.1", "194.204.159.1", "1.1.1.1", "8.8.8.8"]
  method = "native"
  privileged = false
  count = 1
  deadline = "1s"
  interval = "1s"

[[inputs.dns_query]]
  servers = ["192.168.1.12"]
  domains = ["connectivitycheck.gstatic.com"]
  record_type = "A"
  timeout = "1s"
  interval = "1s"

[[inputs.dns_query]]
  servers = ["1.1.1.1"]
  domains = ["connectivitycheck.gstatic.com"]
  record_type = "A"
  timeout = "1s"
  interval = "1s"

[[inputs.http_response]]
  urls = ["http://connectivitycheck.gstatic.com/generate_204"]
  response_timeout = "2s"
  response_status_code = 204
  interval = "5s"

[[inputs.internet_speed]]
  interval = "10m"
  cache = true

[[outputs.file]]
  files = ["/network-watch/ping.csv"]
  namepass = ["ping"]
  data_format = "csv"
  csv_header = true
  csv_timestamp_format = "2006-01-02 15:04:05"
  csv_columns = ["timestamp", "tag.url", "field.result_code", "field.percent_packet_loss", "field.average_response_ms"]
  rotation_interval = "24h"
  rotation_max_archives = 30

[[outputs.file]]
  files = ["/network-watch/dns.csv"]
  namepass = ["dns_query"]
  data_format = "csv"
  csv_header = true
  csv_timestamp_format = "2006-01-02 15:04:05"
  csv_columns = ["timestamp", "tag.server", "field.result_code", "field.rcode_value", "field.query_time_ms"]
  rotation_interval = "24h"
  rotation_max_archives = 30

[[outputs.file]]
  files = ["/network-watch/http.csv"]
  namepass = ["http_response"]
  data_format = "csv"
  csv_header = true
  csv_timestamp_format = "2006-01-02 15:04:05"
  csv_columns = ["timestamp", "tag.server", "field.result_code", "field.http_response_code", "field.response_time"]
  rotation_interval = "24h"
  rotation_max_archives = 30

[[outputs.file]]
  files = ["/network-watch/speed.csv"]
  namepass = ["internet_speed"]
  data_format = "csv"
  csv_header = true
  csv_timestamp_format = "2006-01-02 15:04:05"
  csv_columns = ["timestamp", "tag.source", "tag.server_id", "field.download", "field.upload", "field.latency", "field.jitter", "field.packet_loss"]
  rotation_interval = "24h"
  rotation_max_archives = 30
