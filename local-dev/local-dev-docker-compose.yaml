name: local-dev

volumes:
  mysql_data:
  mongodb_data:
  mongodb_config:
  postgres_data:
  qdrant_data:
  floci_data:

services:
  mysql:
    container_name: mysql
    image: mysql:9.7.2@sha256:257388edf9c84dbc04c763625446d5f3fa6ed60d1b0873bc552c614ba0a7ab4e
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: local
      MYSQL_DATABASE: test-spring
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plocal" ]
      interval: 5s
      timeout: 20s
      retries: 10
      start_period: 10s

  mongodb:
    container_name: mongodb
    image: mongo:8.3.8@sha256:5211c51171f57ae60842b11664bb244628971b3d35325762a97888337b9bb0db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  postgres:
    container_name: postgres
    image: postgres-local:latest
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    build:
      context: .
      dockerfile: ./postgresql/Dockerfile
      tags:
        - postgres-local:latest
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -h localhost" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:v1.19@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      default:
        aliases:
          - mem0_store
          - qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    container_name: keycloak
    image: keycloak-local:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway" # for linux internal host recognition same as on windows
    ports:
      - "9443:9443" # https port
      - "9000:9000" # management port
    build:
      context: ./auth
      dockerfile: ./Keycloak/Dockerfile
      tags:
        - keycloak-local:latest
    environment:
      # Database Config
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://host.docker.internal:5432/keycloak
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=local
      # Hostname Config
      - KC_HOSTNAME=keycloak.test
      - KC_HOSTNAME_PORT=9443
      - KC_HOSTNAME_STRICT=false      # Allows other hosts like 'localhost' or 'keycloak'
    # Certificates need to be imported everytime Keycloak is starting
    # Change port from default 8443 to 9443 as it was conflicted with Docker Desktop and WSL
    command: [
      "--https-certificate-file=/etc/x509/https/localhost.crt",
      "--https-certificate-key-file=/etc/x509/https/localhostCert.key",
      "--https-port=9443"
    ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "-L", "-k", "https://keycloak:9000/health/ready" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy

  floci:
    image: floci/floci:2.0.1@sha256:4e451c39c7bb88e3cd4f87e8fc0c25d5b47695a51185d521e2241fa00486e8eb
    container_name: floci
    restart: unless-stopped
    ports:
      - "9070:4566"
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_UI_ENABLED: "false"
    volumes:
      - floci_data:/app/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:4566/_floci/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5

  floci-ui:
    image: floci/floci-ui:0.4.0@sha256:31993d99032cb72278b8df60f56e0840cfb722fbc26174fa7eb581a0518dbc78
    container_name: floci-ui
    restart: unless-stopped
    ports:
      - "9071:4500"
    environment:
      FLOCI_ENDPOINT: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PORT: "4500"
    depends_on:
      floci:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://localhost:4500/api/clouds || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
