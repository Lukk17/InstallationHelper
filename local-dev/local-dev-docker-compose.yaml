name: local-dev

volumes:
  mysql_data:
  mongodb_data:
  postgres_data:
  qdrant_data:
  minio_data:

services:
  mysql:
    container_name: mysql
    image: mysql:9.6.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: local
      MYSQL_DATABASE: test-spring
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plocal" ]
      interval: 5s
      timeout: 20s
      retries: 10
      start_period: 10s

  mongodb:
    container_name: mongodb
    image: mongo:8.2.6
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: articles
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  postgres:
    container_name: postgres
    image: postgres-local:latest
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    build:
      context: .
      dockerfile: ./postgresql/Dockerfile
      tags:
        - postgres-local:latest
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -h localhost" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:v1.16
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      default:
        aliases:
          - mem0_store
          - qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    container_name: keycloak
    image: keycloak-local:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway" # for linux internal host recognition same as on windows
    ports:
      - "9443:9443" # https port
      - "9000:9000" # management port
    build:
      context: ./auth
      dockerfile: ./Keycloak/Dockerfile
      tags:
        - keycloak-local:latest
    environment:
      # Database Config
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://host.docker.internal:5432/keycloak
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=local
      # Hostname Config
      - KC_HOSTNAME=keycloak.test
      - KC_HOSTNAME_PORT=9443
      - KC_HOSTNAME_STRICT=false      # Allows other hosts like 'localhost' or 'keycloak'
    # Certificates need to be imported everytime Keycloak is starting
    # Change port from default 8443 to 9443 as it was conflicted with Docker Desktop and WSL
    command: [
      "--https-certificate-file=/etc/x509/https/localhost.crt",
      "--https-certificate-key-file=/etc/x509/https/localhostCert.key",
      "--https-port=9443"
    ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "-L", "-k", "https://keycloak:9000/health/ready" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: unless-stopped
    ports:
      - "9070:9000"
      - "9071:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
