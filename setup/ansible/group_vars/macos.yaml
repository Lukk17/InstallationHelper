---
# -----------------------------------------------------
# MACOS SPECIFIC TOGGLES
# -----------------------------------------------------

# MacOS System Configurations
setup_zsh: true
setup_karabiner: true
setup_finder_defaults: true

# Mac Only System Alternatives (Alternatives to Windows-only apps)
install_stats: true            # Alt for HWMonitor
install_grandperspective: true # Alt for WizTree
install_lulu: true             # Alt for GlassWire / Firewall
install_balena_etcher: true    # Alt for Rufus

# Virtualization toggles
install_virtualbox: true
install_vmware: false          # The vmware-fusion Homebrew cask no longer exists, Broadcom moved the download behind a portal login. Use install_utm, or install Fusion by hand.
# User Identity for privilege-safe operations (macOS)
non_root_home: "/Users/{{ non_root_user }}"

# Three of these were mapped in vars/Darwin.yaml and reachable from nowhere: the dispatcher reads
# install_<key> out of all.yaml overlaid by this file, and none of them was defined in either, so
# macOS could never install them whatever the mapping said.
#
# docker and lynis are on, because they are on for Linux too. Docker on macOS is Docker Desktop, the
# cask, which is the same product Windows gets: macOS has no Linux kernel, so the engine runs in a
# virtual machine whatever you choose, and Docker Desktop is the one Docker supports. Lynis is the
# same Unix security auditing tool Linux gets, from the same upstream.
#
# utm is the one entry here with no Linux counterpart: it is a macOS-only virtual machine
# application built on QEMU, and it is the Mac answer to what install_virt_manager gives Linux.
install_docker: true
install_lynis: true
install_utm: true
