---
# -----------------------------------------------------
# LINUX SPECIFIC TOGGLES
# -----------------------------------------------------

# Desktop Environments Setup
install_kde_plasma: false
configure_kde_plasma: false
install_gnome: false
configure_gnome: false

# System Core Configurations
install_system_core: true
# Bootloader (only one should be true; both false = keep existing bootloader)
setup_systemd_boot: false
setup_grub: false
remove_distro_grub: false
remove_distro_systemd_boot: false
setup_hibernate: true
setup_tmpfs: true
toggle_wayland_nvidia: false
setup_zsh: true

# Linux Only Native Apps (System / Security)
install_lynis: true
install_chkrootkit: true
install_clamav: true

# Linux Only Crypto Hardware Apps
install_ledger_live: true
install_trezor_suite: true

# Linux Only Utilities
install_appimagelauncher: true
install_waydroid: false
install_snapd: true
install_putty: true
install_rclone: true  # pacman on Arch and CachyOS, apt on Debian and Ubuntu, dnf on Fedora.

# Arch Linux AUR helpers
# yay, a second AUR helper beside paru. Off by default because nothing in this playbook uses it: every
# Arch User Repository package goes through paru. The moment any task uses yay, yay becomes required,
# this toggle must be removed and arch_core must build yay unconditionally, which
# e2e/tier1/paru_consumers.sh enforces. Does nothing outside the Arch family.
install_yay: false

# Gaming
# Lutris, from pacman on Arch and from Flathub on Debian, Ubuntu and Fedora. On CachyOS it is the
# cachyos-gaming-applications metapackage instead, which also installs Steam, Heroic, Faugus,
# gamescope, MangoHud and GOverlay regardless of install_steam, plus cachyos-gaming-meta with Proton,
# Wine, umu-launcher, protontricks and winetricks. See setup/ansible/vars/derivatives/cachyos.yaml.
# Because it brings Steam, on CachyOS it also triggers the alignment in roles/arch_core that replaces
# mesa and lib32-mesa with mesa-git and lib32-mesa-git, exactly as install_steam does.
install_gaming_suite: true

# Hardware/System Alternative Apps (Alternatives to Windows-only apps)
install_hardinfo: true    # Alt for HWMonitor
install_lm_sensors: true  # Alt for HWInfo
install_greenenvy: true   # Alt for MSI Afterburner
install_baobab: true      # Alt for WizTree
install_openrazer: true     # Razer device driver + daemon, Polychromatic is only a front end for it
install_polychromatic: true # Alt for Razer Synapse
install_balena_etcher: true
install_gputest: true     # Alt for FurMark

# Virtualization toggles
install_virt_manager: true
install_docker: true
install_podman_desktop: true  # GUI front end for the Docker engine above, flatpak on every distro
install_virtualbox: false
install_vmware: false

# AI Tools - Linux specific
# On by default, the owner's choice since 2026-10-10. On Debian and Ubuntu it installs from Anthropic's
# own apt repository as an ordinary package, which is how the vendor distributes it, so there is no
# source compile and no downloaded file. On Arch the AUR package compiles nothing: it has no build()
# and no makedepends, it downloads Anthropic's own .deb from downloads.claude.ai, checks a pinned
# SHA-256 that matches Anthropic's signed Packages index and unpacks it, about 181 MB, read out of
# its PKGBUILD on 2026-10-10. It does need paru, like every AUR package. On Fedora the vendor supports nothing today, so the toggle does nothing
# there, recorded in e2e/tier1/documented_no_ops.txt.
install_claude_desktop: true

# Btrfs Snapshots with Snapper
install_snapper: true

# The actual human user running the playbook (not root).
# User Identity for privilege-safe operations (Linux)
non_root_home: "/home/{{ non_root_user }}"

# Shared apt env-var prefix + flags for `raw:` invocations that bypass the
# ansible-core 2.19 ansiballz deserialization race. -y (not -yqq) so apt
# prints "Setting up X (1.2.3) ..." lines that the dual_logger heartbeat
# can surface as live progress.
apt_raw_env: >-
  DEBIAN_FRONTEND=noninteractive
  APT_LISTCHANGES_FRONTEND=none
  NEEDRESTART_MODE=a
  NEEDRESTART_SUSPEND=1
  LANG=C.UTF-8
  LC_ALL=C.UTF-8
apt_raw_flags: >-
  -y
  -o DPkg::Lock::Timeout=300
  -o Dpkg::Options::=--force-confdef
  -o Dpkg::Options::=--force-confold

# Mapped in vars/RedHat.yaml and, until this was added, unreachable: no install_boot_repair existed
# in all.yaml or in this file, so Fedora could never install it whatever the mapping said. False
# because false is what the run did before. boot-repair is a Fedora-only mapping here.
install_boot_repair: false
