---
# -----------------------------------------------------
# WINDOWS SPECIFIC TOGGLES
# -----------------------------------------------------

# Windows System Configurations
setup_wsl: true
enable_hyperv: true
# Off because the scheduled-task definition it imports does not exist. wsl_setup.yaml
# runs schtasks against "{{ playbook_dir }}\..\tasks\Hibernate@2AM.xml", and there is no
# setup/tasks/ directory anywhere in this repository, so the task would fail on every
# Windows run. Turn it back on once that XML is committed. See docs/regression_ledger.md.
import_hibernate_task: false

# Windows Only Dev Tools
install_powershell: true

# Windows Only Entertainment & Streaming
install_netflix: true
install_disney_plus: true
install_prime_video: true
install_itunes: true

# Windows Only Hardware & OEM
install_geforce_experience: false
install_razer_cortex: true
install_galaxy_buds: true

# Windows Only Utilities & Networks
install_hwmonitor: true
install_hwinfo: true
install_crystaldiskinfo: true
install_crystaldiskmark: true
install_msiafterburner: true
install_wiztree: true
install_advanced_ip_scanner: true
install_glasswire: true
install_tcpview: true
install_autoruns: true
install_rufus: true
install_powertoys: true
install_putty: true
install_appcontrol: true

# Virtualization toggles
install_virtualbox: true
install_vmware: true                  # via Chocolatey (no winget manifest post-Broadcom)
install_docker: true

# Cross-platform toggles overridden off for Windows
install_dbeaver: false
install_onlyoffice: false
