# Universal SDK & AI Ecosystem (Installed via custom roles, not basic pkg managers)
#
# install_dart installs a standalone Dart SDK. As of 2026-09-18 that only happens on Windows, where
# FVM has no Dart-free route: fvm.app's own install script offers macOS and Linux only, so Windows
# activates FVM from pub.dev through `dart pub global activate fvm`, which needs a real Dart on PATH
# to run at all. FVM's own installation page puts that same command behind a warning, "This is not
# recommended if you plan on using FVM to manage your global Flutter install", which is exactly what
# this project does with `fvm global`, and Linux and macOS dropped both the warning and the Dart it
# needed by switching to the install script everywhere, including Arch, which needs no Dart either.
# Windows keeps this toggle and its `dart pub global activate` route by deliberate choice: Chocolatey
# has already been rejected here once, because its `fvm` package declares an exact `dart-sdk` version
# as a hard dependency (see docs/regression_ledger.md), and a standalone zip from GitHub releases
# trades away Chocolatey's own upgrade tracking. This toggle is a documented no-op on every family
# but Windows, see e2e/tier1/documented_no_ops.txt.
install_dart: true
install_flutter: true
install_android_sdk: true
install_stable_diffusion: false  # heavy: clones AUTOMATIC1111 repo + GB of model deps. Opt in explicitly.
install_lm_studio: true
install_claude_code: true
install_claude_desktop: true
install_jetbrains_toolbox: true
install_opencode: true
install_kilo_code: true  # Kilo Code CLI, the kilo command, npm package @kilocode/cli on every OS like the other AI command line tools.
install_openspec: true
install_codex: true
install_grok: true

# The scope of a run. setup.sh --software none with one or more --enable keys passes those keys as
# ih_picked_apps, comma separated. Such a picked-apps run installs only what was picked, so every role
# and task that configures the machine whatever was picked reads ih_picked_apps_run and stays out of
# it: system_core's system settings and upgrade, the /sbin PATH file of debian_core, linux_security,
# systemd_boot and the cache cleanup in site.yaml. A full run, a configure-only run (--software none
# with nothing enabled) and a profile leave ih_picked_apps empty. setup/README_SETUP.md, "Picking
# single apps", lists what a picked-apps run touches.
ih_picked_apps: ""
ih_picked_apps_run: "{{ ih_picked_apps | default('') | string | length > 0 }}"
# env_variables is the one exception, decided by ih_env_variables_run. The apps below put a variable
# or a PATH entry into dev_env_file, or rely on the ones env_variables writes there, and only
# env_variables makes every shell import that file. So a picked-apps run that picks one of them runs
# env_variables, and one that picks none of them does not. e2e/tier1/picked_apps_scope.sh fails when
# a task that writes dev_env_file, or an SDK block in sdk_manager, is gated on a toggle missing here.
env_variables_dependent_toggles:
  - install_nodejs
  - install_java
  - install_python
  - install_flutter
  - install_android_sdk
  - install_lm_studio
  - install_jetbrains_toolbox
ih_env_variables_run: >-
  {{ not (ih_picked_apps_run | bool)
     or ((ih_picked_apps | default('') | string).split(',') | intersect(env_variables_dependent_toggles) | length > 0) }}

# Logging configuration
# Set to true to allow playbook to continue if log file creation fails
# Default: false (playbook fails if cannot write logs)
allow_callback_failure: false

# Global Theme / Wallpaper Settings
set_custom_wallpaper: true
default_wallpaper: "forest-house.jpg"

# User Identity for privilege-safe operations
# ansible_env.SUDO_USER captures who ran `sudo ansible-playbook`.
# Falls back to ansible_user_id if not using sudo.
non_root_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"

# Android SDK location. Not a pinned value, and deliberately not in setup/pinned_values/pinned_values.toml:
# non_root_home comes from linux.yaml or macos.yaml and resolves non_root_user above, so only lazy
# templating after fact gathering can render this. A file of pins has to resolve on its own.
android_home: "{{ non_root_home }}/Android/Sdk"

# Where the owner keeps source checkouts. env_variables creates it and exports it as PROJECTS_DIR, and
# a project, a script or an agent can read that one name instead of guessing a path. Same templating
# rule as android_home: non_root_home comes from linux.yaml or macos.yaml, so only lazy templating
# after fact gathering can render it. Override with `-e projects_dir=/some/path` or edit this line.
# The Windows default, %USERPROFILE%\Projects, is $projectsDir in Set-WindowsDevEnvironment, setup/windows/WindowsCustomInstalls.ps1.
projects_dir: "{{ non_root_home }}/Projects"

# The shell and environment layout on Linux and macOS, read by env_variables, shell_zsh, sdk_manager,
# ai_tools and verify_install.yaml, so the five cannot name different files. Same templating rule as
# android_home. setup/configuration.md, "Shell and environment layout", describes what goes where.
# dev_env_file must sort after 99-environment.conf, the link to /etc/environment systemd ships in
# /usr/lib/environment.d, because Ubuntu's /etc/environment assigns PATH outright and a file read
# before it loses every PATH entry it added. setup/configuration.md has the measurement.
dev_env_file: "{{ non_root_home }}/.config/environment.d/990-dev.conf"
# zsh_config_dir is ~/.config/zsh when this run sets zsh up, and also when an earlier run already did,
# which ih_zdotdir_stub says: the pre_tasks of site.yaml set it when ~/.zshenv carries the block that
# shell_zsh writes under zdotdir_stub_marker. zsh then reads ~/.config/zsh and never ~/.zshrc, so a
# block written into the home directory would be ignored. The home directory is the answer only on a
# machine zsh was never set up on.
zdotdir_stub_marker: "# {mark} ANSIBLE ZDOTDIR"
zsh_config_dir: "{{ non_root_home ~ '/.config/zsh' if (setup_zsh | default(false) | bool or ih_zdotdir_stub | default(false) | bool) else non_root_home }}"
interactive_rc_files: >-
  {{ ([{'shell': 'bash', 'path': non_root_home ~ '/.bashrc'}] if ansible_facts['system'] == 'Linux' else [])
     + [{'shell': 'zsh', 'path': zsh_config_dir ~ '/.zshrc'}] }}
shell_startup_files: >-
  {{ [non_root_home ~ '/.bashrc', non_root_home ~ '/.bash_profile', non_root_home ~ '/.profile',
      non_root_home ~ '/.zshrc', non_root_home ~ '/.zprofile',
      zsh_config_dir ~ '/.zshrc', zsh_config_dir ~ '/.zprofile'] | unique }}
shell_layout_backup_dir: "{{ non_root_home }}/.local/state/installation-helper/shell-layout-backup"

# JetBrains Toolbox on Linux, read by roles/jetbrains_toolbox and verify_install.yaml, so the two
# cannot name different paths. The data directory is Toolbox's own fixed one. The tarball unpacks
# into it with its top directory stripped, so the binary lands at bin/jetbrains-toolbox, the path
# Toolbox 2.x's own `--install` used. scripts is where Toolbox writes the idea, pycharm and other
# shell launchers, its default shell_scripts.location.
jetbrains_toolbox_data_dir: "{{ non_root_home }}/.local/share/JetBrains/Toolbox"
jetbrains_toolbox_binary: "{{ jetbrains_toolbox_data_dir }}/bin/jetbrains-toolbox"
jetbrains_toolbox_scripts_dir: "{{ jetbrains_toolbox_data_dir }}/scripts"

# KiCad 9, installed beside the KiCad 10 the package managers carry, read by roles/software_installer and
# verify_install.yaml. On Linux it is KiCad's own AppImage with one system-wide menu entry and icon per
# tool, each named kicad9-<tool>. arguments is what follows the AppImage on the Exec line, and wm_class is
# the StartupWMClass KiCad's own entry for the tool carries. On macOS it is the KiCad folder of KiCad's own
# disk image, copied apart from the KiCad 10 cask's /Applications/KiCad. kicad9_macos_current_test is the
# one shell test of whether that folder holds KiCad.app and the stamp of the pinned version, which the
# install asks before it downloads and the verification asks after the run. kicad9_appimage_applies is
# true on x86_64 Linux only.
kicad9_appimage_applies: "{{ ansible_facts['system'] == 'Linux' and ansible_facts['architecture'] == 'x86_64' }}"
kicad9_appimage: "/opt/kicad9/{{ kicad9_appimage_file }}"
kicad9_menu_dir: "/usr/local/share/applications"
kicad9_icon_theme_dir: "/usr/local/share/icons/hicolor"
kicad9_icon_dir: "{{ kicad9_icon_theme_dir }}/scalable/apps"
kicad9_launchers:
  - { tool: "kicad", arguments: "kicad %f", name: "KiCad 9", generic_name: "EDA Suite", comment: "Suite of tools for schematic design and circuit board layout", wm_class: "kicad" }
  - { tool: "eeschema", arguments: "eeschema %f", name: "KiCad 9 Schematic Editor", generic_name: "Schematic Capture Tool", comment: "Standalone schematic editor for KiCad schematics", wm_class: "eeschema" }
  - { tool: "pcbnew", arguments: "pcbnew %f", name: "KiCad 9 PCB Editor", generic_name: "PCB layout editor", comment: "Standalone circuit board editor for KiCad boards", wm_class: "pcbnew" }
  - { tool: "gerbview", arguments: "gerbview %F", name: "KiCad 9 Gerber Viewer", generic_name: "Gerber File Viewer", comment: "View Gerber files", wm_class: "gerbview" }
  - { tool: "bitmap2component", arguments: "bitmap2component", name: "KiCad 9 Image Converter", generic_name: "Bitmap to Component Converter", comment: "Create a component from a bitmap for use with KiCad", wm_class: "bitmap2component" }
  - { tool: "pcbcalculator", arguments: "pcb_calculator", name: "KiCad 9 PCB Calculator", generic_name: "PCB Calculator", comment: "Calculator for various electronics-related computations", wm_class: "pcb_calculator" }
kicad9_macos_dir: "/Applications/KiCad 9"
kicad9_macos_stamp: "{{ kicad9_macos_dir }}/.installation_helper_version"
kicad9_macos_current_test: >-
  [ -d "{{ kicad9_macos_dir }}/KiCad.app" ] && [ "$(cat "{{ kicad9_macos_stamp }}" 2>/dev/null)" = "{{ kicad9_version }}" ]
