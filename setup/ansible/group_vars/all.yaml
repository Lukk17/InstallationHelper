install_pipx: true  # A package on every Unix. On Windows `py -m pip install --user pipx` from setup/windows/WindowsCustomInstalls.ps1, because winget has none and Chocolatey's pulls in a second Python. The KDE role installs the same package for Konsave whatever this says.
install_go: true
install_java: true
install_maven: true
install_gradle: true
install_kubectl: true
install_minikube: true
install_k3d: true
install_helm: true
install_terraform: true
