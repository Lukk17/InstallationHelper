# Communication
install_discord: true
install_slack: true
install_telegram: true
install_whatsapp: true
install_signal: true
install_teams: true  # Windows via winget and macOS via cask. No Linux mapping, upstream is web only there, so it no-ops on Linux.
install_zoom: true  # Homebrew cask on macOS, winget on Windows, AUR zoom on Arch and CachyOS, Flathub us.zoom.Zoom on Debian, Ubuntu and Fedora.

# Productivity
