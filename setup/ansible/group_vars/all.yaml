install_opencode_desktop: true  # Desktop app, version 2. AUR opencode-desktop-bin on Arch, the vendor .deb and .rpm on Debian, Ubuntu and Fedora, Homebrew cask on macOS, the vendor installer on Windows. The CLI is install_opencode.

# Media / Design
install_vlc: true
install_spotify: true
install_gimp: true
