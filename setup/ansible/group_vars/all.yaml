---
# -----------------------------------------------------
# GLOBAL SOFTWARE TOGGLES (Cross-Platform Intent)
# -----------------------------------------------------

# Browsers
install_chrome: true
install_brave: true
install_tor: true

# Dev Tools
install_git: true
install_nodejs: true
install_python: true
install_java: true
install_maven: true
install_gradle: true
install_kubectl: true
install_minikube: true
install_k3d: true
install_helm: true
install_terraform: true
install_gh: true
install_jq: true
install_fzf: true
install_ripgrep: true
install_lens: true
install_postman: true
install_openssl: true
install_dbeaver: true
install_filezilla: true

# IDEs / Editors
install_vscode: true
install_sublime: true
install_arduino: true
install_antigravity: true
install_bruno: true
install_bruno_cli: true

# Communication
install_discord: true
install_slack: true
install_telegram: true
install_whatsapp: true
install_signal: true

# Productivity
install_obsidian: true
install_bitwarden: true
install_keepassxc: true
install_onlyoffice: true

# AI
install_chatgpt: true  # Desktop app — Windows and macOS only, OpenAI ships no Linux build.

# Media / Design
install_vlc: true
install_spotify: true
install_gimp: true
install_krita: true
install_handbrake: true
install_audacity: true
install_rawtherapee: true

# Gaming — storefronts/launchers. GOG/Epic/EA/CurseForge ship on Windows
# (winget) + macOS (cask) but have no official Linux client, so they no-op on
# Linux (no mapping in vars/{Debian,RedHat,Archlinux}.yaml).
install_steam: true
install_ea_app: true
install_gog: true
install_epic: true
install_curseforge: true

# CAD / 3D
install_freecad: true
install_prusaslicer: true

# Peripherals
install_synapse: true  # Razer Synapse 4 — Windows and macOS. Linux uses install_openrazer in linux.yaml.

# Utilities
install_veracrypt: true
install_teamviewer: true
install_speedtest: true
install_syncthing: true
install_gparted: true
install_partitionmanager: true
install_partition_wizard: true

# Crypto / Volunteer
install_boinc: true
install_gridcoin: true

# Universal SDK & AI Ecosystem (Installed via custom roles, not basic pkg managers)
install_dart: true
install_flutter: true
install_android_sdk: true
install_stable_diffusion: false  # heavy: clones AUTOMATIC1111 repo + GB of model deps. Opt in explicitly.
install_lm_studio: true
install_claude_code: true
install_claude_desktop: true
install_jetbrains_toolbox: true
install_opencode: true
install_openspec: true
install_codex: true
install_grok: true

# Logging configuration
# Set to true to allow playbook to continue if log file creation fails
# Default: false (playbook fails if cannot write logs)
allow_callback_failure: false

# Global Theme / Wallpaper Settings
set_custom_wallpaper: true
default_wallpaper: "forest-house.jpg"

# User Identity for privilege-safe operations
# ansible_env.SUDO_USER captures who ran `sudo ansible-playbook`.
# Falls back to ansible_user_id if not using sudo.
non_root_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"

