---
- hosts: localhost
  connection: local
  gather_facts: yes
  environment:
    # Suppress locale warnings from sudo that corrupt module JSON output
    LANG: "C.UTF-8"
    LC_ALL: "C.UTF-8"
  vars_files:
    - group_vars/all.yaml
    - group_vars/versions.yaml

  pre_tasks:
    - name: Load OS-specific group vars
      ansible.builtin.include_vars:
        file: "group_vars/{{ 'windows' if ansible_facts['os_family'] == 'Windows' else 'macos' if ansible_facts['os_family'] == 'Darwin' else 'linux' }}.yaml"

    - name: Load OS translation dictionary
      ansible.builtin.include_vars:
        file: "vars/{{ ansible_facts['os_family'] }}.yaml"
        name: os_dict

    - name: Update apt cache (Debian)
      ansible.builtin.apt:
        update_cache: yes
      become: yes
      changed_when: false
      when: ansible_facts['os_family'] == 'Debian'

  tasks:
    # 1. OS-Specific Core Bootstrapping + Boot (CRITICAL — no rescue)
    - ansible.builtin.import_role:
        name: systemd_boot
      when: "ansible_facts['system'] == 'Linux' and setup_systemd_boot | default(false) | bool"

    - ansible.builtin.import_role:
        name: windows_core
      when: "ansible_facts['os_family'] == 'Windows'"

    - ansible.builtin.import_role:
        name: macos_core
      when: "ansible_facts['os_family'] == 'Darwin'"

    - ansible.builtin.import_role:
        name: arch_core
      when: "ansible_facts['os_family'] == 'Archlinux'"

    - ansible.builtin.import_role:
        name: fedora_core
      when: "ansible_facts['os_family'] == 'RedHat'"

    - ansible.builtin.import_role:
        name: debian_core
      when: "ansible_facts['os_family'] == 'Debian'"

    - ansible.builtin.import_role:
        name: system_core
      when: "ansible_facts['system'] == 'Linux' and install_system_core | default(false) | bool"

    # 2. Linux Desktop Environments (non-critical)
    - name: Run kde_plasma_setup
      block:
        - ansible.builtin.include_role:
            name: kde_plasma_setup
      rescue:
        - ansible.builtin.debug:
            msg: "Role kde_plasma_setup failed — check ~/installation_issues.log for details."
      when: "ansible_facts['system'] == 'Linux' and (install_kde_plasma | default(false) | bool or configure_kde_plasma | default(false) | bool)"

    - name: Run gnome_setup
      block:
        - ansible.builtin.include_role:
            name: gnome_setup
      rescue:
        - ansible.builtin.debug:
            msg: "Role gnome_setup failed — check ~/installation_issues.log for details."
      when: "ansible_facts['system'] == 'Linux' and (install_gnome | default(false) | bool or configure_gnome | default(false) | bool)"

    # 3. Cross-Platform Settings (CRITICAL — needed for SDK path resolution)
    - ansible.builtin.import_role:
        name: env_variables

    - name: Run shell_zsh
      block:
        - ansible.builtin.include_role:
            name: shell_zsh
      rescue:
        - ansible.builtin.debug:
            msg: "Role shell_zsh failed — check ~/installation_issues.log for details."
      when: "setup_zsh | default(false) | bool and ansible_facts['os_family'] != 'Windows'"

    # 4. Universal Complex Roles (non-critical)
    - name: Run sdk_manager
      block:
        - ansible.builtin.include_role:
            name: sdk_manager
      rescue:
        - ansible.builtin.debug:
            msg: "Role sdk_manager failed — check ~/installation_issues.log for details."

    - name: Run ai_tools
      block:
        - ansible.builtin.include_role:
            name: ai_tools
      rescue:
        - ansible.builtin.debug:
            msg: "Role ai_tools failed — check ~/installation_issues.log for details."

    - name: Run jetbrains_toolbox
      block:
        - ansible.builtin.include_role:
            name: jetbrains_toolbox
      rescue:
        - ansible.builtin.debug:
            msg: "Role jetbrains_toolbox failed — check ~/installation_issues.log for details."
      when: "install_jetbrains_toolbox | default(false) | bool"

    # 5. Core Software Router (non-critical)
    - name: Run software_installer
      block:
        - ansible.builtin.include_role:
            name: software_installer
      rescue:
        - ansible.builtin.debug:
            msg: "Role software_installer failed — check ~/installation_issues.log for details."

    # 6. Linux Advanced Apps (non-critical)
    - name: Run waydroid
      block:
        - ansible.builtin.include_role:
            name: waydroid
      rescue:
        - ansible.builtin.debug:
            msg: "Role waydroid failed — check ~/installation_issues.log for details."
      when: "ansible_facts['system'] == 'Linux' and install_waydroid | default(false) | bool"

    - name: Run linux_crypto_hardware
      block:
        - ansible.builtin.include_role:
            name: linux_crypto_hardware
      rescue:
        - ansible.builtin.debug:
            msg: "Role linux_crypto_hardware failed — check ~/installation_issues.log for details."
      when: "ansible_facts['system'] == 'Linux' and (install_ledger_live | default(false) | bool or install_trezor_suite | default(false) | bool)"

    - name: Run linux_security
      block:
        - ansible.builtin.include_role:
            name: linux_security
      rescue:
        - ansible.builtin.debug:
            msg: "Role linux_security failed — check ~/installation_issues.log for details."
      when: "ansible_facts['system'] == 'Linux' and setup_hibernate | default(false) | bool"

    - name: Run snapper
      block:
        - ansible.builtin.include_role:
            name: snapper
      rescue:
        - ansible.builtin.debug:
            msg: "Role snapper failed — check ~/installation_issues.log for details."
      when: "ansible_facts['system'] == 'Linux' and install_snapper | default(false) | bool"

    - name: Run virtualization_config
      block:
        - ansible.builtin.include_role:
            name: virtualization_config
      rescue:
        - ansible.builtin.debug:
            msg: "Role virtualization_config failed — check ~/installation_issues.log for details."
      when: "ansible_facts['system'] == 'Linux' and (install_virt_manager | default(false) | bool or install_docker | default(false) | bool or install_virtualbox | default(false) | bool or install_vmware | default(false) | bool)"

  post_tasks:
    - name: Mark playbook as fully attempted
      ansible.builtin.set_fact:
        playbook_succeeded: true

    - name: Check if flatpak is installed
      ansible.builtin.command: which flatpak
      register: flatpak_check
      changed_when: false
      failed_when: false

    - name: Clean Flatpak unused runtimes
      ansible.builtin.command: flatpak uninstall --unused -y
      become: yes
      changed_when: false
      ignore_errors: yes
      when:
        - playbook_succeeded | bool
        - ansible_facts['system'] == 'Linux'
        - flatpak_check.rc == 0

    - name: Clean Flatpak per-user app caches
      ansible.builtin.shell: |
        find {{ non_root_home }}/.var/app -maxdepth 2 -name cache -type d -exec rm -rf {} + 2>/dev/null || true
      become: yes
      become_user: "{{ non_root_user }}"
      changed_when: false
      when:
        - playbook_succeeded | bool
        - ansible_facts['system'] == 'Linux'

    - name: Remove disabled Snap revisions
      ansible.builtin.shell: |
        snap list --all 2>/dev/null | awk '/disabled/{print $1, $3}' |
        while read snap_name snap_revision; do
          snap remove "$snap_name" --revision="$snap_revision"
        done || true
      become: yes
      changed_when: false
      ignore_errors: yes
      when:
        - playbook_succeeded | bool
        - ansible_facts['system'] == 'Linux'

    - name: Remove Snap download cache directory
      ansible.builtin.file:
        path: /var/lib/snapd/cache
        state: absent
      become: yes
      when:
        - playbook_succeeded | bool
        - ansible_facts['system'] == 'Linux'

    - name: Clean APT cache (Debian)
      ansible.builtin.apt:
        autoremove: yes
        clean: yes
      become: yes
      when:
        - playbook_succeeded | bool
        - ansible_facts['os_family'] == 'Debian'

    - name: Clean Pacman package cache (Arch, keeps latest version)
      ansible.builtin.command: pacman -Sc --noconfirm
      become: yes
      changed_when: false
      when:
        - playbook_succeeded | bool
        - ansible_facts['os_family'] == 'Archlinux'

    - name: Clean DNF cache (Fedora)
      ansible.builtin.shell: |
        dnf autoremove -y
        dnf clean all
      become: yes
      changed_when: false
      when:
        - playbook_succeeded | bool
        - ansible_facts['os_family'] == 'RedHat'

    - name: Remove temporary installation folder
      ansible.builtin.file:
        path: "{{ non_root_home }}/.lukkInstall"
        state: absent
      become: yes
      when: playbook_succeeded | bool


