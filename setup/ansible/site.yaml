---
- hosts: localhost
  connection: local
  gather_facts: yes
  vars_files:
    - group_vars/all.yaml
    - group_vars/versions.yaml

  pre_tasks:
    - name: Load OS-specific group vars
      ansible.builtin.include_vars:
        file: "group_vars/{{ 'windows' if ansible_os_family == 'Windows' else 'macos' if ansible_os_family == 'Darwin' else 'linux' }}.yaml"

    - name: Load OS translation dictionary
      ansible.builtin.include_vars:
        file: "vars/{{ ansible_os_family }}.yaml"
        name: os_dict

    - name: Update apt cache (Debian)
      ansible.builtin.apt:
        update_cache: yes
      become: yes
      changed_when: false
      when: ansible_os_family == 'Debian'

  roles:
    # 1. OS-Specific Core Bootstrapping + Boot
    - { role: systemd_boot, when: ansible_system == 'Linux' and setup_systemd_boot | default(false) | bool }

    - { role: windows_core, when: ansible_os_family == 'Windows' }
    - { role: macos_core, when: ansible_os_family == 'Darwin' }
    - { role: arch_core, when: ansible_os_family == 'Archlinux' }
    - { role: fedora_core, when: ansible_os_family == 'RedHat' }
    - { role: system_core, when: ansible_system == 'Linux' and install_system_core | default(false) | bool }

    # 2. Linux Desktop Environments
    - { role: kde_plasma_setup, when: ansible_system == 'Linux' and (install_kde_plasma | default(false) | bool or configure_kde_plasma | default(false) | bool) }
    - { role: gnome_setup, when: ansible_system == 'Linux' and (install_gnome | default(false) | bool or configure_gnome | default(false) | bool) }

    # 3. Cross-Platform Settings
    - { role: env_variables }
    - { role: shell_zsh, when: setup_zsh | default(false) | bool and ansible_os_family != 'Windows' }

    # 4. Universal Complex Roles (SDKs & AI)
    - { role: sdk_manager }
    - { role: ai_tools }

    # 5. Core Software Router (Replaces dev_tools, other_apps, gaming, crypto_tools, etc.)
    - { role: software_installer }

    # 6. Linux Advanced Apps
    - { role: waydroid, when: ansible_system == 'Linux' and install_waydroid | default(false) | bool }
    - { role: linux_crypto_hardware, when: ansible_system == 'Linux' and (install_ledger_live | default(false) | bool or install_trezor_suite | default(false) | bool) }
    - { role: linux_security, when: ansible_system == 'Linux' and setup_hibernate | default(false) | bool }
    - { role: virtualization_config, when: ansible_system == 'Linux' and (install_virt_manager | default(false) | bool or install_docker | default(false) | bool or install_virtualbox | default(false) | bool or install_vmware | default(false) | bool) }
