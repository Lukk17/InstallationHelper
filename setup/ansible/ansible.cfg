[defaults]
inventory = localhost,
interpreter_python = auto_silent
callback_plugins = ./callback_plugins
stdout_callback = dual_logger

# Out of /tmp: ansiballz lives here and the 2.19 deserialization race fires
# when dpkg postinst contends for /tmp. See AGENTS.md for full context.
local_tmp = ~/.ansible/tmp
remote_tmp = ~/.ansible/tmp

retry_files_enabled = False
host_key_checking = False

fact_caching = jsonfile
fact_caching_connection = ~/.ansible/facts-cache
# Single-host local playbook runs 30-40 min. 300s expiry triggers an
# implicit re-gather mid-run. 0 = no expiry (fine for one-shot runs;
# the cache file is rewritten next run anyway).
fact_caching_timeout = 0

[privilege_escalation]
become_method = sudo
become_user = root
become_ask_pass = False
# Do NOT set become_flags — default "-H -S -n" is required for -K piping;
# overriding it broke sudo password handling in a prior run.
