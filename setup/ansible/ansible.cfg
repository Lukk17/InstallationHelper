[defaults]
inventory = localhost,
interpreter_python = /usr/bin/python3
callback_plugins = ./callback_plugins
stdout_callback = dual_logger

# Use /tmp for local temp files (works on live USB systems)
local_tmp = /tmp/ansible-local
remote_tmp = /tmp/ansible-remote

# Display retry count
retry_files_enabled = False

# Disable key checking (for automation)
host_key_checking = False

[ssh_connection]
# Pipelining reduces SSH overhead and avoids temp file execution issues
# that cause "No start of json char found" errors with become/sudo
pipelining = True

[privilege_escalation]
# become is NOT set globally — each task declares become: yes explicitly.
# This prevents sudo output from corrupting module JSON deserialization.
become_method = sudo
become_user = root
become_ask_pass = False
