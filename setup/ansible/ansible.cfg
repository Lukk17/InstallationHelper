[defaults]
# No `inventory` key on purpose. This setting is a comma-separated path list, so
# `localhost,` split into "localhost" and "", and the empty entry resolved to the
# config directory. Ansible then walked all of setup/ansible/ as an inventory
# source, tried to execute callback_plugins/dual_logger.py as an inventory
# script, and emitted 212 warnings on any run without an explicit -i, which is
# every lint and syntax check. Every real invocation passes -i localhost, which
# overrides this key anyway. See docs/regression_ledger.md.
interpreter_python = auto_silent
callback_plugins = ./callback_plugins
stdout_callback = dual_logger

# The pinned versions and download locations come from setup/pinned_values/pinned_values.toml
# through a vars plugin, so every role keeps referencing them by name. host_group_vars has to stay
# listed: setting this key replaces the default rather than adding to it, and dropping it stops the
# adjacent group_vars from loading at all. Relative paths here resolve against this file's directory.
vars_plugins = ./vars_plugins
vars_plugins_enabled = host_group_vars, pinned_values

# Out of /tmp: ansiballz lives here and the 2.19 deserialization race fires
# when dpkg postinst contends for /tmp. See AGENTS.md for full context.
local_tmp = ~/.ansible/tmp
remote_tmp = ~/.ansible/tmp

retry_files_enabled = False
host_key_checking = False

fact_caching = jsonfile
fact_caching_connection = ~/.ansible/facts-cache
# Single-host local playbook runs 30-40 min. 300s expiry triggers an
# implicit re-gather mid-run. 0 = no expiry (fine for one-shot runs;
# the cache file is rewritten next run anyway).
fact_caching_timeout = 0

[privilege_escalation]
become_method = sudo
become_user = root
become_ask_pass = False
# Do NOT set become_flags — default "-H -S -n" is required for -K piping;
# overriding it broke sudo password handling in a prior run.
