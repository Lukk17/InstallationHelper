# --- Lens Desktop ---
- name: Add the Lens repository
  when: install_lens | default(false) | bool
  block:
    # The key location is a role default only so that the forced-failure scenario,
    # e2e/tier3/scenarios/07-forced-failure.yaml, can point it at a path that answers 404 and prove that
    # one repository that cannot be added is reported, and costs only what installs from it.
    - name: Import Lens GPG key
      ansible.builtin.rpm_key:
        key: "{{ software_installer_lens_key_url }}"
        state: present
      become: true
      register: import_lens_gpg_key_fetch
      retries: 3
      delay: 10
      until: import_lens_gpg_key_fetch is succeeded

    - name: Add Lens dnf repository
      ansible.builtin.yum_repository:
        name: lens
        description: Lens Desktop
        baseurl: https://downloads.k8slens.dev/rpm/packages
        enabled: true
        gpgcheck: true
        gpgkey: "{{ software_installer_lens_key_url }}"
      become: true

    - name: Fetch the Lens repository metadata on its own
      ansible.builtin.include_tasks:
        file: fedora_repository_check.yaml
        apply:
          tags: [always]
      vars:
        repository_key: lens
      tags: [always]
  rescue:
    - name: Undo, record and name the Lens repository that could not be added
      ansible.builtin.include_tasks:
        file: repository_unavailable.yaml
        apply:
          tags: [always]
      vars:
        repository_key: lens
      tags: [always]

# --- Antigravity ---
# Moved here from fedora_core on 2026-10-10, where it was critical bootstrap with no rescue.
# Antigravity itself installs from the official tarball in custom_installs.yaml, and this repository
# only carries its later updates, which is why its entry in vars/RedHat.yaml says updates_only and
# nothing is skipped when it could not be added. The failure is still recorded and named.
- name: Add the Antigravity repository
  when: install_antigravity | default(false) | bool
  block:
    - name: Add Antigravity YUM repository (Fedora)
      become: yes
      ansible.builtin.yum_repository:
        name: antigravity-rpm
        description: Antigravity RPM Repository
        baseurl: "{{ antigravity_yum_repo }}"
        gpgkey: https://us-central1-yum.pkg.dev/doc/repo-signing-key.gpg
        gpgcheck: yes
        enabled: yes

    - name: Fetch the Antigravity repository metadata on its own
      ansible.builtin.include_tasks:
        file: fedora_repository_check.yaml
        apply:
          tags: [always]
      vars:
        repository_key: antigravity
      tags: [always]
  rescue:
    - name: Undo, record and name the Antigravity repository that could not be added
      ansible.builtin.include_tasks:
        file: repository_unavailable.yaml
        apply:
          tags: [always]
      vars:
        repository_key: antigravity
      tags: [always]

