# --- Microsoft VS Code ---
- name: Add the Microsoft VS Code repository
  when: install_vscode | default(false) | bool
  block:
    - name: Import Microsoft GPG key
      ansible.builtin.rpm_key:
        key: https://packages.microsoft.com/keys/microsoft.asc
        state: present
      become: true
      register: import_microsoft_gpg_key_fetch
      retries: 3
      delay: 10
      until: import_microsoft_gpg_key_fetch is succeeded

    - name: Add VS Code dnf repository
      ansible.builtin.yum_repository:
        name: vscode
        description: Visual Studio Code
        baseurl: https://packages.microsoft.com/yumrepos/vscode
        enabled: true
        gpgcheck: true
        gpgkey: https://packages.microsoft.com/keys/microsoft.asc
      become: true

    - name: Fetch the Microsoft VS Code repository metadata on its own
      ansible.builtin.include_tasks:
        file: fedora_repository_check.yaml
        apply:
          tags: [always]
      vars:
        repository_key: vscode
      tags: [always]
  rescue:
    - name: Undo, record and name the Microsoft VS Code repository that could not be added
      ansible.builtin.include_tasks:
        file: repository_unavailable.yaml
        apply:
          tags: [always]
      vars:
        repository_key: vscode
      tags: [always]

