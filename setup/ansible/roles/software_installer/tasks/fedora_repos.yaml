---
# Every network task in this file retries three times with ten seconds between attempts. That is not
# defensive decoration: a single TCP reset from one vendor's key host aborts the whole software
# phase, and the first GitHub sweep lost two otherwise-clean scenarios to exactly that. Ubuntu's
# kde-full run died on "Connection reset by peer" fetching the Tailscale keyring, and Debian's
# kde-configure-only run died the same way fetching one .deb from deb.debian.org. Neither is a
# defect in this repository and both cost a job of twenty minutes or more. The vendor downloads in
# custom_installs.yaml already had this and the repository key downloads did not, which was an
# inconsistency rather than a decision.

# Set up official DNF repositories before batched dnf installs.

# --- Google Chrome ---
- name: Add Google Chrome dnf repository
  ansible.builtin.yum_repository:
    name: google-chrome
    description: google-chrome
    baseurl: https://dl.google.com/linux/chrome/rpm/stable/x86_64
    enabled: true
    gpgcheck: true
    gpgkey: https://dl.google.com/linux/linux_signing_key.pub
  become: true
  when: install_chrome | default(false) | bool

# --- Brave Browser ---
- name: Add Brave dnf repository
  ansible.builtin.yum_repository:
    name: brave-browser
    description: Brave Browser
    baseurl: https://brave-browser-rpm-release.s3.brave.com/x86_64/
    enabled: true
    gpgcheck: true
    gpgkey: https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
  become: true
  when: install_brave | default(false) | bool

# --- Microsoft VS Code ---
- name: Import Microsoft GPG key
  ansible.builtin.rpm_key:
    key: https://packages.microsoft.com/keys/microsoft.asc
    state: present
  become: true
  when: install_vscode | default(false) | bool
  register: import_microsoft_gpg_key_fetch
  retries: 3
  delay: 10
  until: import_microsoft_gpg_key_fetch is succeeded

- name: Add VS Code dnf repository
  ansible.builtin.yum_repository:
    name: vscode
    description: Visual Studio Code
    baseurl: https://packages.microsoft.com/yumrepos/vscode
    enabled: true
    gpgcheck: true
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc
  become: true
  when: install_vscode | default(false) | bool

# --- Sublime Text ---
- name: Import Sublime Text GPG key
  ansible.builtin.rpm_key:
    key: https://download.sublimetext.com/sublimehq-rpm-pub.gpg
    state: present
  become: true
  when: install_sublime | default(false) | bool
  register: import_sublime_text_gpg_key_fetch
  retries: 3
  delay: 10
  until: import_sublime_text_gpg_key_fetch is succeeded

- name: Add Sublime Text dnf repository
  ansible.builtin.yum_repository:
    name: sublime-text
    description: Sublime Text
    baseurl: https://download.sublimetext.com/rpm/stable/x86_64
    enabled: true
    gpgcheck: true
    gpgkey: https://download.sublimetext.com/sublimehq-rpm-pub.gpg
  become: true
  when: install_sublime | default(false) | bool

# --- Kubernetes (kubectl) ---
- name: Add Kubernetes dnf repository
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes
    baseurl: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_minor | default('v1.34') }}/rpm/"
    enabled: true
    gpgcheck: true
    gpgkey: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_minor | default('v1.34') }}/rpm/repodata/repomd.xml.key"
  become: true
  when: install_kubectl | default(false) | bool

# --- Terraform (HashiCorp) ---
- name: Add HashiCorp dnf repository (terraform)
  ansible.builtin.get_url:
    url: https://rpm.releases.hashicorp.com/fedora/hashicorp.repo
    dest: /etc/yum.repos.d/hashicorp.repo
    mode: '0644'
  become: true
  when: install_terraform | default(false) | bool

# --- Lens Desktop ---
  register: add_hashicorp_dnf_repository_terraform_fetch
  retries: 3
  delay: 10
  until: add_hashicorp_dnf_repository_terraform_fetch is succeeded
- name: Import Lens GPG key
  ansible.builtin.rpm_key:
    key: https://downloads.k8slens.dev/keys/gpg
    state: present
  become: true
  when: install_lens | default(false) | bool
  register: import_lens_gpg_key_fetch
  retries: 3
  delay: 10
  until: import_lens_gpg_key_fetch is succeeded

- name: Add Lens dnf repository
  ansible.builtin.yum_repository:
    name: lens
    description: Lens Desktop
    baseurl: https://downloads.k8slens.dev/rpm/packages
    enabled: true
    gpgcheck: true
    gpgkey: https://downloads.k8slens.dev/keys/gpg
  become: true
  when: install_lens | default(false) | bool

# Antigravity is intentionally NOT pre-registered here. The .rpm's postinst
# adds its own /etc/yum.repos.d/antigravity.repo. Pre-adding ours produced
# duplicate-source conflicts. We install via dnf_url and let the postinst
# own the repo for future updates.

# --- Docker CE ---
- name: Add Docker CE dnf repository
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/fedora/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: '0644'
  become: true
  when: install_docker | default(false) | bool

# --- OpenRazer ---
  register: add_docker_ce_dnf_repository_fetch
  retries: 3
  delay: 10
  until: add_docker_ce_dnf_repository_fetch is succeeded
- name: Add OpenRazer dnf repository
  ansible.builtin.get_url:
    url: "{{ openrazer_fedora_repo_url }}"
    dest: /etc/yum.repos.d/hardware:razer.repo
    mode: '0644'
  become: true
  when: install_openrazer | default(false) | bool
  register: add_openrazer_dnf_repository_fetch
  retries: 3
  delay: 10
  until: add_openrazer_dnf_repository_fetch is succeeded

- name: Install kernel headers for the OpenRazer DKMS module
  ansible.builtin.dnf:
    name: "{{ ['kernel-devel', 'kernel-headers'] }}"
    state: present
  become: true
  when: install_openrazer | default(false) | bool

# --- Tailscale ---
# The repo definition is Fedora-release independent, `$basearch` is expanded by
# dnf itself when it reads the .repo file, so it is written out literally here.
# Upstream signs both the packages and the repo metadata, hence repo_gpgcheck.
- name: Add Tailscale dnf repository
  ansible.builtin.yum_repository:
    name: tailscale-stable
    description: Tailscale stable
    baseurl: https://pkgs.tailscale.com/stable/fedora/$basearch
    enabled: true
    repo_gpgcheck: true
    gpgcheck: true
    gpgkey: https://pkgs.tailscale.com/stable/fedora/repo.gpg
  become: true
  when: install_tailscale | default(false) | bool
