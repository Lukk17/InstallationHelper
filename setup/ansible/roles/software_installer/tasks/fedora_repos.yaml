# --- Kubernetes (kubectl) ---
- name: Add the Kubernetes repository
  when: install_kubectl | default(false) | bool
  block:
    - name: Add Kubernetes dnf repository
      ansible.builtin.yum_repository:
        name: kubernetes
        description: Kubernetes
        baseurl: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_minor | default('v1.34') }}/rpm/"
        enabled: true
        gpgcheck: true
        gpgkey: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_minor | default('v1.34') }}/rpm/repodata/repomd.xml.key"
      become: true

    - name: Fetch the Kubernetes repository metadata on its own
      ansible.builtin.include_tasks:
        file: fedora_repository_check.yaml
        apply:
          tags: [always]
      vars:
        repository_key: kubectl
      tags: [always]
  rescue:
    - name: Undo, record and name the Kubernetes repository that could not be added
      ansible.builtin.include_tasks:
        file: repository_unavailable.yaml
        apply:
          tags: [always]
      vars:
        repository_key: kubectl
      tags: [always]

