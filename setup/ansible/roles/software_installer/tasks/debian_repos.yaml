---
# Every network task in this file retries three times with ten seconds between attempts. That is not
# defensive decoration: a single TCP reset from one vendor's key host aborts the whole software
# phase, and the first GitHub sweep lost two otherwise-clean scenarios to exactly that. Ubuntu's
# kde-full run died on "Connection reset by peer" fetching the Tailscale keyring, and Debian's
# kde-configure-only run died the same way fetching one .deb from deb.debian.org. Neither is a
# defect in this repository and both cost a job of twenty minutes or more. The vendor downloads in
# custom_installs.yaml already had this and the repository key downloads did not, which was an
# inconsistency rather than a decision.
#
# Retries are not enough on their own, because a vendor host that is down stays down for all three
# attempts. Until 2026-10-10 nothing here had a rescue, so one repository that could not be added
# ended the whole software phase, and every package after it was skipped, from every manager. Each
# repository is now its own block. Its last step fetches that repository's package lists on their own
# through debian_repository_check.yaml, because writing a sources file touches no network and a dead
# host would otherwise only surface at the shared refresh at the bottom of this file. Its rescue is
# repository_unavailable.yaml, which removes what the block wrote, records the failure and names it.
# setup/ansible/tasks/repository_availability.yaml then reads the disk, and dynamic_install.yaml,
# custom_installs.yaml and virtualization_config skip and name only what needed that repository.
# Every repository here has an entry of the same key in vars/Debian.yaml under
# third_party_repositories, and e2e/tier1/availability_facts.sh fails the gate when the two drift.

# Set up official APT repositories before batched apt installs.
# Uses /etc/apt/keyrings/ + signed-by= with DEARMORED binary keyrings (.gpg).
#
# Why dearmored: Debian's apt accepts both ASCII-armored (.asc) and binary
# (.gpg) keyrings in `signed-by=`, but Ubuntu 24.04+ apt is stricter and only
# reliably trusts binary keyrings — that's why VS Code and Sublime hit
# NO_PUBKEY errors on Ubuntu in the previous run. Dearmoring works on both.

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

# Generic helper would be nice but Ansible has no clean shell-substitute,
# so each repo is two tasks: download to /tmp, dearmor into /etc/apt/keyrings.

# --- Google Chrome ---
- name: Add the Google Chrome repository
  when: install_chrome | default(false) | bool
  block:
    - name: Download Google Chrome signing key
      ansible.builtin.get_url:
        url: https://dl.google.com/linux/linux_signing_key.pub
        dest: /tmp/google-chrome.asc
        mode: '0644'
        force: true
      register: download_google_chrome_signing_key_fetch
      retries: 3
      delay: 10
      until: download_google_chrome_signing_key_fetch is succeeded

    - name: Convert Google Chrome key to binary keyring
      ansible.builtin.shell: |
        set -o pipefail
        gpg --dearmor < /tmp/google-chrome.asc > /etc/apt/keyrings/google-chrome.gpg
        chmod 0644 /etc/apt/keyrings/google-chrome.gpg
      args:
        executable: /bin/bash
        creates: /etc/apt/keyrings/google-chrome.gpg
      become: true

    # google-chrome-stable owns this repository itself once it has been installed once, and the line
    # below only exists to bootstrap that first install.
    #
    # What the package does, read out of /var/lib/dpkg/info/google-chrome-stable.postinst inside a
    # debian:trixie container that had just installed Chrome from the repository this task adds: its
    # install_deb822_sources() runs on every install and upgrade, recognises the line below through its
    # own REPOCONFIGREGEX, rewrites it into /etc/apt/sources.list.d/google-chrome.sources in deb822 form
    # pointing at https://dl.google.com/linux/chrome-stable/deb/ and signed by
    # /usr/share/keyrings/google-chrome.gpg, and then deletes /etc/apt/sources.list.d/google-chrome.list
    # outright. The container showed the .list file present before the install and gone after it, with
    # the .sources file in its place.
    #
    # So on every later run apt_repository found its file missing, wrote it again and reported changed
    # forever, and left the machine carrying two definitions of the same repository. Skipping once the
    # package's own file exists is what stops it, and it is also the honest description of who owns the
    # repository at that point.
    - name: Check whether google-chrome-stable already owns its apt repository
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/google-chrome.sources
      register: chrome_vendor_sources

    - name: Add Google Chrome apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main"
        filename: google-chrome
        state: present
        update_cache: false
      become: true
      when: not (chrome_vendor_sources.stat.exists | default(false))

    - name: Fetch the Google Chrome package lists on their own
      ansible.builtin.include_tasks:
        file: debian_repository_check.yaml
        apply:
          tags: [always]
      vars:
        repository_key: chrome
      tags: [always]
  rescue:
    - name: Undo, record and name the Google Chrome repository that could not be added
      ansible.builtin.include_tasks:
        file: repository_unavailable.yaml
        apply:
          tags: [always]
      vars:
        repository_key: chrome
      tags: [always]

# --- Brave Browser ---
# Brave publishes an already-binary keyring, so no dearmor needed.
- name: Add the Brave repository
  when: install_brave | default(false) | bool
  block:
    - name: Download Brave signing key (already binary)
      ansible.builtin.get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
        dest: /etc/apt/keyrings/brave-browser-archive-keyring.gpg
        mode: '0644'
      become: true
      register: download_brave_signing_key_already_binary_fetch
      retries: 3
      delay: 10
      until: download_brave_signing_key_already_binary_fetch is succeeded

    - name: Add Brave apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main"
        filename: brave-browser
        state: present
        update_cache: false
      become: true

    - name: Fetch the Brave package lists on their own
      ansible.builtin.include_tasks:
        file: debian_repository_check.yaml
        apply:
          tags: [always]
      vars:
        repository_key: brave
      tags: [always]
  rescue:
    - name: Undo, record and name the Brave repository that could not be added
      ansible.builtin.include_tasks:
        file: repository_unavailable.yaml
        apply:
          tags: [always]
      vars:
        repository_key: brave
      tags: [always]

