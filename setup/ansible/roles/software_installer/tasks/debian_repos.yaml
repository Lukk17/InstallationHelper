---
# Set up official APT repositories before batched apt installs.
# Uses /etc/apt/keyrings/ + signed-by= with DEARMORED binary keyrings (.gpg).
#
# Why dearmored: Debian's apt accepts both ASCII-armored (.asc) and binary
# (.gpg) keyrings in `signed-by=`, but Ubuntu 24.04+ apt is stricter and only
# reliably trusts binary keyrings — that's why VS Code and Sublime hit
# NO_PUBKEY errors on Ubuntu in the previous run. Dearmoring works on both.

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

# Generic helper would be nice but Ansible has no clean shell-substitute,
# so each repo is two tasks: download to /tmp, dearmor into /etc/apt/keyrings.

# --- Google Chrome ---
- name: Download Google Chrome signing key
  ansible.builtin.get_url:
    url: https://dl.google.com/linux/linux_signing_key.pub
    dest: /tmp/google-chrome.asc
    mode: '0644'
    force: true
  when: install_chrome | default(false) | bool

- name: Convert Google Chrome key to binary keyring
  ansible.builtin.shell: |
    set -o pipefail
    gpg --dearmor < /tmp/google-chrome.asc > /etc/apt/keyrings/google-chrome.gpg
    chmod 0644 /etc/apt/keyrings/google-chrome.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/google-chrome.gpg
  become: true
  when: install_chrome | default(false) | bool

# google-chrome-stable owns this repository itself once it has been installed once, and the line
# below only exists to bootstrap that first install.
#
# What the package does, read out of /var/lib/dpkg/info/google-chrome-stable.postinst inside a
# debian:trixie container that had just installed Chrome from the repository this task adds: its
# install_deb822_sources() runs on every install and upgrade, recognises the line below through its
# own REPOCONFIGREGEX, rewrites it into /etc/apt/sources.list.d/google-chrome.sources in deb822 form
# pointing at https://dl.google.com/linux/chrome-stable/deb/ and signed by
# /usr/share/keyrings/google-chrome.gpg, and then deletes /etc/apt/sources.list.d/google-chrome.list
# outright. The container showed the .list file present before the install and gone after it, with
# the .sources file in its place.
#
# So on every later run apt_repository found its file missing, wrote it again and reported changed
# forever, and left the machine carrying two definitions of the same repository. Skipping once the
# package's own file exists is what stops it, and it is also the honest description of who owns the
# repository at that point.
- name: Check whether google-chrome-stable already owns its apt repository
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/google-chrome.sources
  register: chrome_vendor_sources
  when: install_chrome | default(false) | bool

- name: Add Google Chrome apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main"
    filename: google-chrome
    state: present
    update_cache: false
  become: true
  when:
    - install_chrome | default(false) | bool
    - not (chrome_vendor_sources.stat.exists | default(false))

# --- Brave Browser ---
# Brave publishes an already-binary keyring, so no dearmor needed.
- name: Download Brave signing key (already binary)
  ansible.builtin.get_url:
    url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
    dest: /etc/apt/keyrings/brave-browser-archive-keyring.gpg
    mode: '0644'
  become: true
  when: install_brave | default(false) | bool

- name: Add Brave apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main"
    filename: brave-browser
    state: present
    update_cache: false
  become: true
  when: install_brave | default(false) | bool

# --- Microsoft VS Code ---
- name: Download Microsoft signing key for VS Code
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /tmp/packages.microsoft.asc
    mode: '0644'
    force: true
  when: install_vscode | default(false) | bool

- name: Convert Microsoft key to binary keyring
  ansible.builtin.shell: |
    set -o pipefail
    gpg --dearmor < /tmp/packages.microsoft.asc > /etc/apt/keyrings/packages.microsoft.gpg
    chmod 0644 /etc/apt/keyrings/packages.microsoft.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/packages.microsoft.gpg
  become: true
  when: install_vscode | default(false) | bool

- name: Add VS Code apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main"
    filename: vscode
    state: present
    update_cache: false
  become: true
  when: install_vscode | default(false) | bool

# --- Sublime Text ---
- name: Download Sublime Text signing key (ASCII despite .gpg URL suffix)
  ansible.builtin.get_url:
    url: https://download.sublimetext.com/sublimehq-pub.gpg
    dest: /tmp/sublimehq-pub.asc
    mode: '0644'
    force: true
  when: install_sublime | default(false) | bool

- name: Convert Sublime key to binary keyring
  ansible.builtin.shell: |
    set -o pipefail
    gpg --dearmor < /tmp/sublimehq-pub.asc > /etc/apt/keyrings/sublimehq-pub.gpg
    chmod 0644 /etc/apt/keyrings/sublimehq-pub.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/sublimehq-pub.gpg
  become: true
  when: install_sublime | default(false) | bool

- name: Add Sublime Text apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/sublimehq-pub.gpg] https://download.sublimetext.com/ apt/stable/"
    filename: sublime-text
    state: present
    update_cache: false
  become: true
  when: install_sublime | default(false) | bool

# --- Kubernetes (kubectl) ---
- name: Download Kubernetes signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_minor | default('v1.34') }}/deb/Release.key"
    dest: /tmp/kubernetes-apt-keyring.asc
    mode: '0644'
    force: true
  when: install_kubectl | default(false) | bool

- name: Convert Kubernetes key to binary keyring
  ansible.builtin.shell: |
    set -o pipefail
    gpg --dearmor < /tmp/kubernetes-apt-keyring.asc > /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    chmod 0644 /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  become: true
  when: install_kubectl | default(false) | bool

- name: Add Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_minor | default('v1.34') }}/deb/ /"
    filename: kubernetes
    state: present
    update_cache: false
  become: true
  when: install_kubectl | default(false) | bool

# --- Helm ---
- name: Download Helm signing key
  ansible.builtin.get_url:
    url: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
    dest: /tmp/helm-apt-keyring.asc
    mode: '0644'
    force: true
  when: install_helm | default(false) | bool

- name: Convert Helm key to binary keyring
  ansible.builtin.shell: |
    set -o pipefail
    gpg --dearmor < /tmp/helm-apt-keyring.asc > /etc/apt/keyrings/helm-apt-keyring.gpg
    chmod 0644 /etc/apt/keyrings/helm-apt-keyring.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/helm-apt-keyring.gpg
  become: true
  when: install_helm | default(false) | bool

- name: Add Helm apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/helm-apt-keyring.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
    filename: helm
    state: present
    update_cache: false
  become: true
  when: install_helm | default(false) | bool

# --- Terraform (HashiCorp) ---
- name: Download HashiCorp signing key
  ansible.builtin.get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /tmp/hashicorp-archive-keyring.asc
    mode: '0644'
    force: true
  when: install_terraform | default(false) | bool

- name: Convert HashiCorp key to binary keyring
  ansible.builtin.shell: |
    set -o pipefail
    gpg --dearmor < /tmp/hashicorp-archive-keyring.asc > /etc/apt/keyrings/hashicorp-archive-keyring.gpg
    chmod 0644 /etc/apt/keyrings/hashicorp-archive-keyring.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/hashicorp-archive-keyring.gpg
  become: true
  when: install_terraform | default(false) | bool

- name: Add HashiCorp apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
    filename: hashicorp
    state: present
    update_cache: false
  become: true
  when: install_terraform | default(false) | bool

# --- GitHub CLI (gh) ---
# GitHub publishes an already-dearmored (binary) keyring, so no gpg --dearmor step.
- name: Download GitHub CLI binary keyring
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: '0644'
    force: true
  become: true
  when: install_gh | default(false) | bool

- name: Add GitHub CLI apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    filename: github-cli
    state: present
    update_cache: false
  become: true
  when: install_gh | default(false) | bool

# --- Lens Desktop ---
- name: Download Lens signing key
  ansible.builtin.get_url:
    url: https://downloads.k8slens.dev/keys/gpg
    dest: /tmp/lens.asc
    mode: '0644'
    force: true
  when: install_lens | default(false) | bool

- name: Convert Lens key to binary keyring
  ansible.builtin.shell: |
    set -o pipefail
    gpg --dearmor < /tmp/lens.asc > /etc/apt/keyrings/lens.gpg
    chmod 0644 /etc/apt/keyrings/lens.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/lens.gpg
  become: true
  when: install_lens | default(false) | bool

- name: Add Lens apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/lens.gpg] https://downloads.k8slens.dev/apt/debian stable main"
    filename: lens
    state: present
    update_cache: false
  become: true
  when: install_lens | default(false) | bool

# Antigravity is intentionally NOT pre-registered here. The `antigravity`
# .deb's postinst script installs its own keyring at
# /etc/apt/keyrings/antigravity-repo-key.gpg and writes its own .list file.
# Pre-adding ours produces a "Conflicting values set for option Signed-By"
# error that breaks every subsequent `apt update`. We let the package's
# postinst own the repo; we just install the .deb via apt_url.

# --- Docker CE ---
- name: Download Docker signing key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ 'ubuntu' if ih_base == 'ubuntu' else 'debian' }}/gpg"
    dest: /tmp/docker.asc
    mode: '0644'
    force: true
  when: install_docker | default(false) | bool

- name: Convert Docker key to binary keyring
  ansible.builtin.shell: |
    set -o pipefail
    gpg --dearmor < /tmp/docker.asc > /etc/apt/keyrings/docker.gpg
    chmod 0644 /etc/apt/keyrings/docker.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/docker.gpg
  become: true
  when: install_docker | default(false) | bool

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.gpg]
      https://download.docker.com/linux/{{ 'ubuntu' if ih_base == 'ubuntu' else 'debian' }}
      {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present
    update_cache: false
  become: true
  vars:
    docker_apt_arch_map:
      x86_64: amd64
      aarch64: arm64
      armv7l: armhf
      armv6l: armel
    docker_apt_arch: "{{ docker_apt_arch_map[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"
  when: install_docker | default(false) | bool

# --- Claude Desktop ---
# Anthropic publishes an apt repository, and the desktop application is only distributed that way on
# Linux. This replaced a signed file on a content host: that URL now answers 404, so the install was
# broken and nothing noticed until e2e/tier2/resolve_pinned_urls.sh started asking whether pinned
# locations still exist. The toggle is off by default on Linux, which is why no container run hit it.
#
# The key is published already armoured, so it is written as .asc and referenced as such rather than
# being dearmoured, which is what the vendor documentation instructs. Its fingerprint is
# 31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE, and that is worth knowing rather than trusting the file:
# apt reports NO_PUBKEY BAA929FF1A7ECACE when the download silently returns the wrong content.
#
# Debian based only. The vendor states that Fedora and RHEL are not supported today, which is why
# there is no equivalent block in fedora_repos.yaml and no RedHat mapping.
- name: Download the Claude Desktop signing key
  ansible.builtin.get_url:
    url: https://downloads.claude.ai/claude-desktop/key.asc
    dest: /usr/share/keyrings/claude-desktop-archive-keyring.asc
    mode: '0644'
    force: true
  become: true
  register: claude_desktop_key
  retries: 3
  delay: 10
  until: claude_desktop_key is succeeded
  when: install_claude_desktop | default(false) | bool

# Verified rather than assumed, because a key that downloaded as an error page produces an apt failure
# several tasks later that names a missing public key instead of a bad download.
- name: Confirm the Claude Desktop key is the one Anthropic publishes
  ansible.builtin.command: gpg --show-keys --with-colons /usr/share/keyrings/claude-desktop-archive-keyring.asc
  become: true
  register: claude_desktop_fpr
  changed_when: false
  failed_when: >-
    claude_desktop_fpr.rc != 0 or
    '31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE' not in claude_desktop_fpr.stdout
  when: install_claude_desktop | default(false) | bool

- name: Add the Claude Desktop apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/claude-desktop-archive-keyring.asc] https://downloads.claude.ai/claude-desktop/apt/stable stable main"
    filename: claude-desktop
    state: present
    update_cache: false
  become: true
  when: install_claude_desktop | default(false) | bool

# --- Syncthing ---
# Syncthing publishes an already-dearmored (binary) release key, so no gpg
# --dearmor step. The repo has one suite (`syncthing`) for every Debian
# derivative. `stable-v2` is the monthly stable channel of the 2.x line.
- name: Download Syncthing binary keyring
  ansible.builtin.get_url:
    url: https://syncthing.net/release-key.gpg
    dest: /etc/apt/keyrings/syncthing-archive-keyring.gpg
    mode: '0644'
    force: true
  become: true
  when: install_syncthing | default(false) | bool

- name: Add Syncthing apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/syncthing-archive-keyring.gpg] https://apt.syncthing.net/ syncthing stable-v2"
    filename: syncthing
    state: present
    update_cache: false
  become: true
  when: install_syncthing | default(false) | bool

# --- Tailscale ---
# Tailscale publishes an already-dearmored (binary) keyring, so no gpg
# --dearmor step. Both the keyring and the repo live under a per-distribution,
# per-codename path. The distribution segment is normalised to ubuntu or debian
# the same way the Docker task above does it, because upstream publishes those
# two only and a derivative's own name (linuxmint, pop!_os) is a 404.
- name: Download Tailscale binary keyring
  ansible.builtin.get_url:
    url: >-
      https://pkgs.tailscale.com/stable/{{ 'ubuntu' if ih_base == 'ubuntu' else 'debian' }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg
    dest: /etc/apt/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'
    force: true
  become: true
  when: install_tailscale | default(false) | bool

- name: Add Tailscale apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/{{ 'ubuntu' if ih_base == 'ubuntu' else 'debian' }}
      {{ ansible_facts['distribution_release'] }} main
    filename: tailscale
    state: present
    update_cache: false
  become: true
  when: install_tailscale | default(false) | bool

- name: Refresh apt cache after repo changes
  ansible.builtin.apt:
    update_cache: true
  become: true
  changed_when: false

# Cleanup any leftover legacy ASCII keyring files from older runs so apt
# doesn't trip on duplicate Signed-By= references to the same source URL.
- name: Remove legacy ASCII keyring files (post-dearmor migration)
  ansible.builtin.file:
    path: "/etc/apt/keyrings/{{ item }}"
    state: absent
  become: true
  loop:
    - google-chrome.asc
    - packages.microsoft.gpg.legacy
    - sublimehq-pub.asc
    - kubernetes-apt-keyring.asc
    - lens.asc
    - docker.asc
