# --- Kubernetes (kubectl) ---
- name: Add the Kubernetes repository
  when: install_kubectl | default(false) | bool
  block:
    - name: Download Kubernetes signing key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_minor | default('v1.34') }}/deb/Release.key"
        dest: /tmp/kubernetes-apt-keyring.asc
        mode: '0644'
        force: true
      register: download_kubernetes_signing_key_fetch
      retries: 3
      delay: 10
      until: download_kubernetes_signing_key_fetch is succeeded

    - name: Convert Kubernetes key to binary keyring
      ansible.builtin.shell: |
        set -o pipefail
        gpg --dearmor < /tmp/kubernetes-apt-keyring.asc > /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        chmod 0644 /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        executable: /bin/bash
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      become: true

    - name: Add Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_minor | default('v1.34') }}/deb/ /"
        filename: kubernetes
        state: present
        update_cache: false
      become: true

    - name: Fetch the Kubernetes package lists on their own
      ansible.builtin.include_tasks:
        file: debian_repository_check.yaml
        apply:
          tags: [always]
      vars:
        repository_key: kubectl
      tags: [always]
  rescue:
    - name: Undo, record and name the Kubernetes repository that could not be added
      ansible.builtin.include_tasks:
        file: repository_unavailable.yaml
        apply:
          tags: [always]
      vars:
        repository_key: kubectl
      tags: [always]

