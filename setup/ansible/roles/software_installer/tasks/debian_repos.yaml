        repository_key: lens
      tags: [always]

# --- Antigravity ---
# Moved here from debian_core on 2026-10-10, where it was critical bootstrap with no rescue, so a key
# host that did not answer stopped the whole run before a single package was installed. Antigravity
# itself does not install from this repository: custom_installs.yaml extracts the official tarball,
# because the pool URLs behind this repository answer 404. The repository is what carries later
# updates, which is why its entry in vars/Debian.yaml says updates_only and nothing is skipped when it
# could not be added. The failure is still recorded and named, and the run still ends failed.
- name: Add the Antigravity repository
  when: install_antigravity | default(false) | bool
  block:
    # Downloaded to a file first and converted second, like every other key in this file. The key used
    # to arrive through `curl | gpg --dearmor -o <keyring>` guarded by creates: on that keyring, so a
    # download that failed could leave a zero-length keyring behind, and the retry then skipped because
    # the file it was guarded by existed, which counted the step as done.
    - name: Download Antigravity APT signing key
      ansible.builtin.get_url:
        url: https://us-central1-apt.pkg.dev/doc/repo-signing-key.gpg
        dest: /tmp/antigravity-repo-key.gpg
        mode: '0644'
        force: true
      register: antigravity_key
      retries: 3
      delay: 10
      until: antigravity_key is succeeded

    - name: Convert Antigravity key to binary keyring
      ansible.builtin.shell: |
        set -o pipefail
        gpg --dearmor < /tmp/antigravity-repo-key.gpg > /etc/apt/keyrings/antigravity-repo-key.gpg
        chmod 0644 /etc/apt/keyrings/antigravity-repo-key.gpg
      args:
        executable: /bin/bash
        creates: /etc/apt/keyrings/antigravity-repo-key.gpg
      become: true

    - name: Add Antigravity APT repository
      become: yes
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/antigravity.list
        content: |
          deb [signed-by=/etc/apt/keyrings/antigravity-repo-key.gpg] {{ antigravity_apt_repo }}/ antigravity-debian main
        mode: '0644'

    - name: Fetch the Antigravity package lists on their own
      ansible.builtin.include_tasks:
        file: debian_repository_check.yaml
        apply:
          tags: [always]
      vars:
        repository_key: antigravity
      tags: [always]
  rescue:
    - name: Undo, record and name the Antigravity repository that could not be added
      ansible.builtin.include_tasks:
        file: repository_unavailable.yaml
        apply:
          tags: [always]
      vars:
        repository_key: antigravity
      tags: [always]

# --- Docker CE ---
- name: Add the Docker repository
  when: install_docker | default(false) | bool
  block:
    - name: Download Docker signing key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ 'ubuntu' if ih_base == 'ubuntu' else 'debian' }}/gpg"
        dest: /tmp/docker.asc
        mode: '0644'
        force: true
      register: download_docker_signing_key_fetch
      retries: 3
      delay: 10
      until: download_docker_signing_key_fetch is succeeded

    - name: Convert Docker key to binary keyring
      ansible.builtin.shell: |
        set -o pipefail
        gpg --dearmor < /tmp/docker.asc > /etc/apt/keyrings/docker.gpg
        chmod 0644 /etc/apt/keyrings/docker.gpg
      args:
        executable: /bin/bash
        creates: /etc/apt/keyrings/docker.gpg
      become: true

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.gpg]
          https://download.docker.com/linux/{{ 'ubuntu' if ih_base == 'ubuntu' else 'debian' }}
          {{ ansible_facts['distribution_release'] }} stable
        filename: docker
        state: present
        update_cache: false
      become: true
      vars:
        docker_apt_arch_map:
          x86_64: amd64
          aarch64: arm64
          armv7l: armhf
          armv6l: armel
        docker_apt_arch: "{{ docker_apt_arch_map[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"

    - name: Fetch the Docker package lists on their own
      ansible.builtin.include_tasks:
        file: debian_repository_check.yaml
        apply:
          tags: [always]
      vars:
        repository_key: docker
      tags: [always]
  rescue:
    - name: Undo, record and name the Docker repository that could not be added
      ansible.builtin.include_tasks:
        file: repository_unavailable.yaml
        apply:
          tags: [always]
      vars:
        repository_key: docker
      tags: [always]

# --- Claude Desktop ---
# Anthropic publishes an apt repository, and the desktop application is only distributed that way on
# Linux. This replaced a signed file on a content host: that URL now answers 404, so the install was
# broken and nothing noticed until e2e/tier2/resolve_pinned_urls.sh started asking whether pinned
# locations still exist. The toggle is off by default on Linux, which is why no container run hit it.
#
# The key is published already armoured, so it is written as .asc and referenced as such rather than
# being dearmoured, which is what the vendor documentation instructs. Its fingerprint is
# 31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE, and that is worth knowing rather than trusting the file:
# apt reports NO_PUBKEY BAA929FF1A7ECACE when the download silently returns the wrong content.
#
# Debian based only. The vendor states that Fedora and RHEL are not supported today, which is why
# there is no equivalent block in fedora_repos.yaml and no RedHat mapping.
- name: Add the Claude Desktop repository
  when: install_claude_desktop | default(false) | bool
  block:
    - name: Download the Claude Desktop signing key
      ansible.builtin.get_url:
        url: https://downloads.claude.ai/claude-desktop/key.asc
        dest: /usr/share/keyrings/claude-desktop-archive-keyring.asc
        mode: '0644'
        force: true
      become: true
      register: claude_desktop_key
      retries: 3
      delay: 10
      until: claude_desktop_key is succeeded

    # Verified rather than assumed, because a key that downloaded as an error page produces an apt failure
    # several tasks later that names a missing public key instead of a bad download.
    - name: Confirm the Claude Desktop key is the one Anthropic publishes
      ansible.builtin.command: gpg --show-keys --with-colons /usr/share/keyrings/claude-desktop-archive-keyring.asc
      become: true
      register: claude_desktop_fpr
      changed_when: false
      failed_when: >-
        claude_desktop_fpr.rc != 0 or
        '31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE' not in claude_desktop_fpr.stdout

    - name: Add the Claude Desktop apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/claude-desktop-archive-keyring.asc] https://downloads.claude.ai/claude-desktop/apt/stable stable main"
        filename: claude-desktop
        state: present
        update_cache: false
      become: true

    - name: Fetch the Claude Desktop package lists on their own
      ansible.builtin.include_tasks:
        file: debian_repository_check.yaml
        apply:
          tags: [always]
      vars:
        repository_key: claude_desktop
      tags: [always]
  rescue:
    - name: Undo, record and name the Claude Desktop repository that could not be added
      ansible.builtin.include_tasks:
        file: repository_unavailable.yaml
        apply:
          tags: [always]
      vars:
        repository_key: claude_desktop
      tags: [always]

# --- Syncthing ---
# Syncthing publishes an already-dearmored (binary) release key, so no gpg
# --dearmor step. The repo has one suite (`syncthing`) for every Debian
# derivative. `stable-v2` is the monthly stable channel of the 2.x line.
- name: Add the Syncthing repository
  when: install_syncthing | default(false) | bool
  block:
    - name: Download Syncthing binary keyring
      ansible.builtin.get_url:
        url: https://syncthing.net/release-key.gpg
        dest: /etc/apt/keyrings/syncthing-archive-keyring.gpg
        mode: '0644'
        force: true
      become: true
      register: download_syncthing_binary_keyring_fetch
      retries: 3
      delay: 10
      until: download_syncthing_binary_keyring_fetch is succeeded

    - name: Add Syncthing apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/syncthing-archive-keyring.gpg] https://apt.syncthing.net/ syncthing stable-v2"
        filename: syncthing
        state: present
        update_cache: false
      become: true

    - name: Fetch the Syncthing package lists on their own
      ansible.builtin.include_tasks:
        file: debian_repository_check.yaml
        apply:
          tags: [always]
      vars:
        repository_key: syncthing
      tags: [always]
  rescue:
    - name: Undo, record and name the Syncthing repository that could not be added
      ansible.builtin.include_tasks:
        file: repository_unavailable.yaml
        apply:
          tags: [always]
      vars:
        repository_key: syncthing
      tags: [always]

# --- Tailscale ---
# Tailscale publishes an already-dearmored (binary) keyring, so no gpg
# --dearmor step. Both the keyring and the repo live under a per-distribution,
# per-codename path. The distribution segment is normalised to ubuntu or debian
# the same way the Docker task above does it, because upstream publishes those
# two only and a derivative's own name (linuxmint, pop!_os) is a 404.
- name: Add the Tailscale repository
  when: install_tailscale | default(false) | bool
  block:
    - name: Download Tailscale binary keyring
      ansible.builtin.get_url:
        url: >-
          https://pkgs.tailscale.com/stable/{{ 'ubuntu' if ih_base == 'ubuntu' else 'debian' }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg
        dest: /etc/apt/keyrings/tailscale-archive-keyring.gpg
        mode: '0644'
        force: true
      become: true
      register: download_tailscale_binary_keyring_fetch
      retries: 3
      delay: 10
      until: download_tailscale_binary_keyring_fetch is succeeded

    - name: Add Tailscale apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/tailscale-archive-keyring.gpg]
          https://pkgs.tailscale.com/stable/{{ 'ubuntu' if ih_base == 'ubuntu' else 'debian' }}
          {{ ansible_facts['distribution_release'] }} main
        filename: tailscale
        state: present
        update_cache: false
      become: true

    - name: Fetch the Tailscale package lists on their own
      ansible.builtin.include_tasks:
        file: debian_repository_check.yaml
        apply:
          tags: [always]
      vars:
        repository_key: tailscale
      tags: [always]
  rescue:
    - name: Undo, record and name the Tailscale repository that could not be added
      ansible.builtin.include_tasks:
        file: repository_unavailable.yaml
        apply:
          tags: [always]
      vars:
        repository_key: tailscale
      tags: [always]

- name: Refresh apt cache after repo changes
  ansible.builtin.apt:
    update_cache: true
  become: true
  changed_when: false

# Cleanup any leftover legacy ASCII keyring files from older runs so apt
# doesn't trip on duplicate Signed-By= references to the same source URL.
- name: Remove legacy ASCII keyring files (post-dearmor migration)
  ansible.builtin.file:
    path: "/etc/apt/keyrings/{{ item }}"
    state: absent
  become: true
  loop:
    - google-chrome.asc
    - packages.microsoft.gpg.legacy
    - sublimehq-pub.asc
    - kubernetes-apt-keyring.asc
    - lens.asc
    - docker.asc
