---
# The installed community.windows collection ships no winget module (only
# win_scoop), so drive the winget CLI directly. The winget App Execution Alias
# is NOT on PATH in non-interactive WinRM sessions, so resolve the real
# winget.exe out of the DesktopAppInstaller package and call it by full path
# (PATH fallback kept for interactive runs). Idempotent: skip when `winget list`
# already finds the id; also tolerate winget's "already installed" outcome.
- name: Install Winget packages (per-item; winget has no native batch)
  ansible.windows.win_shell: |
    $id  = '{{ item.value.package }}'
    $src = '{{ item.value.source | default("winget") }}'
    $winget = (Get-ChildItem "$env:ProgramFiles\WindowsApps\Microsoft.DesktopAppInstaller_*_x64__8wekyb3d8bbwe\winget.exe" -ErrorAction SilentlyContinue |
               Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
    if (-not $winget) { $winget = 'winget.exe' }
    & $winget list --exact --id $id --accept-source-agreements *> $null
    if ($LASTEXITCODE -eq 0) { 'PRESENT'; exit 0 }
    $out = & $winget install --exact --id $id --source $src --silent `
      --accept-source-agreements --accept-package-agreements --disable-interactivity 2>&1 | Out-String
    $out
    if ($LASTEXITCODE -eq 0 -or $out -match 'already installed') { exit 0 }
    exit $LASTEXITCODE
  loop: "{{ software_installer_packages | selectattr('value.manager', 'equalto', 'winget') | list }}"
  loop_control:
    label: "{{ item.value.package }}"
  register: winget_install
  changed_when: "'PRESENT' not in (winget_install.stdout | default(''))"
  failed_when: winget_install.rc != 0
