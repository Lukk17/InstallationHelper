---
- name: Initialize dynamic package list
  ansible.builtin.set_fact:
    software_installer_packages: []

- name: Build list of packages to dynamically install
  ansible.builtin.set_fact:
    software_installer_packages: "{{ software_installer_packages + [item] }}"
  loop: "{{ os_dict.software_mapping | default({}) | dict2items }}"
  when: lookup('vars', 'install_' ~ item.key, default=false) | bool

- name: Dynamically Install Packages
  block:
    # ------------------ LINUX MANAGERS ------------------
    - name: Install APT packages (Native)
      ansible.builtin.apt:
        name: "{{ item.value.package }}"
        state: present
      become: true
      loop: "{{ software_installer_packages }}"
      when: ansible_facts['os_family'] == 'Debian' and item.value.manager == 'apt' and not item.value.is_deb_url | default(false)

    - name: Install APT from URL (deb)
      ansible.builtin.apt:
        deb: "{{ lookup('vars', item.key ~ '_url') }}"
        state: present
      become: true
      loop: "{{ software_installer_packages }}"
      when: ansible_facts['os_family'] == 'Debian' and (item.value.manager == 'apt_url' or item.value.is_deb_url | default(false))

    - name: Install DNF packages (Native)
      ansible.builtin.dnf:
        name: "{{ item.value.package }}"
        state: present
      become: true
      loop: "{{ software_installer_packages }}"
      when: ansible_facts['os_family'] == 'RedHat' and item.value.manager in ['dnf', 'dnf_repo']

    - name: Install DNF from URL (rpm)
      ansible.builtin.dnf:
        name: "{{ lookup('vars', item.key ~ '_url') }}"
        state: present
      become: true
      loop: "{{ software_installer_packages }}"
      when: ansible_facts['os_family'] == 'RedHat' and item.value.manager == 'dnf_url'

    - name: Install Pacman packages (Native)
      community.general.pacman:
        name: "{{ item.value.package }}"
        state: present
      become: true
      loop: "{{ software_installer_packages }}"
      register: pacman_result
      failed_when: false
      when: ansible_facts['os_family'] == 'Archlinux' and item.value.manager == 'pacman'

    - name: Check Pacman install results
      ansible.builtin.debug:
        msg: "[WARNING] Package not found. Enable multilib."
      loop: "{{ software_installer_packages }}"
      when:
        - ansible_facts['os_family'] == 'Archlinux'
        - item.value.manager == 'pacman'
        - pacman_result.results is defined
        - pacman_result.results[item_loop_index] is defined
        - "'could not find' in (pacman_result.results[item_loop_index].msg | default(''))"
      vars:
        item_loop_index: "{{ software_installer_packages.index(item) }}"

    - name: Install AUR packages (Native)
      become: no
      kewlfft.aur.aur:
        name: "{{ item.value.package }}"
        state: present
      loop: "{{ software_installer_packages }}"
      when: ansible_facts['os_family'] == 'Archlinux' and item.value.manager == 'aur'

    - name: Install Snap packages (Classic/Native)
      community.general.snap:
        name: "{{ item.value.package }}"
        classic: "{{ item.value.classic | default(false) }}"
        state: present
      become: true
      loop: "{{ software_installer_packages }}"
      when: ansible_facts['system'] == 'Linux' and item.value.manager == 'snap'

    - name: Install Flatpak packages (Native)
      community.general.flatpak:
        name: "{{ item.value.package }}"
        remote: flathub
        state: present
      loop: "{{ software_installer_packages }}"
      failed_when: false
      register: flatpak_result
      when: ansible_facts['system'] == 'Linux' and item.value.manager == 'flatpak'

    - name: Show Flatpak installation results
      ansible.builtin.debug:
        msg: "Flatpak result: {{ flatpak_result }}"
      when: flatpak_result is defined

    # ------------------ MACOS MANAGERS ------------------
    - name: Install Homebrew packages (Native)
      community.general.homebrew:
        name: "{{ item.value.package }}"
        state: present
      loop: "{{ software_installer_packages }}"
      when: ansible_facts['os_family'] == 'Darwin' and item.value.manager == 'brew'

    - name: Install Homebrew Cask packages (Native)
      community.general.homebrew_cask:
        name: "{{ item.value.package }}"
        state: present
      loop: "{{ software_installer_packages }}"
      when: ansible_facts['os_family'] == 'Darwin' and item.value.manager == 'brew_cask'

    # ------------------ WINDOWS MANAGERS ------------------
    - name: Include Windows installation tasks
      ansible.builtin.include_tasks: windows_install.yaml
      when: ansible_facts['os_family'] == 'Windows'
  rescue:
    - name: Show installation errors
      ansible.builtin.debug:
        msg: "[WARNING] Some packages failed to install. Check individual errors above."
  when: software_installer_packages is defined and software_installer_packages | length > 0
