---
# Software Installer — dynamic dispatcher
#
# Builds per-manager package lists from os_dict.software_mapping, then installs one package per
# call, for every manager without exception.
#
# There is no batch anywhere in this file, by decision on 2026-08-25, and the reasoning is worth
# keeping where the code is. A batch is a single call with a single exit code, so one unavailable
# package reports the whole set as failed and nothing can say which one broke. That cost this
# repository the whole set three times in four days: a flatpak fetch timing out lost twenty-two
# applications on twenty of forty-eight container cells, a deleted Tor Browser build lost roughly
# thirty Homebrew casks twice in two days, and a Chocolatey batch stamped one package's failure onto
# every package in it.
#
# The speed argument for keeping apt, dnf and pacman batched was measured and did not hold.
# Twenty-two packages from the real Debian mapping in debian:trixie, two samples each way: batched
# 250 and 199 seconds against looped 278 and 244, and on a desktop-heavy set with recommends, batched
# 274 against looped 264. Identical package counts at the end of both shapes. Two identical batched
# runs differed from each other by twenty per cent, so the noise was larger than the effect, and the
# absolute figure was tens of seconds inside a scenario that runs thirty to a hundred minutes.
#
# The correctness argument was real and is now answered rather than avoided. A single solve cannot
# pick a library version or a provider that a later package rejects, and a loop can. So each family
# asks its own package manager afterwards whether the set it produced is consistent, and names what
# is broken if it is not.

- name: Fail fast if os_dict.software_mapping is missing
  ansible.builtin.fail:
    msg: >-
      os_dict.software_mapping not loaded for ih_family={{ ih_family }}, which is the family
      derived in site.yaml pre_tasks by tasks/derive_os_facts.yaml, not Ansible's own os_family.
      Check that vars/{{ ih_family }}.yaml exists and was loaded in site.yaml pre_tasks.
  when: os_dict is not defined or os_dict.software_mapping is not defined

# Both carry `always`, because every task below depends on this fact and none of the per-manager
# tags select these two. tags.md documents invocations such as `--tags apt_batch`, and without this
# the fact was undefined under any of them, the block's own `when` at the bottom of this file
# evaluated false, and a documented command installed nothing while exiting zero. A set_fact costs
# nothing to run under a tag selection that does not need it.
- name: Initialise dynamic package list
  ansible.builtin.set_fact:
    software_installer_packages: []
  tags: always

- name: Build list of packages to dynamically install
  ansible.builtin.set_fact:
    software_installer_packages: "{{ software_installer_packages + [item] }}"
  loop: "{{ os_dict.software_mapping | default({}) | dict2items }}"
  when: lookup('vars', 'install_' ~ item.key, default=false) | bool
  tags: always

# Before any manager's list is worked out, so no manager is ever handed a package this processor
# cannot run. tasks/architecture_availability.yaml is the one place that answers it, and
# verify_install.yaml reads the same file, so the two cannot disagree about it.
- name: Decide which requested mappings this machine's processor architecture cannot run
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/architecture_availability.yaml"
    apply:
      tags: [always]
  tags: always

- name: Leave out every requested mapping this machine's processor architecture cannot run
  ansible.builtin.set_fact:
    software_installer_packages: >-
      {{ software_installer_packages | rejectattr('key', 'in', ih_architecture_skipped | list) | list }}
  tags: always

- name: Name every requested mapping skipped for this machine's processor architecture
  ansible.builtin.debug:
    msg: >-
      [WARN] Skipping {{ item.key }}: the vendor publishes no build for this processor, it
      {{ item.value }}. Nothing is wrong with the run.
  loop: "{{ ih_architecture_skipped | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  tags: always

# The same shape for snap. With install_snapd off nothing installs snapd, so a snap mapping would only
# fail four times and end the run failed for a choice the user made. On Ubuntu itself snapd ships with
# the system, so nothing is skipped there whatever the toggle says. tasks/snap_availability.yaml is the
# one place that answers it, and site.yaml names the same list at the end of the run.
- name: Decide which requested mappings need snapd while install_snapd is off
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/snap_availability.yaml"
    apply:
      tags: [always]
  tags: always

- name: Leave out every requested mapping that needs snapd while install_snapd is off
  ansible.builtin.set_fact:
    software_installer_packages: >-
      {{ software_installer_packages | rejectattr('key', 'in', ih_snap_skipped | list) | list }}
  tags: always

- name: Name every requested mapping skipped because install_snapd is off
  ansible.builtin.debug:
    msg: >-
      [WARN] Skipping install_{{ item.key }}: {{ item.value }}. Turn install_snapd on to install it.
  loop: "{{ ih_snap_skipped | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  tags: always

# One place where each manager's package list is worked out, and every task below reads it
# from here.
#
# Two reasons, and the second one is the older problem. A batch is a single call, so when one fails
# every application in it is missing, and the rescue at the bottom of this file could only ever name
# the task: the user learned that "Install DNF packages" failed and never which forty
# applications they did not get. A task-level `vars:` is invisible from a rescue, so the list has to
# live somewhere the rescue can reach, and a fact is that somewhere.
#
# And the same list was already written out more than once: the apt expression appeared twice, once for
# the install and once for the log tail, and the flatpak one five times across the daemon install, the
# health probe, the repository purge, the Flathub remote and the batch itself. Editing one copy and not
# the others is how a run installs under one condition and reports under another, which this repository
# has already been burnt by. One definition each now.
#
# `always`, for the same reason as the two tasks above: every batch task depends on this fact, none of
# the per-manager tags selects it, and without the tag a documented invocation such as
# `--tags apt_batch` would find the fact undefined and install nothing while exiting zero.
- name: Group the requested packages by the manager that installs them
  ansible.builtin.set_fact:
    software_installer_batches:
      apt: >-
        {{ software_installer_packages
           | selectattr('value.manager', 'equalto', 'apt')
           | rejectattr('value.is_deb_url', 'defined')
           | map(attribute='value.package')
           | list }}
      dnf: >-
        {{ software_installer_packages
           | selectattr('value.manager', 'in', ['dnf', 'dnf_repo'])
           | map(attribute='value.package')
           | list }}
      pacman: >-
        {{ software_installer_packages
           | selectattr('value.manager', 'equalto', 'pacman')
           | map(attribute='value.package')
           | list }}
      flatpak: >-
        {{ software_installer_packages
           | selectattr('value.manager', 'equalto', 'flatpak')
           | map(attribute='value.package')
           | list }}
  tags: always

- name: Dynamically Install Packages
  block:
    # ------------------ LINUX MANAGERS ------------------
    - name: Configure official Debian/Ubuntu apt repositories
      ansible.builtin.include_tasks:
        file: debian_repos.yaml
        apply:
          tags: [apt_batch]
      tags: [apt_batch]
      when: ih_family == 'Debian'

    - name: Configure official Fedora dnf repositories
      ansible.builtin.include_tasks:
        file: fedora_repos.yaml
        apply:
          tags: [dnf_batch]
      tags: [dnf_batch]
      when: ih_family == 'RedHat'

    # After the repository setup above, and tagged always, because every consumer reads the answer and
    # a run limited by --tags to one of them still has to know the truth about this machine.
    # tasks/repository_availability.yaml is the one place that answers it.
    - name: Decide which requested third-party repositories this machine could not add
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/repository_availability.yaml"
        apply:
          tags: [always]
      tags: [always]

    # Worked out from the enabled mapping rather than from the batches, so the report names the
    # application the user asked for, and so it still holds when the batches are overridden, which the
    # forced-failure scenario does. updates_only repositories install nothing here, so nothing is
    # skipped for them. The names go to the terminal summary in site.yaml and the [ERROR] line below
    # reaches ~/installation_errors.log.
    - name: Start with no package skipped for a missing repository
      ansible.builtin.set_fact:
        repository_skipped_packages: []
      tags: [always]

    - name: Skip each package whose repository could not be added
      ansible.builtin.set_fact:
        repository_skipped_packages: "{{ repository_skipped_packages + [item.value.package] }}"
        not_installed_with_reason: >-
          {{ (not_installed_with_reason | default([]))
             + [item.key ~ ' (the ' ~ unavailable_repositories[item.key].vendor ~ ' repository could not be added)'] }}
        any_role_failed: true
      loop: "{{ software_installer_packages | selectattr('key', 'in', unavailable_repositories | default({}) | list) | list }}"
      loop_control:
        label: "{{ item.key }}"
      when: not (unavailable_repositories[item.key].updates_only | default(false) | bool)
      tags: [always]

    - name: Name every package skipped because its repository could not be added
      ansible.builtin.debug:
        msg: >-
          [ERROR] {{ repository_skipped_packages | length }} package(s) were NOT installed because the
          repository they come from could not be added: {{ repository_skipped_packages | join(', ') }}.
          The repository step that failed is named above. Every other package still installs.
      when: repository_skipped_packages | length > 0
      tags: [always]

    # One package per call, and there is no batch left anywhere in this file.
    #
    # The batch went on 2026-08-25 at the owner's decision, and the measurement backs it. Twenty-two
    # packages from this same mapping in debian:trixie, two samples each way: batched 250 and 199
    # seconds against looped 278 and 244, and on a desktop-heavy set with recommends, batched 274
    # against looped 264. Both shapes ended with identical package counts. Two identical batched runs
    # differed from each other by twenty per cent, which is larger than the difference being claimed.
    # So a batch was worth at most about two per cent of a container scenario, against losing the
    # whole set whenever any part of it failed, which happened three times in four days.
    #
    # What a batch used to cover, and what now covers it: apt solves the whole request at once, so it
    # cannot pick a library version for one package that the next cannot accept. A loop can. That is
    # answered afterwards rather than avoided beforehand, by the consistency guard below, which asks
    # apt whether the system it produced is coherent and fails the run naming what is broken. A batch
    # hid that question. A guard answers it.
    #
    # Through setup/ansible/tasks/install_role_packages.yaml, like every apt, dnf, pacman, flatpak, snap
    # and Homebrew install in the playbook, so the retry rule lives in one place: one attempt against the
    # cache the pre_tasks refreshed, then for a package that failed, wait, apt-get update, try again,
    # four attempts in all. Until 2026-10-15 this loop retried the same apt-get install four times
    # against the same lists. The shared file names every package still missing with what apt said,
    # records it in not_installed_with_reason and sets any_role_failed. A package whose repository could
    # not be added is named above as NOT installed and is left out of the list, because asking apt for
    # it would only fail four times over and name it a second time with a worse reason.
    - name: Install APT packages, one at a time
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
        apply:
          tags: [apt_batch]
      vars:
        role_packages: "{{ software_installer_batches.apt | reject('in', repository_skipped_packages | default([])) | list }}"
        role_packages_purpose: the software set
        role_packages_manager: apt
      when:
        - ih_family == 'Debian'
        - software_installer_batches.apt | length > 0
      tags: [apt_batch]

    # The guard that replaces what the batch used to hide. `apt-get check` re-reads the package
    # database and reports unmet dependencies and broken packages, which is exactly the state a
    # per-package loop could produce and a single solve could not. It is read-only and takes a second.
    - name: Ask apt whether the installed set is consistent
      ansible.builtin.command:
        cmd: apt-get check
      become: true
      register: apt_consistency
      changed_when: false
      failed_when: false
      when:
        - ih_family == 'Debian'
        - software_installer_batches.apt | length > 0
      tags: [apt_batch]

    - name: Report and record an inconsistent APT dependency state
      ansible.builtin.set_fact:
        any_role_failed: true
      when:
        - ih_family == 'Debian'
        - apt_consistency.rc | default(0) != 0
      tags: [apt_batch]

    - name: Name what apt says is broken
      ansible.builtin.debug:
        msg: >-
          [ERROR] apt reports the installed set is not consistent, which is the one thing installing
          one package at a time can produce and a single solve cannot. Fix the mapping or add the
          conflicting packages to the same request. apt said:
          {{ (apt_consistency.stderr | default('')) | trim | truncate(600) }}
          {{ (apt_consistency.stdout | default('')) | trim | truncate(600) }}
      when:
        - ih_family == 'Debian'
        - apt_consistency.rc | default(0) != 0
      tags: [apt_batch]

    - name: Show last 30 lines of the apt install log (debug)
      ansible.builtin.command: tail -30 /var/log/installation-packages.log
      become: true
      changed_when: false
      failed_when: false
      when:
        - ih_family == 'Debian'
        - software_installer_batches.apt | length > 0
      tags: [apt_batch]

    # Resolved once, into a list of {key, url, dest}, and every task below loops over that. The
    # download task and the install task each used to re-derive the URL with their own copy of the
    # same expression, which is the two-lists shape this repository has already been burnt by: edit
    # one and the run downloads under one condition and installs under another.
    #
    # An empty url is dropped here rather than guarded for three times. That is also the shape the
    # verify play asserts against, so a mapping with no download location is a named failure in the
    # e2e run instead of a package that silently never installs.
    - name: Resolve the vendor .deb downloads this run needs
      ansible.builtin.set_fact:
        apt_url_items: >-
          {{ apt_url_items | default([]) + [{
               'key': item.key,
               'url': item_url | trim,
               'dest': software_installer_stage_dir ~ '/' ~ item.key ~ '.deb'
             }] }}
      loop: "{{ software_installer_packages | selectattr('value.manager', 'equalto', 'apt_url') | list }}"
      vars:
        item_url: "{{ item.value.url | default(lookup('vars', item.key ~ '_url', default='')) }}"
      when:
        - ih_family == 'Debian'
        - item_url | trim | length > 0
      loop_control:
        label: "{{ item.key }}"
      tags: [apt_batch]

    # Vendor .deb files are staged in a directory only root can enter, never in /tmp. The old path
    # was /tmp/apt_url-<key>.deb, which is a predictable name in a directory every local account can
    # write to, and the file is then handed to apt and installed as root. Any unprivileged user on
    # the machine could sit in a loop replacing that file between the download and the install and
    # get their own package installed with root maintainer scripts. Mode 0700 on the directory closes
    # the window without needing to trust the file name.
    #
    # Not gated on os_family, because custom_installs.yaml stages its own vendor artifacts here on
    # Fedora as well, and a directory that exists only on Debian would send those back to /tmp.
    #
    # No `group:` on purpose, and this is the second time a hardcoded per-platform name has bitten this
    # repository. Asking for `group: root` fails on macOS, where the group owning gid 0 is named wheel,
    # and this task runs on every platform and sits early in the block, so a failed group lookup would
    # have taken the Homebrew batches and every macOS custom install down with it and named only this
    # task. Omitting it gives the directory root's own primary group, which is root on Linux and wheel
    # on macOS, decided by the platform rather than by us. At mode 0700 the group cannot read it anyway.
    - name: Create the private staging directory for vendor downloads
      ansible.builtin.file:
        path: "{{ software_installer_stage_dir }}"
        state: directory
        owner: root
        mode: '0700'
      become: true
      tags: [apt_batch]

    # Two-step pattern: fetch the .deb, then install from the local file. The apt module's own
    # `deb: <url>` parameter has no retry support, so the fetch is done here where `retries` and
    # `delay` apply.
    #
    # `force: true` because the destination name is stable while several of these artifacts are not.
    # TeamViewer's download URL has no version in it at all, so a cached file under a permanent path
    # would be reused forever and the run would install a months-old build while reporting success,
    # and tier 3 could not catch it because it compares package names and never versions. get_url
    # with force compares content and still reports ok when the bytes match, so idempotency survives.
    #
    # `async` with `poll` above zero bounds the task without introducing any concurrency. It is here
    # because `timeout: 60` bounds a single socket operation and not the transfer, so a vendor that
    # dribbles bytes could hold an unattended run open indefinitely. This is the same mistake, in the
    # same file, that the AUR loop below records having made.
    #
    # One dead vendor URL must not cost the rest of the phase. Before this was two tasks it could
    # not: the download was fatal, and the tasks after it are the flatpak batch, snap, and every
    # custom install, so a single 404 on a pinned artifact took roughly twenty applications down with
    # it. `ignore_errors` keeps the item's own failure loud in the log and lets the others proceed,
    # and what happened is then established from the file on disk rather than from the result's
    # `failed` key, which `failed_when` rewrites and e2e/tier1/failed_key_reads.sh forbids reading.
    - name: Download .deb files for apt_url installs
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ item.dest }}"
        # Keyed by artifact, `<toggle>_deb`, because every other callsite in the repository keys this
        # mapping by artifact and the documented examples do too. This one keyed it by the bare toggle
        # name, so the five entries it looks for could not be written by anyone following the
        # documentation, and the mapping is empty, so nothing noticed.
        checksum: "{{ download_checksums[item.key ~ '_deb'] | default(omit) }}"
        force: true
        mode: '0600'
        timeout: 60
      become: true
      register: apt_url_download
      async: 900
      poll: 5
      # Five, not three, and fifteen seconds apart. Thirty seconds of patience was not enough for
      # Launchpad, which carries VeraCrypt: Ubuntu's gnome-full cell lost the download on 2026-08-21
      # after all three attempts, and the same URL answered 200 from a developer machine minutes
      # later while a second Launchpad URL returned nothing at all. A vendor host that rate-limits
      # needs a longer budget than a vendor host that is simply slow.
      retries: 5
      delay: 15
      until: apt_url_download is succeeded
      ignore_errors: true
      loop: "{{ apt_url_items | default([]) }}"
      loop_control:
        label: "{{ item.key }}"
      tags: [apt_batch]

    - name: Check which vendor .deb files actually arrived
      ansible.builtin.stat:
        path: "{{ item.dest }}"
      become: true
      register: apt_url_staged
      loop: "{{ apt_url_items | default([]) }}"
      loop_control:
        label: "{{ item.key }}"
      changed_when: false
      tags: [apt_batch]

    # The stat results are turned into two lists of keys here rather than looped over directly, and the
    # reason is what the run record looks like. A loop over `apt_url_staged.results` makes each loop
    # item an entire stat result, and the callback records the raw item rather than the loop label, so
    # every per-item line for the install below read as several hundred characters of mode, inode and
    # checksum before reaching the package name, and the end-of-run "installed" section carried four of
    # those dictionaries instead of four package names. A failure has to name the software the user did
    # not get, and that one did the opposite. Measured on a Debian container run, not reasoned about.
    #
    # Both lists come off the same results in one task, so present and absent cannot drift apart.
    - name: List which vendor .deb files arrived and which did not
      ansible.builtin.set_fact:
        apt_url_present: >-
          {{ apt_url_staged.results | default([])
             | selectattr('stat.exists')
             | map(attribute='item.key')
             | list }}
        apt_url_absent: >-
          {{ apt_url_staged.results | default([])
             | rejectattr('stat.exists')
             | map(attribute='item.key')
             | list }}
      tags: [apt_batch]

    # Tolerated per item, for the same reason the download above is. On the Debian defaults run of
    # 2026-08-17 balenaEtcher's vendor package declared a dependency on a graphical authentication agent
    # that a container has no desktop to provide, apt refused it, and while this task was fatal the
    # block's rescue skipped everything after it: the flatpak set, snap and every custom install were
    # lost to one unsatisfiable dependency on one of five artifacts.
    #
    # apt-get with a path, not the apt module's `deb:` option, and the difference is not cosmetic.
    # `deb:` runs dpkg -i and then apt-get -f install, and dpkg cannot choose between the providers of
    # a virtual dependency. balenaEtcher's .deb depends on
    # polkit-1-auth-agent | policykit-1-gnome | polkit-kde-1, four packages provide the first of those
    # on Debian trixie, and the module answers "Dependency is not satisfiable" and leaves the package
    # unpacked and unconfigured. `apt-get install ./file.deb` hands the local file to the solver,
    # which picks a provider and installs it. Measured on debian:trixie and ubuntu:26.04 on
    # 2026-08-21: the module refuses, the command exits 0 and dpkg -l reports it installed. The path is
    # absolute, which is what makes apt read it as a file: the argument must contain a slash.
    #
    # The cost is real and worth knowing: apt satisfies that dependency with ukui-polkit, which pulls
    # systemsettings, polkitd and the rest of a desktop authentication stack onto a machine that may
    # have no desktop. That is the package's own requirement rather than something this playbook
    # invents, and a run that shows it is more honest than a suppression that hides it.
    #
    # Through the shared file with apt, because apt-get resolves each file's dependencies from the
    # package lists, so a retry after apt-get update is the one that can see a dependency a lagging
    # mirror did not have. The shared file names each file that did not install.
    - name: Install APT from URL, one vendor .deb at a time
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
        apply:
          tags: [apt_batch]
      vars:
        role_packages: >-
          {{ apt_url_items | default([])
             | selectattr('key', 'in', apt_url_present | default([]))
             | map(attribute='dest')
             | list }}
        role_packages_purpose: the vendor .deb downloads
        role_packages_manager: apt
      when:
        - ih_family == 'Debian'
        - apt_url_present | default([]) | length > 0
      tags: [apt_batch]

    # Read straight after the include and under the same condition, because role_packages_missing is
    # whatever the last include of the shared file left behind.
    - name: Remember which vendor .deb files apt refused
      ansible.builtin.set_fact:
        apt_url_refused: "{{ role_packages_missing | default([]) }}"
      when:
        - ih_family == 'Debian'
        - apt_url_present | default([]) | length > 0
      tags: [apt_batch]

    # Asks dpkg what is on the machine rather than trusting the task above, which is the same shape as
    # the `pacman -Qq` check that finally caught the AUR case. A vendor package can also exit zero and
    # install nothing, and this notices that too.
    - name: Ask dpkg which vendor packages actually installed
      ansible.builtin.shell: "dpkg-query -W -f='${Status}' {{ item.package }} 2>/dev/null | grep -c 'install ok installed' || true"
      register: apt_url_installed_check
      changed_when: false
      loop: >-
        {{ software_installer_packages
           | selectattr('value.manager', 'equalto', 'apt_url')
           | map(attribute='value') | list }}
      loop_control:
        label: "{{ item.package }}"
      when: ansible_facts['system'] == 'Linux' and ih_family == 'Debian'
      tags: [apt_batch]

    - name: Work out which vendor packages the user did not get
      ansible.builtin.set_fact:
        apt_url_missing: >-
          {{ (apt_url_installed_check.results | default([]))
             | rejectattr('stdout', 'equalto', '1')
             | map(attribute='item.package') | list }}
      tags: [apt_batch]

    # A package the user asked for and did not get marks the run failed at the end, whether the file
    # never arrived or the install refused it. Tolerating a failure mid-run and pretending it did not
    # happen are different things.
    - name: Record vendor packages that are not installed
      ansible.builtin.set_fact:
        any_role_failed: true
      when: (apt_url_absent | default([]) | length > 0) or (apt_url_missing | default([]) | length > 0)
      tags: [apt_batch]

    - name: Report vendor downloads that never arrived
      ansible.builtin.debug:
        msg: >-
          [ERROR] These packages install from a vendor URL and the file never arrived, so they are not
          installed: {{ apt_url_absent | join(', ') }}. The URLs come from the pinned values, and there
          are two quite different reasons this happens, so check which one before changing anything.
          A 404 means the pinned version has been withdrawn and the pin needs bumping. Anything else,
          a timeout or a connection reset or no answer at all, means the vendor's host was unreachable
          for the whole retry budget and the pin is probably fine. Launchpad, which carries VeraCrypt,
          rate-limits and has been measured returning nothing at all to a request that succeeds
          moments later.
      when: apt_url_absent | default([]) | length > 0
      tags: [apt_batch]

    # Only the shape the shared file cannot see: the file arrived, apt exited 0 on it, and dpkg still does
    # not have the package. A file that never arrived is named by the task above, and a file apt refused
    # by the shared install file, with what apt said.
    - name: Report vendor packages that apt reported installed and dpkg does not have
      ansible.builtin.debug:
        msg: >-
          [ERROR] These vendor packages downloaded and apt installed them without an error, and dpkg
          does not list them as installed: {{ apt_url_silently_absent | join(', ') }}. Either the
          package name in the OS dictionary is not the name the .deb installs, or the install did nothing.
      vars:
        apt_url_silently_absent: >-
          {{ software_installer_packages
             | selectattr('value.manager', 'equalto', 'apt_url')
             | selectattr('key', 'in', apt_url_present | default([]))
             | rejectattr('key', 'in', apt_url_refused_keys)
             | map(attribute='value.package')
             | select('in', apt_url_missing | default([]))
             | list }}
        apt_url_refused_keys: >-
          {{ apt_url_items | default([])
             | selectattr('dest', 'in', apt_url_refused | default([]))
             | map(attribute='key') | list }}
      when: apt_url_silently_absent | length > 0
      tags: [apt_batch]

    # Nothing here is wanted after the install: they are one-shot vendor artifacts, up to five of
    # them, the largest measured at 119 MB, and leaving them behind grows /var/cache on every run
    # for no benefit. Removing them also means there is no cached file for a later run to trust.
    - name: Remove the staged vendor .deb files
      ansible.builtin.file:
        path: "{{ item.dest }}"
        state: absent
      become: true
      loop: "{{ apt_url_items | default([]) }}"
      loop_control:
        label: "{{ item.key }}"
      tags: [apt_batch]

    # One package per call, for the reason written above the apt task, and the same shape, through the
    # same shared file: one attempt against the metadata dnf already holds, then for a package that
    # failed, wait, dnf makecache --refresh, try again, four attempts in all. Until 2026-10-15 this loop
    # retried the same dnf install four times against the same metadata. A command rather than the dnf
    # module, because the module reports a failure only through the result's `failed` key, which this
    # repository forbids deciding from. See e2e/tier1/failed_key_reads.sh.
    - name: Install DNF packages, one at a time
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
        apply:
          tags: [dnf_batch]
      vars:
        role_packages: "{{ software_installer_batches.dnf | reject('in', repository_skipped_packages | default([])) | list }}"
        role_packages_purpose: the software set
        role_packages_manager: dnf
      when:
        - ih_family == 'RedHat'
        - software_installer_batches.dnf | length > 0
      tags: [dnf_batch]

    # The same guard the apt path carries. `dnf check --dependencies` re-reads the RPM database and
    # reports unmet dependencies, which is the state a per-package loop could produce and one
    # transaction could not.
    - name: Ask dnf whether the installed set is consistent
      ansible.builtin.command:
        cmd: dnf check --dependencies
      become: true
      register: dnf_consistency
      changed_when: false
      failed_when: false
      when:
        - ih_family == 'RedHat'
        - software_installer_batches.dnf | length > 0
      tags: [dnf_batch]

    - name: Report and record an inconsistent DNF dependency state
      ansible.builtin.set_fact:
        any_role_failed: true
      when:
        - ih_family == 'RedHat'
        - dnf_consistency.rc | default(0) != 0
      tags: [dnf_batch]

    - name: Name what dnf says is broken
      ansible.builtin.debug:
        msg: >-
          [ERROR] dnf reports unmet dependencies in the installed set, which is the one thing
          installing one package at a time can produce and a single transaction cannot. dnf said:
          {{ (dnf_consistency.stdout | default('')) | trim | truncate(600) }}
          {{ (dnf_consistency.stderr | default('')) | trim | truncate(600) }}
      when:
        - ih_family == 'RedHat'
        - dnf_consistency.rc | default(0) != 0
      tags: [dnf_batch]

    # Vendor .rpm files straight from their URL, one per call, through the shared file with dnf. The
    # location is the per-item `url:` field, else <key>_rpm_url, else <key>_url.
    #
    # --nogpgcheck because vendor-published .rpms (TeamViewer, VeraCrypt, Etcher and the rest) are
    # signed by the vendor's own key, not by Fedora's, and dnf5 rejects them. The URL itself comes from
    # setup/pinned_values/pinned_values.toml, under this repository's control.
    #
    # This was the dnf module, whose failure on the last attempt was fatal, so one withdrawn vendor rpm
    # sent the whole software installer into its rescue and skipped the flatpak set and every custom
    # install after it. The shared file names the URL that did not install and carries on.
    #
    # A mapping with exclude_path goes down the rpm route instead, grouped by the path it leaves out, so
    # its rpm never writes that path. The field in vars/RedHat.yaml is the one place that decides it, and
    # e2e/tier2/rpm_file_conflicts.sh reads the same field.
    - name: Resolve the vendor .rpm locations this run installs
      ansible.builtin.set_fact:
        dnf_url_locations: >-
          {{ (dnf_url_locations | default([]))
             + ([] if item.value.exclude_path is defined else [item_url | trim]) }}
        dnf_url_excluding: >-
          {{ (dnf_url_excluding | default({}))
             | combine({item.value.exclude_path: ((dnf_url_excluding | default({}))[item.value.exclude_path]
                                                  | default([])) + [item_url | trim]}
                       if item.value.exclude_path is defined else {}) }}
      loop: "{{ software_installer_packages | selectattr('value.manager', 'equalto', 'dnf_url') | list }}"
      vars:
        item_url: >-
          {{ item.value.url
             | default(lookup('vars', item.key ~ '_rpm_url', default=''))
             | default(lookup('vars', item.key ~ '_url', default=''), true) }}
      when:
        - ih_family == 'RedHat'
        # Trimmed, so a pin holding nothing but whitespace counts as absent here and in
        # e2e/tier3/verify.yaml alike rather than as absent to one and present to the other.
        - item_url | trim | length > 0
      loop_control:
        label: "{{ item.key }}"
      tags: [dnf_batch]

    - name: Install DNF from URL, one vendor .rpm at a time
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
        apply:
          tags: [dnf_batch]
      vars:
        role_packages: "{{ dnf_url_locations | default([]) }}"
        role_packages_purpose: the vendor .rpm downloads
        role_packages_manager: dnf
        role_packages_install_options: --nogpgcheck
      when:
        - ih_family == 'RedHat'
        - dnf_url_locations | default([]) | length > 0
      tags: [dnf_batch]

    - name: Install the vendor .rpm files rpm installs without a path, one at a time
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
        apply:
          tags: [dnf_batch]
      vars:
        role_packages: "{{ dnf_url_excluding[rpm_excluded_path] }}"
        role_packages_purpose: the vendor .rpm downloads rpm installs without {{ rpm_excluded_path }}
        role_packages_manager: rpm_url
        role_packages_install_options: "--excludepath={{ rpm_excluded_path | quote }}"
      loop: "{{ dnf_url_excluding | default({}) | list }}"
      loop_control:
        loop_var: rpm_excluded_path
      when: ih_family == 'RedHat'
      tags: [dnf_batch]

    # Every package that brings Steam, which on CachyOS is the gaming suite as well as steam itself.
    # ih_steam_packages comes from setup/ansible/tasks/steam_graphics_alignment.yaml through arch_core.
    - name: Record Steam as NOT installed because the 32-bit graphics stack could not be aligned
      ansible.builtin.set_fact:
        any_role_failed: true
        not_installed_with_reason: >-
          {{ (not_installed_with_reason | default([]))
             + (ih_steam_packages | map('regex_replace', '$', ' (the CachyOS 32-bit graphics packages could not be aligned)') | list) }}
      when:
        - ih_family == 'Archlinux'
        - ih_steam_requested | default(false) | bool
        - not (steam_graphics_stack_aligned | default(true) | bool)
      tags: [pacman_batch]

    - name: Name Steam as NOT installed because the 32-bit graphics stack could not be aligned
      ansible.builtin.debug:
        msg: >-
          [ERROR] {{ ih_steam_packages | join(', ') }} {{ 'was' if ih_steam_packages | length == 1 else 'were' }}
          NOT installed, because the CachyOS 32-bit graphics packages could not be aligned. The
          alignment step that failed is named earlier in this log. Every other pacman package still
          installs.
      when:
        - ih_family == 'Archlinux'
        - ih_steam_requested | default(false) | bool
        - not (steam_graphics_stack_aligned | default(true) | bool)
      tags: [pacman_batch]

    # One package per call, for the reason written above the apt task, and the same shape.
    #
    # This is the path with the most to lose from losing its single solve, and it is worth naming
    # exactly what that was. pacman picks a provider for a virtual dependency once when it sees the
    # whole request. Installing one package at a time picks a provider per package, and two choices
    # can contradict each other: the CachyOS alignment task in roles/arch_core/tasks/main.yaml records
    # that chain in full, where steam wants
    # lib32-vulkan-driver, whose first provider drags in mesa-git, which conflicts with the stable
    # mesa that qemu-full installed earlier in the same run.
    #
    # A batch did not solve that either. It turned a contradiction into one failure with no way to
    # tell which package caused it, which is how one bad name silently dropped every pacman package
    # from a run while the play stayed green, recorded in docs/regression_ledger.md. The answer is
    # the guard below, which asks pacman afterwards whether the installed set is coherent and names
    # what is broken.
    #
    # pacman through a command rather than the module, for the reporting rather than the installing:
    # the module reports failure through the result's `failed` key and this repository forbids
    # deciding from that key. See e2e/tier1/failed_key_reads.sh. A command returns rc.
    #
    # --needed so a package already present is not reinstalled, which is what keeps a rerun honest.
    #
    # Through setup/ansible/tasks/install_role_packages.yaml, the file every role's own pacman list
    # goes through, so the rule for when pacman may refresh its index lives in one place. Until
    # 2026-10-15 this loop had its own copy of the install and retried the same command three times
    # without a refresh, so a package a lagging mirror answered 404 for was asked of the same stale
    # index four times and lost, measured against a fake pacman that serves a file only after a
    # refresh. The shared file tries each package once against the index arch_core upgraded the
    # system against, then retries only the packages that failed, refreshing before each retry, with
    # the same four attempts in all. It names every package still missing with what pacman said,
    # records it in not_installed_with_reason and sets any_role_failed.
    #
    # Steam, and on CachyOS the gaming suite that depends on it, is left out of the list when the
    # CachyOS 32-bit graphics stack could not be aligned, because without it pacman stops on a conflict
    # it cannot answer. Each is named as NOT installed with the reason just before this instead.
    # steam_graphics_stack_aligned and ih_steam_packages come from
    # setup/ansible/tasks/steam_graphics_alignment.yaml through arch_core, and the first is true
    # everywhere there is nothing to align.
    - name: Install Pacman packages, one at a time
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
        apply:
          tags: [pacman_batch]
      vars:
        role_packages: >-
          {{ software_installer_batches.pacman
             | reject('in', [] if (steam_graphics_stack_aligned | default(true) | bool)
                            else (ih_steam_packages | default([])))
             | list }}
        role_packages_purpose: the software set
      when:
        - ih_family == 'Archlinux'
        - software_installer_batches.pacman | length > 0
      tags: [pacman_batch]

    # The guard that replaces the single solve. `pacman -Dk` checks the local database for missing
    # dependencies and for packages whose dependencies are not satisfied, which is exactly the state
    # a per-package loop can produce and one solve cannot. Read-only and takes a second.
    - name: Ask pacman whether the installed set is consistent
      ansible.builtin.command:
        cmd: pacman -Dk
      become: true
      register: pacman_consistency
      changed_when: false
      failed_when: false
      when:
        - ih_family == 'Archlinux'
        - software_installer_batches.pacman | length > 0
      tags: [pacman_batch]

    - name: Report and record an inconsistent Pacman dependency state
      ansible.builtin.set_fact:
        any_role_failed: true
      when:
        - ih_family == 'Archlinux'
        - pacman_consistency.rc | default(0) != 0
      tags: [pacman_batch]

    - name: Name what pacman says is broken
      ansible.builtin.debug:
        msg: >-
          [ERROR] pacman reports the installed set is not consistent, which is the one thing
          installing one package at a time can produce and a single solve cannot. A conflicting
          provider choice looks like this, and the fix is to name the provider you want in the OS
          dictionary rather than the virtual package. pacman said:
          {{ (pacman_consistency.stdout | default('')) | trim | truncate(600) }}
          {{ (pacman_consistency.stderr | default('')) | trim | truncate(600) }}
      when:
        - ih_family == 'Archlinux'
        - pacman_consistency.rc | default(0) != 0
      tags: [pacman_batch]

    # --noprovides, and it is not optional. Four AUR packages provide `appimagelauncher` and three
    # provide `google-chrome` besides the exactly-named ones, and paru asks which to use:
    #
    #   :: There are 5 providers available for appimagelauncher:
    #       1) appimagelauncher  2) appimagelauncher-beta-bin  ...
    #      Enter a number (default=1):
    #
    # --noconfirm does not answer that question. paru asks, gets nothing, and exits 1. Both names
    # exist as real AUR packages, checked against the AUR API, so --noprovides makes paru target the
    # literal name and picks exactly what the default would have picked, minus the prompt.
    #
    # The concurrency is gone too, and the ledger's own rule 9 is why: anything writing to shared
    # on-disk state from a loop needs serialisation, not async for throughput, and the pacman
    # database is shared on-disk state. jetbrains-toolbox built cleanly in a real run and then died
    # on `:: Pacman is currently in use, please wait...` because eleven jobs fired with poll: 0 all
    # run at once, so `throttle: 2` was throttling the firing and nothing else. Builds are slower in
    # series and they finish, which beats faster and absent.
    #
    # failed_when: false keeps one bad build from abandoning a forty minute play, and the collectors
    # below read rc rather than `failed`, because failed_when rewrites `failed` and used to erase the
    # evidence they were looking for.
    # async with poll above zero, which is the combination that gives a hard time bound WITHOUT
    # bringing the concurrency back. Ansible waits for each item before starting the next, so the
    # pacman database lock is still uncontended, and the async wrapper still kills a build that
    # exceeds 90 minutes.
    #
    # Recorded because I broke it and a review caught it: removing the old `poll: 0` firing to fix
    # the lock contention also removed the only time bound in this path, leaving a plain foreground
    # module call with nothing to stop it. --noconfirm --skipreview --noprovides does not cover every
    # prompt paru can raise, a PGP key import or a pkgver() reaching an unreachable host among them,
    # and one such package would have hung an unattended run forever. Trading a real timeout away
    # while fixing something else is exactly the kind of thing this repository's ledger exists for.
    #
    # An expired job returns "async task did not complete within the requested time" with no rc, so
    # the rc collector below cannot see it. The pacman -Qq absence check can, which is why that check
    # is load-bearing rather than belt-and-braces.
    - name: Install AUR packages (one at a time, so the pacman database lock cannot be contended)
      become: true
      become_user: "{{ non_root_user }}"
      kewlfft.aur.aur:
        name: "{{ item.value.package }}"
        state: present
        use: paru
        extra_args: "--noconfirm --skipreview --needed --noprovides"
      loop: "{{ software_installer_packages | selectattr('value.manager', 'equalto', 'aur') | list }}"
      # paru_available comes from setup/ansible/tasks/paru_availability.yaml through arch_core. When
      # paru could not be built nothing here runs, and the collector below the pacman query names every
      # requested package that is not already on the machine as skipped for that reason.
      when:
        - ih_family == 'Archlinux'
        - paru_available | default(false) | bool
      register: aur_results
      async: "{{ aur_build_timeout | default(5400) | int }}"
      poll: 15
      failed_when: false
      # Retried, because these builds are network-heavy and the observed failures are transfers
      # rather than compilation. lens-bin fetches a 230 MB AppImage, and it failed twice in the harness
      # while the identical build with the identical helper flags succeeded when run by hand in the same
      # image, which is the signature of a transient transfer rather than a broken package.
      #
      # The retry rule every package manager follows, four attempts twenty seconds apart, by the
      # owner's decision of 2026-10-15, with no refresh between them, because the AUR keeps no index
      # to refresh: paru asks the AUR's /rpc endpoint on every call, and its own -y, "Refresh local
      # repos", refreshes the pacman sync databases, which before a single install is the partial
      # upgrade e2e/tier1/pacman_partial_refresh.sh forbids. The budget was five attempts sixty seconds
      # apart before, raised after a kde-full run on Arch lost google-chrome to
      # `error sending request for url (https://aur.archlinux.org/rpc): channel closed` while the nine
      # other AUR packages built fine seconds later, because aur.archlinux.org rate-limits that endpoint
      # per source address. One minute of patience is now what such a package gets, which that run
      # suggests can be too little, and the package is named as NOT installed if it is.
      #
      # `until` reads rc, not the result's `failed` key, and that is the only reason this works at all:
      # `failed_when: false` above rewrites `failed` to false, so `until: aur_results is succeeded`
      # would be true on the first attempt and the retry would never happen. That exact mistake is
      # recorded in docs/regression_ledger.md against a different task in this file. Measured rather
      # than assumed: the same task shape run against /bin/false retries the full count per item.
      retries: 3
      delay: 20
      until: (aur_results.rc | default(1)) == 0
      loop_control:
        label: "{{ item.value.package }}"
      tags: [pacman_batch]

    # Selected on rc, not on `failed`, and that distinction is why this collector was dead code from
    # the day it was written. The install task carries `failed_when: false` so one bad build cannot
    # abandon a forty minute play, and Ansible applies `failed_when` by rewriting the result's own
    # `failed` key. Every item therefore arrives here with `failed: false` whatever the build did, and
    # an expression selecting `failed == true` can never match anything.
    #
    # Read off a real run rather than reasoned about. Three AUR builds in one defaults run exited
    # rc 1, their result files each carried `"failed": true`, and this collector still produced an
    # empty list while the play carried on. The build's own rc survives untouched by failed_when,
    # which is why rc is the thing to read.
    - name: Collect AUR packages that reported a failure
      ansible.builtin.set_fact:
        aur_reported_failures: >-
          {{ (aur_results.results | default([]))
             | selectattr('rc', 'defined')
             | rejectattr('rc', 'equalto', 0)
             | map(attribute='item.value.package')
             | list }}
      when: ih_family == 'Archlinux'
      tags: [pacman_batch]

    # A build killed by the async timeout comes back with no rc at all, so the collector above cannot
    # see it, and its msg is Ansible's own "async task did not complete within the requested time".
    # Selected on that message rather than on `failed`, for the same reason as above.
    #
    # This collector was briefly hardcoded to an empty list, when serialising the loop removed the
    # async firing and I reasoned there was no longer a timeout state to collect. That was wrong in
    # two ways: it also removed the timeout itself, and a hardcoded empty list is a collector that
    # cannot report. Both are back.
    - name: Collect AUR packages whose build was killed by the timeout
      ansible.builtin.set_fact:
        aur_timed_out: >-
          {{ (aur_results.results | default([]))
             | selectattr('msg', 'defined')
             | selectattr('msg', 'search', 'did not complete within the requested time')
             | map(attribute='item.value.package')
             | list }}
      when: ih_family == 'Archlinux'
      tags: [pacman_batch]

    # A third shape, and the only one of the three that the job's own result cannot reveal: paru
    # exits 0, async_status reports finished 1 with failed absent, and the package is not on the
    # machine. Found on a kde-configure-only run where verification reported antigravity missing
    # while the playbook's summary listed it as installed and both collectors above reported
    # nothing. Asking pacman is the only way to tell, so ask pacman.
    #
    # A name here that pacman does not know is a failure either way, and the message says so: either
    # the build did not install, or the AUR base name differs from the built pkgname and the mapping
    # names the wrong one. Both need the same look. All eleven AUR names in the Arch dictionary were
    # checked against `pacman -Q` inside a finished container and every one resolved, so this does
    # not fire spuriously today.
    - name: Ask pacman which requested AUR packages are actually installed
      ansible.builtin.command:
        cmd: "pacman -Qq {{ aur_requested_packages | join(' ') }}"
      vars:
        aur_requested_packages: >-
          {{ software_installer_packages
             | selectattr('value.manager', 'equalto', 'aur')
             | map(attribute='value.package')
             | list }}
      register: aur_installed_query
      changed_when: false
      failed_when: false
      when:
        - ih_family == 'Archlinux'
        - software_installer_packages | selectattr('value.manager', 'equalto', 'aur') | list | length > 0
      tags: [pacman_batch]

    - name: Collect AUR packages that reported success and are not installed
      ansible.builtin.set_fact:
        aur_absent_after_install: >-
          {{ software_installer_packages
             | selectattr('value.manager', 'equalto', 'aur')
             | map(attribute='value.package')
             | difference(aur_installed_query.stdout_lines | default([]))
             | list }}
      when:
        - ih_family == 'Archlinux'
        - paru_available | default(false) | bool
      tags: [pacman_batch]

    # The same absence, with the other cause. Nothing was attempted, so the message must not say a
    # build failed or claimed success. A package an earlier run already installed is still there and
    # is not named, which is why this asks pacman rather than listing every requested AUR package.
    # Kept apart from failed_aur_packages for the same reason: that list's message explains three
    # build outcomes, and none of them happened here.
    - name: Collect AUR packages skipped because paru could not be built
      ansible.builtin.set_fact:
        aur_skipped_without_paru: >-
          {{ (aur_skipped_without_paru | default([]))
             + (software_installer_packages
                | selectattr('value.manager', 'equalto', 'aur')
                | map(attribute='value.package')
                | difference(aur_installed_query.stdout_lines | default([]))
                | list) }}
      when:
        - ih_family == 'Archlinux'
        - not (paru_available | default(false) | bool)
      tags: [pacman_batch]

    - name: Combine every kind of AUR failure
      ansible.builtin.set_fact:
        failed_aur_packages: >-
          {{ (aur_reported_failures | default([])
              + aur_timed_out | default([])
              + aur_absent_after_install | default([])) | unique }}
      when: ih_family == 'Archlinux'
      tags: [pacman_batch]

    # Diagnosis for the shape that reports success and installs nothing. It has now happened three
    # times, on a different package each time and exactly one package per run out of eleven:
    # antigravity, then visual-studio-code-bin, then appimagelauncher. One in eleven at random is not
    # a package problem, and the packages were checked: visual-studio-code-bin's AUR entry is
    # healthy and its 239 MB source matched the declared sha256 exactly.
    #
    # What is missing is the build's own output, and a review caught that my first attempt could not
    # supply it. It printed the module's `msg`, which for a successful-but-absent item is the canned
    # string "installed package(s)": kewlfft.aur.aur only carries paru's stdout when it fails, and
    # those items are already named by the rc collector above. So the one shape this exists to
    # explain would have produced nothing useful.
    #
    # pacman's own log is the artefact that does not depend on the module. It records every
    # transaction with a timestamp, so a package that paru claimed to install and pacman never
    # committed is visible as an absence of any `installed <name>` line, and a partial transaction is
    # visible as an `upgraded`/`removed` pair without it.
    #
    # `shell` rather than `debug` on purpose. The dual_logger callback renders a command's stdout and
    # does not render a debug message on an ok task, which is why the three warnings above were
    # invisible and why this took three runs to notice. It must not fail the task either, or it would
    # abandon the rest of the install, which is what `fail` or `assert` here would do.
    - name: Show what pacman recorded for every AUR package that is absent
      ansible.builtin.shell:
        cmd: >-
          grep -aE '\[ALPM\] (installed|upgraded|removed) ({{ aur_absent_after_install | join('|') }})'
          /var/log/pacman.log | tail -20;
          echo "--- last 15 pacman transactions ---";
          grep -aE '\[ALPM\] (installed|upgraded|removed)' /var/log/pacman.log | tail -15
      # No register on purpose. The value of this task is its stdout, which the callback renders, and a
      # registered result that nothing reads is the exact shape of the dead collector this file already
      # got burnt by: e2e/tier1/tolerated_failures_read.sh now fails the gate for one.
      changed_when: false
      failed_when: false
      when:
        - ih_family == 'Archlinux'
        - aur_absent_after_install | default([]) | length > 0
      tags: [pacman_batch]

    # Reported separately because they need different responses. A failure means read the build
    # log, a timeout means either the build is genuinely slower than the budget or the machine
    # was oversubscribed, and raising the budget is the fix rather than retrying.
    - name: Surface AUR builds that failed
      ansible.builtin.debug:
        msg: "[WARN] AUR packages failed to build: {{ aur_reported_failures | join(', ') }}"
      when:
        - ih_family == 'Archlinux'
        - aur_reported_failures | default([]) | length > 0
      tags: [pacman_batch]

    - name: Surface AUR packages that claimed success and are absent
      ansible.builtin.debug:
        msg: "[WARN] AUR packages reported a successful build and pacman does not have them: {{ aur_absent_after_install | join(', ') }}. Either the build exited zero without installing, which a rerun usually shows again, or the package name in vars/Archlinux.yaml is the AUR base rather than the built package name, in which case fix the mapping."
      when:
        - ih_family == 'Archlinux'
        - aur_absent_after_install | default([]) | length > 0
      tags: [pacman_batch]

    - name: Surface AUR packages skipped because paru could not be built
      ansible.builtin.debug:
        msg: >-
          [ERROR] paru could not be built, so these Arch User Repository packages were NOT installed:
          {{ aur_skipped_without_paru | unique | join(', ') }}. The paru step that failed is named
          earlier in this log. Fix it and rerun to install them.
      when:
        - ih_family == 'Archlinux'
        - aur_skipped_without_paru | default([]) | length > 0
      tags: [pacman_batch]

    - name: Surface AUR builds that ran out of time
      ansible.builtin.debug:
        msg: "[WARN] AUR packages were still building when their wait expired, so they are NOT installed: {{ aur_timed_out | join(', ') }}."
      when:
        - ih_family == 'Archlinux'
        - aur_timed_out | default([]) | length > 0
      tags: [pacman_batch]

    # Recorded whatever aur_allow_failures says, because a package the user asked for and did not
    # get means the run did not succeed, and the exit code has to say so. aur_allow_failures only
    # decides whether the run stops here or carries on and reports at the end. Previously it
    # defaulted to true, so the fail task below never fired and nothing else recorded the miss
    # either, which is how google-chrome went absent from a run that reported success.
    - name: Record missing AUR packages in the play summary
      ansible.builtin.set_fact:
        any_role_failed: true
      when:
        - ih_family == 'Archlinux'
        - (failed_aur_packages | default([]) | length > 0) or (aur_skipped_without_paru | default([]) | length > 0)
      tags: [pacman_batch]

    # No `| default(false)` on aur_allow_failures. defaults/main.yaml sets it to true and is the single
    # source for what absent means, and reading it here with a default of false gave the same question
    # two answers: the role default said "carry on and report at the end", the read said "stop now".
    # A role default cannot be absent in the first place, so the default here could only ever
    # contradict it, and the message beside it described whichever of the two the reader happened to
    # trust. The message now states the real default.
    - name: Fail immediately if AUR packages failed and aur_allow_failures is false
      ansible.builtin.fail:
        msg: >-
          AUR package install failed: {{ failed_aur_packages | join(', ') }}. This run stops here
          because aur_allow_failures was set to false. Its default is true, which finishes the run and
          names the missing packages at the end instead, and either way the run's exit code reports the
          failure.
      when:
        - ih_family == 'Archlinux'
        - failed_aur_packages | default([]) | length > 0
        - not (aur_allow_failures | bool)
      tags: [pacman_batch]

    # After the pacman and AUR sets rather than before them, because the software set can bring a
    # kernel of its own, and the headers are named from the kernels installed at the time. On CachyOS
    # cachyos-gaming-applications brings cachyos-gaming-meta, then winetricks, wine and
    # ntsync-autoload, which needs NTSYNC-MODULE, which linux-cachyos provides, resolved with
    # pacman -Sp in cachyos/cachyos-v3 on 2026-10-19. In GitHub sweep run 39231000107 the headers step
    # ran before that kernel existed and the verification failed on linux-cachyos-headers. Installing
    # the headers after openrazer-driver-dkms still builds the module, because Arch's dkms hook fires
    # on a new /usr/lib/modules/*/build/include as well as on a new dkms.conf, read from the hook in
    # archlinux:base.
    - name: Install Arch prerequisites (DKMS kernel headers)
      ansible.builtin.include_tasks:
        file: arch_prereqs.yaml
        apply:
          tags: [pacman_batch]
      tags: [pacman_batch]
      when: ih_family == 'Archlinux'

    # Snap, one per call through the shared file. snapd keeps no package list to refresh, so a retry
    # only waits: four attempts twenty seconds apart. Fetches from api.snapcraft.io can flake with HTTP
    # 56, a peer reset, mid-stream. This was community.general.snap, whose failure on the last attempt
    # sent the software installer into its rescue and skipped everything after it.
    - name: Install Snap packages, one at a time
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
        apply:
          tags: [snap]
      vars:
        role_packages: >-
          {{ software_installer_packages | selectattr('value.manager', 'equalto', 'snap')
             | map(attribute='value.package') | list }}
        role_packages_classic: >-
          {{ software_installer_packages | selectattr('value.manager', 'equalto', 'snap')
             | selectattr('value.classic', 'defined') | selectattr('value.classic')
             | map(attribute='value.package') | list }}
        role_packages_purpose: the software set
        role_packages_manager: snap
      when:
        - ih_family in ['Debian', 'RedHat', 'Archlinux']
        - software_installer_packages | selectattr('value.manager', 'equalto', 'snap') | list | length > 0
      tags: [snap]

    - name: Ensure flatpak daemon is installed
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
        apply:
          tags: [flatpak]
      vars:
        role_packages: [flatpak]
        role_packages_purpose: the Flatpak installer the software set needs
      when:
        - ih_family in ['Debian', 'RedHat', 'Archlinux']
        - software_installer_batches.flatpak | length > 0
      tags: [flatpak]

    - name: Check flatpak repository health
      ansible.builtin.command: flatpak remotes
      register: flatpak_health
      changed_when: false
      failed_when: false
      become: true
      when:
        - ansible_facts['system'] == 'Linux'
        - software_installer_batches.flatpak | length > 0
      tags: [flatpak]

    - name: Purge corrupted flatpak ostree repository (opt-in only)
      ansible.builtin.file:
        path: /var/lib/flatpak/repo
        state: absent
      become: true
      when:
        - ansible_facts['system'] == 'Linux'
        - software_installer_batches.flatpak | length > 0
        - flatpak_health is defined
        - flatpak_health.rc != 0
        - flatpak_force_repo_reset | default(false) | bool
        - flatpak_health.stderr is defined
        - "'ostree' in (flatpak_health.stderr | lower) or 'corrupt' in (flatpak_health.stderr | lower)"
      tags: [flatpak]

    - name: Add Flathub remote
      community.general.flatpak_remote:
        name: flathub
        state: present
        flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
        method: system
      become: true
      when:
        - ansible_facts['system'] == 'Linux'
        - software_installer_batches.flatpak | length > 0
      tags: [flatpak]

    # One application at a time, and one failure does not stop the others.
    #
    # This was two batched tasks, one per family. A flatpak application is an independent download of
    # an independent bundle from Flathub, so batching bought only the seconds flatpak spends starting
    # up, and it cost the whole set whenever any part of the fetch failed: on 2026-08-24 twenty of the
    # forty-eight container cells lost twenty-two applications each to one timeout on one URL, the
    # Flathub summaries file, which answered 200 with 1.6 MB in 0.29 seconds when measured by hand at
    # the time.
    #
    # Through the shared file with flatpak: one attempt, then for an application that failed, wait,
    # flatpak update --appstream to fetch the remote's summary and appstream data again, try again, four
    # attempts in all. raw, for the ansible-core 2.19 deserialization race in the workaround section of
    # AGENTS.md, and the shared file reads rc rather than the result's failed key.
    - name: Install Flatpak applications, one at a time
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
        apply:
          tags: [flatpak]
      vars:
        role_packages: "{{ software_installer_batches.flatpak }}"
        role_packages_purpose: the software set
        role_packages_manager: flatpak
      when:
        - ih_family in ['Debian', 'RedHat', 'Archlinux']
        - software_installer_batches.flatpak | length > 0
      tags: [flatpak]

    # Read straight after the include and under the same condition, because role_packages_missing is
    # whatever the last include of the shared file left behind.
    - name: Collect Flatpak applications whose install reported a failure
      ansible.builtin.set_fact:
        flatpak_reported_failures: "{{ role_packages_missing | default([]) }}"
      when:
        - ih_family in ['Debian', 'RedHat', 'Archlinux']
        - software_installer_batches.flatpak | length > 0
      tags: [flatpak]
    # Asked rather than assumed, the same question the AUR collector asks pacman. An install that
    # exits zero and leaves nothing behind is a shape this repository has been bitten by three times
    # on the AUR side, and there is no reason flatpak is immune to it.
    - name: Ask flatpak which requested applications are actually installed
      ansible.builtin.command:
        cmd: flatpak list --system --app --columns=application
      become: true
      register: flatpak_installed_query
      changed_when: false
      failed_when: false
      when:
        - ansible_facts['system'] == 'Linux'
        - software_installer_batches.flatpak | length > 0
      tags: [flatpak]

    - name: Collect Flatpak applications that are absent after the install
      ansible.builtin.set_fact:
        flatpak_absent_after_install: >-
          {{ software_installer_batches.flatpak
             | difference(flatpak_installed_query.stdout_lines | default([]))
             | difference(flatpak_reported_failures | default([]))
             | list }}
      when:
        - ansible_facts['system'] == 'Linux'
        - software_installer_batches.flatpak | length > 0
      tags: [flatpak]

    - name: Combine every kind of Flatpak failure
      ansible.builtin.set_fact:
        failed_flatpak_applications: >-
          {{ (flatpak_reported_failures | default([])
              + flatpak_absent_after_install | default([])) | unique }}
      tags: [flatpak]

    # debug rather than a command, and it renders because the callback prints a debug message on a
    # task that has something to say. The three AUR warnings above were invisible for three runs
    # because they were attached to tasks the callback rendered as ok with no output. An application
    # whose install failed is already named by the shared install file with what flatpak said.
    - name: Surface Flatpak applications that reported success and are absent
      ansible.builtin.debug:
        msg: "[WARN] Flatpak reported success and does not list these applications: {{ flatpak_absent_after_install | join(', ') }}. Either the install exited zero without installing, or the application id in the OS dictionary is not the id Flathub publishes, in which case fix the mapping."
      when: flatpak_absent_after_install | default([]) | length > 0
      tags: [flatpak]

    - name: Show the tail of the flatpak install log when something is missing
      ansible.builtin.command: tail -40 /var/log/installation-packages.log
      become: true
      changed_when: false
      failed_when: false
      when: failed_flatpak_applications | default([]) | length > 0
      tags: [flatpak]

    # An application the user asked for and did not get means the run did not succeed, so the exit
    # code has to say so. Recorded rather than raised, so the rest of the installer still runs and
    # the summary names every loss at the end instead of stopping at the first one.
    - name: Record missing Flatpak applications in the play summary
      ansible.builtin.set_fact:
        any_role_failed: true
      when: failed_flatpak_applications | default([]) | length > 0
      tags: [flatpak]

    # ------------------ MACOS MANAGERS ------------------
    # One formula and one cask at a time, through the shared file with brew and brew_cask: one
    # attempt, then for a package that failed, wait, brew update to fetch the newest Homebrew and
    # formula definitions, try again, four attempts in all. brew update upgrades nothing installed,
    # that is brew upgrade. The shared file names each one that did not install with what brew said.
    #
    # Looped since 2026-08-21 for the casks and 2026-08-25 for the formulae, because a batch is one
    # call with one exit code: a Tor Browser build the vendor had deleted and rawtherapee refusing an
    # older macOS each cost around thirty applications in one call.
    - name: Install Homebrew formulae, one at a time
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
        apply:
          tags: [brew]
      vars:
        role_packages: >-
          {{ software_installer_packages | selectattr('value.manager', 'equalto', 'brew')
             | map(attribute='value.package') | list }}
        role_packages_purpose: the software set
        role_packages_manager: brew
      when:
        - ih_family == 'Darwin'
        - software_installer_packages | selectattr('value.manager', 'equalto', 'brew') | list | length > 0
      tags: [brew]

    - name: Install Homebrew Casks, one at a time
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
        apply:
          tags: [brew]
      vars:
        role_packages: >-
          {{ software_installer_packages | selectattr('value.manager', 'equalto', 'brew_cask')
             | map(attribute='value.package') | list }}
        role_packages_purpose: the software set
        role_packages_manager: brew_cask
      when:
        - ih_family == 'Darwin'
        - software_installer_packages | selectattr('value.manager', 'equalto', 'brew_cask') | list | length > 0
      tags: [brew]

    # ------------------ CUSTOM INSTALLS (flatpak bundles, AppImages, binaries) --
    - name: Include Linux custom install tasks
      ansible.builtin.include_tasks: custom_installs.yaml
      when: ansible_facts['system'] == 'Linux'

    - name: Include macOS custom install tasks
      ansible.builtin.include_tasks: macos_install.yaml
      when: ih_family == 'Darwin'
  # This rescue keeps the rest of the playbook running after an install error, but
  # it used to emit one anonymous warning line, which hid both which task failed
  # and the fact that every later task in this block was skipped. It also never
  # propagated, so site.yaml's own rescue around this role never fired and the run
  # exited zero. See docs/regression_ledger.md.
  rescue:
    # Names the task that failed and what it cost. No package install in this block can land here any
    # longer: each goes through setup/ansible/tasks/install_role_packages.yaml, which never fails on its
    # own and names what it could not install. What still can is a repository step, a download or a
    # custom install.
    - name: Name the install step that failed and what it cost
      ansible.builtin.debug:
        msg: >-
          [ERROR] Install step '{{ ansible_failed_task.name | default('unknown') }}' failed:
          {{ ansible_failed_result.msg | default(ansible_failed_result.stderr | default('no message given')) }}
          Every remaining task in the software installer was skipped, so anything
          listed after this step is NOT installed.
          {% if 'could not find' in (ansible_failed_result.msg | default('')) %}
          A package name did not resolve. Either the name in
          vars/{{ ih_family }}.yaml is wrong, or it lives in a
          repository that is not enabled, which on Arch means multilib in
          /etc/pacman.conf for the 32-bit Steam dependencies.
          {% endif %}

    - name: Propagate the installer failure to the play summary
      ansible.builtin.set_fact:
        any_role_failed: true
  when: software_installer_packages is defined and software_installer_packages | length > 0
