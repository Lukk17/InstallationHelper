---
# Each DMG chain uses block: + always: so the volume is detached even when
# the copy step fails — otherwise stale /Volumes/ mounts collide on rerun.

# Every vendor artifact below is staged in a directory only root can enter, never in /tmp. All three
# are handed to root: the .pkg goes to `installer -pkg -target /`, and the two disk images have their
# contents copied into /Applications. /tmp is writable by every local account, all three file names
# are fixed, and get_url does not overwrite a destination that already exists, so any local user
# could pre-create one of those paths and have their own payload installed by root.
#
# Created here rather than relied upon from dynamic_install.yaml, whose own create task asks for
# `group: root`. On macOS gid 0 is named `wheel`, so `root` is the Linux answer to a per-OS question,
# and a group name the directory services database cannot resolve fails the task outright rather than
# creating the directory. `wheel` resolves on every macOS release. The mode is what carries the
# security property in any case: at 0700 the group cannot read the directory either way.
#
# Not gated on any toggle, for the same reason the Linux one is not: three separate blocks stage into
# it, and a condition listing all three is a fourth place to keep in sync.
- name: Create the private staging directory for vendor downloads (macOS)
  ansible.builtin.file:
    path: "{{ software_installer_stage_dir }}"
    state: directory
    owner: root
    group: wheel
    mode: '0700'
  become: true

# --- Google Antigravity ---
- name: Resolve Antigravity DMG URL for this Mac's architecture
  ansible.builtin.set_fact:
    antigravity_dmg_resolved_url: "{{ antigravity_dmg_arm64_url if ansible_facts['architecture'] == 'arm64' else antigravity_dmg_x64_url }}"
  when: install_antigravity | default(false) | bool

- name: Install Antigravity from DMG
  when: install_antigravity | default(false) | bool
  block:
    # force: true because the destination name is stable while the artifact behind the URL is not:
    # the arm64 and x64 URLs are resolved per machine and neither carries a version, so a cached file
    # under a permanent staging path would be installed forever and the run would report success.
    - name: Download Antigravity DMG
      ansible.builtin.get_url:
        url: "{{ antigravity_dmg_resolved_url }}"
        dest: "{{ software_installer_stage_dir }}/Antigravity.dmg"
        force: true
        mode: '0600'
        checksum: "{{ download_checksums.antigravity_macos | default(omit) }}"
        timeout: 60
      become: true
      register: antigravity_dmg_download
      retries: 3
      delay: 10
      until: antigravity_dmg_download is succeeded

    # become: true on the whole mount chain, because the staging directory is mode 0700 and
    # root-owned, so no other account can read the image to attach it, and a volume attached by root
    # is detached by root.
    - name: Mount Antigravity DMG and capture mount-point
      ansible.builtin.shell: |
        set -e -o pipefail
        hdiutil attach -nobrowse -noautoopen "{{ software_installer_stage_dir }}/Antigravity.dmg" \
          | awk -F '\t' '/\/Volumes\// {print $NF; exit}'
      args:
        executable: /bin/bash
      become: true
      register: antigravity_mount
      changed_when: true

    - name: Find Antigravity .app inside mounted volume
      ansible.builtin.find:
        paths: "{{ antigravity_mount.stdout }}"
        patterns: "*.app"
        file_type: directory
        recurse: false
      become: true
      register: antigravity_app
      when: antigravity_mount.stdout | length > 0

    - name: Copy Antigravity.app to /Applications
      ansible.builtin.command: cp -R "{{ antigravity_app.files[0].path }}" /Applications/
      args:
        creates: "/Applications/{{ antigravity_app.files[0].path | basename }}"
      become: true
      when:
        - antigravity_app is defined
        - antigravity_app.files | default([]) | length > 0
  always:
    - name: Detach Antigravity DMG
      ansible.builtin.command: hdiutil detach -quiet "{{ antigravity_mount.stdout }}"
      become: true
      changed_when: true
      failed_when: false
      when:
        - antigravity_mount is defined
        - antigravity_mount.stdout | default('') | length > 0

    # In `always` so a failed mount or copy cannot leave a gigabyte-scale disk image sitting in a
    # permanent staging directory, and so no later run can find a file there to trust.
    - name: Remove the staged Antigravity DMG
      ansible.builtin.file:
        path: "{{ software_installer_stage_dir }}/Antigravity.dmg"
        state: absent
      become: true

# --- Razer Synapse for Mac ---
# Razer publishes no Homebrew cask, only a .pkg. Razer requires an Apple Silicon
# Mac on macOS 15 Sequoia or newer, so the whole block is gated on that: the
# payload declares hostArchitectures x86_64,arm64 but Razer does not support Intel.
# Idempotency uses `pkgutil --pkg-info`, since a distribution .pkg leaves receipts
# rather than one predictable application bundle.
- name: Install Razer Synapse for Mac
  when:
    - install_synapse | default(false) | bool
    - ansible_facts['architecture'] == 'arm64'
    - ansible_facts['distribution_version'] is version('15.0', '>=')
  block:
    - name: Check whether Razer Synapse is already installed
      ansible.builtin.command: pkgutil --pkg-info com.razer.install.SynapseInstall
      register: razer_synapse_receipt
      changed_when: false
      failed_when: false

    # force: true because Razer's download URL carries no version at all, so a cached file under a
    # permanent staging path would install a months-old build on every future run.
    - name: Download Razer Synapse pkg
      ansible.builtin.get_url:
        url: "{{ razer_synapse_macos_pkg_url }}"
        dest: "{{ software_installer_stage_dir }}/RazerSynapseInstaller.pkg"
        force: true
        mode: '0600'
        checksum: "{{ download_checksums.razer_synapse_macos | default(omit) }}"
        timeout: 120
      become: true
      register: razer_synapse_download
      retries: 3
      delay: 10
      until: razer_synapse_download is succeeded
      when: razer_synapse_receipt.rc != 0

    - name: Install Razer Synapse pkg
      ansible.builtin.command: installer -pkg {{ software_installer_stage_dir }}/RazerSynapseInstaller.pkg -target /
      become: true
      changed_when: true
      when: razer_synapse_receipt.rc != 0

    - name: Remove the staged Razer Synapse pkg
      ansible.builtin.file:
        path: "{{ software_installer_stage_dir }}/RazerSynapseInstaller.pkg"
        state: absent
      become: true

- name: Warn when Razer Synapse is skipped on this Mac
  ansible.builtin.debug:
    msg: "[WARN] Skipping Razer Synapse — Razer supports Apple Silicon on macOS 15 Sequoia or newer only. This Mac is {{ ansible_facts['architecture'] }} on macOS {{ ansible_facts['distribution_version'] }}."
  when:
    - install_synapse | default(false) | bool
    - ansible_facts['architecture'] != 'arm64' or ansible_facts['distribution_version'] is version('15.0', '<')

# --- Gridcoin ---
- name: Install Gridcoin from DMG
  when: install_gridcoin | default(false) | bool
  block:
    # force: true for the same reason as the Antigravity image above: the staged name is stable, the
    # artifact behind the pinned URL is not guaranteed to be, and a permanent staging path turns a
    # non-overwriting download into a cache no version bump can invalidate.
    - name: Download Gridcoin DMG
      ansible.builtin.get_url:
        url: "{{ gridcoin_macos_dmg_url }}"
        dest: "{{ software_installer_stage_dir }}/gridcoin.dmg"
        force: true
        mode: '0600'
        checksum: "{{ download_checksums.gridcoin_macos | default(omit) }}"
        timeout: 60
      become: true
      register: gridcoin_dmg_download
      retries: 3
      delay: 10
      until: gridcoin_dmg_download is succeeded

    - name: Mount Gridcoin DMG and capture mount-point
      ansible.builtin.shell: |
        set -e -o pipefail
        hdiutil attach -nobrowse -noautoopen "{{ software_installer_stage_dir }}/gridcoin.dmg" \
          | awk -F '\t' '/\/Volumes\// {print $NF; exit}'
      args:
        executable: /bin/bash
      become: true
      register: gridcoin_mount
      changed_when: true

    - name: Find Gridcoin .app inside mounted volume
      ansible.builtin.find:
        paths: "{{ gridcoin_mount.stdout }}"
        patterns: "*.app"
        file_type: directory
        recurse: false
      become: true
      register: gridcoin_app
      when: gridcoin_mount.stdout | length > 0

    - name: Copy Gridcoin.app to /Applications
      ansible.builtin.command: cp -R "{{ gridcoin_app.files[0].path }}" /Applications/
      args:
        creates: "/Applications/{{ gridcoin_app.files[0].path | basename }}"
      become: true
      when:
        - gridcoin_app is defined
        - gridcoin_app.files | default([]) | length > 0
  always:
    - name: Detach Gridcoin DMG
      ansible.builtin.command: hdiutil detach -quiet "{{ gridcoin_mount.stdout }}"
      become: true
      changed_when: true
      failed_when: false
      when:
        - gridcoin_mount is defined
        - gridcoin_mount.stdout | default('') | length > 0

    - name: Remove the staged Gridcoin DMG
      ansible.builtin.file:
        path: "{{ software_installer_stage_dir }}/gridcoin.dmg"
        state: absent
      become: true
# --- Docker, the same engine Linux gets, reached the only way macOS can reach it ---
#
# On Linux the virtualization_config role installs Docker CE from Docker's own repository, so the
# engine runs on the host kernel. macOS has no Linux kernel, so there is no such thing as a native
# Docker Engine there and any answer is a Linux virtual machine with the Docker CLI pointed at it.
#
# This installs the parts rather than Docker Desktop. colima runs the engine in a small Lima virtual
# machine, and the docker, docker-compose and docker-buildx formulae are the same command line
# programs Linux gets from Docker's repository, so `docker` and `docker compose` behave identically
# on both. Docker Desktop is the alternative and was what this mapped to before: it bundles the same
# virtual machine behind a graphical application and a licence that a large company has to pay for.
#
# Not in vars/Darwin.yaml, because the dictionary maps one application to one package and this needs
# four packages plus a machine that has to be started. Linux keeps Docker out of its dictionary for
# the same reason.
- name: Install the Docker command line and the Linux machine that runs the engine (macOS)
  community.general.homebrew:
    name:
      - colima
      - docker
      - docker-compose
      - docker-buildx
    state: present
  when: install_docker | default(false) | bool
  tags: [brew]

# Asked rather than assumed, because `colima start` on an already running machine is not a no-op:
# it prints an error and exits non-zero, which would make every rerun of this playbook report a
# failure that is not one.
- name: Ask whether the Docker machine is already running (macOS)
  ansible.builtin.command: colima status
  register: colima_state
  changed_when: false
  failed_when: false
  when: install_docker | default(false) | bool

# Tolerated on purpose and reported on purpose. Starting the machine needs the Virtualization
# framework, which is unavailable inside a virtual machine that is not itself nested-virtualisation
# capable, and a provisioning run should not die because of that. The result is read below rather
# than registered and forgotten, which is the defect class docs/regression_ledger.md is full of.
- name: Start the Docker machine (macOS)
  ansible.builtin.command: colima start
  register: colima_start
  changed_when: colima_start.rc == 0
  failed_when: false
  when:
    - install_docker | default(false) | bool
    - colima_state is defined
    - colima_state.rc | default(1) != 0

- name: Say so when the Docker machine could not be started (macOS)
  ansible.builtin.debug:
    msg: >-
      [WARN] colima start failed with rc={{ colima_start.rc }}, so the docker command has no engine
      to talk to yet. Run `colima start` by hand and read what it says. The command line programs
      are installed either way. Output: {{ (colima_start.stderr | default('')) | truncate(300) }}
  when:
    - install_docker | default(false) | bool
    - colima_start is defined
    - colima_start.rc | default(0) != 0
