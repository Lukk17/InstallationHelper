---
# Each DMG chain uses block: + always: so the volume is detached even when
# the copy step fails — otherwise stale /Volumes/ mounts collide on rerun.
#
# Each one carries a rescue as well, in the shape custom_installs.yaml uses for the Linux vendor
# downloads. Until 2026-10-10 none did, and this file runs inside the software installer block, so one
# vendor host that did not answer ended the installer there and the installs after it were skipped. Now
# the failure is recorded, the application is named as NOT installed, and the rest continue.

# Every vendor artifact below is staged in a directory only root can enter, never in /tmp. Both are
# handed to root: the .pkg goes to `installer -pkg -target /`, and the disk image has its contents
# copied into /Applications. /tmp is writable by every local account, both file names are fixed, and
# get_url does not overwrite a destination that already exists, so any local user could pre-create
# one of those paths and have their own payload installed by root.
#
# Created here rather than relied upon from dynamic_install.yaml, whose own create task asks for
# `group: root`. On macOS gid 0 is named `wheel`, so `root` is the Linux answer to a per-OS question,
# and a group name the directory services database cannot resolve fails the task outright rather than
# creating the directory. `wheel` resolves on every macOS release. The mode is what carries the
# security property in any case: at 0700 the group cannot read the directory either way.
#
# Not gated on any toggle, for the same reason the Linux one is not: two separate blocks stage into
# it, and a condition listing both is a third place to keep in sync.
- name: Create the private staging directory for vendor downloads (macOS)
  ansible.builtin.file:
    path: "{{ software_installer_stage_dir }}"
    state: directory
    owner: root
    group: wheel
    mode: '0700'
  become: true

# --- Razer Synapse for Mac ---
# Razer publishes no Homebrew cask, only a .pkg. Razer requires an Apple Silicon
# Mac on macOS 15 Sequoia or newer, so the whole block is gated on that: the
# payload declares hostArchitectures x86_64,arm64 but Razer does not support Intel.
# Idempotency uses `pkgutil --pkg-info`, since a distribution .pkg leaves receipts
# rather than one predictable application bundle.
- name: Install Razer Synapse for Mac
  when:
    - install_synapse | default(false) | bool
    - ansible_facts['architecture'] == 'arm64'
    - ansible_facts['distribution_version'] is version('15.0', '>=')
  block:
    - name: Check whether Razer Synapse is already installed
      ansible.builtin.command: pkgutil --pkg-info com.razer.install.SynapseInstall
      register: razer_synapse_receipt
      changed_when: false
      failed_when: false

    # force: true because Razer's download URL carries no version at all, so a cached file under a
    # permanent staging path would install a months-old build on every future run.
    - name: Download Razer Synapse pkg
      ansible.builtin.get_url:
        url: "{{ razer_synapse_macos_pkg_url }}"
        dest: "{{ software_installer_stage_dir }}/RazerSynapseInstaller.pkg"
        force: true
        mode: '0600'
        checksum: "{{ download_checksums.razer_synapse_macos | default(omit) }}"
        timeout: 120
      become: true
      register: razer_synapse_download
      retries: 3
      delay: 10
      until: razer_synapse_download is succeeded
      when: razer_synapse_receipt.rc != 0

    - name: Install Razer Synapse pkg
      ansible.builtin.command: installer -pkg {{ software_installer_stage_dir }}/RazerSynapseInstaller.pkg -target /
      become: true
      changed_when: true
      when: razer_synapse_receipt.rc != 0

    # This installer disrupts the connection, and the task after it paid for that. From the macOS
    # defaults cell of run 32864564543, the install reported success at 15:53:26 and the very next
    # task came back `unreachable` at 15:53:42, with `failed=0` in the recap. On a local connection
    # unreachable does not mean a task decided it failed, it means Ansible could not deliver the
    # module to a host it was already running on. Sixty-five packages had installed by then.
    #
    # Intermittent, which is why it took until now to see: the same cell passed in run 32839893770
    # an hour earlier. It depends on how long Razer's postinstall work keeps the session busy.
    #
    # wait_for_connection is the mechanism Ansible provides for this, and it is the honest one. Not
    # ignore_errors, because that would hide a genuine failure of the install itself, and not merging
    # this into the install task either, because a disruption long enough to kill the next task would
    # kill whatever came after it too. This waits for the transport to answer and then carries on, and
    # if it never answers the host is unreachable, which no rescue catches, so the play still fails.
    # The rescue below hides nothing either: it marks the run failed and names Synapse as NOT
    # installed, and only spares the installs that come after it.
    - name: Wait for the connection to come back after the Synapse installer
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 180
      when: razer_synapse_receipt.rc != 0
  rescue:
    - name: Record that Razer Synapse could not be installed
      ansible.builtin.set_fact:
        any_role_failed: true
        not_installed_with_reason: >-
          {{ (not_installed_with_reason | default([]))
             + ['synapse (' ~ (ansible_failed_task.name | default('a step')) ~ ' failed)'] }}

    - name: Name the Razer Synapse step that failed
      ansible.builtin.debug:
        msg: >-
          [ERROR] Step '{{ ansible_failed_task.name | default('unknown') }}' failed with:
          {{ ansible_failed_result.msg | default('no message given') }}
          Razer Synapse is NOT installed. Every other install continues, and the run is marked failed.
  # In always rather than at the end of the block, so a download that arrived and an installer that
  # then failed do not leave the package behind in the permanent staging directory.
  always:
    - name: Remove the staged Razer Synapse pkg
      ansible.builtin.file:
        path: "{{ software_installer_stage_dir }}/RazerSynapseInstaller.pkg"
        state: absent
      become: true

- name: Warn when Razer Synapse is skipped on this Mac
  ansible.builtin.debug:
    msg: "[WARN] Skipping Razer Synapse — Razer supports Apple Silicon on macOS 15 Sequoia or newer only. This Mac is {{ ansible_facts['architecture'] }} on macOS {{ ansible_facts['distribution_version'] }}."
  when:
    - install_synapse | default(false) | bool
    - ansible_facts['architecture'] != 'arm64' or ansible_facts['distribution_version'] is version('15.0', '<')

# --- Gridcoin ---
- name: Install Gridcoin from DMG
  when: install_gridcoin | default(false) | bool
  block:
    # force: true because the staged name is stable, the artifact behind the pinned URL is not
    # guaranteed to be, and a permanent staging path turns a non-overwriting download into a cache no
    # version bump can invalidate.
    - name: Download Gridcoin DMG
      ansible.builtin.get_url:
        url: "{{ gridcoin_macos_dmg_url }}"
        dest: "{{ software_installer_stage_dir }}/gridcoin.dmg"
        force: true
        mode: '0600'
        checksum: "{{ download_checksums.gridcoin_macos | default(omit) }}"
        timeout: 60
      become: true
      register: gridcoin_dmg_download
      retries: 3
      delay: 10
      until: gridcoin_dmg_download is succeeded

    - name: Mount Gridcoin DMG and capture mount-point
      ansible.builtin.shell: |
        set -e -o pipefail
        hdiutil attach -nobrowse -noautoopen "{{ software_installer_stage_dir }}/gridcoin.dmg" \
          | awk -F '\t' '/\/Volumes\// && !done {print $NF; done = 1}'
      args:
        executable: /bin/bash
      become: true
      register: gridcoin_mount
      changed_when: true

    - name: Find Gridcoin .app inside mounted volume
      ansible.builtin.find:
        paths: "{{ gridcoin_mount.stdout }}"
        patterns: "*.app"
        file_type: directory
        recurse: false
      become: true
      register: gridcoin_app
      when: gridcoin_mount.stdout | length > 0

    - name: Copy Gridcoin.app to /Applications
      ansible.builtin.command: cp -R "{{ gridcoin_app.files[0].path }}" /Applications/
      args:
        creates: "/Applications/{{ gridcoin_app.files[0].path | basename }}"
      become: true
      when:
        - gridcoin_app is defined
        - gridcoin_app.files | default([]) | length > 0
  rescue:
    - name: Record that Gridcoin could not be installed
      ansible.builtin.set_fact:
        any_role_failed: true
        not_installed_with_reason: >-
          {{ (not_installed_with_reason | default([]))
             + ['gridcoin (' ~ (ansible_failed_task.name | default('a step')) ~ ' failed)'] }}

    - name: Name the Gridcoin step that failed
      ansible.builtin.debug:
        msg: >-
          [ERROR] Step '{{ ansible_failed_task.name | default('unknown') }}' failed with:
          {{ ansible_failed_result.msg | default('no message given') }}
          Gridcoin is NOT installed. Every other install continues, and the run is marked failed.
  always:
    - name: Detach Gridcoin DMG
      ansible.builtin.command: hdiutil detach -quiet "{{ gridcoin_mount.stdout }}"
      become: true
      changed_when: true
      failed_when: false
      when:
        - gridcoin_mount is defined
        - gridcoin_mount.stdout | default('') | length > 0

    - name: Remove the staged Gridcoin DMG
      ansible.builtin.file:
        path: "{{ software_installer_stage_dir }}/gridcoin.dmg"
        state: absent
      become: true

# --- KiCad 9 beside KiCad 10 ---
# KiCad's own unified universal disk image. Its KiCad folder, KiCad.app, the other tools and the
# libraries, is copied with ditto to the folder group_vars/all.yaml names, apart from the cask's
# /Applications/KiCad, with the volume mounted read-only. A stamp file in that folder holds the pinned
# version it was copied from. The test is kicad9_macos_current_test in group_vars/all.yaml, the one
# verify_install.yaml asks after the run.
- name: Install KiCad 9 from KiCad's disk image
  when: install_kicad9 | default(false) | bool
  block:
    - name: Ask whether the KiCad 9 folder holds KiCad.app at the pinned version
      ansible.builtin.shell: "{{ kicad9_macos_current_test }}"
      args:
        executable: /bin/bash
      register: kicad9_macos_installed
      changed_when: false
      failed_when: false

    - name: Decide whether the KiCad 9 folder is at the pinned version
      ansible.builtin.set_fact:
        kicad9_macos_current: "{{ kicad9_macos_installed.rc == 0 }}"

    - name: Download the KiCad 9 disk image
      ansible.builtin.get_url:
        url: "{{ kicad9_macos_dmg_url }}"
        dest: "{{ software_installer_stage_dir }}/kicad9.dmg"
        force: true
        mode: '0600'
        checksum: "{{ download_checksums.kicad9_macos | default(omit) }}"
        timeout: 300
      become: true
      register: kicad9_macos_download
      retries: 3
      delay: 10
      until: kicad9_macos_download is succeeded
      when: not (kicad9_macos_current | bool)

    - name: Mount the KiCad 9 disk image read-only and capture the mount point
      ansible.builtin.shell: |
        set -e -o pipefail
        hdiutil attach -nobrowse -readonly -noautoopen {{ (software_installer_stage_dir ~ '/kicad9.dmg') | quote }} \
          | awk -F '\t' '/\/Volumes\// && !done {print $NF; done = 1}'
      args:
        executable: /bin/bash
      become: true
      register: kicad9_macos_mount
      changed_when: true
      when: not (kicad9_macos_current | bool)

    - name: Fail when the KiCad 9 disk image mounted nowhere
      ansible.builtin.fail:
        msg: hdiutil attach printed no /Volumes mount point for the KiCad 9 disk image, so there is no KiCad folder to copy.
      when:
        - not (kicad9_macos_current | bool)
        - kicad9_macos_mount.stdout | default('') | trim | length == 0

    - name: Remove a KiCad 9 folder of another version or without KiCad.app
      ansible.builtin.file:
        path: "{{ kicad9_macos_dir }}"
        state: absent
      become: true
      when: not (kicad9_macos_current | bool)

    - name: Copy the KiCad folder of the disk image to the KiCad 9 folder
      ansible.builtin.command: ditto {{ (kicad9_macos_mount.stdout ~ '/KiCad') | quote }} {{ kicad9_macos_dir | quote }}
      become: true
      changed_when: true
      when: not (kicad9_macos_current | bool)

    - name: Record the version the KiCad 9 folder was copied from
      ansible.builtin.copy:
        content: "{{ kicad9_version }}\n"
        dest: "{{ kicad9_macos_stamp }}"
        mode: '0644'
      become: true
      when: not (kicad9_macos_current | bool)
  rescue:
    - name: Record that KiCad 9 could not be installed
      ansible.builtin.set_fact:
        any_role_failed: true
        not_installed_with_reason: >-
          {{ (not_installed_with_reason | default([]))
             + ['kicad9 (' ~ (ansible_failed_task.name | default('a step')) ~ ' failed)'] }}

    - name: Name the KiCad 9 step that failed
      ansible.builtin.debug:
        msg: >-
          [ERROR] Step '{{ ansible_failed_task.name | default('unknown') }}' failed with:
          {{ ansible_failed_result.msg | default('no message given') }}
          KiCad 9 is NOT installed. Every other install continues, and the run is marked failed.
  always:
    - name: Detach the KiCad 9 disk image
      ansible.builtin.command: hdiutil detach -quiet {{ kicad9_macos_mount.stdout | quote }}
      become: true
      changed_when: true
      failed_when: false
      when:
        - kicad9_macos_mount is defined
        - kicad9_macos_mount.stdout | default('') | length > 0

    - name: Remove the staged KiCad 9 disk image
      ansible.builtin.file:
        path: "{{ software_installer_stage_dir }}/kicad9.dmg"
        state: absent
      become: true
