---
- name: Create Antigravity install directory (Linux, non-Arch)
  ansible.builtin.file:
    path: /opt/antigravity
    state: directory
    mode: '0755'
  become: true
  when:
    - ansible_facts['system'] == 'Linux'
    - ih_family != 'Archlinux'
    - install_antigravity | default(false) | bool

- name: Download Antigravity Linux tarball
  ansible.builtin.get_url:
    url: "{{ antigravity_linux_tarball_url }}"
    dest: "{{ non_root_home }}/.lukkInstall/antigravity.tar.gz"
    mode: '0644'
    checksum: "{{ download_checksums.antigravity_linux | default(omit) }}"
    timeout: 60
  register: antigravity_download
  retries: 3
  delay: 10
  until: antigravity_download is succeeded
  when:
    - ansible_facts['system'] == 'Linux'
    - ih_family != 'Archlinux'
    - install_antigravity | default(false) | bool

- name: Extract Antigravity tarball
  ansible.builtin.unarchive:
    src: "{{ non_root_home }}/.lukkInstall/antigravity.tar.gz"
    dest: /opt/antigravity
    remote_src: true
    extra_opts: ['--strip-components=1']
    creates: /opt/antigravity/antigravity
  become: true
  when:
    - ansible_facts['system'] == 'Linux'
    - ih_family != 'Archlinux'
    - install_antigravity | default(false) | bool

- name: Symlink Antigravity to /usr/local/bin
  ansible.builtin.file:
    src: /opt/antigravity/antigravity
    dest: /usr/local/bin/antigravity
    state: link
  become: true
  when:
    - ansible_facts['system'] == 'Linux'
    - ih_family != 'Archlinux'
    - install_antigravity | default(false) | bool

# --- AppImageLauncher (Fedora only): rpm -i --nodigest bypass ---
# The 2020-vintage upstream RPM (last release) was built without file digests
# and dnf5 in Fedora 43+ enforces digest verification regardless of GPG
# settings, so the standard dnf_url path fails. rpm itself can install it
# directly with --nodigest. On Debian the same package installs cleanly via
# apt_url; on Arch the AUR `appimagelauncher` package handles it.

# Staged in the role's private directory rather than /tmp, and this one is the most dangerous of
# the three vendor downloads in this file. /tmp is writable by every local account, the file name
# is fixed, get_url does not overwrite a path that already exists, and the next task installs it as
# root with --nodigest, which is to say with no integrity checking at all. Any local user could
# pre-create that path and have their own payload installed as root. The staging directory is created
# in dynamic_install.yaml, owned by root and mode 0700.
#
# The checksum, the timeout and the retries are not optional extras here, and this was the one vendor
# download in this file that had none of the three while both of its siblings below had all three.
# Because the install runs `rpm --nodigest`, with rpm's own integrity checking switched off,
# `download_checksums.appimagelauncher_rpm` is the only place left where these bytes can be checked
# at all. It is keyed by artifact, like every other entry in that mapping, and the mapping is empty
# today, so `| default(omit)` leaves behaviour unchanged until someone populates it. The timeout
# bounds a socket operation that otherwise has none, and the retries stop a single vendor blip
# costing the install outright.
- name: Download AppImageLauncher RPM (Fedora)
  ansible.builtin.get_url:
    url: "{{ appimage_launcher_rpm_url }}"
    dest: "{{ software_installer_stage_dir }}/appimagelauncher.rpm"
    force: true
    mode: '0600'
    checksum: "{{ download_checksums.appimagelauncher_rpm | default(omit) }}"
    timeout: 60
  become: true
  register: appimagelauncher_download
  retries: 3
  delay: 10
  until: appimagelauncher_download is succeeded
  when:
    - ih_family == 'RedHat'
    - install_appimagelauncher | default(false) | bool

- name: Install AppImageLauncher via rpm with --nodigest (Fedora)
  ansible.builtin.command:
    cmd: rpm --install --upgrade --replacepkgs --nodigest {{ software_installer_stage_dir }}/appimagelauncher.rpm
    creates: /usr/bin/appimagelauncher
  become: true
  when:
    - ih_family == 'RedHat'
    - install_appimagelauncher | default(false) | bool

# Removed once installed, in the shape dynamic_install.yaml uses for the vendor .deb files. The
# staging directory is permanent now that it is not /tmp, so an artifact left in it is both a file
# that grows /var/cache on every run and a file a later run could be made to trust.
- name: Remove the staged AppImageLauncher RPM (Fedora)
  ansible.builtin.file:
    path: "{{ software_installer_stage_dir }}/appimagelauncher.rpm"
    state: absent
  become: true
  when:
    - ih_family == 'RedHat'
    - install_appimagelauncher | default(false) | bool

# --- k3d: lightweight Kubernetes-in-Docker (all Linux distros) ---
# k3d has no stable package across apt/dnf (only AUR on Arch), so every Linux
# distro uses the upstream install.sh, mirroring the LM Studio curl|bash path.
# The stat guard keeps it idempotent; `timeout 300` bounds the piped bash so a
# stalled download can't hang the run.

- name: Check if k3d is already installed (Linux)
  ansible.builtin.stat:
    path: /usr/local/bin/k3d
  register: k3d_installed
  when:
    - ansible_facts['system'] == 'Linux'
    - install_k3d | default(false) | bool

- name: Install k3d via official script (Linux)
  ansible.builtin.shell: |
    set -o pipefail
    timeout 300 bash -c 'curl -s --max-time 120 https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash'
  args:
    executable: /bin/bash
  become: true
  register: k3d_install
  retries: 2
  delay: 10
  until: k3d_install is succeeded
  changed_when: true
  when:
    - ansible_facts['system'] == 'Linux'
    - install_k3d | default(false) | bool
    - not (k3d_installed.stat.exists | default(false))

# --- Docker CE: Official Docker repository (Fedora) ---

- name: Add Docker CE repository (Fedora)
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/fedora/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: '0644'
  become: true
  when:
    - ih_family == 'RedHat'
    - install_docker | default(false) | bool

# --- Gridcoin: official flatpak bundle on ALL Linux distros ---
# We previously tried the Gridcoin PPA on Debian, but PPAs are Ubuntu-only
# and add-apt-repository fails on plain Debian. The OpenSUSE Fedora_Rawhide
# repo is also fragile across Fedora releases. Using the upstream-published
# flatpak bundle gives us a single install path that works everywhere.

- name: Download Gridcoin flatpak bundle (Linux)
  ansible.builtin.get_url:
    url: "{{ gridcoin_flatpak_url }}"
    dest: "{{ software_installer_stage_dir }}/gridcoin.flatpak"
    force: true
    mode: '0600'
    checksum: "{{ download_checksums.gridcoin_flatpak | default(omit) }}"
    timeout: 60
  become: true
  register: gridcoin_download
  retries: 3
  delay: 10
  until: gridcoin_download is succeeded
  when:
    - ansible_facts['system'] == 'Linux'
    - install_gridcoin | default(false) | bool

# There used to be a guard task here that ran `flatpak info org.gridcoin.Gridcoin` and only installed
# when that came back non-zero. It never once guarded anything, because the bundle does not carry that
# application id. Installing it in a debian:trixie container and then asking flatpak what it had got
# named `us.gridcoin.GridcoinResearch/x86_64/master`, so the guard's `flatpak info` always answered
# "error: org.gridcoin.Gridcoin/*unspecified*/*unspecified* not installed" at rc 1, the install always
# ran, and the second time it ran it failed the play with:
#
#   error: Failed to install bundle us.gridcoin.GridcoinResearch: us.gridcoin.GridcoinResearch
#   already installed
#
# Correcting the id in the guard would have hidden a second problem rather than fixed it: the bundle
# is pinned by version in pinned_values.toml, the ref inside it is a single branch called master, and
# a guard that skips whenever any version is present would never apply a pin that has been bumped. So
# the install is attempted every time and the result is classified instead, which is the only form
# that gets both cases right.
#
# rc 0 means flatpak installed the bundle, so the task is changed. rc non-zero carrying the
# already-installed message means the machine is already at this bundle, so the task is neither
# changed nor failed. Any other non-zero result still fails the play, which is the whole point: the
# phrase matched is flatpak's own wording for this one outcome and nothing else, so a corrupt bundle,
# a missing runtime or an out-of-space install stays as loud as it was before. Both spellings flatpak
# uses contain it, the plain one being "This version of us.gridcoin.GridcoinResearch is already
# installed" and the --noninteractive one being "us.gridcoin.GridcoinResearch already installed",
# which was checked by running the bundle install twice rather than by reading about it.
- name: Install Gridcoin flatpak bundle (Linux)
  ansible.builtin.command: flatpak install --system --noninteractive --bundle --assumeyes {{ software_installer_stage_dir }}/gridcoin.flatpak
  become: true
  register: gridcoin_bundle_install
  changed_when: gridcoin_bundle_install.rc == 0
  failed_when: >-
    gridcoin_bundle_install.rc != 0
    and 'already installed' not in ((gridcoin_bundle_install.stdout | default(''))
                                    ~ (gridcoin_bundle_install.stderr | default('')))
  when:
    - ansible_facts['system'] == 'Linux'
    - install_gridcoin | default(false) | bool

# Removed whether or not the install above changed anything, because the download runs whenever the
# toggle is on.
- name: Remove the staged Gridcoin flatpak bundle (Linux)
  ansible.builtin.file:
    path: "{{ software_installer_stage_dir }}/gridcoin.flatpak"
    state: absent
  become: true
  when:
    - ansible_facts['system'] == 'Linux'
    - install_gridcoin | default(false) | bool

# Lens is installed via the official apt/dnf repo on Debian/Fedora (configured
# in debian_repos.yaml / fedora_repos.yaml) and via AUR `lens-bin` on Arch.
# The AppImage fallback used to live here but `downloads.k8slens.dev/ide/Lens.AppImage`
# is not a stable URL — the official path is the apt/dnf repo. Keep this block
# empty as a marker.

# --- GpuTest: binary zip download (Debian/Fedora only, Arch uses AUR) ---

- name: Create GpuTest directory
  ansible.builtin.file:
    path: /opt/gputest
    state: directory
    mode: '0755'
  become: true
  when:
    - ansible_facts['system'] == 'Linux'
    - ih_family != 'Archlinux'
    - install_gputest | default(false) | bool

- name: Download GpuTest binary archive
  ansible.builtin.get_url:
    url: "{{ gputest_url }}"
    dest: "{{ software_installer_stage_dir }}/gputest.zip"
    force: true
    mode: '0600'
    checksum: "{{ download_checksums.gputest | default(omit) }}"
    timeout: 60
  become: true
  register: gputest_download
  retries: 3
  delay: 10
  until: gputest_download is succeeded
  when:
    - ansible_facts['system'] == 'Linux'
    - ih_family != 'Archlinux'
    - install_gputest | default(false) | bool

- name: Extract GpuTest archive
  ansible.builtin.unarchive:
    src: "{{ software_installer_stage_dir }}/gputest.zip"
    dest: /opt/gputest
    remote_src: true
    creates: /usr/local/bin/GpuTest
  become: true
  when:
    - ansible_facts['system'] == 'Linux'
    - ih_family != 'Archlinux'
    - install_gputest | default(false) | bool

# Same as the two above: extracted, so the archive itself is of no further use, and the staging
# directory is permanent.
- name: Remove the staged GpuTest archive
  ansible.builtin.file:
    path: "{{ software_installer_stage_dir }}/gputest.zip"
    state: absent
  become: true
  when:
    - ansible_facts['system'] == 'Linux'
    - ih_family != 'Archlinux'
    - install_gputest | default(false) | bool

# The ozone3d zip extracts to a versioned subdirectory
# (e.g. GpuTest_Linux_x64_0.7.0/GpuTest), not directly to /opt/gputest/GpuTest.
# Locate the actual binary before symlinking.
- name: Locate GpuTest binary inside /opt/gputest
  ansible.builtin.find:
    paths: /opt/gputest
    patterns: GpuTest
    file_type: file
    recurse: true
  register: gputest_binary
  when:
    - ansible_facts['system'] == 'Linux'
    - ih_family != 'Archlinux'
    - install_gputest | default(false) | bool

- name: Create GpuTest symlink
  ansible.builtin.file:
    src: "{{ gputest_binary.files[0].path }}"
    dest: /usr/local/bin/GpuTest
    state: link
    force: true
  become: true
  when:
    - ansible_facts['system'] == 'Linux'
    - ih_family != 'Archlinux'
    - install_gputest | default(false) | bool
    - gputest_binary is defined
    - gputest_binary.files | default([]) | length > 0

# --- Syncthing autostart: enable the shipped systemd USER unit ---
# Debian, Fedora and Arch all ship /usr/lib/systemd/user/syncthing.service but
# leave it disabled. Enabling it in user scope starts Syncthing at login as the
# owner of the files being synced, which mirrors the logon scheduled task that
# the Windows installer registers. System scope is deliberately not used: it
# would run as root or need a syncthing@<user> instance.
- name: Look up UID of the non-root user (Syncthing autostart)
  ansible.builtin.getent:
    database: passwd
    key: "{{ non_root_user }}"
  when:
    - ansible_facts['system'] == 'Linux'
    - install_syncthing | default(false) | bool

# `systemctl --user` needs a live D-Bus session. On a headless box or a live
# USB there is none and the call fails with "Failed to connect to bus".
- name: Probe for an active login session (Syncthing autostart)
  ansible.builtin.command: loginctl show-user {{ non_root_user | quote }} -p State --value
  register: syncthing_user_state
  changed_when: false
  failed_when: false
  become: true
  when:
    - ansible_facts['system'] == 'Linux'
    - install_syncthing | default(false) | bool

- name: Enable Syncthing systemd user service (starts at login)
  ansible.builtin.systemd:
    name: syncthing.service
    scope: user
    enabled: true
    state: started
  become: true
  become_user: "{{ non_root_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[non_root_user][1] }}"
  when:
    - ansible_facts['system'] == 'Linux'
    - install_syncthing | default(false) | bool
    - (syncthing_user_state.stdout | default('') | trim) == 'active'

- name: Report skipped Syncthing autostart (no active login session)
  ansible.builtin.debug:
    msg: "[WARN] Syncthing installed but autostart not enabled, no active login session for {{ non_root_user }}. Run `systemctl --user enable --now syncthing.service` after logging in."
  when:
    - ansible_facts['system'] == 'Linux'
    - install_syncthing | default(false) | bool
    - (syncthing_user_state.stdout | default('') | trim) != 'active'

# --- Tailscale daemon: enable the shipped systemd SYSTEM unit ---
# tailscaled owns a kernel network interface and routing table entries, so it
# has to run in system scope as root, unlike the Syncthing user unit above.
# The Debian and Ubuntu packages enable the unit in their post-install, Fedora
# and Arch do not, and ansible.builtin.systemd is idempotent, so this runs on
# every distro instead of carrying a per-distribution special case.
# Joining a tailnet stays manual: `sudo tailscale up` needs interactive browser
# authentication and an auth key would be a credential committed to this repo.
- name: Enable tailscaled systemd system service
  ansible.builtin.systemd:
    name: tailscaled.service
    enabled: true
    state: started
  become: true
  when:
    - ansible_facts['system'] == 'Linux'
    - install_tailscale | default(false) | bool

# --- OpenRazer: device access group and reboot notice ---
# The OpenRazer daemon talks to devices through udev rules that grant one group
# access, so a user outside that group sees no hardware even with the driver
# loaded. Which group that is, is a per-distribution fact and therefore lives in
# os_dict: Arch patches upstream to use `openrazer` and has no plugdev at all,
# Debian ships plugdev in the base system, Fedora's package creates it. Hardcoding
# plugdev here failed every Arch run, see docs/regression_ledger.md.
# Membership only takes effect on the next login.
- name: Probe for the OpenRazer device group
  ansible.builtin.getent:
    database: group
    key: "{{ os_dict.openrazer_device_group }}"
    fail_key: false
  become: true
  when:
    - ansible_facts['system'] == 'Linux'
    - install_openrazer | default(false) | bool
    - os_dict.openrazer_device_group is defined

- name: Fail when the OpenRazer device group is absent
  ansible.builtin.fail:
    msg: "OpenRazer device group '{{ os_dict.openrazer_device_group }}' does not exist on {{ ansible_facts['distribution'] }}. The OpenRazer package creates it, so its install did not complete. Check the package manager output above rather than rerunning."
  when:
    - ansible_facts['system'] == 'Linux'
    - install_openrazer | default(false) | bool
    - os_dict.openrazer_device_group is defined
    - getent_group[os_dict.openrazer_device_group] is none

- name: Add the non-root user to the OpenRazer device group
  ansible.builtin.user:
    name: "{{ non_root_user }}"
    groups: "{{ os_dict.openrazer_device_group }}"
    append: true
  become: true
  when:
    - ansible_facts['system'] == 'Linux'
    - install_openrazer | default(false) | bool
    - os_dict.openrazer_device_group is defined

# The driver is a DKMS module built against the running kernel. It cannot load
# until the machine reboots, and on a Secure Boot system it will not load at all
# unless the module is signed or Secure Boot is turned off.
- name: Check whether the OpenRazer kernel module is loaded
  ansible.builtin.command: lsmod
  register: openrazer_lsmod
  changed_when: false
  failed_when: false
  when:
    - ansible_facts['system'] == 'Linux'
    - install_openrazer | default(false) | bool

- name: Report the OpenRazer reboot requirement
  ansible.builtin.debug:
    msg: "[WARN] OpenRazer installed but the razerkbd/razermouse DKMS modules are not loaded yet. Reboot to load them. On a Secure Boot machine the unsigned module is refused, either sign it or disable Secure Boot. After rebooting, log out and back in so {{ os_dict.openrazer_device_group | default('device group') }} membership applies."
  when:
    - ansible_facts['system'] == 'Linux'
    - install_openrazer | default(false) | bool
    - "'razer' not in (openrazer_lsmod.stdout | default(''))"
