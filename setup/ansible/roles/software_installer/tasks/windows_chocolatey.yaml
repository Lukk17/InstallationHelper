---
- name: Install Chocolatey packages (batched)
  chocolatey.chocolatey.win_chocolatey:
    name: "{{ choco_packages }}"
    state: present
  vars:
    choco_packages: >-
      {{ software_installer_packages
         | selectattr('value.manager', 'equalto', 'choco')
         | map(attribute='value.package')
         | list }}
  when: choco_packages | length > 0
