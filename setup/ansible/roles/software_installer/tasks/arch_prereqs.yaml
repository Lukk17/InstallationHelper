---
# Arch prerequisites that must land before the batched pacman install, the same
# role debian_repos.yaml and fedora_repos.yaml play for their families.

# --- Kernel headers for DKMS modules ---
# Arch's dkms package lists linux-headers only as an optional dependency, so
# pulling openrazer-daemon installs openrazer-driver-dkms with nothing to build
# against. The alpm hook reports "Missing <ver> kernel headers" and still exits
# zero, so the module silently never builds and the daemon exits at startup.
# Fedora already installs kernel-devel and kernel-headers for the same reason.
#
# Headers are per kernel flavour (linux, linux-lts, linux-zen, linux-hardened),
# so the package name is derived from each installed kernel's own pkgbase file
# rather than hardcoded. Every installed kernel is covered, not just the running
# one, because a full system upgrade earlier in this playbook can replace the
# running kernel's module tree before this task runs.
- name: Find the pkgbase marker of every installed kernel (Arch)
  ansible.builtin.find:
    paths: /usr/lib/modules
    patterns: pkgbase
    file_type: file
    recurse: true
    depth: 2
  register: arch_kernel_pkgbase_files
  when: install_openrazer | default(false) | bool

- name: Read the package base of every installed kernel (Arch)
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  register: arch_kernel_pkgbases
  become: true
  loop: "{{ arch_kernel_pkgbase_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: install_openrazer | default(false) | bool

- name: Install matching kernel headers for DKMS modules (Arch)
  community.general.pacman:
    name: "{{ arch_dkms_header_packages }}"
    state: present
  become: true
  vars:
    arch_dkms_header_packages: >-
      {{ arch_kernel_pkgbases.results | default([])
         | selectattr('content', 'defined')
         | map(attribute='content')
         | map('b64decode')
         | map('trim')
         | map('regex_replace', '^(.+)$', '\1-headers')
         | unique
         | list }}
  when:
    - install_openrazer | default(false) | bool
    - arch_dkms_header_packages | length > 0

# What matters is not whether a headers package installed but whether DKMS ends up with something to
# build against, and that is a directory on disk: pacman's linux-headers packages provide
# /usr/lib/modules/<version>/build and dkms compiles against exactly that. So the outcome is measured
# rather than inferred from a module result, the same way the vendor .deb installs in
# dynamic_install.yaml establish what happened from stat.
#
# Two outcomes have to be told apart here, and /usr/lib/modules is what tells them apart. A container
# has no kernel of its own, and in the published Arch image /usr/lib/modules is not a directory at
# all: the find above reports "Skipped '/usr/lib/modules' path due to this access issue:
# '/usr/lib/modules' is not a directory", which is in every Arch tier 3 playbook log. Every real Arch
# install has that directory with at least one pacman-managed kernel under it. So an absent module
# tree means nothing on this machine manages kernels, which is informational, and a present module
# tree with no build directory means the DKMS driver genuinely cannot build, which is a failure the
# run has to report. Reporting both the same way would either fail every container run or keep saying
# nothing on the hardware this matters on.
- name: Check whether this machine manages kernel modules at all (Arch)
  ansible.builtin.stat:
    path: /usr/lib/modules
  register: arch_kernel_module_tree
  when: install_openrazer | default(false) | bool

- name: Look for a DKMS build directory under any installed kernel (Arch)
  ansible.builtin.find:
    paths: /usr/lib/modules
    patterns: build
    file_type: any
    recurse: true
    depth: 2
  register: arch_kernel_build_dirs
  when:
    - install_openrazer | default(false) | bool
    - arch_kernel_module_tree.stat.isdir | default(false)

- name: Report that this machine has no kernel module tree of its own (Arch)
  ansible.builtin.debug:
    msg: >-
      /usr/lib/modules is not a directory here, so no kernel is managed on this machine and no DKMS
      kernel headers were installed. That is what a container looks like and is not a fault there.
      On real hardware it cannot happen.
  when:
    - install_openrazer | default(false) | bool
    - not (arch_kernel_module_tree.stat.isdir | default(false))

- name: Report that the OpenRazer driver cannot build without kernel headers (Arch)
  ansible.builtin.debug:
    msg: >-
      [ERROR] OpenRazer will install and its kernel driver will NOT build: no
      /usr/lib/modules/<version>/build directory exists for any installed kernel, and that is what
      DKMS compiles against. The daemon starts and exits, no Razer device is controllable, and pacman
      reports success anyway because Arch's dkms alpm hook ends in return 0. Install the headers
      matching your kernel by hand, linux-headers for the stock kernel, then rerun.
  when:
    - install_openrazer | default(false) | bool
    - arch_kernel_module_tree.stat.isdir | default(false)
    - arch_kernel_build_dirs.matched | default(0) == 0

- name: Record the unbuildable OpenRazer driver in the play summary (Arch)
  ansible.builtin.set_fact:
    any_role_failed: true
  when:
    - install_openrazer | default(false) | bool
    - arch_kernel_module_tree.stat.isdir | default(false)
    - arch_kernel_build_dirs.matched | default(0) == 0
