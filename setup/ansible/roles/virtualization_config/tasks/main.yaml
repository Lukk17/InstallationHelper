---
# Debian/Ubuntu apt tasks use shell+file-redirect (Ubuntu hit the 2.19
# deserialization bug on long apt installs). Arch and Fedora kept on the
# native modules — they ran cleanly in the last full run.
#
# Every apt-get call below takes its flags from apt_raw_flags in group_vars/linux.yaml, the same
# variable the batched apt install in software_installer reads, so there is one source of truth for
# them. They used to be spelled out here with -yqq, and that -qq is why these three tasks reported
# changed on every run. With -qq, apt-get prints absolutely nothing when there is no work left to
# do, measured as zero bytes of output in a debian:trixie container, so the "0 upgraded, 0 newly
# installed, 0 to remove" line that changed_when looks for could never appear and the condition was
# always true. With -y the same call prints "0 upgraded, 0 newly installed, 0 to remove and 9 not
# upgraded." and the condition means what it says.
#
# set -o pipefail is load-bearing for the same reason it is on the batched apt install. Without it
# the shell reports the status of the last command in the pipeline, which is tee, and tee succeeds
# whatever apt did, so failed_when below could never fire on a real apt failure.

# qemu-system-x86, not qemu-kvm. qemu-kvm has no installation candidate on either Debian trixie or
# Ubuntu 26.04, and the two then behave differently: on Debian apt resolves the virtual name to its
# single provider and exits 0, while on Ubuntu 26.04 it exits 100 with "Package 'qemu-kvm' has no
# installation candidate". Measured on both images on 2026-08-21 with apt-get install -s.
#
# So this task had been failing on every Ubuntu and Pop!_OS run and nobody could see it, because the
# pipeline ends in tee and there was no set -o pipefail above it, so failed_when was reading tee's
# status. Adding that pipefail earlier today is what made this visible, which is the argument for
# that change in one sentence: the mask was hiding a real defect rather than a hypothetical one.
#
# qemu-system-x86 has a real candidate on both, 1:10.0.11 on Debian and 1:10.2.1 on Ubuntu, and it is
# what qemu-kvm was the transitional name for.
- name: Install QEMU/KVM and virt-manager packages (Debian) via apt-get → log file
  ansible.builtin.shell: |
    set -o pipefail
    apt-get install {{ apt_raw_flags }} \
      qemu-system-x86 libvirt-daemon-system libvirt-clients virt-manager virtinst \
      bridge-utils virtiofsd \
      2>&1 | tee -a /var/log/installation-virt-apt.log
  args:
    executable: /bin/bash
  environment:
    DEBIAN_FRONTEND: noninteractive
    APT_LISTCHANGES_FRONTEND: none
    NEEDRESTART_MODE: a
    NEEDRESTART_SUSPEND: "1"
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
  become: true
  register: virt_apt_result
  # Detect idempotent no-op: apt's "0 upgraded, 0 newly installed, 0 to remove"
  # line means nothing changed. Any other output means real work happened.
  changed_when: "'0 upgraded, 0 newly installed, 0 to remove' not in (virt_apt_result.stdout | default(''))"
  failed_when: virt_apt_result.rc | default(0) != 0
  # Retried as a whole for the reason on the apt batch above: this fetches from the network,
  # and one dropped connection must not cost the run every application in the batch. What has
  # already installed is skipped on the second attempt, so a retry costs only what was lost.
  until: virt_apt_result.rc | default(1) == 0
  retries: 3
  delay: 20
  when: ih_family == 'Debian' and install_virt_manager | default(false) | bool
  tags: [libvirt]

- name: Install QEMU/KVM and virt-manager packages (Arch)
  become: yes
  community.general.pacman:
    name:
      - qemu-full
      - virt-manager
      - libvirt
      - dnsmasq
      - nftables
      - virtiofsd
    state: present
  when: ih_family == 'Archlinux' and install_virt_manager | default(false) | bool
  tags: [libvirt]

- name: Install QEMU/KVM and virt-manager packages (Fedora)
  become: yes
  ansible.builtin.dnf:
    name:
      - qemu-kvm
      - libvirt
      - virt-manager
      - virt-install
      - bridge-utils
      - virtiofsd
    state: present
  when: ih_family == 'RedHat' and install_virt_manager | default(false) | bool
  tags: [libvirt]

# spice-vdagent — only when this machine is itself a guest VM.
- name: Install spice-vdagent (Debian guest) via apt-get → log file
  ansible.builtin.shell: |
    set -o pipefail
    apt-get install {{ apt_raw_flags }} spice-vdagent 2>&1 | tee -a /var/log/installation-virt-apt.log
  args:
    executable: /bin/bash
  environment:
    DEBIAN_FRONTEND: noninteractive
    NEEDRESTART_MODE: a
  become: true
  register: spice_apt_result
  changed_when: "'0 upgraded, 0 newly installed, 0 to remove' not in (spice_apt_result.stdout | default(''))"
  failed_when: spice_apt_result.rc | default(0) != 0
  # Retried as a whole for the reason on the apt batch above: this fetches from the network,
  # and one dropped connection must not cost the run every application in the batch. What has
  # already installed is skipped on the second attempt, so a retry costs only what was lost.
  until: spice_apt_result.rc | default(1) == 0
  retries: 3
  delay: 20
  when: ih_family == 'Debian' and ansible_virtualization_role == 'guest'
  tags: [libvirt]

- name: Install spice-vdagent (Arch guest)
  become: yes
  community.general.pacman:
    name: spice-vdagent
    state: present
  when: ih_family == 'Archlinux' and ansible_virtualization_role == 'guest'
  tags: [libvirt]

- name: Install spice-vdagent (Fedora guest)
  become: yes
  ansible.builtin.dnf:
    name: spice-vdagent
    state: present
  when: ih_family == 'RedHat' and ansible_virtualization_role == 'guest'
  tags: [libvirt]

# This used to be one task asking for libvirtd.service to be both enabled and started, and it
# reported changed on every run that was more than about two minutes long. The reason is not a
# reporting bug. libvirtd is socket-activated and the unit that ships with it carries
# Environment=LIBVIRTD_ARGS="--{{ ih_timeout }} 120", so the daemon exits by itself two minutes after the last
# client disconnects and systemd leaves libvirtd.socket listening in its place. Asking for the
# service to be started is therefore asking for a state the system deliberately walks away from, and
# a second pass really does start the daemon again. The change was honest, the request was wrong.
#
# Measured rather than reasoned about, in a Debian trixie container running systemd as PID 1. After
# 150 idle seconds systemctl reported libvirtd.service inactive and libvirtd.socket active, and the
# old task reported "changed": true at that point. In the same state the two tasks below both
# reported "changed": false, and so did they while the daemon was still running. With the service
# stopped and only the sockets listening, `virsh -c qemu:///system uri` answered and systemd brought
# the service straight back up, so nothing is lost by not demanding it be running.
#
# The two halves are asked for separately because they are two different things. The socket is what
# has to be listening now, and a socket unit does not exit when it is idle, so starting it is
# genuinely repeatable. The service is what has to come up at boot, because that is the pass which
# autostarts the guests marked for it, and enabling it without demanding it run leaves the idle exit
# alone.
#
# libvirtd.socket ships on all three Linux families this playbook supports, checked by listing the
# unit directory in a container of each rather than generalising from Debian, and all three carry the
# same --{{ ih_timeout }} 120 in libvirtd.service.
- name: Enable libvirtd at boot (Linux)
  become: true
  ansible.builtin.systemd:
    name: libvirtd.service
    enabled: true
  when: ansible_facts['system'] == 'Linux' and install_virt_manager | default(false) | bool
  tags: [libvirt]

- name: Enable and start the libvirtd socket (Linux)
  become: true
  ansible.builtin.systemd:
    name: libvirtd.socket
    state: started
    enabled: true
  when: ansible_facts['system'] == 'Linux' and install_virt_manager | default(false) | bool
  tags: [libvirt]

- name: Add current user to libvirt group (Linux)
  become: true
  ansible.builtin.user:
    name: "{{ non_root_user }}"
    groups: libvirt
    append: true
  when: ansible_facts['system'] == 'Linux' and install_virt_manager | default(false) | bool
  tags: [libvirt]

- name: Add current user to kvm group (Linux)
  become: true
  ansible.builtin.user:
    name: "{{ non_root_user }}"
    groups: kvm
    append: true
  when: ansible_facts['system'] == 'Linux' and install_virt_manager | default(false) | bool
  tags: [libvirt]

# Docker — installed here for ALL Linux distros so the service-start task can
# rely on the package being present. The matching APT/DNF repos are provisioned
# by `software_installer/tasks/{debian_repos,fedora_repos}.yaml` when the toggle
# is on.

# Same shell+apt-get pattern as the batched software install — Ubuntu's apt
# module reliably trips "Module result deserialization failed" when a docker
# install's containerd.io / docker-ce postinst writes to stdout (systemctl
# daemon-reload, needrestart messages). Bypass via shell.
- name: Install Docker CE (Debian) via apt-get → log file
  ansible.builtin.shell: |
    set -o pipefail
    apt-get install {{ apt_raw_flags }} \
      docker-ce docker-ce-cli containerd.io \
      docker-buildx-plugin docker-compose-plugin \
      2>&1 | tee -a /var/log/installation-docker-apt.log
  args:
    executable: /bin/bash
  environment:
    DEBIAN_FRONTEND: noninteractive
    APT_LISTCHANGES_FRONTEND: none
    NEEDRESTART_MODE: a
    NEEDRESTART_SUSPEND: "1"
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
  become: true
  register: docker_apt_result
  changed_when: "'0 upgraded, 0 newly installed, 0 to remove' not in (docker_apt_result.stdout | default(''))"
  failed_when: docker_apt_result.rc | default(0) != 0
  # Retried as a whole for the reason on the apt batch above: this fetches from the network,
  # and one dropped connection must not cost the run every application in the batch. What has
  # already installed is skipped on the second attempt, so a retry costs only what was lost.
  until: docker_apt_result.rc | default(1) == 0
  retries: 3
  delay: 20
  when: ih_family == 'Debian' and install_docker | default(false) | bool
  tags: [docker]

- name: Install Docker CE (Fedora)
  become: true
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  when: ih_family == 'RedHat' and install_docker | default(false) | bool
  tags: [docker]

- name: Install Docker (Arch)
  become: true
  community.general.pacman:
    name:
      - docker
      - docker-buildx
      - docker-compose
      # Docker on Arch needs the nftables variant of iptables or the daemon fails to
      # initialise its bridge driver. That variant used to be a separate iptables-nft package
      # and Arch has since consolidated: core/iptables IS the nftables build, and the old
      # behaviour moved to iptables-legacy, which declares `provides: iptables`. So
      # iptables-nft no longer exists and naming it failed the whole task, taking the Docker
      # install with it. Found by e2e/tier2/resolve_role_packages.sh. See
      # docs/regression_ledger.md.
      #
      # bridge-utils is deliberately absent: iproute2 ships those tools and bridge-utils is no
      # longer in the Arch repositories.
      - iptables
    state: present
  when: ih_family == 'Archlinux' and install_docker | default(false) | bool
  tags: [docker]

# On Arch, libvirtd loaded the legacy iptables kernel modules when it
# started a few tasks earlier. Docker (with iptables-nft) then fails to
# init the bridge driver with "iptables v1.8.13 (nf_tables): Could not
# fetch rule set generation id: Invalid argument" because the kernel
# namespace is in mixed legacy+nft state. Fix: switch libvirt's firewall
# backend to nftables and restart libvirtd so both ecosystems agree.
# Probe whether libvirt is actually installed before writing its config.
# Under `--tags docker` alone, the libvirt install task (tagged `[libvirt]`)
# doesn't fire, so libvirtd.service may be absent. Writing to network.conf
# and restarting a non-existent unit would fail the play.
- name: Probe for libvirtd.service unit (Arch)
  ansible.builtin.stat:
    path: "{{ item }}"
  register: libvirtd_service_units
  loop:
    - /usr/lib/systemd/system/libvirtd.service
    - /lib/systemd/system/libvirtd.service
  when:
    - ih_family == 'Archlinux'
    - install_docker | default(false) | bool
    - install_virt_manager | default(false) | bool
  tags: [docker, libvirt]

- name: Configure libvirt firewall backend to nftables (Arch)
  ansible.builtin.lineinfile:
    path: /etc/libvirt/network.conf
    regexp: '^#?\s*firewall_backend\s*='
    line: 'firewall_backend = "nftables"'
    create: true
    mode: '0644'
    owner: root
    group: root
  become: true
  register: libvirt_firewall_backend
  when:
    - ih_family == 'Archlinux'
    - install_docker | default(false) | bool
    - install_virt_manager | default(false) | bool
    - libvirtd_service_units is defined
    - libvirtd_service_units.results | selectattr('stat.exists', 'equalto', true) | list | length > 0
  tags: [docker, libvirt]

- name: Restart libvirtd after firewall-backend change (Arch)
  ansible.builtin.systemd:
    name: libvirtd
    state: restarted
  become: true
  when:
    - ih_family == 'Archlinux'
    - libvirt_firewall_backend is defined
    - libvirt_firewall_backend is changed
  tags: [docker, libvirt]

# On Arch, after libvirtd flips its firewall backend to nftables, kernel
# iptables-nft state needs a moment to settle before dockerd can register
# its NAT chains. Without this pause, Docker.service failed 4s after the
# libvirtd restart with "Job for docker.service failed because the control
# process exited with error code." See AGENTS.md for full context.
- name: Pause briefly to let iptables-nft state settle (Arch)
  ansible.builtin.pause:
    seconds: 5
  when:
    - ih_family == 'Archlinux'
    - libvirt_firewall_backend is defined
    - libvirt_firewall_backend is changed
  tags: [docker, libvirt]

# nf_tables / nft_compat / br_netfilter are built INTO modern Arch
# kernels (not loadable modules) so no explicit modprobe is needed.
# An earlier attempt at `community.general.modprobe` here fired AFTER
# the mid-playbook pacman -Syu had bumped the kernel and removed the
# running kernel's /lib/modules/<ver>/ dir — every modprobe then failed
# with "No such file or directory: modules.builtin" and the rescue
# skipped the actual Docker start. Trust the running kernel.

- name: Probe for docker.service unit (Linux)
  ansible.builtin.stat:
    path: "{{ item }}"
  register: docker_service_units
  loop:
    - /lib/systemd/system/docker.service
    - /usr/lib/systemd/system/docker.service
    - /etc/systemd/system/docker.service
  when: ansible_facts['system'] == 'Linux' and install_docker | default(false) | bool
  tags: [docker]

- name: Enable and start Docker service (Linux)
  become: true
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  register: docker_start
  retries: 3
  delay: 5
  until: docker_start is succeeded
  when:
    - ansible_facts['system'] == 'Linux'
    - install_docker | default(false) | bool
    - docker_service_units is defined
    - docker_service_units.results | selectattr('stat.exists', 'equalto', true) | list | length > 0
  tags: [docker]

- name: Add current user to docker group (Linux)
  become: true
  ansible.builtin.user:
    name: "{{ non_root_user }}"
    groups: docker
    append: true
  when: ansible_facts['system'] == 'Linux' and install_docker | default(false) | bool
  tags: [docker]
