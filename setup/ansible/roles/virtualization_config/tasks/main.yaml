---
- name: Install QEMU/KVM and virt-manager packages (Debian)
  become: yes
  ansible.builtin.apt:
    name:
      - qemu-kvm
      - libvirt-daemon-system
      - libvirt-clients
      - virt-manager
      - virtinst
      - bridge-utils
      - virtiofsd
    state: present
  when: ansible_facts['os_family'] == 'Debian' and install_virt_manager | default(false) | bool

- name: Install QEMU/KVM and virt-manager packages (Arch)
  become: yes
  community.general.pacman:
    name:
      - qemu-full
      - virt-manager
      - libvirt
      - dnsmasq
      - nftables
      - bridge-utils
      - virtiofsd
    state: present
  when: ansible_facts['os_family'] == 'Archlinux' and install_virt_manager | default(false) | bool

- name: Install QEMU/KVM and virt-manager packages (Fedora)
  become: yes
  ansible.builtin.dnf:
    name:
      - qemu-kvm
      - libvirt
      - virt-manager
      - virt-install
      - bridge-utils
      - virtiofsd
    state: present
  when: ansible_facts['os_family'] == 'RedHat' and install_virt_manager | default(false) | bool

# Install spice-vdagent when this machine is itself running inside a VM (guest)
- name: Install spice-vdagent for clipboard/display integration (Debian guest)
  become: yes
  ansible.builtin.apt:
    name: spice-vdagent
    state: present
  when: ansible_facts['os_family'] == 'Debian' and ansible_virtualization_role == 'guest'

- name: Install spice-vdagent for clipboard/display integration (Arch guest)
  become: yes
  community.general.pacman:
    name: spice-vdagent
    state: present
  when: ansible_facts['os_family'] == 'Archlinux' and ansible_virtualization_role == 'guest'

- name: Install spice-vdagent for clipboard/display integration (Fedora guest)
  become: yes
  ansible.builtin.dnf:
    name: spice-vdagent
    state: present
  when: ansible_facts['os_family'] == 'RedHat' and ansible_virtualization_role == 'guest'

- name: Enable and start libvirtd service (Linux)
  become: true
  ansible.builtin.systemd:
    name: libvirtd
    state: started
    enabled: true
  when: ansible_facts['system'] == 'Linux' and install_virt_manager | default(false) | bool

- name: Add current user to libvirt group (Linux)
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: libvirt
    append: true
  when: ansible_facts['system'] == 'Linux' and install_virt_manager | default(false) | bool

- name: Add current user to kvm group (Linux)
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: kvm
    append: true
  when: ansible_facts['system'] == 'Linux' and install_virt_manager | default(false) | bool

- name: Install Docker (Arch)
  become: true
  community.general.pacman:
    name: docker
    state: present
  when: ansible_facts['os_family'] == 'Archlinux' and install_docker | default(false) | bool

- name: Enable and start Docker service (Linux)
  become: true
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  when: ansible_facts['system'] == 'Linux' and install_docker | default(false) | bool

- name: Add current user to docker group (Linux)
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true
  when: ansible_facts['system'] == 'Linux' and install_docker | default(false) | bool
