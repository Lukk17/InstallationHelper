---
# Every package in this role is installed one package per call through
# setup/ansible/tasks/install_role_packages.yaml, under the retry rule every package manager follows,
# so one package that cannot install costs only itself and is named, and the rest of the set and of the
# role still run. That file installs through raw, for the 2.19 deserialization bug Ubuntu hit on long
# apt installs, with apt's flags from apt_raw_flags in group_vars/linux.yaml.

# virt-manager is install_virt_manager's mapping, and the rest of the KVM stack is that toggle's
# companion_packages entry in vars/<OS>.yaml, which setup/ansible/verify_install.yaml reads too, so the
# verification expects exactly what this installs. virt-manager is asked for again here, after
# software_installer installed it, so a run limited to --tags libvirt still gets the application.
- name: Install QEMU/KVM and virt-manager packages (Linux)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: "{{ [os_dict.software_mapping.virt_manager.package] + os_dict.companion_packages.virt_manager }}"
    role_packages_purpose: QEMU/KVM and virt-manager
  when: ih_family in ['Debian', 'RedHat', 'Archlinux'] and install_virt_manager | default(false) | bool
  tags: [libvirt]

# The libvirt daemon is what every libvirt task below enables or joins, so a daemon package that did not
# install leaves them nothing to act on. It is already named as NOT installed, and enabling a unit that
# does not exist would end the role there, Docker included.
- name: Remember whether the libvirt daemon installed (Linux)
  ansible.builtin.set_fact:
    virt_libvirt_missing: "{{ role_packages_missing | intersect(['libvirt', 'libvirt-daemon-system']) | length > 0 }}"
  when: ih_family in ['Debian', 'RedHat', 'Archlinux'] and install_virt_manager | default(false) | bool
  tags: [libvirt]

# spice-vdagent — only when this machine is itself a guest VM.
- name: Install spice-vdagent (Debian guest)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: [spice-vdagent]
    role_packages_purpose: the SPICE guest agent
  when: ih_family == 'Debian' and ansible_virtualization_role == 'guest'
  tags: [libvirt]

- name: Install spice-vdagent (Arch guest)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: [spice-vdagent]
    role_packages_purpose: the SPICE guest agent
  when: ih_family == 'Archlinux' and ansible_virtualization_role == 'guest'
  tags: [libvirt]

- name: Install spice-vdagent (Fedora guest)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: [spice-vdagent]
    role_packages_purpose: the SPICE guest agent
  when: ih_family == 'RedHat' and ansible_virtualization_role == 'guest'
  tags: [libvirt]

# This used to be one task asking for libvirtd.service to be both enabled and started, and it
# reported changed on every run that was more than about two minutes long. The reason is not a
# reporting bug. libvirtd is socket-activated and the unit that ships with it carries
# Environment=LIBVIRTD_ARGS="--{{ ih_timeout }} 120", so the daemon exits by itself two minutes after the last
# client disconnects and systemd leaves libvirtd.socket listening in its place. Asking for the
# service to be started is therefore asking for a state the system deliberately walks away from, and
# a second pass really does start the daemon again. The change was honest, the request was wrong.
#
# Measured rather than reasoned about, in a Debian trixie container running systemd as PID 1. After
# 150 idle seconds systemctl reported libvirtd.service inactive and libvirtd.socket active, and the
# old task reported "changed": true at that point. In the same state the two tasks below both
# reported "changed": false, and so did they while the daemon was still running. With the service
# stopped and only the sockets listening, `virsh -c qemu:///system uri` answered and systemd brought
# the service straight back up, so nothing is lost by not demanding it be running.
#
# The two halves are asked for separately because they are two different things. The socket is what
# has to be listening now, and a socket unit does not exit when it is idle, so starting it is
# genuinely repeatable. The service is what has to come up at boot, because that is the pass which
# autostarts the guests marked for it, and enabling it without demanding it run leaves the idle exit
# alone.
#
# libvirtd.socket ships on all three Linux families this playbook supports, checked by listing the
# unit directory in a container of each rather than generalising from Debian, and all three carry the
# same --{{ ih_timeout }} 120 in libvirtd.service.
- name: Enable libvirtd at boot (Linux)
  become: true
  ansible.builtin.systemd:
    name: libvirtd.service
    enabled: true
  when:
    - ansible_facts['system'] == 'Linux' and install_virt_manager | default(false) | bool
    - not (virt_libvirt_missing | default(false) | bool)
  tags: [libvirt]

- name: Enable and start the libvirtd socket (Linux)
  become: true
  ansible.builtin.systemd:
    name: libvirtd.socket
    state: started
    enabled: true
  when:
    - ansible_facts['system'] == 'Linux' and install_virt_manager | default(false) | bool
    - not (virt_libvirt_missing | default(false) | bool)
  tags: [libvirt]

- name: Add current user to libvirt group (Linux)
  become: true
  ansible.builtin.user:
    name: "{{ non_root_user }}"
    groups: libvirt
    append: true
  when:
    - ansible_facts['system'] == 'Linux' and install_virt_manager | default(false) | bool
    - not (virt_libvirt_missing | default(false) | bool)
  tags: [libvirt]

- name: Add current user to kvm group (Linux)
  become: true
  ansible.builtin.user:
    name: "{{ non_root_user }}"
    groups: kvm
    append: true
  when: ansible_facts['system'] == 'Linux' and install_virt_manager | default(false) | bool
  tags: [libvirt]

# Docker — installed here for ALL Linux distros so the service-start task can
# rely on the package being present. The matching APT/DNF repos are provisioned
# by `software_installer/tasks/{debian_repos,fedora_repos}.yaml` when the toggle
# is on.

# Docker is installed here rather than by software_installer, so this is where a Docker repository
# that could not be added is answered for. software_installer/tasks/debian_repos.yaml and
# fedora_repos.yaml give it its own block with a rescue, setup/ansible/tasks/
# repository_availability.yaml decides from the disk whether it is there, and every Docker task below
# that needs the package reads that answer. Without that answer the package install would fail and take
# every later task in this role with it, so Docker is skipped and named as NOT installed instead, and
# everything else here continues.
- name: Record Docker as NOT installed because its repository could not be added (Debian, Fedora)
  ansible.builtin.set_fact:
    any_role_failed: true
    not_installed_with_reason: >-
      {{ (not_installed_with_reason | default([]))
         + ['docker (the ' ~ unavailable_repositories.docker.vendor ~ ' repository could not be added)'] }}
  when:
    - ih_family in ['Debian', 'RedHat']
    - install_docker | default(false) | bool
    - "'docker' in unavailable_repositories | default({})"
  tags: [docker]

- name: Name Docker as NOT installed because its repository could not be added (Debian, Fedora)
  ansible.builtin.debug:
    msg: >-
      [ERROR] Docker was NOT installed, because the {{ unavailable_repositories.docker.vendor }}
      repository could not be added. The repository step that failed is named earlier in this log.
      Everything else in this role continues.
  when:
    - ih_family in ['Debian', 'RedHat']
    - install_docker | default(false) | bool
    - "'docker' in unavailable_repositories | default({})"
  tags: [docker]

# Docker's packages are install_docker's companion_packages entry in vars/<OS>.yaml, which
# setup/ansible/verify_install.yaml reads too, so the verification expects every package installed here
# and not only docker.service and the docker group.
- name: Install Docker CE (Debian)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: "{{ os_dict.companion_packages.docker }}"
    role_packages_purpose: Docker
  when:
    - ih_family == 'Debian'
    - install_docker | default(false) | bool
    - "'docker' not in unavailable_repositories | default({})"
  tags: [docker]

- name: Install Docker CE (Fedora)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: "{{ os_dict.companion_packages.docker }}"
    role_packages_purpose: Docker
  when:
    - ih_family == 'RedHat'
    - install_docker | default(false) | bool
    - "'docker' not in unavailable_repositories | default({})"
  tags: [docker]

# These four were one community.general.pacman call until 2026-10-15, when the cachyos defaults
# scenario lost all of them to a single 404: the dependency containerd-2.4.1-1.1 was published,
# cdn77.cachyos.org did not carry it yet, and the whole transaction failed. docs/regression_ledger.md
# has the entry, and e2e/tier1/batched_managers.sh now fails on any task that hands several packages to
# one call. A retry after a package index refresh is what gets a current answer from a mirror that is
# behind, and the wait before it is the retry rule's twenty seconds like every other set: it waited three
# minutes until the owner settled one rule for every manager on 2026-10-15.
#
# Docker on Arch needs the nftables variant of iptables or the daemon fails to initialise its bridge
# driver. That variant used to be a separate iptables-nft package and Arch has since consolidated:
# core/iptables IS the nftables build, and the old behaviour moved to iptables-legacy, which declares
# `provides: iptables`. So iptables-nft no longer exists and naming it failed the whole task, taking
# the Docker install with it. Found by e2e/tier2/resolve_role_packages.sh. See
# docs/regression_ledger.md. bridge-utils is deliberately absent: iproute2 ships those tools and
# bridge-utils is no longer in the Arch repositories.
- name: Install Docker (Arch), one package at a time
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: "{{ os_dict.companion_packages.docker }}"
    role_packages_purpose: Docker
  when: ih_family == 'Archlinux' and install_docker | default(false) | bool
  tags: [docker]

# The engine is docker on Arch and docker-ce on Debian and Fedora. Without it there is no daemon to
# start and no docker group to join, so the tasks below that need either are skipped, and the package
# is already named as NOT installed.
- name: Remember whether the Docker engine installed (Linux)
  ansible.builtin.set_fact:
    docker_engine_missing: "{{ role_packages_missing | intersect(['docker', 'docker-ce']) | length > 0 }}"
  when:
    - ih_family in ['Debian', 'RedHat', 'Archlinux']
    - install_docker | default(false) | bool
    - "'docker' not in unavailable_repositories | default({})"
  tags: [docker]

- name: Say that the Docker service and group are skipped because the engine did not install (Linux)
  ansible.builtin.debug:
    msg: >-
      The Docker service and the docker group are skipped, because the Docker engine package did not
      install and there is no Docker to start. The package is named as NOT installed above.
  when:
    - ih_family in ['Debian', 'RedHat', 'Archlinux']
    - install_docker | default(false) | bool
    - docker_engine_missing | default(false) | bool
  tags: [docker]

# On Arch, libvirtd loaded the legacy iptables kernel modules when it
# started a few tasks earlier. Docker (with iptables-nft) then fails to
# init the bridge driver with "iptables v1.8.13 (nf_tables): Could not
# fetch rule set generation id: Invalid argument" because the kernel
# namespace is in mixed legacy+nft state. Fix: switch libvirt's firewall
# backend to nftables and restart libvirtd so both ecosystems agree.
# Probe whether libvirt is actually installed before writing its config.
# Under `--tags docker` alone, the libvirt install task (tagged `[libvirt]`)
# doesn't fire, so libvirtd.service may be absent. Writing to network.conf
# and restarting a non-existent unit would fail the play.
- name: Probe for libvirtd.service unit (Arch)
  ansible.builtin.stat:
    path: "{{ item }}"
  register: libvirtd_service_units
  loop:
    - /usr/lib/systemd/system/libvirtd.service
    - /lib/systemd/system/libvirtd.service
  when:
    - ih_family == 'Archlinux'
    - install_docker | default(false) | bool
    - install_virt_manager | default(false) | bool
  tags: [docker, libvirt]

- name: Configure libvirt firewall backend to nftables (Arch)
  ansible.builtin.lineinfile:
    path: /etc/libvirt/network.conf
    regexp: '^#?\s*firewall_backend\s*='
    line: 'firewall_backend = "nftables"'
    create: true
    mode: '0644'
    owner: root
    group: root
  become: true
  register: libvirt_firewall_backend
  when:
    - ih_family == 'Archlinux'
    - install_docker | default(false) | bool
    - install_virt_manager | default(false) | bool
    - libvirtd_service_units is defined
    - libvirtd_service_units.results | selectattr('stat.exists', 'equalto', true) | list | length > 0
  tags: [docker, libvirt]

- name: Restart libvirtd after firewall-backend change (Arch)
  ansible.builtin.systemd:
    name: libvirtd
    state: restarted
  become: true
  when:
    - ih_family == 'Archlinux'
    - libvirt_firewall_backend is defined
    - libvirt_firewall_backend is changed
  tags: [docker, libvirt]

# On Arch, after libvirtd flips its firewall backend to nftables, kernel
# iptables-nft state needs a moment to settle before dockerd can register
# its NAT chains. Without this pause, Docker.service failed 4s after the
# libvirtd restart with "Job for docker.service failed because the control
# process exited with error code." See docs/regression_ledger.md, "Arch libvirt and Docker fight over the iptables backend".
- name: Pause briefly to let iptables-nft state settle (Arch)
  ansible.builtin.pause:
    seconds: 5
  when:
    - ih_family == 'Archlinux'
    - libvirt_firewall_backend is defined
    - libvirt_firewall_backend is changed
  tags: [docker, libvirt]

# nf_tables / nft_compat / br_netfilter are built INTO modern Arch
# kernels (not loadable modules) so no explicit modprobe is needed.
# An earlier attempt at `community.general.modprobe` here fired AFTER
# the mid-playbook pacman -Syu had bumped the kernel and removed the
# running kernel's /lib/modules/<ver>/ dir — every modprobe then failed
# with "No such file or directory: modules.builtin" and the rescue
# skipped the actual Docker start. Trust the running kernel.

- name: Probe for docker.service unit (Linux)
  ansible.builtin.stat:
    path: "{{ item }}"
  register: docker_service_units
  loop:
    - /lib/systemd/system/docker.service
    - /usr/lib/systemd/system/docker.service
    - /etc/systemd/system/docker.service
  when:
    - ansible_facts['system'] == 'Linux'
    - install_docker | default(false) | bool
    - "'docker' not in unavailable_repositories | default({})"
    - not (docker_engine_missing | default(false) | bool)
  tags: [docker]

- name: Enable and start Docker service (Linux)
  become: true
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  register: docker_start
  retries: 3
  delay: 5
  until: docker_start is succeeded
  when:
    - ansible_facts['system'] == 'Linux'
    - install_docker | default(false) | bool
    - "'docker' not in unavailable_repositories | default({})"
    - not (docker_engine_missing | default(false) | bool)
    - docker_service_units is defined
    - docker_service_units.results | selectattr('stat.exists', 'equalto', true) | list | length > 0
  tags: [docker]

- name: Add current user to docker group (Linux)
  become: true
  ansible.builtin.user:
    name: "{{ non_root_user }}"
    groups: "{{ os_dict.docker_group }}"
    append: true
  register: docker_group_add
  when:
    - ansible_facts['system'] == 'Linux'
    - install_docker | default(false) | bool
    - "'docker' not in unavailable_repositories | default({})"
    - not (docker_engine_missing | default(false) | bool)
    - os_dict.docker_group is defined
  tags: [docker]

# Supplementary groups are stamped onto a login session, not re-read by an already-open shell or by
# a new terminal window opened from the same desktop session, because that new window still inherits
# the desktop session's credentials from hours earlier. Only a full logout, a reboot, or `newgrp
# docker` in the one shell that needs it right now applies the change. Without this message the user
# is left to discover that the hard way: `docker` keeps asking for sudo, and verify_install.yaml's
# own group check re-reads /etc/group rather than the caller's live session, so it reports success
# for the exact state the user experiences as failure.
- name: Report the docker group session requirement
  ansible.builtin.debug:
    msg: "[WARN] {{ non_root_user }} was added to the {{ os_dict.docker_group }} group, but this only takes effect on a new login session. A new terminal window is NOT enough, it still carries the group list from the desktop session you are already in. Either log out and back in (or reboot), or run `newgrp {{ os_dict.docker_group }}` in the one shell you want to use right now."
  when:
    - ansible_facts['system'] == 'Linux'
    - install_docker | default(false) | bool
    - "'docker' not in unavailable_repositories | default({})"
    - not (docker_engine_missing | default(false) | bool)
    - docker_group_add is changed
  tags: [docker]
