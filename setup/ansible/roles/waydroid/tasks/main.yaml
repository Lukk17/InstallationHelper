---
# The script at https://repo.waydro.id downloads the keyring to /usr/share/keyrings/waydroid.gpg,
# writes /etc/apt/sources.list.d/waydroid.list and then runs apt update, read on 2026-10-11. The task
# used to be guarded by creates on the list file, so an attempt that died in apt update was skipped by
# its own retry and reported ok, and a plain apt update exits 0 with only a warning when one host does
# not answer anyway. So the script runs when either file is missing, and a retry runs it again in full
# because a when is decided once before the first attempt. Whether the repository really serves its
# package lists is then asked on their own, through the same check and the same rescue every
# repository block in software_installer uses, with the waydroid entry in vars/Debian.yaml, and the
# block fails unless apt can name a candidate for waydroid. See docs/regression_ledger.md.
- name: Add the Waydroid repository (Debian)
  when: ih_family == 'Debian'
  vars:
    repository_key: waydroid
  block:
    - name: Probe for the Waydroid keyring and sources file (Debian)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: >-
        {{ os_dict.third_party_repositories.waydroid.files
           + os_dict.third_party_repositories.waydroid.keyrings }}
      register: waydroid_repository_probe

    - name: Add Waydroid repository (Debian)
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://repo.waydro.id | bash
      args:
        executable: /bin/bash
      become: yes
      when: waydroid_repository_probe.results | rejectattr('stat.exists') | list | length > 0
      register: waydroid_repo
      until: waydroid_repo is succeeded
      retries: 3
      delay: 10

    - name: Fetch the Waydroid package lists on their own (Debian)
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/roles/software_installer/tasks/debian_repository_check.yaml"
        apply:
          tags: [always]
      tags: [always]

    - name: Ask apt whether the Waydroid repository offers waydroid (Debian)
      ansible.builtin.command:
        argv: [apt-cache, policy, waydroid]
      environment:
        LC_ALL: C
      register: waydroid_candidate
      changed_when: false
      failed_when: >-
        waydroid_candidate.rc != 0
        or 'Candidate:' not in waydroid_candidate.stdout
        or 'Candidate: (none)' in waydroid_candidate.stdout
  rescue:
    - name: Undo, record and name the Waydroid repository that could not be added (Debian)
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/roles/software_installer/tasks/repository_unavailable.yaml"
        apply:
          tags: [always]
      tags: [always]

    - name: Stop the Waydroid role, because its repository could not be added (Debian)
      ansible.builtin.fail:
        msg: >-
          The Waydroid repository could not be added, so Waydroid cannot be installed in this run.
          The step that failed and its message are named above.

- name: Install Waydroid (Debian)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: "{{ os_dict.companion_packages.waydroid }}"
    role_packages_purpose: Waydroid
  when: ih_family == 'Debian'

# From the official extra repository, not the Arch User Repository. waydroid has no AUR entry at all,
# asked of the AUR API on 2026-10-10, and archlinux.org lists it in extra, so going through paru only
# made Waydroid depend on an AUR helper it never needed.
- name: Install Waydroid (Archlinux)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: "{{ os_dict.companion_packages.waydroid }}"
    role_packages_purpose: Waydroid
  when: ih_family == 'Archlinux'

- name: Install Waydroid (Fedora)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: "{{ os_dict.companion_packages.waydroid }}"
    role_packages_purpose: Waydroid
  when: ih_family == 'RedHat'

- name: Stop when waydroid did not install
  ansible.builtin.fail:
    msg: waydroid did not install, so setting up Waydroid cannot continue. What the package manager said is in the [ERROR] line above.
  when: "'waydroid' in (role_packages_missing | default([]))"

- name: Probe for Waydroid data image
  ansible.builtin.stat:
    path: /var/lib/waydroid/images/system.img
  register: waydroid_image
  become: yes

# `{{ ih_timeout }} 1700` inside the shell guards against a stuck network mid-stream
# (waydroid init downloads ~1 GB and otherwise can hang past async window).
- name: Initialise Waydroid system image
  ansible.builtin.shell: |
    set -o pipefail
    {{ ih_timeout }} 1700 waydroid init -s GAPPS </dev/null
  args:
    executable: /bin/bash
  become: yes
  when: not waydroid_image.stat.exists
  async: 1800
  poll: 30
  register: waydroid_init
  changed_when: waydroid_init.rc == 0
  failed_when: waydroid_init.rc != 0

- name: Probe current Waydroid multi-window prop
  ansible.builtin.command: waydroid prop get persist.waydroid.multi_windows
  become: yes
  register: waydroid_mw_current
  changed_when: false
  failed_when: false

- name: Set Waydroid Multi-Windows prop
  ansible.builtin.command: waydroid prop set persist.waydroid.multi_windows true
  become: yes
  when: waydroid_mw_current.stdout | trim != 'true'

- name: Enable and start Waydroid container service
  ansible.builtin.systemd:
    name: waydroid-container
    enabled: yes
    state: started
  become: yes

- name: Download Aurora Store
  ansible.builtin.get_url:
    url: "{{ aurora_store_url }}"
    dest: "{{ non_root_home }}/.lukkInstall/{{ aurora_store_file }}"
    mode: '0644'
    headers:
      User-Agent: Mozilla
    timeout: 60
  become: yes
  become_user: "{{ non_root_user }}"
  register: aurora_store_download
  retries: 3
  delay: 10
  until: aurora_store_download is succeeded

- name: Probe for GDM custom config
  ansible.builtin.stat:
    path: /etc/gdm3/custom.conf
  register: gdm_conf

- name: Configure GDM Wayland Enable
  ansible.builtin.replace:
    path: /etc/gdm3/custom.conf
    regexp: '#WaylandEnable=false'
    replace: 'WaylandEnable=true'
  become: yes
  notify: Restart GDM3
  when: gdm_conf.stat.exists

- name: Configure NVIDIA Wayland memory allocation
  ansible.builtin.lineinfile:
    path: /etc/modprobe.d/nvidia-power-management.conf
    line: "options nvidia NVreg_PreserveVideoMemoryAllocations=1"
    create: yes
    mode: '0644'
    owner: root
    group: root
  become: yes
  notify: Restart GDM3
