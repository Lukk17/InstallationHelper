---
- name: Ensure temporary installation folder exists
  ansible.builtin.file:
    path: "{{ non_root_home }}/.lukkInstall"
    state: directory
    mode: '0755'
    owner: "{{ non_root_user }}"
    group: "{{ ih_non_root_group }}"
  become: yes

# --- Flatpak: Required for flatpak applications ---
- name: Install flatpak (RedHat/Fedora)
  ansible.builtin.dnf:
    name: flatpak
    state: present
  become: yes
  when: ih_family == 'RedHat'

- name: Install flatpak (Debian/Ubuntu)
  ansible.builtin.apt:
    name: flatpak
    state: present
  become: yes
  when: ih_family == 'Debian'

# Arch was missing entirely. flatpak was installed for RedHat and Debian only, while the
# Flathub task below runs on every Linux, so on Arch it shelled out to a binary that was not
# there and failed every run that reached it. Because this role has no rescue, that aborted
# the whole playbook fifteen minutes in with nothing installed. Found by the e2e
# kde-configure-only and live-profile scenarios. See docs/regression_ledger.md.
- name: Install flatpak (Arch)
  community.general.pacman:
    name: flatpak
    state: present
  become: yes
  register: arch_flatpak_install
  retries: 3
  delay: 10
  until: arch_flatpak_install is succeeded
  when: ih_family == 'Archlinux'

# site.yaml runs this role without a rescue, on purpose, because it is the bootstrap
# everything later depends on. The consequence nobody accounted for is that one transient
# network failure here aborts the whole run before a single package is installed. Two of
# three parallel container runs died exactly here, fifteen minutes in, with nothing
# installed, while a third that was running ahead of them got through. The command itself
# is fine and idempotent, proven by running it three times in a clean container, so it was
# contention. A user on flaky wifi loses a forty minute run the same way.
#
# `until` reads the same expression as `failed_when`, so a remote that already exists
# satisfies it on the first attempt and is not retried three times before being accepted.
# failed_when is false on purpose. This role has no rescue, so a task that fails here stops
# the play immediately and nothing after it runs, which is why the first version of the
# explanatory task below never printed anything: it sat after a task that had already
# aborted the play. Capturing the result and deciding in the next task is what makes the
# real error reachable. `until` still retries a genuine network blip.
- name: Add Flathub repository (Linux)
  ansible.builtin.command: flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
  become: yes
  register: flathub_remote_add
  changed_when: false
  failed_when: false
  retries: 3
  delay: 10
  until: >
    flathub_remote_add.rc | default(1) == 0 or
    'already exists' in (flathub_remote_add.stderr | default(''))
  when: ansible_facts['system'] == 'Linux'

# The original failure reported only "Error executing command." with no stderr and no return
# code, so nobody could tell that flatpak simply was not installed. Ansible does not surface
# a command's stderr through failed_when, so state it explicitly.
- name: Fail with the real reason Flathub could not be added
  ansible.builtin.fail:
    msg: >-
      Could not add the Flathub remote after 3 attempts.
      rc={{ flathub_remote_add.rc | default('unknown') }}
      stderr={{ flathub_remote_add.stderr | default('(empty)') | trim }}
      stdout={{ flathub_remote_add.stdout | default('(empty)') | trim }}
      If that says flatpak is not a recognised command then the flatpak install above did not
      run for this distribution. Otherwise Flathub itself was unreachable at
      https://dl.flathub.org/repo/flathub.flatpakrepo, so check name resolution and outbound
      HTTPS. This role has no rescue, so the run stops here.
  when:
    - ansible_facts['system'] == 'Linux'
    - flathub_remote_add is defined
    - not (flathub_remote_add is skipped)
    - flathub_remote_add.rc | default(0) != 0
    - "'already exists' not in (flathub_remote_add.stderr | default(''))"

# apt full-upgrade can run 5 to 10 minutes and trips the 2.19 ansiballz race, so raw bypasses the
# Python module entirely. See the workaround section in AGENTS.md before touching this.
#
# Three defects were fixed here at once, all of them making the task lie about what happened.
#
# The command used to end with `grep ... && echo CHANGED || echo UNCHANGED`, so the shell's exit
# status was an echo's, which is always 0. `failed_when: rc != 0` therefore could not fire and a
# completely failed apt-get full-upgrade reported success. Proven with Ansible in both target
# images: `sh -c "exit 7" | tee log` comes back rc 0, and with `set -o pipefail` it comes back 7.
#
# `2>&1 | tee` also bound to the autoremove alone, because `&&` has lower precedence than the
# pipe, so the full-upgrade's own output never reached the log the next line then grepped.
#
# And the grep read a log opened with `tee -a`, which appends, while the comment above claimed `>`
# truncated it. So from the second run onward the log still held the first run's "Setting up"
# lines and the task reported changed forever, whatever apt actually did. Reading stdout instead
# of a file removes that question entirely rather than fixing the truncation.
- name: Full system upgrade and autoremove (Debian, via raw)
  ansible.builtin.raw: >-
    set -o pipefail;
    {{ apt_raw_env }} apt-get {{ apt_raw_flags }} full-upgrade 2>&1
    | tee -a /var/log/installation-apt-upgrade.log
    && {{ apt_raw_env }} apt-get {{ apt_raw_flags }} autoremove 2>&1
    | tee -a /var/log/installation-apt-upgrade.log
  become: yes
  register: apt_full_upgrade
  changed_when: apt_full_upgrade.stdout | default('') is search('^(Inst |Setting up |Removing )', multiline=True)
  failed_when: apt_full_upgrade.rc | default(0) != 0
  when: ih_family == 'Debian'

# No failed_when on either of these two, and that is the change. Both carried
#
#   failed_when: <registered>.failed | default(false)
#
# which reads like a guard and is not one. It restates the default behaviour when the key is
# present, and when the key is absent the `default(false)` turns whatever happened into a pass. An
# async task can produce exactly that: a result with no `failed` key. The ledger already has an
# entry for the AUR version of this, where a job still running when its wait expired came back with
# no `failed` key at all and fell straight through a collector that required one.
#
# Removing the override lets the module's own failure semantics stand, including the async timeout,
# which is strictly safer than an expression whose only possible effect is to turn a failure into a
# pass.
- name: Full system upgrade (Arch)
  community.general.pacman:
    update_cache: yes
    upgrade: yes
  become: yes
  async: 1800
  poll: 30
  register: pacman_full_upgrade
  when: ih_family == 'Archlinux'

- name: Full system upgrade (Fedora)
  ansible.builtin.dnf:
    name: "*"
    state: latest
  become: yes
  async: 1800
  poll: 30
  register: dnf_full_upgrade
  when: ih_family == 'RedHat'

# git is required by pyenv's bootstrap script (curl pyenv.run | bash) and
# by several other SDK installers. Minimal Ubuntu/Debian VMs don't ship it.
- name: Install unzip, zip and git (Arch)
  community.general.pacman:
    name:
      - unzip
      - zip
      - git
    state: present
  become: yes
  when: ih_family == 'Archlinux'

- name: Install unzip, zip and git (Debian)
  ansible.builtin.apt:
    name:
      - unzip
      - zip
      - git
    state: present
  become: yes
  when: ih_family == 'Debian'

- name: Install unzip, zip, patch and git (Fedora)
  ansible.builtin.dnf:
    name:
      - unzip
      - zip
      - patch
      - git
    state: present
  become: yes
  when: ih_family == 'RedHat'
