---
# --- Cross-distro settings ---

- name: Mount /tmp in RAM
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "tmpfs /tmp tmpfs mode=0777 0 0"
    state: present
  become: yes
  when: setup_tmpfs | bool

- name: Setup local time RTC (dual-boot Windows fix)
  ansible.builtin.command: timedatectl set-local-rtc 1 --adjust-system-clock
  become: yes
  changed_when: false

# --- Locale: Debian ---

- name: Generate PL locale (Debian)
  community.general.locale_gen:
    name: pl_PL.UTF-8
    state: present
  become: yes
  when: ansible_os_family == 'Debian'

- name: Set EN locale as default (Debian)
  ansible.builtin.command: update-locale LANG=en_US.UTF-8
  become: yes
  changed_when: false
  when: ansible_os_family == 'Debian'

- name: Install Polish language packs (Debian)
  ansible.builtin.apt:
    name:
      - language-pack-pl
      - language-pack-gnome-pl
      - language-pack-pl-base
    state: present
  become: yes
  when: ansible_os_family == 'Debian'

# --- Locale: Arch ---

- name: Enable pl_PL.UTF-8 locale (Arch)
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    line: "pl_PL.UTF-8 UTF-8"
    state: present
  become: yes
  when: ansible_os_family == 'Archlinux'

- name: Generate locales (Arch)
  ansible.builtin.command: locale-gen
  become: yes
  changed_when: false
  when: ansible_os_family == 'Archlinux'

- name: Set EN locale as default (Arch)
  ansible.builtin.lineinfile:
    path: /etc/locale.conf
    line: "LANG=en_US.UTF-8"
    create: yes
    state: present
  become: yes
  when: ansible_os_family == 'Archlinux'

# --- Locale: Fedora ---

- name: Set EN locale as default (Fedora)
  ansible.builtin.command: localectl set-locale LANG=en_US.UTF-8
  become: yes
  changed_when: false
  when: ansible_os_family == 'RedHat'

- name: Install Polish locale support (Fedora)
  ansible.builtin.dnf:
    name: glibc-langpack-pl
    state: present
  become: yes
  when: ansible_os_family == 'RedHat'