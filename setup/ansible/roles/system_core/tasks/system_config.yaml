---
# --- Cross-distro settings ---

- name: Mount /tmp in RAM
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^tmpfs\s+/tmp\s+tmpfs'
    line: "tmpfs /tmp tmpfs mode=0777 0 0"
    state: present
  become: yes
  when: setup_tmpfs | bool

- name: Setup UTC time RTC (Linux only)
  community.general.timezone:
    hwclock: UTC
  become: yes
  when: ansible_facts['system'] == 'Linux'

# --- Locale: Debian ---

# locale_gen needs /etc/locale.gen and /var/lib/locales/supported.d, and both come from the
# `locales` package, which base_utils.yaml installs with the rest of this role's packages before any task
# here runs.
- name: Generate PL locale (Debian)
  community.general.locale_gen:
    name: pl_PL.UTF-8
    state: present
  become: yes
  when: ih_family == 'Debian'

- name: Set EN locale as default (Debian)
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: '^LANG='
    line: "LANG=en_US.UTF-8"
    create: true
  become: yes
  when: ih_family == 'Debian'

# One package per call through tasks/install_role_packages.yaml, so one that cannot install costs only
# itself and is named.
- name: Install Polish language packs (Ubuntu)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages:
      - language-pack-pl
      - language-pack-gnome-pl
      - language-pack-pl-base
    role_packages_purpose: the Polish language packs
  when: ih_family == 'Debian' and ih_base == 'ubuntu'

# The Debian-only Polish task package, which Ubuntu covers with language packs instead. Fedora's
# glibc-langpack-pl is installed in base_utils.yaml with the rest of this role's packages.
- name: Install Polish locale support (Debian)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: [task-polish]
    role_packages_purpose: Polish locale support
  when: ih_family == 'Debian' and ih_base != 'ubuntu'

# --- Locale: Arch ---

- name: Enable pl_PL.UTF-8 locale (Arch)
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    line: "pl_PL.UTF-8 UTF-8"
    state: present
  become: yes
  when: ih_family == 'Archlinux'

- name: Generate locales (Arch)
  community.general.locale_gen:
    name: pl_PL.UTF-8
    state: present
  become: yes
  when: ih_family == 'Archlinux'

- name: Set EN locale as default (Arch)
  ansible.builtin.lineinfile:
    path: /etc/locale.conf
    regexp: '^LANG='
    line: "LANG=en_US.UTF-8"
    create: yes
    state: present
  become: yes
  when: ih_family == 'Archlinux'

# --- Locale: Fedora ---

- name: Set EN locale as default (Fedora)
  ansible.builtin.lineinfile:
    path: /etc/locale.conf
    regexp: '^LANG='
    line: "LANG=en_US.UTF-8"
    create: true
  become: yes
  when: ih_family == 'RedHat'
