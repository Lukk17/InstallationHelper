---
# --- Cross-distro settings ---

- name: Mount /tmp in RAM
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^tmpfs\s+/tmp\s+tmpfs'
    line: "tmpfs /tmp tmpfs mode=0777 0 0"
    state: present
  become: yes
  when: setup_tmpfs | bool

- name: Setup UTC time RTC (Linux only)
  community.general.timezone:
    hwclock: UTC
  become: yes
  when: ansible_facts['system'] == 'Linux'

# --- Locale: Debian ---

# locale_gen needs /etc/locale.gen and /var/lib/locales/supported.d, and both come from the
# `locales` package. This used to be installed further down this file, after the generate task
# that needs it, and only on Debian: the Ubuntu branch installs language packs and never
# installed `locales` at all. A desktop install has the package already, which is why nothing
# noticed, but a minimal install does not, and neither does a container. The result was
# "Is the package locales installed?" two minutes into every Debian and Ubuntu run, in
# system_core, which is early enough that nothing at all got installed afterwards. Found by the
# first e2e smoke run on debian:trixie and ubuntu:26.04. See docs/regression_ledger.md.
- name: Install locale support (Debian family)
  ansible.builtin.apt:
    name: locales
    state: present
    update_cache: true
  become: yes
  when: ih_family == 'Debian'

- name: Generate PL locale (Debian)
  community.general.locale_gen:
    name: pl_PL.UTF-8
    state: present
  become: yes
  when: ih_family == 'Debian'

- name: Set EN locale as default (Debian)
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: '^LANG='
    line: "LANG=en_US.UTF-8"
    create: true
  become: yes
  when: ih_family == 'Debian'

- name: Install Polish language packs (Ubuntu)
  ansible.builtin.apt:
    name:
      - language-pack-pl
      - language-pack-gnome-pl
      - language-pack-pl-base
    state: present
  become: yes
  when: ih_family == 'Debian' and ih_base == 'ubuntu'

# `locales` moved to the top of this block, before the task that needs it. What is left here is
# the Debian-only Polish task package, which Ubuntu covers with language packs instead.
- name: Install Polish locale support (Debian)
  ansible.builtin.apt:
    name: task-polish
    state: present
  become: yes
  when: ih_family == 'Debian' and ih_base != 'ubuntu'

# --- Locale: Arch ---

- name: Enable pl_PL.UTF-8 locale (Arch)
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    line: "pl_PL.UTF-8 UTF-8"
    state: present
  become: yes
  when: ih_family == 'Archlinux'

- name: Generate locales (Arch)
  community.general.locale_gen:
    name: pl_PL.UTF-8
    state: present
  become: yes
  when: ih_family == 'Archlinux'

- name: Set EN locale as default (Arch)
  ansible.builtin.lineinfile:
    path: /etc/locale.conf
    regexp: '^LANG='
    line: "LANG=en_US.UTF-8"
    create: yes
    state: present
  become: yes
  when: ih_family == 'Archlinux'

# --- Locale: Fedora ---

- name: Set EN locale as default (Fedora)
  ansible.builtin.lineinfile:
    path: /etc/locale.conf
    regexp: '^LANG='
    line: "LANG=en_US.UTF-8"
    create: true
  become: yes
  when: ih_family == 'RedHat'

- name: Install Polish locale support (Fedora)
  ansible.builtin.dnf:
    name: glibc-langpack-pl
    state: present
  become: yes
  when: ih_family == 'RedHat'
