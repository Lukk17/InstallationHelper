---
- name: Create Android SDK directory
  ansible.builtin.file:
    path: "{{ android_home }}/cmdline-tools"
    state: directory
    mode: '0755'

- name: Check if Android cmdline-tools are already installed
  ansible.builtin.stat:
    path: "{{ android_home }}/cmdline-tools/latest"
  register: cmdline_tools_stat

- name: Download Android Command Line Tools (Linux)
  ansible.builtin.get_url:
    url: "https://dl.google.com/android/repository/commandlinetools-linux-{{ android_cmdline_tools_build }}_latest.zip"
    dest: "/tmp/cmdline-tools.zip"
    mode: '0644'
  when:
    - ansible_facts['os_family'] not in ['Windows', 'Darwin']
    - not cmdline_tools_stat.stat.exists

- name: Download Android Command Line Tools (macOS)
  ansible.builtin.get_url:
    url: "https://dl.google.com/android/repository/commandlinetools-mac-{{ android_cmdline_tools_build }}_latest.zip"
    dest: "/tmp/cmdline-tools.zip"
    mode: '0644'
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - not cmdline_tools_stat.stat.exists

- name: Extract Android Command Line Tools
  ansible.builtin.unarchive:
    src: "/tmp/cmdline-tools.zip"
    dest: "{{ android_home }}/cmdline-tools"
    remote_src: yes
  when: not cmdline_tools_stat.stat.exists

- name: Rename extracted cmdline-tools to stable layout
  ansible.builtin.command: >
    mv {{ android_home }}/cmdline-tools/cmdline-tools {{ android_home }}/cmdline-tools/latest
  args:
    creates: "{{ android_home }}/cmdline-tools/latest"
  when: not cmdline_tools_stat.stat.exists

# sdkmanager needs Java to run. We use SDKMAN's `current` Java symlink.
# Under `--tags android` alone, the SDKMAN task (tagged `[sdkman]`) doesn't
# fire — probe the symlink first and surface a clear error if missing.
- name: Probe SDKMAN Java installation
  ansible.builtin.stat:
    path: "{{ non_root_home }}/.sdkman/candidates/java/current/bin/java"
  register: sdkman_java_stat

- name: Warn if SDKMAN Java is missing — skip Android SDK install
  ansible.builtin.debug:
    msg: "[WARN] Skipping Android SDK install — SDKMAN Java not found at {{ non_root_home }}/.sdkman/candidates/java/current. Run with --tags sdkman,android to install Java first."
  when: not sdkman_java_stat.stat.exists

- name: Accept Android SDK licenses
  ansible.builtin.shell: |
    set -o pipefail
    export JAVA_HOME="{{ non_root_home }}/.sdkman/candidates/java/current"
    export PATH="$JAVA_HOME/bin:$PATH"
    timeout 300 bash -c 'yes 2>/dev/null | {{ android_home }}/cmdline-tools/latest/bin/sdkmanager --licenses' || true
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: sdk_licenses
  changed_when: "'All SDK package licenses accepted' in (sdk_licenses.stdout | default(''))"
  failed_when: >
    'All SDK package licenses accepted' not in (sdk_licenses.stdout | default('')) and
    sdk_licenses.rc | default(0) != 0
  when: sdkman_java_stat.stat.exists

# sdkmanager downloads several hundred MB of platforms + build-tools.
# async+poll dodges the 2.19 ansiballz race on the long-running call.
- name: Install Android Platform and Build Tools
  ansible.builtin.shell: |
    set -o pipefail
    export JAVA_HOME="{{ non_root_home }}/.sdkman/candidates/java/current"
    export PATH="$JAVA_HOME/bin:$PATH"
    timeout 1500 {{ android_home }}/cmdline-tools/latest/bin/sdkmanager \
      "platforms;android-{{ android_api_level }}" \
      "build-tools;{{ android_build_tools_version }}" \
      "platform-tools" </dev/null
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: sdk_install
  async: 1800
  poll: 30
  changed_when: "'done' in (sdk_install.stdout | default(''))"
  failed_when:
    - sdk_install.rc is defined
    - sdk_install.rc != 0
  when: sdkman_java_stat.stat.exists

