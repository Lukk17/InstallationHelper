---
- name: Create Android SDK directory
  ansible.builtin.file:
    path: "{{ android_home }}/cmdline-tools"
    state: directory
    mode: '0755'

- name: Check if Android cmdline-tools are already installed
  ansible.builtin.stat:
    path: "{{ android_home }}/cmdline-tools/latest"
  register: cmdline_tools_stat

- name: Download Android Command Line Tools (Linux)
  ansible.builtin.get_url:
    url: "https://dl.google.com/android/repository/commandlinetools-linux-{{ android_cmdline_tools_build }}_latest.zip"
    dest: "/tmp/cmdline-tools.zip"
    mode: '0644'
  when:
    - ih_family not in ['Windows', 'Darwin']
    - not cmdline_tools_stat.stat.exists
  register: cmdline_tools_linux_download
  retries: 3
  delay: 10
  until: cmdline_tools_linux_download is succeeded

- name: Download Android Command Line Tools (macOS)
  ansible.builtin.get_url:
    url: "https://dl.google.com/android/repository/commandlinetools-mac-{{ android_cmdline_tools_build }}_latest.zip"
    dest: "/tmp/cmdline-tools.zip"
    mode: '0644'
  when:
    - ih_family == 'Darwin'
    - not cmdline_tools_stat.stat.exists
  register: cmdline_tools_macos_download
  retries: 3
  delay: 10
  until: cmdline_tools_macos_download is succeeded

- name: Extract Android Command Line Tools
  ansible.builtin.unarchive:
    src: "/tmp/cmdline-tools.zip"
    dest: "{{ android_home }}/cmdline-tools"
    remote_src: yes
  when: not cmdline_tools_stat.stat.exists

- name: Rename extracted cmdline-tools to stable layout
  ansible.builtin.command: >
    mv {{ android_home }}/cmdline-tools/cmdline-tools {{ android_home }}/cmdline-tools/latest
  args:
    creates: "{{ android_home }}/cmdline-tools/latest"
  when: not cmdline_tools_stat.stat.exists

# sdkmanager needs Java to run. We use SDKMAN's `current` Java symlink.
# Under `--tags android` alone, the SDKMAN task (tagged `[sdkman]`) doesn't
# fire — probe the symlink first and surface a clear error if missing.
- name: Probe SDKMAN Java installation
  ansible.builtin.stat:
    path: "{{ non_root_home }}/.sdkman/candidates/java/current/bin/java"
  register: sdkman_java_stat

# Without that symlink sdkmanager cannot run at all, so both tasks below skip and the Android SDK is
# not installed: no platforms, no build-tools, no platform-tools. The cmdline-tools zip is unpacked by
# the tasks above, which makes the outcome worse than a clean skip, because {{ android_home }} then
# looks populated to anything checking casually. This used to be a debug message and nothing else,
# which meant an exit code of zero and no summary entry for a whole SDK the user asked for.
- name: Report that the Android SDK could not be installed without SDKMAN Java
  ansible.builtin.debug:
    msg: >-
      [ERROR] The Android SDK was NOT installed. SDKMAN Java is absent from
      {{ non_root_home }}/.sdkman/candidates/java/current and sdkmanager cannot run without a JDK, so
      no platform, build-tools or platform-tools package was fetched. Either install_java is false, or
      the SDKMAN install failed earlier in this run and named itself there. Rerun with
      --tags sdkman,android once that is fixed.
  when: not sdkman_java_stat.stat.exists

- name: Record the missing Android SDK in the play summary
  ansible.builtin.set_fact:
    any_role_failed: true
  when: not sdkman_java_stat.stat.exists

# sdkmanager records an accepted licence as a file under {{ android_home }}/licenses, one per
# licence, and `creates` cannot express that: the set is not fixed. Google adds licence types over
# time, this build of the command line tools asks for seven, and keying the guard on any one of them
# would permanently skip a machine that has six of the seven, which is the state a killed run or a
# newly added licence type leaves behind. Verified by deleting one of the seven files and asking
# again, below.
#
# So ask sdkmanager instead. With stdin closed it prints the state and accepts nothing, proven in a
# debian:trixie container with the pinned command line tools: on a machine with no licences at all
# it printed "7 of 7 SDK package licenses not accepted." and left no licences directory behind, with
# six of seven it printed "1 of 7 SDK package license not accepted." and again wrote nothing, and
# with all seven accepted it printed "All SDK package licenses accepted." That last string is the
# gate below.
#
# It costs a repository fetch, roughly a minute, which is the same fetch the accept run makes. That
# is the price of an answer that is right in the half accepted case.
- name: Ask sdkmanager which SDK licenses are already accepted
  ansible.builtin.shell: |
    set -o pipefail
    export JAVA_HOME="{{ non_root_home }}/.sdkman/candidates/java/current"
    export PATH="$JAVA_HOME/bin:$PATH"
    {{ ih_timeout }} 300 {{ android_home }}/cmdline-tools/latest/bin/sdkmanager --licenses </dev/null
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: sdk_license_state
  changed_when: false
  failed_when: false
  when: sdkman_java_stat.stat.exists

# The answers come from a file rather than from `yes |`. A pipe from `yes` is killed by SIGPIPE the
# moment sdkmanager exits, and with `set -o pipefail` the pipeline then reports 141 whatever
# sdkmanager did, which is what the trailing `|| true` on the old version of this task was there to
# swallow. It swallowed sdkmanager's own status with it, so the failed_when beside it could never
# fire. Reading from a file leaves rc meaning what it says. Seven licences plus the review prompt
# need eight answers today, and 200 is the headroom for a build of the tools that asks for more.
- name: Accept Android SDK licenses
  ansible.builtin.shell: |
    set -o pipefail
    export JAVA_HOME="{{ non_root_home }}/.sdkman/candidates/java/current"
    export PATH="$JAVA_HOME/bin:$PATH"
    answers="$(mktemp)"
    trap 'rm -f "$answers"' EXIT
    for _ in $(seq 200); do echo y; done > "$answers"
    {{ ih_timeout }} 300 {{ android_home }}/cmdline-tools/latest/bin/sdkmanager --licenses < "$answers"
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: sdk_licenses
  # Reaching this task means licences were missing, so the change report is the default one. The
  # failure test is the post-condition: sdkmanager prints this line at the end of a run that
  # accepted everything, and its absence means some licence is still outstanding and the platform
  # install below will fail on it.
  failed_when: >-
    sdk_licenses.rc != 0 or
    'All SDK package licenses accepted' not in (sdk_licenses.stdout | default(''))
  when:
    - sdkman_java_stat.stat.exists
    - "'All SDK package licenses accepted' not in (sdk_license_state.stdout | default(''))"

# sdkmanager downloads several hundred MB of platforms + build-tools.
# async+poll dodges the 2.19 ansiballz race on the long-running call.
# One package per call, so one failed download names its package and loses nothing else. sdkmanager
# keeps no package index to refresh, so it follows the rule for a manager without one: three retries
# after the first attempt, twenty seconds apart, through until. until is evaluated on the polled
# result: measured in python:3.13-slim with ansible-core 2.19.4, 2.20.1, 2.20.7 and 2.21.5, a looped
# async task with poll 1 and until on rc retried each item and registered the last attempt's rc.
- name: Install Android Platform and Build Tools, one package per call
  ansible.builtin.shell: |
    set -o pipefail
    export JAVA_HOME="{{ non_root_home }}/.sdkman/candidates/java/current"
    export PATH="$JAVA_HOME/bin:$PATH"
    {{ ih_timeout }} 1500 {{ android_home }}/cmdline-tools/latest/bin/sdkmanager {{ item | quote }} </dev/null
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  loop:
    - "platforms;android-{{ android_api_level }}"
    - "build-tools;{{ android_build_tools_version }}"
    - "platform-tools"
  register: sdk_install
  async: 1800
  poll: 30
  until: sdk_install.rc | default(1) == 0
  retries: 3
  delay: 20
  changed_when:
    - sdk_install.rc | default(1) == 0
    - "'done' in (sdk_install.stdout | default(''))"
  failed_when: false
  when: sdkman_java_stat.stat.exists

- name: Name the Android SDK packages that did not install
  ansible.builtin.set_fact:
    sdk_install_failures: >-
      {{ (sdk_install.results | default([]))
         | rejectattr('skipped', 'defined')
         | rejectattr('rc', 'defined')
         | list
         + ((sdk_install.results | default([]))
            | selectattr('rc', 'defined')
            | rejectattr('rc', 'equalto', 0)
            | list) }}
  when: sdkman_java_stat.stat.exists

- name: Report every Android SDK package that did not install, and what sdkmanager said
  ansible.builtin.debug:
    msg: >-
      [ERROR] {{ sdk_install_failures | map(attribute='item') | join(', ') }}, from the Android SDK,
      did not install with sdkmanager after 4 attempts and
      {{ 'is' if sdk_install_failures | length == 1 else 'are' }} NOT present. Every other SDK package
      was installed on its own call.
      {% for entry in sdk_install_failures %}
      {{ entry.item }}: {{ (((entry.stderr | default('')).splitlines() + (entry.stdout | default('')).splitlines() + ([] if entry.rc is defined else [entry.msg | default('')])) | map('trim') | select | list)[-4:] | join(' ') | truncate(400) }}
      {% endfor %}
  when:
    - sdkman_java_stat.stat.exists
    - sdk_install_failures | length > 0

- name: Record the Android SDK packages that did not install in the play summary
  ansible.builtin.set_fact:
    any_role_failed: true
    not_installed_with_reason: >-
      {{ (not_installed_with_reason | default([]))
         + (sdk_install_failures
            | map(attribute='item')
            | map('regex_replace', '$', ' (Android SDK, sdkmanager could not install it in 4 attempts)')
            | list) }}
  when:
    - sdkman_java_stat.stat.exists
    - sdk_install_failures | length > 0
