---
# The vendor installer copies bin/sdkman-init.sh in its first archive step and writes var/version
# only after the second, native archive is in place, so var/version is the mark of a finished
# install. Guarding on sdkman-init.sh let a first attempt that failed between those two steps be
# skipped by its own retry and reported ok, which is what CachyOS GNOME full hit in sweep
# 38107292439. The installer itself exits 0 without doing anything once sdkman-init.sh exists, so a
# half-finished directory is completed with `sdk selfupdate force`, SDKMAN's own repair, which keeps
# every installed candidate. See docs/regression_ledger.md.
- name: Install SDKMAN, or complete a half-finished install (Linux/Mac)
  ansible.builtin.shell: |
    set -o pipefail
    export SDKMAN_DIR="{{ non_root_home }}/.sdkman"
    if [ -f "$SDKMAN_DIR/bin/sdkman-init.sh" ]; then
      bash -c 'source "$SDKMAN_DIR/bin/sdkman-init.sh" && sdk selfupdate force'
    else
      curl -fsSL --max-time 120 "https://get.sdkman.io" | bash
    fi
    [ -f "$SDKMAN_DIR/var/version" ] && [ -f "$SDKMAN_DIR/var/version_native" ]
  args:
    creates: "{{ non_root_home }}/.sdkman/var/version"
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: sdkman_bootstrap
  retries: 3
  delay: 10
  until: sdkman_bootstrap is succeeded

# The vendor installer writes its init snippet into .bashrc and .zshrc only on the one run that
# reaches its last step, so a machine where that run never finished, or where a later copy replaced
# .zshrc, has SDKMAN on disk and `sdk` unreachable. Same reasoning and same file as the NVM block in
# nvm_unix.yaml.
- name: Ensure the project's own environment file directory exists (Linux/Mac)
  ansible.builtin.file:
    path: "{{ non_root_home }}/apps_config"
    state: directory
    owner: "{{ non_root_user }}"
    group: "{{ ih_non_root_group }}"
    mode: '0755'
  become: yes

- name: Ensure SDKMAN shell init is present in the project's environment file (Linux/Mac)
  ansible.builtin.blockinfile:
    path: "{{ non_root_home }}/apps_config/env.sh"
    marker: "# {mark} ANSIBLE SDKMAN SHELL INIT"
    create: yes
    block: |
      export SDKMAN_DIR="$HOME/.sdkman"
      [ -s "$SDKMAN_DIR/bin/sdkman-init.sh" ] && . "$SDKMAN_DIR/bin/sdkman-init.sh"
  become: yes
  become_user: "{{ non_root_user }}"

# SDKMAN's `sdk install` writes to shared state files (~/.sdkman/etc/config,
# ~/.sdkman/var/, the installed-candidates registry under candidates/) without
# locking. Concurrent installs of different versions of the same candidate
# (Java) race and leave the registry incoherent — the on-disk extract under
# ~/.sdkman/candidates/java/X.Y-tem/ may succeed but `sdk default java X.Y-tem`
# still reports "is not installed on your system". Stay serial. `sdk` is a
# shell function so the timeout wrapper uses bash -c to find it.
- name: Install all Java Temurin versions via SDKMAN (Linux/Mac)
  ansible.builtin.shell: |
    set -o pipefail
    {{ ih_timeout }} 900 bash -c 'source {{ non_root_home }}/.sdkman/bin/sdkman-init.sh && sdk install java {{ item }} <<<"n"'
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  loop:
    - "{{ java11_id }}"
    - "{{ java17_id }}"
    - "{{ java21_id }}"
    - "{{ java25_id }}"
  loop_control:
    label: "{{ item }}"
  register: sdk_java_install
  async: 1200
  poll: 30
  # Adoptium CDN occasionally flakes mid-download ("Download has failed,
  # aborting!"). 2 retries with 30s delay absorbs the transient case.
  retries: 2
  delay: 30
  until: sdk_java_install is succeeded
  changed_when: "'is already installed' not in (sdk_java_install.stdout | default(''))"
  failed_when: >
    sdk_java_install.rc | default(0) != 0 and
    'is already installed' not in (sdk_java_install.stdout | default('')) and
    'is already installed' not in (sdk_java_install.stderr | default(''))

# Gradle only where the OS cannot supply a usable one. Arch and macOS both package
# a current Gradle, so they get it from the software_installer instead and this task
# skips. The condition reads the os_dict mapping rather than naming distributions, so
# adding a native gradle entry to a vars file is all it takes to switch a family over.
# Before this existed, Debian and Fedora had install_gradle: true, no mapping, and a
# comment claiming SDKMAN handled it, so Gradle was simply never installed on either.
# See docs/regression_ledger.md.
- name: Install Gradle via SDKMAN where the OS has no native package (Linux/Mac)
  ansible.builtin.shell: |
    set -o pipefail
    {{ ih_timeout }} 600 bash -c 'source {{ non_root_home }}/.sdkman/bin/sdkman-init.sh && sdk install gradle {{ gradle_id }} <<<"n"'
  args:
    executable: /bin/bash
    creates: "{{ non_root_home }}/.sdkman/candidates/gradle/{{ gradle_id }}"
  become: yes
  become_user: "{{ non_root_user }}"
  register: sdk_gradle_install
  retries: 2
  delay: 30
  until: sdk_gradle_install is succeeded
  failed_when: >
    sdk_gradle_install.rc | default(0) != 0 and
    'is already installed' not in (sdk_gradle_install.stdout | default('')) and
    'is already installed' not in (sdk_gradle_install.stderr | default(''))
  when:
    - install_gradle | default(false) | bool
    - os_dict.software_mapping.gradle is not defined

- name: Set default Java via SDKMAN (Linux/Mac)
  ansible.builtin.shell: |
    set -o pipefail
    source {{ non_root_home }}/.sdkman/bin/sdkman-init.sh && sdk default java {{ default_java }}
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: sdk_java_default
  changed_when: "'Default java set to' in sdk_java_default.stdout"
