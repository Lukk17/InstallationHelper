---
# One package per call through tasks/install_role_packages.yaml, for all three families, so one that
# cannot install costs only itself and is named. The list is install_python's companion_packages entry
# in vars/<OS>.yaml, which setup/ansible/verify_install.yaml reads too, and the reason for each name that
# changed with a distribution release is written beside it there.
#
# On Arch zlib is deliberately not in that list. Every Arch-family system already has a provider of it,
# and on CachyOS that provider is zlib-ng-compat, which declares `Conflicts With: zlib`. Naming the real
# package as an explicit target therefore asks pacman to replace the one that is installed, and with
# --noconfirm it cannot answer its own question and the whole task fails with "unresolvable package
# conflicts detected". Measured on the CachyOS image on 2026-08-21: with zlib in the list the install
# exits 1, without it the install exits 0 and /usr/include/zlib.h is still there, from
# zlib-ng-compat, so python-build has the headers it needs either way.
- name: Install Pyenv build dependencies
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: "{{ os_dict.companion_packages.python }}"
    role_packages_purpose: the Pyenv build dependencies
  when: ih_family in ['Debian', 'RedHat', 'Archlinux']

# pyenv-installer, which pyenv.run hands to bash, clones pyenv into ~/.pyenv first and then
# pyenv-doctor, pyenv-update and pyenv-virtualenv into its plugins directory, under set -e. Guarding
# on ~/.pyenv/bin/pyenv, which the first of those four clones writes, let an attempt that died on a
# later clone be skipped by its own retry and reported ok, the shape SDKMAN had in sweep 38107292439.
# The guard is now the command the last clone writes. The vendor installer refuses to run at all once
# ~/.pyenv exists, so a half-finished install is completed here instead, one missing checkout at a
# time from sdk_manager_pyenv_components, and ~/.pyenv/versions, which pyenv's own .gitignore leaves
# out, is never touched. The task fails unless all four commands exist, so a retry really retries.
# See docs/regression_ledger.md.
- name: Install Pyenv, or complete a half-finished install (Linux/Mac)
  ansible.builtin.shell: |
    set -eo pipefail
    export PYENV_ROOT="{{ non_root_home }}/.pyenv"
    complete_checkout() {
      local directory="$PYENV_ROOT/$2"
      [ -x "$directory/bin/$3" ] && return 0
      mkdir -p "$directory"
      git -C "$directory" init -q
      git -C "$directory" remote add origin "$1" 2>/dev/null || git -C "$directory" remote set-url origin "$1"
      git -C "$directory" fetch -q --depth 1 origin master
      git -C "$directory" -c advice.detachedHead=false -c core.autocrlf=false -c core.symlinks=true checkout -q -f -B master FETCH_HEAD
      git -C "$directory" branch -q --set-upstream-to=origin/master master
      git -C "$directory" config core.symlinks true
    }
    if [ -d "$PYENV_ROOT" ]; then
    {% for component in sdk_manager_pyenv_components %}
      complete_checkout {{ component.repository | quote }} {{ component.directory | quote }} {{ component.command | quote }}
    {% endfor %}
    else
      curl -fsSL --max-time 120 {{ sdk_manager_pyenv_installer_url | quote }} | bash
    fi
    {% for component in sdk_manager_pyenv_components %}
    [ -x "$PYENV_ROOT/{{ component.directory }}/bin/{{ component.command }}" ]
    {% endfor %}
  args:
    creates: "{{ non_root_home }}/.pyenv/plugins/pyenv-virtualenv/bin/pyenv-virtualenv"
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: pyenv_bootstrap
  retries: 3
  delay: 10
  until: pyenv_bootstrap is succeeded

# pyenv.run prints the snippet a shell needs and writes it nowhere, so the project writes it. The
# static half, PYENV_ROOT and the directory holding the pyenv command, goes in the environment file
# every shell and the desktop session read. `pyenv init -` defines a shell function and puts the shims
# on PATH, so it goes in each interactive rc file, in the dialect of the shell that reads that file,
# because `pyenv init - bash` and `pyenv init - zsh` are pyenv's own two answers. The shims stay out
# of the desktop session: the pyenv global is `system` on Linux, see "Choose the pyenv global
# version" below, so a desktop application gets the same python either way.
- name: Ensure PYENV_ROOT is in the project's environment file (Linux/Mac)
  ansible.builtin.blockinfile:
    path: "{{ dev_env_file }}"
    marker: "# {mark} ANSIBLE PYENV ENVIRONMENT"
    create: yes
    mode: '0644'
    block: |
      PYENV_ROOT=${HOME}/.pyenv
      PATH=${HOME}/.pyenv/bin:${PATH}
  become: yes
  become_user: "{{ non_root_user }}"

- name: Persist Pyenv shell init into every interactive rc file (Linux/Mac)
  ansible.builtin.blockinfile:
    path: "{{ item.path }}"
    marker: "# {mark} ANSIBLE PYENV SHELL INIT"
    create: yes
    mode: '0644'
    block: |
      command -v pyenv >/dev/null 2>&1 && eval "$(pyenv init - {{ item.shell }})"
  loop: "{{ interactive_rc_files }}"
  loop_control:
    label: "{{ item.path }}"
  become: yes
  become_user: "{{ non_root_user }}"

# Fire all 4 Python builds in parallel (poll: 0). Each compiles from source
# in ~5–10 min — serial is 20–40 min, parallel is bound by CPU contention
# on a 4-core box (≈15–20 min). async_status collects results afterwards.
# Three attempts inside the job, because the retries keyword cannot reach an async task launched
# with poll: 0: retrying that would mean relaunching it, and the collector below has no way to do
# so. The all-software cell on Debian lost Python 3.12.13 to a TLS connect error from python.org on
# 2026-08-21, reported by curl as code 35, unexpected eof while reading, and that was after
# python-build had already retried once itself. One interrupted download failed a run that had
# otherwise installed everything. --skip-existing makes a repeat attempt free when an earlier one
# got there, so the only cost of this loop is on the path where the alternative was failing.
#
# This prose lives here, above the task, rather than inside the shell body, and that is not a style
# preference. Ansible runs split_args over a free-form module argument before anything executes, it
# counts quotes across the whole string including comment lines, and three apostrophes in three
# words ending in s broke every Linux run at parse time with "failed at splitting arguments". A
# comment inside a shell body is not inert.
- name: Fire all Python builds via Pyenv (parallel)
  ansible.builtin.shell: |
    set -o pipefail
    export PYENV_ROOT="{{ non_root_home }}/.pyenv"
    export PATH="$PYENV_ROOT/bin:$PATH"
    for attempt in 1 2 3; do
        if {{ ih_timeout }} 1500 pyenv install --skip-existing {{ item }} </dev/null; then
            exit 0
        fi
        echo "pyenv install {{ item }} attempt ${attempt} of 3 failed" >&2
        sleep 20
    done
    exit 1
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  loop:
    - "{{ python310_id }}"
    - "{{ python311_id }}"
    - "{{ python312_id }}"
    - "{{ python313_id }}"
  loop_control:
    label: "{{ item }}"
  # 4800 rather than 1800 because of the retry loop above, whose arithmetic the old budget did not
  # cover: three attempts at a 1500 second ceiling each, plus two 20 second waits, is 4540 seconds,
  # and async is a hard kill. At 1800 an attempt that ran to its own timeout left 300 seconds for
  # the two after it, so the loop could only ever help against a fast failure like a dropped TLS
  # handshake, and a genuinely slow build was killed halfway through attempt two with no message
  # saying so. The four builds run concurrently, so this is a ceiling on the worst case rather than
  # a cost anybody pays.
  async: 4800
  poll: 0
  register: pyenv_jobs
  changed_when: false

# Waiting is not itself a change, so this task reports one only when the job it collected actually
# built something. It needs no guard: `pyenv install --skip-existing` is already the guard, and the
# fire task above is what would have to be gated if it were not.
#
# The old condition tested for "already installed" and "already exists" in stderr and could never be
# true. Measured against pyenv 2.8.4 in a debian:trixie container: `pyenv install --skip-existing`
# on a version whose prefix already carries a bin directory exits 0 having written nothing at all,
# zero bytes on both streams, because pyenv-install `continue`s before python-build ever runs.
# "already exists" is what pyenv prints without --skip-existing, which is not how this task runs. So
# every rerun reported four changes it had not made.
#
# python-build writes "Installed Python-<version> to <prefix>" to stderr, and only after a build has
# succeeded, so that string is the evidence a build really happened. A build that ran and failed
# prints "Installing Python-<version>..." and never the past tense, and is reported by failed_when
# rather than as a change, which is right: a failed build leaves nothing usable behind.
#
# The half-built case belongs to pyenv rather than to this file. --skip-existing skips on
# ${PREFIX}/bin, not on the prefix itself, so an interrupted build that left ~/.pyenv/versions/X.Y.Z
# with no bin directory is rebuilt from scratch and reports the change, confirmed in the same
# container.
- name: Wait for parallel Pyenv Python builds to finish
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ pyenv_jobs.results }}"
  loop_control:
    label: "{{ item.item }}"
  become: yes
  become_user: "{{ non_root_user }}"
  register: pyenv_install
  until: pyenv_install.finished
  # 170 at 30 seconds is 85 minutes, which has to outlast the async ceiling above rather than merely
  # be a large number. The old 80 was 40 minutes against an async budget of 30, and raising the
  # budget without raising this would have the collector give up on a job that was still running,
  # reporting a failure the machine had not had.
  retries: 170
  delay: 30
  changed_when: >-
    pyenv_install.finished and
    'Installed Python-' in (pyenv_install.stderr | default(''))
  # An rc-less finished result is a lost or killed job, and `rc | default(0)` called that a pass,
  # which is the one answer it could not afford to give. Same reasoning as the async_status
  # collector in fvm_unix.yaml. The old third condition tolerated "already exists" in stderr, a
  # string --skip-existing never produces, so it could only ever have masked a real failure.
  failed_when:
    - pyenv_install.finished
    - pyenv_install.rc is not defined or pyenv_install.rc != 0

- name: Choose the pyenv global version
  ansible.builtin.set_fact:
    # `system` on Linux, because a pyenv global puts its shims ahead of /usr/bin on PATH and makepkg's
    # build() then runs a pyenv interpreter that cannot see python-build or python-installer, which
    # pacman installs into the system one: "No module named build" and "failed to build
    # 'konsave-2.3.0-1'" from paru. macOS keeps the pinned version, its /usr/bin/python3 is Apple's
    # old Command Line Tools Python and there is no makepkg. Projects pin with `pyenv local`.
    pyenv_global_target: "{{ default_python if ih_family == 'Darwin' else 'system' }}"

- name: Read current pyenv global version
  ansible.builtin.shell: |
    set -o pipefail
    export PYENV_ROOT="{{ non_root_home }}/.pyenv"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"
    pyenv global
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: pyenv_current_global
  changed_when: false
  failed_when: false

- name: Set default Python via Pyenv (Linux/Mac)
  ansible.builtin.shell: |
    set -o pipefail
    export PYENV_ROOT="{{ non_root_home }}/.pyenv"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"
    pyenv global {{ pyenv_global_target }}
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  when: (pyenv_current_global.stdout | default('') | trim) != pyenv_global_target
