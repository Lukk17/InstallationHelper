---
- name: Install Pyenv build dependencies (Debian)
  become: yes
  ansible.builtin.apt:
    name:
      - build-essential
      - libssl-dev
      - zlib1g-dev
      - libbz2-dev
      - libreadline-dev
      - libsqlite3-dev
      # libncursesw5-dev is gone from Debian trixie and Ubuntu 26.04, both of which ship
      # libncurses-dev instead, confirmed with apt-cache policy. apt fails the whole task on an
      # unknown name, so every Pyenv build dependency install failed across the Debian family and
      # took Python version management with it. See docs/regression_ledger.md.
      - libncurses-dev
      - xz-utils
      - tk-dev
      - libxml2-dev
      - libxmlsec1-dev
      - libffi-dev
      - liblzma-dev
      - curl
    state: present
  when: ih_family == 'Debian'

- name: Install Pyenv build dependencies (Fedora)
  become: yes
  ansible.builtin.dnf:
    name:
      - gcc
      - make
      - patch
      # Fedora moved to zlib-ng and zlib-devel no longer exists on 44. The replacement is
      # zlib-ng-compat-devel, which provides the same headers, confirmed with dnf info.
      - zlib-ng-compat-devel
      - bzip2-devel
      - readline-devel
      - sqlite-devel
      - openssl-devel
      - tk-devel
      - libffi-devel
      - xz-devel
      - curl
    state: present
  when: ih_family == 'RedHat'

- name: Install Pyenv build dependencies (Arch)
  become: yes
  community.general.pacman:
    name:
      - base-devel
      - openssl
      - zlib
      - xz
      - tk
      - curl
    state: present
  when: ih_family == 'Archlinux'

- name: Install Pyenv (Linux/Mac)
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL --max-time 120 https://pyenv.run | bash
  args:
    creates: "{{ non_root_home }}/.pyenv/bin/pyenv"
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: pyenv_bootstrap
  retries: 3
  delay: 10
  until: pyenv_bootstrap is succeeded

# Fire all 4 Python builds in parallel (poll: 0). Each compiles from source
# in ~5–10 min — serial is 20–40 min, parallel is bound by CPU contention
# on a 4-core box (≈15–20 min). async_status collects results afterwards.
- name: Fire all Python builds via Pyenv (parallel)
  ansible.builtin.shell: |
    set -o pipefail
    export PYENV_ROOT="{{ non_root_home }}/.pyenv"
    export PATH="$PYENV_ROOT/bin:$PATH"
    timeout 1500 pyenv install --skip-existing {{ item }} </dev/null
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  loop:
    - "{{ python310_id }}"
    - "{{ python311_id }}"
    - "{{ python312_id }}"
    - "{{ python313_id }}"
  loop_control:
    label: "{{ item }}"
  async: 1800
  poll: 0
  register: pyenv_jobs
  changed_when: false

- name: Wait for parallel Pyenv Python builds to finish
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ pyenv_jobs.results }}"
  loop_control:
    label: "{{ item.item }}"
  become: yes
  become_user: "{{ non_root_user }}"
  register: pyenv_install
  until: pyenv_install.finished
  retries: 80
  delay: 30
  changed_when: >-
    pyenv_install.finished and
    'already installed' not in (pyenv_install.stderr | default('')) and
    'already exists' not in (pyenv_install.stderr | default(''))
  failed_when:
    - pyenv_install.finished
    - pyenv_install.rc | default(0) != 0
    - "'already exists' not in (pyenv_install.stderr | default(''))"

- name: Read current pyenv global version
  ansible.builtin.shell: |
    set -o pipefail
    export PYENV_ROOT="{{ non_root_home }}/.pyenv"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"
    pyenv global
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: pyenv_current_global
  changed_when: false
  failed_when: false

- name: Set default Python via Pyenv (Linux/Mac)
  ansible.builtin.shell: |
    set -o pipefail
    export PYENV_ROOT="{{ non_root_home }}/.pyenv"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"
    pyenv global {{ default_python }}
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  when: (pyenv_current_global.stdout | default('') | trim) != default_python

