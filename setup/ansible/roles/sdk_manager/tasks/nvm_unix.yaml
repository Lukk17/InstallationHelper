---
- name: Install NVM (Linux/Mac)
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL --max-time 120 -o- https://raw.githubusercontent.com/nvm-sh/nvm/v{{ nvm_version }}/install.sh | bash
  args:
    creates: "{{ non_root_home }}/.nvm/nvm.sh"
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: nvm_bootstrap
  retries: 3
  delay: 10
  until: nvm_bootstrap is succeeded

# The vendor installer above appends the three source lines to whatever profile file it detects
# from $SHELL at the time it runs, and under `ansible.builtin.shell` with `executable: /bin/bash`
# that is always .bashrc, regardless of the user's actual login shell. A real CachyOS run on
# 2026-09-15 confirmed the gap: line 911 of that log shows "Appending nvm source string to
# /home/lukk/.bashrc" and nothing was ever written to .zshrc, so nvm, npm and every npm-installed
# tool were unreachable from the owner's zsh session even though they had installed correctly.
#
# This block now targets apps_config/env.sh, the one file env_unix.yaml has every rc file source,
# rather than .zshrc directly, because shell_zsh's Oh My Zsh install replaces .zshrc wholesale on a
# fresh install and would take a block written straight into it down too. See
# docs/regression_ledger.md, "shell_zsh's Oh My Zsh install overwrites the PATH block env_variables
# just wrote". Do not add this to .bashrc: the vendor installer already owns that file and a second
# writer there would fight it on every rerun. It still writes its own copy there on its own, so a
# bash login shell now sources nvm.sh twice: once from the vendor's line in .bashrc and once through
# apps_config/env.sh. nvm.sh guards its own function definitions, so the second source is a harmless
# no-op, at the cost of a few extra milliseconds at shell start. zsh only ever gets this one copy.
- name: Ensure the project's own environment file directory exists (Linux/Mac)
  ansible.builtin.file:
    path: "{{ non_root_home }}/apps_config"
    state: directory
    owner: "{{ non_root_user }}"
    group: "{{ ih_non_root_group }}"
    mode: '0755'
  become: yes

- name: Ensure NVM shell init is present in the project's environment file (Linux/Mac)
  ansible.builtin.blockinfile:
    path: "{{ non_root_home }}/apps_config/env.sh"
    marker: "# {mark} ANSIBLE NVM SHELL INIT"
    create: yes
    block: |
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"  # This loads nvm
      [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"  # This loads nvm bash_completion
  become: yes
  become_user: "{{ non_root_user }}"

# `nvm` is a shell function, not a binary — `timeout nvm …` fails with
# "No such file or directory" because timeout uses execve(). Wrap the
# whole call in `bash -c` so the function is defined inside the timed
# sub-shell. That applies to the probe below just as much as to the install.
#
# `creates` cannot express this one. The artefact is
# ~/.nvm/versions/node/<version>/bin/node and the version is whatever LTS resolves to on the day,
# so the only shape `creates` could take is a glob over every installed version, which would skip
# the install on a machine that has some other Node and not the LTS one.
#
# `nvm which "lts/*"` is NVM's own answer to the same question and needs no network: it resolves the
# alias out of ~/.nvm/alias and checks the binary. Measured in a debian:trixie container against
# NVM 0.40.4, it exits 0 and prints the node path once the LTS release is installed, and exits 1 in
# one second on a machine that has NVM and no Node at all. It also exits 1 for every half-installed
# shape tried: the node binary deleted, the node binary left non-executable, and the whole version
# directory removed with the alias files still in place. Each of those reinstalls, which is correct.
- name: Ask NVM whether the current LTS release is already installed (Linux/Mac)
  ansible.builtin.shell: |
    set -o pipefail
    {{ ih_timeout }} 60 bash -c 'source {{ non_root_home }}/.nvm/nvm.sh && nvm which "lts/*"'
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: nvm_lts_installed
  changed_when: false
  failed_when: false

# The old changed_when read stdout for "is already installed", which NVM writes with nvm_err, so it
# lands on stderr and the test was never true: every rerun reported a change it had not made. The
# guard above now keeps the task from running at all in that case, so reaching it means the LTS
# release really is absent and the default change report is the truthful one.
- name: Install Node LTS via NVM (Linux/Mac)
  ansible.builtin.shell: |
    set -o pipefail
    {{ ih_timeout }} 900 bash -c 'source {{ non_root_home }}/.nvm/nvm.sh && nvm install --lts </dev/null'
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: nvm_install
  async: 1200
  poll: 30
  # An async result carrying no rc at all is the shape a lost or killed job takes, and the previous
  # condition required rc to be defined before it could fail, so that shape passed silently. Same
  # reasoning as the async_status collector in fvm_unix.yaml.
  failed_when: nvm_install.rc is not defined or nvm_install.rc != 0
  # Retried as a whole for the reason on the apt batch above: this fetches from the network,
  # and one dropped connection must not cost the run every application in the batch. What has
  # already installed is skipped on the second attempt, so a retry costs only what was lost.
  until: nvm_install.rc | default(1) == 0
  retries: 2
  delay: 20
  when: (nvm_lts_installed.rc | default(1)) != 0
