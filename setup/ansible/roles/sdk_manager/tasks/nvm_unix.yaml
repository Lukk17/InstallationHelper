---
# The vendor installer clones the default branch of nvm, which already holds nvm.sh, and only then
# fetches and checks out the pinned tag, under install_nvm_from_git in install.sh, read for v0.40.4 on
# 2026-10-11. Guarding on nvm.sh let an attempt that died between the clone and the checkout be
# skipped by its own retry and reported ok, leaving whatever the default branch held instead of the
# pin. nvm writes no file of its own once the pinned tag is in place, so this task writes one, named
# after the pin, only after nvm itself answers with the pinned version. The installer updates an
# existing ~/.nvm in place, so a half-finished install, or one from an earlier pin, is completed by
# running it again. See docs/regression_ledger.md.
- name: Install NVM, or complete a half-finished install (Linux/Mac)
  ansible.builtin.shell: |
    set -o pipefail
    nvm_dir="{{ non_root_home }}/.nvm"
    curl -fsSL --max-time 120 -o- https://raw.githubusercontent.com/nvm-sh/nvm/v{{ nvm_version }}/install.sh | PROFILE=/dev/null bash || exit 1
    . "$nvm_dir/nvm.sh" --no-use && [ "$(nvm --version)" = {{ nvm_version | quote }} ] && touch "$nvm_dir/.installation-helper-nvm-{{ nvm_version }}"
  args:
    creates: "{{ non_root_home }}/.nvm/.installation-helper-nvm-{{ nvm_version }}"
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: nvm_bootstrap
  retries: 3
  delay: 10
  until: nvm_bootstrap is succeeded

# The vendor installer appends its own three lines to whichever profile it detects, .bashrc under
# this task's bash, which is how a machine ended up sourcing nvm.sh twice. PROFILE=/dev/null above
# is nvm's own switch for leaving every profile alone, read in install.sh v0.40.4 (nvm_detect_profile
# and the `[ "${PROFILE-}" = '/dev/null' ]` branch of nvm_do_install), so the project's two blocks
# below are the only wiring. NVM_DIR is static and goes in the environment file every shell and the
# desktop session read. Loading nvm.sh defines shell functions, which no environment file can carry,
# so that goes in each interactive rc file instead.
- name: Ensure NVM_DIR is in the project's environment file (Linux/Mac)
  ansible.builtin.blockinfile:
    path: "{{ dev_env_file }}"
    marker: "# {mark} ANSIBLE NVM ENVIRONMENT"
    create: yes
    mode: '0644'
    block: |
      NVM_DIR=${HOME}/.nvm
  become: yes
  become_user: "{{ non_root_user }}"

- name: Ensure NVM shell init is present in every interactive rc file (Linux/Mac)
  ansible.builtin.blockinfile:
    path: "{{ item.path }}"
    marker: "# {mark} ANSIBLE NVM SHELL INIT"
    create: yes
    mode: '0644'
    block: |
      [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
      [ -s "$NVM_DIR/bash_completion" ] && . "$NVM_DIR/bash_completion"
  loop: "{{ interactive_rc_files }}"
  loop_control:
    label: "{{ item.path }}"
  become: yes
  become_user: "{{ non_root_user }}"

# What an earlier install, run before PROFILE=/dev/null, appended to a profile. The patterns match the
# vendor's lines only: the block above carries no export and no trailing comment.
- name: Remove the init lines the NVM installer appended before this project wired NVM itself (Linux/Mac)
  ansible.builtin.lineinfile:
    path: "{{ item.0 }}"
    regexp: "{{ item.1 }}"
    state: absent
  loop: "{{ shell_startup_files | product(nvm_vendor_lines) | list }}"
  loop_control:
    label: "{{ item.0 }}"
  vars:
    nvm_vendor_lines:
      - '^export NVM_DIR='
      - '# This loads nvm$'
      - '# This loads nvm bash_completion$'
  become: yes
  become_user: "{{ non_root_user }}"

# `nvm` is a shell function, not a binary — `timeout nvm …` fails with
# "No such file or directory" because timeout uses execve(). Wrap the
# whole call in `bash -c` so the function is defined inside the timed
# sub-shell. That applies to the probe below just as much as to the install.
#
# `creates` cannot express this one. The artefact is
# ~/.nvm/versions/node/<version>/bin/node and the version is whatever LTS resolves to on the day,
# so the only shape `creates` could take is a glob over every installed version, which would skip
# the install on a machine that has some other Node and not the LTS one.
#
# `nvm which "lts/*"` is NVM's own answer to the same question and needs no network: it resolves the
# alias out of ~/.nvm/alias and checks the binary. Measured in a debian:trixie container against
# NVM 0.40.4, it exits 0 and prints the node path once the LTS release is installed, and exits 1 in
# one second on a machine that has NVM and no Node at all. It also exits 1 for every half-installed
# shape tried: the node binary deleted, the node binary left non-executable, and the whole version
# directory removed with the alias files still in place. Each of those reinstalls, which is correct.
- name: Ask NVM whether the current LTS release is already installed (Linux/Mac)
  ansible.builtin.shell: |
    set -o pipefail
    {{ ih_timeout }} 60 bash -c 'source {{ non_root_home }}/.nvm/nvm.sh && nvm which "lts/*"'
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: nvm_lts_installed
  changed_when: false
  failed_when: false

# The old changed_when read stdout for "is already installed", which NVM writes with nvm_err, so it
# lands on stderr and the test was never true: every rerun reported a change it had not made. The
# guard above now keeps the task from running at all in that case, so reaching it means the LTS
# release really is absent and the default change report is the truthful one.
- name: Install Node LTS via NVM (Linux/Mac)
  ansible.builtin.shell: |
    set -o pipefail
    {{ ih_timeout }} 900 bash -c 'source {{ non_root_home }}/.nvm/nvm.sh && nvm install --lts </dev/null'
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: nvm_install
  async: 1200
  poll: 30
  # An async result carrying no rc at all is the shape a lost or killed job takes, and the previous
  # condition required rc to be defined before it could fail, so that shape passed silently. Same
  # reasoning as the async_status collector in fvm_unix.yaml.
  failed_when: nvm_install.rc is not defined or nvm_install.rc != 0
  # Retried as a whole for the reason on the apt batch above: this fetches from the network,
  # and one dropped connection must not cost the run every application in the batch. What has
  # already installed is skipped on the second attempt, so a retry costs only what was lost.
  # The retry rule every package manager follows, four attempts twenty seconds apart, with no refresh
  # between them, because nvm reads the Node release index from nodejs.org on every install and keeps
  # no copy a refresh could bring up to date.
  until: nvm_install.rc | default(1) == 0
  retries: 3
  delay: 20
  when: (nvm_lts_installed.rc | default(1)) != 0
