---
- name: Install NVM (Linux/Mac)
  ansible.builtin.shell: >
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
  args:
    creates: "{{ ansible_env.HOME }}/.nvm/nvm.sh"
  when: ansible_os_family != 'Windows' and install_nodejs | bool

- name: Install Node LTS via NVM (Linux/Mac)
  ansible.builtin.shell: >
    . {{ ansible_env.HOME }}/.nvm/nvm.sh && nvm install --lts
  args:
    executable: /bin/bash
  when: ansible_os_family != 'Windows' and install_nodejs | bool

- name: Install Node.js (Windows via Choco)
  community.windows.win_chocolatey:
    name: nodejs
    state: present
  when: ansible_os_family == 'Windows' and install_nodejs | bool
