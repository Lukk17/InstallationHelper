---
- name: Install Dart SDK (Arch)
  become: true
  community.general.pacman:
    name: dart
    state: present
  when: ih_family == 'Archlinux' and install_dart | bool

- name: Add Dart apt signing key (Debian)
  ansible.builtin.shell: |
    set -o pipefail
    wget -qO- https://dl-ssl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/dart.gpg
  become: true
  args:
    creates: /usr/share/keyrings/dart.gpg
    executable: /bin/bash
  when: ih_family == 'Debian' and install_dart | bool
  # Retried for the reason written above the batched apt install: this fetches over the network,
  # and one dropped connection during a provisioning run must not be the end of it. The creates
  # guard above means a second attempt does nothing when the first one actually got there.
  register: dart_apt_key
  until: dart_apt_key is succeeded
  retries: 3
  delay: 10

- name: Add Dart apt repository (Debian)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/dart.gpg] https://storage.googleapis.com/download.dartlang.org/linux/debian stable main"
    state: present
    filename: dart_stable
  become: true
  when: ih_family == 'Debian' and install_dart | bool

- name: Install Dart SDK (Debian)
  ansible.builtin.apt:
    name: dart
    state: present
    update_cache: true
  become: true
  when: ih_family == 'Debian' and install_dart | bool

# Fedora has no `dart` package in the mainline repos and Google's APT repo
# isn't available for RHEL. Install via the official Dart Linux SDK zip from
# storage.googleapis.com — same channel Google publishes for Linux users.
- name: Ensure /opt/dart-sdk parent exists (Fedora)
  ansible.builtin.file:
    path: /opt
    state: directory
    mode: '0755'
  become: true
  when: ih_family == 'RedHat' and install_dart | bool

# Staged in the software_installer role's private directory, never in /tmp, and of every staged
# artifact in this repository this is the one that matters most: the archive is unpacked into /opt as
# root. /tmp is writable by every local account, the file name is fixed, and get_url does not
# overwrite a destination that already exists, so any local user could pre-create that path and have
# their own archive extracted into a system directory by root.
#
# The directory is created here as well as in software_installer's dynamic_install.yaml because
# sdk_manager runs before software_installer in site.yaml and get_url does not create parents. The
# path itself is read from the software_installer role default so there is one definition of it,
# which resolves in this role because site.yaml imports both roles statically and a statically
# imported role's defaults are play-wide. Checked by running it on ansible-core 2.19.9 rather than
# assumed.
- name: Create the private staging directory for the Dart SDK download (Fedora)
  ansible.builtin.file:
    path: "{{ software_installer_stage_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  become: true
  when: ih_family == 'RedHat' and install_dart | bool

# force: true because the file name carries no version while the URL does, so a cached file under a
# permanent staging path would pin the SDK to whatever a previous run fetched and a dart_version bump
# would install nothing new while reporting success.
- name: Download Dart SDK zip (Fedora)
  ansible.builtin.get_url:
    url: "https://storage.googleapis.com/dart-archive/channels/stable/release/{{ dart_version }}/sdk/dartsdk-linux-x64-release.zip"
    dest: "{{ software_installer_stage_dir }}/dartsdk-linux-x64-release.zip"
    force: true
    mode: '0600'
    timeout: 60
  become: true
  register: dart_sdk_download
  retries: 3
  delay: 10
  until: dart_sdk_download is succeeded
  when: ih_family == 'RedHat' and install_dart | bool

- name: Extract Dart SDK to /opt (Fedora)
  ansible.builtin.unarchive:
    src: "{{ software_installer_stage_dir }}/dartsdk-linux-x64-release.zip"
    dest: /opt
    remote_src: true
    creates: /opt/dart-sdk/bin/dart
  become: true
  when: ih_family == 'RedHat' and install_dart | bool

# Nothing wants the zip after the extraction, and the staging path is permanent now that it is not
# /tmp, so leaving it behind would grow /var/cache by roughly a quarter of a gigabyte per run.
- name: Remove the staged Dart SDK zip (Fedora)
  ansible.builtin.file:
    path: "{{ software_installer_stage_dir }}/dartsdk-linux-x64-release.zip"
    state: absent
  become: true
  when: ih_family == 'RedHat' and install_dart | bool

- name: Symlink dart and pub into /usr/local/bin (Fedora)
  ansible.builtin.file:
    src: "/opt/dart-sdk/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - dart
    - dartaotruntime
  become: true
  when: ih_family == 'RedHat' and install_dart | bool

# Dart on macOS lives in the dart-lang/dart tap, not Homebrew core.
# `brew install dart` without this tap fails with "No available formula".
- name: Add dart-lang/dart Homebrew tap (macOS)
  community.general.homebrew_tap:
    name: dart-lang/dart
    state: present
  when: ih_family == 'Darwin' and install_dart | bool

# Homebrew 6.0.0 made tap trust mandatory: a non-official tap is not loaded at all until it is
# trusted, because loading one runs Ruby code from it. https://docs.brew.sh/Tap-Trust
#
# The whole tap, not the one formula, and that is measured rather than preferred. The macOS run of
# 2026-08-22 shows brew trusting `dart-lang/dart/dart` by itself and then refusing anyway with
# "Refusing to load formula dart-lang/dart/dart-beta from untrusted tap dart-lang/dart", so an
# install of one formula still loads its siblings. Homebrew's own advice is to trust the narrowest
# thing that works, and for this tap that is the tap.
#
# Asked before it is granted, so a second run reports no change. brew trust --json v1 prints what is
# already trusted, and it exits non-zero on a Homebrew old enough not to have the command, which is
# exactly the version that does not need any of this.
  # Retried, because this reaches the network and a single dropped connection must not cost the
  # run. Four separate transients hit one sweep on 2026-08-22: a broken pipe from deb.debian.org,
  # a connection reset from GitHub on a font, an SSL connect error fetching an AppImage, and a TLS
  # eof from python.org.
  register: dart_tap
  until: dart_tap is succeeded
  retries: 3
  delay: 15
- name: Ask which taps Homebrew already trusts (macOS)
  ansible.builtin.command: brew trust --json v1
  register: brew_trust_state
  changed_when: false
  failed_when: false
  when: ih_family == 'Darwin' and install_dart | bool

- name: Trust the dart-lang/dart tap, which Homebrew 6 requires before it will load it (macOS)
  ansible.builtin.command: brew trust --tap dart-lang/dart
  register: dart_tap_trust
  changed_when: dart_tap_trust.rc == 0
  when:
    - ih_family == 'Darwin'
    - install_dart | bool
    - brew_trust_state.rc | default(1) == 0
    - "'dart-lang/dart' not in (brew_trust_state.stdout | default(''))"

- name: Install Dart SDK (macOS)
  community.general.homebrew:
    name: dart-lang/dart/dart
    state: present
  when: ih_family == 'Darwin' and install_dart | bool
  # Retried, because this reaches the network and a single dropped connection must not cost the
  # run. Four separate transients hit one sweep on 2026-08-22: a broken pipe from deb.debian.org,
  # a connection reset from GitHub on a font, an SSL connect error fetching an AppImage, and a TLS
  # eof from python.org.
  register: dart_brew
  until: dart_brew is succeeded
  retries: 3
  delay: 15
