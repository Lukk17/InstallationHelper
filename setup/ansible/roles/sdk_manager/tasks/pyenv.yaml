---
- name: Install Pyenv (Linux/Mac)
  ansible.builtin.shell: >
    curl https://pyenv.run | bash
  args:
    creates: "{{ ansible_env.HOME }}/.pyenv/bin/pyenv"
  when: ansible_os_family != 'Windows' and install_python | bool

- name: Install Python 3 via Pyenv (Linux/Mac)
  ansible.builtin.shell: |
    export PYENV_ROOT="$HOME/.pyenv"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init --path)"
    eval "$(pyenv init -)"
    pyenv install -s 3.11.8
    pyenv global 3.11.8
  args:
    executable: /bin/bash
  when: ansible_os_family != 'Windows' and install_python | bool

- name: Install Python (Windows via Winget)
  community.windows.win_winget:
    name: Python.Python.3.11
    state: present
  when: ansible_os_family == 'Windows' and install_python | bool
