---
- name: Check if FVM is already installed (Linux/Mac)
  ansible.builtin.shell: |
    export PATH="$HOME/.fvm/bin:$HOME/.pub-cache/bin:$PATH"
    command -v fvm 2>/dev/null && exit 0
    test -f "$HOME/.fvm/bin/fvm" && exit 0
    test -f "$HOME/.pub-cache/bin/fvm" && exit 0
    exit 1
  args:
    executable: /bin/bash
  register: fvm_check
  changed_when: false
  failed_when: false

- name: Install FVM via dart pub global (Arch Linux)
  ansible.builtin.shell: |
    set -o pipefail
    dart pub global activate fvm
  args:
    executable: /bin/bash
  when:
    - fvm_check.rc != 0
    - ansible_facts['os_family'] == 'Archlinux'

- name: Install FVM via install script (Linux/Mac non-Arch)
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://fvm.app/install.sh | bash
  args:
    executable: /bin/bash
  when:
    - fvm_check.rc != 0
    - ansible_facts['os_family'] != 'Archlinux'

- name: Install Flutter via FVM ({{ flutter_channel }})
  ansible.builtin.shell: |
    set -o pipefail
    export PATH="$HOME/.fvm/bin:$HOME/.pub-cache/bin:$PATH"
    fvm install {{ flutter_channel }}
  args:
    creates: "{{ ansible_env.HOME }}/fvm/versions/{{ flutter_channel }}/bin/flutter"
    executable: /bin/bash

- name: Set FVM global version ({{ flutter_channel }})
  ansible.builtin.shell: |
    set -o pipefail
    export PATH="$HOME/.fvm/bin:$HOME/.pub-cache/bin:$PATH"
    fvm global {{ flutter_channel }}
  args:
    executable: /bin/bash
  changed_when: true
