---
# Each of the two installs below puts the binary in exactly one place, so each one is guarded by the
# `creates` for its own place. The single probe that used to gate both of them looked in
# ~/.fvm/bin and ~/.pub-cache/bin only, and installer 2.0.0 has installed into ~/fvm/bin since
# 2025-12, so the probe could not see the script install's own result and FVM was downloaded and
# unpacked again on every run. Verified in a debian:trixie container: the script leaves
# ~/fvm/bin/fvm and nothing at all in ~/.fvm, ~/.pub-cache or /usr/local/bin.
- name: Check whether FVM is already active in the Dart pub cache (Arch)
  ansible.builtin.stat:
    path: "{{ non_root_home }}/.pub-cache/bin/fvm"
  register: fvm_pub_cache_binary
  when: ih_family == 'Archlinux'

# `dart pub global activate fvm` requires dart on PATH. The dart install
# task is tagged `[dart]`, so under `--tags fvm` alone dart may be absent.
# Pacman is idempotent — if dart is already installed this is a no-op.
- name: Ensure Dart is installed before activating FVM (Arch)
  become: true
  community.general.pacman:
    name: dart
    state: present
  when:
    - ih_family == 'Archlinux'
    - not (fvm_pub_cache_binary.stat.exists | default(false))

- name: Install FVM via dart pub global (Arch Linux)
  ansible.builtin.shell: |
    set -o pipefail
    dart pub global activate fvm
  args:
    creates: "{{ non_root_home }}/.pub-cache/bin/fvm"
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: fvm_arch_install
  retries: 3
  delay: 10
  until: fvm_arch_install is succeeded
  when: ih_family == 'Archlinux'

- name: Install FVM via install script (Linux/Mac non-Arch)
  ansible.builtin.shell: |
    set -o pipefail
    export HOME="{{ non_root_home }}"
    curl -fsSL --max-time 120 https://fvm.app/install.sh | bash
  args:
    creates: "{{ non_root_home }}/fvm/bin/fvm"
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: fvm_script_install
  retries: 3
  delay: 10
  until: fvm_script_install is succeeded
  when: ih_family != 'Archlinux'

- name: Locate FVM binary after install
  ansible.builtin.shell: |
    set -o pipefail
    for p in "{{ non_root_home }}/fvm/bin" "{{ non_root_home }}/.fvm/bin" "{{ non_root_home }}/.pub-cache/bin" "/usr/local/bin"; do
      [ -f "$p/fvm" ] && echo "$p" && exit 0
    done
    exit 1
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: fvm_bin_dir
  changed_when: false
  failed_when: false

- name: Probe whether Flutter channel is already installed via FVM
  ansible.builtin.stat:
    path: "{{ non_root_home }}/fvm/versions/{{ flutter_channel }}/bin/flutter"
  register: flutter_channel_installed

# Ensure parent dir exists for .dart-tool/dart-flutter-telemetry.config —
# copy: fails if the parent doesn't exist. Without this the next
# `failed_when: false` masked the failure and Flutter's interactive
# analytics prompt then hung the install behind `{{ ih_timeout }} 1500`.
- name: Ensure .dart-tool directory exists
  ansible.builtin.file:
    path: "{{ non_root_home }}/.dart-tool"
    state: directory
    mode: '0755'
    owner: "{{ non_root_user }}"
    group: "{{ non_root_user }}"
  become: yes
  when: fvm_bin_dir.rc == 0

- name: Disable Flutter analytics consent prompts (pre-precache)
  ansible.builtin.copy:
    dest: "{{ non_root_home }}/{{ item }}"
    content: |
      {"firstRun":false,"enabled":false,"analytics-opt-out":true}
    mode: '0644'
  become: yes
  become_user: "{{ non_root_user }}"
  loop:
    - .flutter
    - .dart-tool/dart-flutter-telemetry.config
  when: fvm_bin_dir.rc == 0

- name: Fire Flutter install via FVM ({{ flutter_channel }})
  ansible.builtin.shell: |
    set -o pipefail
    export PATH="{{ fvm_bin_dir.stdout | trim }}:{{ non_root_home }}/.pub-cache/bin:$PATH"
    export HOME="{{ non_root_home }}"
    export CI=true
    export FLUTTER_SUPPRESS_ANALYTICS=true
    export PUB_CACHE="{{ non_root_home }}/.pub-cache"
    # Three attempts inside the job, the same shape and for the same reason as the pyenv builds
    # next door: the retries keyword cannot reach a task launched with poll: 0, and this one
    # downloads a Flutter SDK, which is exactly the kind of fetch that a dropped connection ends.
    # fvm install on a channel that is already there exits 0 without downloading, so a repeat
    # attempt costs nothing on the path where the first one worked.
    for attempt in 1 2 3; do
        if {{ ih_timeout }} 1500 fvm install {{ flutter_channel }} </dev/null; then
            exit 0
        fi
        echo "fvm install {{ flutter_channel }} attempt ${attempt} of 3 failed" >&2
        sleep 20
    done
    exit 1
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  # 4800 covers three attempts at the 1500 second ceiling above plus the waits between them, the
  # same arithmetic the pyenv job carries. A budget that cannot fit its own retry loop kills the
  # later attempts silently.
  async: 4800
  poll: 0
  register: fvm_install_job
  changed_when: false
  when:
    - fvm_bin_dir.rc == 0
    - not flutter_channel_installed.stat.exists

- name: Wait for FVM Flutter install to finish
  ansible.builtin.async_status:
    jid: "{{ fvm_install_job.ansible_job_id }}"
  become: yes
  become_user: "{{ non_root_user }}"
  register: fvm_install_result
  until: fvm_install_result.finished
  # 170 at 30 seconds is 85 minutes, which has to outlast the 4800 second async ceiling on the job
  # above rather than merely look generous. At 80 it was 40 minutes against a ceiling of 80, so the
  # collector would have given up on a job that was still running and called it a failure.
  retries: 170
  delay: 30
  changed_when: fvm_install_result.finished and fvm_install_result.rc | default(1) == 0
  # `rc | default(0) != 0` counted a finished result carrying no rc at all as a pass, which is the one
  # shape an async result most easily takes: a job the wrapper killed, or a result file that never got
  # written, comes back with no rc, and the default then supplied the answer the check existed to find
  # out. An rc-less result is now a failure, stated as its own condition rather than left to an
  # undefined-variable error, so the message says what happened.
  failed_when:
    - fvm_install_result.finished
    - fvm_install_result.rc is not defined or fvm_install_result.rc != 0
  when:
    - fvm_bin_dir.rc == 0
    - not flutter_channel_installed.stat.exists
    - fvm_install_job is defined
    - fvm_install_job.ansible_job_id is defined

# Ask FVM what it actually has, the way dynamic_install.yaml asks pacman which AUR packages actually
# landed. Everything above this point reads a job result, and a job result answers a different
# question from the machine's state: an install can exit zero and leave nothing behind, an async
# wrapper can lose a result, and if FVM itself never installed then `fvm_bin_dir.rc != 0` skipped the
# whole install and the previous version of this file said nothing at all about it. `fvm list` is the
# tool's own answer and does not depend on this file guessing where FVM caches SDKs.
- name: Ask FVM which Flutter versions it actually has (Linux/Mac)
  ansible.builtin.shell: |
    set -o pipefail
    export PATH="{{ fvm_bin_dir.stdout | trim }}:{{ non_root_home }}/.pub-cache/bin:$PATH"
    export HOME="{{ non_root_home }}"
    {{ ih_timeout }} 60 fvm list </dev/null
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: fvm_installed_versions
  changed_when: false
  failed_when: false
  when: fvm_bin_dir.rc == 0

- name: Establish whether the requested Flutter channel is installed
  ansible.builtin.set_fact:
    flutter_channel_present: >-
      {{ (fvm_installed_versions.rc | default(1)) == 0
         and flutter_channel in (fvm_installed_versions.stdout | default('')) }}

- name: Report that FVM is absent, so Flutter was never even attempted
  ansible.builtin.debug:
    msg: >-
      [ERROR] Flutter {{ flutter_channel }} was NOT installed, because FVM itself is not on this
      machine: no fvm binary was found in ~/fvm/bin, ~/.fvm/bin, ~/.pub-cache/bin or /usr/local/bin
      after the install step above. Every task that installs Flutter is gated on finding it, so they
      all skipped silently. The FVM install itself is the thing to fix, and its own task above says
      why it failed.
  when: fvm_bin_dir.rc != 0

- name: Report that the requested Flutter channel never arrived
  ansible.builtin.debug:
    msg: >-
      [ERROR] Flutter {{ flutter_channel }} is NOT installed: FVM is present and does not list that
      channel. `fvm list` said:
      {{ fvm_installed_versions.stdout | default('nothing, the command itself failed') | trim }}.
      The install either exited zero without unpacking an SDK or its async result was lost, and
      rerunning with --tags flutter is the first thing to try.
  when:
    - fvm_bin_dir.rc == 0
    - not (flutter_channel_present | bool)

- name: Record the missing Flutter install in the play summary
  ansible.builtin.set_fact:
    any_role_failed: true
  when: not (flutter_channel_present | bool)

# `fvm global <channel>` writes a config file — no network, no download.
# Re-setting to the current value is a no-op on disk, so the previous
# "Read current FVM global channel" probe is dropped (it hit FVM's
# interactive picker via `fvm global` with no args and hung 8h on Ubuntu).
# Run set unconditionally with stdin closed; 10s is the hard safety net,
# the actual work completes in <1s.
- name: Set FVM global version ({{ flutter_channel }})
  ansible.builtin.shell: |
    set -o pipefail
    export PATH="{{ fvm_bin_dir.stdout | trim }}:{{ non_root_home }}/.pub-cache/bin:$PATH"
    {{ ih_timeout }} 10 fvm global {{ flutter_channel }} </dev/null
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: fvm_set_global
  changed_when: "'Setting Flutter SDK' in (fvm_set_global.stdout | default(''))"
  when: fvm_bin_dir.rc == 0
