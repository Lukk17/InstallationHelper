---
- name: Include SDKMAN Unix tasks
  ansible.builtin.include_tasks: sdkman_unix.yaml
  when: ih_family != 'Windows' and install_java | default(false) | bool

- name: Include SDKMAN Windows tasks
  ansible.builtin.include_tasks: sdkman_windows.yaml
  when: ih_family == 'Windows' and install_java | default(false) | bool

