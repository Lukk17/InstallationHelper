- name: Setup Android SDK
  tags: [android]
  when: install_android_sdk | default(false) | bool
  block:
    - name: Include the Android SDK tasks
      ansible.builtin.include_tasks:
        file: android_sdk.yaml
        apply:
          tags: [android]
      tags: [android]
  rescue:
    - name: Record that the Android SDK could not be installed
      ansible.builtin.set_fact:
        any_role_failed: true
        not_installed_with_reason: >-
