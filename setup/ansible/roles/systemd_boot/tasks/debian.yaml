---
- name: Configure kernel-install for BLS layout (Debian)
  become: yes
  ansible.builtin.copy:
    dest: /etc/kernel/install.conf
    content: |
      layout=bls
    mode: '0644'

- name: Get current kernel version (Debian)
  ansible.builtin.shell: uname -r
  register: kernel_version
  changed_when: false

- name: Run kernel-install to generate BLS boot entry (Debian)
  become: yes
  ansible.builtin.shell: >
    kernel-install add {{ kernel_version.stdout }}
    /boot/vmlinuz-{{ kernel_version.stdout }}
  args:
    creates: "{{ esp_path }}/loader/entries/{{ ansible_hostname }}-{{ kernel_version.stdout }}.conf"
  ignore_errors: yes
  register: kernel_install_result

- name: Check if kernel-install created a valid boot entry (Debian)
  ansible.builtin.find:
    paths: "{{ esp_path }}/loader/entries"
    patterns: "*.conf"
  register: debian_boot_entries

- name: Build boot options line (Debian)
  ansible.builtin.set_fact:
    boot_options: "root=UUID={{ root_uuid.stdout | trim }} rw quiet splash{{ ' resume=UUID=' ~ swap_uuid.stdout | trim if swap_uuid.stdout | default('') | trim != '' else '' }}"

- name: "Fallback — create boot entry manually (Debian)"
  become: yes
  ansible.builtin.copy:
    dest: "{{ esp_path }}/loader/entries/{{ ansible_distribution | lower }}.conf"
    content: |
      title   {{ ansible_distribution }} {{ ansible_distribution_version }}
      linux   /vmlinuz-{{ kernel_version.stdout }}
      initrd  /initrd.img-{{ kernel_version.stdout }}
      options {{ boot_options }}
    mode: '0644'
  when: debian_boot_entries.matched == 0

- name: Configure dpkg kernel post-install hook to update systemd-boot (Debian)
  become: yes
  ansible.builtin.copy:
    dest: /etc/kernel/postinst.d/zz-bootctl-update
    content: |
      #!/bin/sh
      bootctl update --no-variables 2>/dev/null || true
    mode: '0755'
