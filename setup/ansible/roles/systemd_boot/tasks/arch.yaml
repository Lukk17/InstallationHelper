---
# On Arch, /boot is typically the ESP (vfat), so kernels live directly on it.
# Paths in entry files are relative to the ESP root.

# Detect which kernel flavor is actually installed (linux, linux-lts,
# linux-zen, linux-hardened). Falls back to "linux" if none found, which
# is wrong but explicit (boot entry will fail to load and operator notices).
- name: Detect installed Arch kernel flavor
  ansible.builtin.shell: |
    set -o pipefail
    for k in linux-zen linux-hardened linux-lts linux; do
      if [ -f "{{ esp_path }}/vmlinuz-${k}" ]; then
        echo "$k"
        exit 0
      fi
    done
    echo "linux"
  args:
    executable: /bin/bash
  register: arch_kernel_flavor
  changed_when: false

- name: Set Arch kernel flavor fact
  ansible.builtin.set_fact:
    arch_kernel: "{{ arch_kernel_flavor.stdout | trim }}"

- name: Check for Intel microcode on ESP (Arch)
  ansible.builtin.stat:
    path: "{{ esp_path }}/intel-ucode.img"
  register: intel_ucode

- name: Check for AMD microcode on ESP (Arch)
  ansible.builtin.stat:
    path: "{{ esp_path }}/amd-ucode.img"
  register: amd_ucode

- name: Build boot options line (Arch)
  ansible.builtin.set_fact:
    boot_options: "root=UUID={{ root_uuid.stdout | trim }} rw quiet{{ ' resume=UUID=' ~ swap_uuid.stdout | trim if swap_uuid.stdout | default('') | trim != '' else '' }}"

- name: Build fallback boot options line (Arch)
  ansible.builtin.set_fact:
    boot_options_fallback: "root=UUID={{ root_uuid.stdout | trim }} rw{{ ' resume=UUID=' ~ swap_uuid.stdout | trim if swap_uuid.stdout | default('') | trim != '' else '' }}"

- name: Create boot entry for Arch Linux
  become: yes
  ansible.builtin.copy:
    dest: "{{ esp_path }}/loader/entries/arch.conf"
    content: |
      title   Arch Linux ({{ arch_kernel }})
      linux   /vmlinuz-{{ arch_kernel }}
      {% if intel_ucode.stat.exists | default(false) %}
      initrd  /intel-ucode.img
      {% elif amd_ucode.stat.exists | default(false) %}
      initrd  /amd-ucode.img
      {% endif %}
      initrd  /initramfs-{{ arch_kernel }}.img
      options {{ boot_options }}
    mode: '0644'

- name: Create fallback boot entry for Arch Linux
  become: yes
  ansible.builtin.copy:
    dest: "{{ esp_path }}/loader/entries/arch-fallback.conf"
    content: |
      title   Arch Linux ({{ arch_kernel }} fallback initramfs)
      linux   /vmlinuz-{{ arch_kernel }}
      {% if intel_ucode.stat.exists | default(false) %}
      initrd  /intel-ucode.img
      {% elif amd_ucode.stat.exists | default(false) %}
      initrd  /amd-ucode.img
      {% endif %}
      initrd  /initramfs-{{ arch_kernel }}-fallback.img
      options {{ boot_options_fallback }}
    mode: '0644'

- name: Ensure pacman hooks directory exists (Arch)
  become: yes
  ansible.builtin.file:
    path: /etc/pacman.d/hooks
    state: directory
    mode: '0755'

- name: Install pacman hook to update systemd-boot on systemd upgrades (Arch)
  become: yes
  ansible.builtin.copy:
    dest: /etc/pacman.d/hooks/95-systemd-boot.hook
    content: |
      [Trigger]
      Type = Package
      Operation = Upgrade
      Target = systemd

      [Action]
      Description = Updating systemd-boot
      When = PostTransaction
      Exec = /usr/bin/bootctl update
    mode: '0644'
