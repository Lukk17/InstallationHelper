---
# Removes GRUB from the CURRENT distro only.
# Other distros' EFI entries on the shared ESP are never touched —
# systemd-boot auto-discovers them via EFI binary scanning.

- name: Map distro to its GRUB EFI directory name
  ansible.builtin.set_fact:
    distro_grub_efi_dir: >-
      {{
        {
          'Ubuntu':    'ubuntu',
          'Debian':    'debian',
          'Archlinux': 'arch',
          'Fedora':    'fedora',
          'CentOS':    'centos',
          'AlmaLinux': 'almalinux',
          'Rocky':     'rocky'
        }[ansible_facts['distribution']] | default(ansible_facts['distribution'] | lower)
      }}

# --- Remove GRUB packages ---

- name: Remove GRUB packages (Debian/Ubuntu)
  become: yes
  ansible.builtin.apt:
    name:
      - grub-efi-amd64
      - grub-efi-amd64-signed
      - grub-efi-amd64-bin
      - grub-common
      - grub2-common
      - grub-pc-bin
      - os-prober
    state: absent
    purge: yes
  when: ansible_facts['os_family'] == 'Debian'

- name: Remove GRUB packages (Arch)
  become: yes
  community.general.pacman:
    name:
      - grub
      - os-prober
    state: absent
  when: ansible_facts['os_family'] == 'Archlinux'

- name: Remove GRUB packages (Fedora)
  become: yes
  ansible.builtin.dnf:
    name:
      - grub2-efi-x64
      - grub2-efi-x64-modules
      - grub2-tools
      - grub2-tools-extra
      - grub2-common
      - os-prober
    state: absent
  when: ansible_facts['os_family'] == 'RedHat'

# --- Remove this distro's GRUB EFI directory from ESP ---

- name: Check if this distro's GRUB EFI directory exists
  ansible.builtin.stat:
    path: "{{ esp_path }}/EFI/{{ distro_grub_efi_dir }}"
  register: distro_grub_dir

- name: Remove this distro's GRUB EFI directory
  become: yes
  ansible.builtin.file:
    path: "{{ esp_path }}/EFI/{{ distro_grub_efi_dir }}"
    state: absent
  when: distro_grub_dir.stat.exists | default(false)

# --- Remove stale NVRAM entry pointing to this distro's GRUB ---

- name: Install efibootmgr if not present (Debian)
  become: yes
  ansible.builtin.apt:
    name: efibootmgr
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Install efibootmgr if not present (Arch)
  become: yes
  community.general.pacman:
    name: efibootmgr
    state: present
  when: ansible_facts['os_family'] == 'Archlinux'

- name: Install efibootmgr if not present (Fedora)
  become: yes
  ansible.builtin.dnf:
    name: efibootmgr
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

# Match NVRAM entries by Loader path (\EFI\<distro>\), not by free-text
# label — labels collide with Windows / other distros and a wrong delete
# bricks UEFI boot.
- name: Dump NVRAM boot entries verbosely
  become: yes
  ansible.builtin.command: efibootmgr -v
  register: efibootmgr_verbose
  changed_when: false

- name: Identify NVRAM Boot IDs whose loader path is this distro's GRUB
  ansible.builtin.set_fact:
    grub_nvram_ids: >-
      {{ efibootmgr_verbose.stdout_lines
         | select('search', '^Boot[0-9A-Fa-f]{4}\\*?')
         | select('search', '\\\\EFI\\\\' ~ distro_grub_efi_dir ~ '\\\\')
         | map('regex_search', '^Boot([0-9A-Fa-f]{4})', '\\1')
         | map('first')
         | list }}

- name: Show NVRAM entries that will be deleted
  ansible.builtin.debug:
    msg: "Deleting NVRAM Boot{{ item }} (matched this distro's GRUB loader path)."
  loop: "{{ grub_nvram_ids }}"
  when: grub_nvram_ids | length > 0

- name: Remove stale GRUB NVRAM entries for this distro
  become: yes
  ansible.builtin.command: efibootmgr -b {{ item }} -B
  loop: "{{ grub_nvram_ids }}"
  when: grub_nvram_ids | length > 0

