---
# Fedora already uses the Boot Loader Specification (BLS) with GRUB2.
# BLS entries in /boot/loader/entries/ are already generated by kernel-install.
# Installing systemd-boot makes it pick those entries up automatically.

- name: Install systemd-boot (Fedora)
  become: yes
  ansible.builtin.dnf:
    name: systemd-boot
    state: present

- name: Get current kernel version (Fedora)
  ansible.builtin.shell: uname -r
  register: kernel_version
  changed_when: false

- name: Run kernel-install to generate BLS boot entry (Fedora)
  become: yes
  ansible.builtin.shell: >
    kernel-install add {{ kernel_version.stdout }}
    /lib/modules/{{ kernel_version.stdout }}/vmlinuz
  args:
    creates: "{{ esp_path }}/loader/entries/{{ ansible_hostname }}-{{ kernel_version.stdout }}.conf"
  ignore_errors: yes

- name: Install kernel-install plugin to keep systemd-boot updated on Fedora
  become: yes
  ansible.builtin.dnf:
    name: sdubby
    state: present
  ignore_errors: yes

