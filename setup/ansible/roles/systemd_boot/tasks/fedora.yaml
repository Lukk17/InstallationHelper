---
# Fedora already uses the Boot Loader Specification (BLS) with GRUB2.
# BLS entries in /boot/loader/entries/ are already generated by kernel-install.
# Installing systemd-boot makes it pick those entries up automatically.

# Fedora has no package called systemd-boot. The bootloader ships as systemd-boot-unsigned,
# confirmed with dnf info on Fedora 44, so this task could never have installed anything. It is
# gated behind setup_systemd_boot, which defaults false, which is why nobody hit it: the first
# person to enable it on Fedora would have found their bootloader install fail outright.
# See docs/regression_ledger.md.
- name: Install systemd-boot (Fedora)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: [systemd-boot-unsigned]
    role_packages_purpose: the systemd-boot bootloader
  when: ih_family == 'RedHat'

- name: Stop when systemd-boot-unsigned did not install
  ansible.builtin.fail:
    msg: systemd-boot-unsigned did not install, so installing systemd-boot cannot continue. What the package manager said is in the [ERROR] line above.
  when: "'systemd-boot-unsigned' in (role_packages_missing | default([]))"

- name: Read machine-id (Fedora)
  ansible.builtin.slurp:
    src: /etc/machine-id
  register: machine_id_raw

- name: Set machine-id fact (Fedora)
  ansible.builtin.set_fact:
    machine_id: "{{ machine_id_raw.content | b64decode | trim }}"

# Use the NEWEST installed kernel image (Fedora keeps vmlinuz inside the
# kernel's modules dir, not /boot). setup.sh's pre-Ansible `dnf upgrade`
# may install a new kernel that's not the running one. installonly_limit
# keeps multiple kernels by default, but the user may have set it to 1.
# Either way, point systemd-boot at the latest on disk, not uname -r.
- name: Find newest installed kernel image (Fedora)
  ansible.builtin.shell: |
    set -o pipefail
    ls -1d /lib/modules/*/vmlinuz 2>/dev/null | awk -F/ '{print $4}' | sort -V | tail -1
  args:
    executable: /bin/bash
  register: kernel_version
  changed_when: false
  failed_when: kernel_version.stdout | length == 0

- name: Run kernel-install to generate BLS boot entry (Fedora)
  become: yes
  ansible.builtin.command: >-
    kernel-install add {{ kernel_version.stdout }}
    /lib/modules/{{ kernel_version.stdout }}/vmlinuz
  args:
    creates: "{{ esp_path }}/loader/entries/{{ machine_id }}-{{ kernel_version.stdout }}.conf"
  register: fedora_kernel_install
  failed_when:
    - fedora_kernel_install.rc != 0
    - "'already' not in (fedora_kernel_install.stderr | default(''))"

# sdubby keeps systemd-boot synced across kernel updates. Its failure is tolerated, because the
# current kernel's boot entry has already been written by the task above and the machine boots without
# it, and then established from the package database rather than from the module result.
#
# The previous shape could not report anything. The four-condition failed_when is combined with AND,
# so a real dnf failure that set rc satisfied all four and failed the task outright, which aborts the
# play because site.yaml imports systemd_boot with no rescue: the warning below never ran because the
# run was already over. A dnf failure that set no rc at all, which is the common shape, failed the
# first condition, so the task went green and `sdubby_install is failed` was false and the warning
# never ran either. The task whose whole job was explaining a missing sdubby could not fire in either
# branch. It also read the result's `failed` key, which e2e/tier1/failed_key_reads.sh forbids for
# exactly this reason: failed_when had already rewritten it.
# Through tasks/install_role_packages.yaml, the retry rule every package manager follows. Not fatal:
# rpm is asked below and the consequence is reported there.
- name: Install kernel-install plugin to keep systemd-boot updated on Fedora
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: [sdubby]
    role_packages_purpose: the kernel-install plugin that keeps systemd-boot's entry current
  when: ih_family == 'RedHat'

- name: Ask rpm whether sdubby is actually installed (Fedora)
  ansible.builtin.command:
    cmd: rpm -q sdubby
  register: sdubby_query
  changed_when: false
  failed_when: false

- name: Report that sdubby is absent so future kernels will not refresh the boot entry
  ansible.builtin.debug:
    msg: >-
      [ERROR] sdubby, the kernel-install plugin, is not installed:
      {{ sdubby_query.stdout | default('rpm reports it absent', true) }}.
      systemd-boot boots the CURRENT kernel, because its entry was written above, and no future Fedora
      kernel update will refresh that entry, so the machine will keep booting an ever older kernel
      until this role is rerun. Install it with: sudo dnf install sdubby
  when: sdubby_query.rc != 0

- name: Record the missing sdubby plugin in the play summary
  ansible.builtin.set_fact:
    any_role_failed: true
  when: sdubby_query.rc != 0
