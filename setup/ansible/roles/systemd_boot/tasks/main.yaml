---
# Bootloader-rewrite role: re-checks the toggle and UEFI here so a
# `--tags systemd_boot` run can't bypass the site.yaml gate and brick a
# BIOS host. No-ops via `meta: end_host`, never `fail:`, so the outer
# playbook survives a mis-enable.

- name: Validate systemd_boot toggle and UEFI prerequisites
  ansible.builtin.stat:
    path: /sys/firmware/efi
  register: efi_dir

- name: Skip systemd-boot setup gracefully on BIOS / when toggle is off
  ansible.builtin.debug:
    msg: >-
      Skipping systemd-boot: setup_systemd_boot={{ setup_systemd_boot | default(false) }},
      uefi_present={{ efi_dir.stat.exists | default(false) }}.
  when: not (setup_systemd_boot | default(false) | bool) or not (efi_dir.stat.exists | default(false))

- name: End systemd_boot role early on BIOS or disabled toggle
  ansible.builtin.meta: end_host
  when: not (setup_systemd_boot | default(false) | bool) or not (efi_dir.stat.exists | default(false))

- name: Detect ESP mount point
  ansible.builtin.shell: |
    set -o pipefail
    if mountpoint -q /efi; then echo "/efi"
    elif mountpoint -q /boot/efi; then echo "/boot/efi"
    elif mountpoint -q /boot && [ "$(findmnt -n -o FSTYPE /boot)" = "vfat" ]; then echo "/boot"
    else echo ""
    fi
  args:
    executable: /bin/bash
  register: esp_raw
  changed_when: false

- name: Fail if no ESP could be detected
  ansible.builtin.fail:
    msg: >-
      systemd-boot requires a mounted ESP (vfat) at /efi, /boot/efi, or /boot.
      Detected none of these. Mount your EFI partition before running this role.
  when: (esp_raw.stdout | trim) | length == 0

- name: Set ESP path fact
  ansible.builtin.set_fact:
    esp_path: "{{ esp_raw.stdout | trim }}"

- name: Verify ESP is a vfat filesystem
  ansible.builtin.command: findmnt -n -o FSTYPE "{{ esp_path }}"
  register: esp_fstype
  changed_when: false

- name: Refuse to write to non-vfat ESP
  ansible.builtin.fail:
    msg: >-
      ESP at {{ esp_path }} reports FSTYPE={{ esp_fstype.stdout | trim }} —
      systemd-boot only writes to vfat ESPs. Aborting to avoid corrupting
      a non-EFI filesystem.
  when: (esp_fstype.stdout | trim) != 'vfat'

- name: Get root partition UUID
  ansible.builtin.shell: findmnt -n -o UUID /
  register: root_uuid
  changed_when: false

- name: Get swap partition UUID (for hibernate resume)
  ansible.builtin.shell: |
    set -o pipefail
    swapon --show --noheadings --raw 2>/dev/null \
      | awk '$2 == "partition" {print $1; exit}' \
      | xargs -r blkid -s UUID -o value
  args:
    executable: /bin/bash
  register: swap_uuid
  changed_when: false
  failed_when: false

- name: Check if GRUB exists on ESP (never remove — needed for multi-boot)
  ansible.builtin.find:
    paths: "{{ esp_path }}/EFI"
    patterns: "*.efi"
    recurse: yes
  register: efi_files

- name: Report existing EFI bootloaders found on ESP
  ansible.builtin.debug:
    msg: >
      Existing EFI entries detected: {{ efi_files.files | map(attribute='path') | list }}.
      These are preserved. systemd-boot will be added alongside them as the new UEFI default.
  when: efi_files.files | length > 0

- name: Ensure systemd-boot package is present (Debian/Ubuntu)
  become: yes
  ansible.builtin.apt:
    name: systemd-boot
    state: present
  when: ih_family == 'Debian'

- name: Backup existing loader entries before any write
  become: yes
  ansible.builtin.shell: |
    set -o pipefail
    if [ -d "{{ esp_path }}/loader/entries" ] && \
       [ -n "$(ls -A "{{ esp_path }}/loader/entries" 2>/dev/null)" ]; then
      ts="$(date +%Y%m%d-%H%M%S)"
      mkdir -p "{{ esp_path }}/loader/entries.bak.${ts}"
      cp -a "{{ esp_path }}/loader/entries/." "{{ esp_path }}/loader/entries.bak.${ts}/"
      echo "backed_up_to={{ esp_path }}/loader/entries.bak.${ts}"
    else
      echo "no_existing_entries"
    fi
  args:
    executable: /bin/bash
  register: loader_entries_backup
  changed_when: "'backed_up_to=' in loader_entries_backup.stdout"

- name: Install systemd-boot to ESP (idempotent via creates:)
  become: yes
  ansible.builtin.command: bootctl install --esp-path="{{ esp_path }}" --no-variables
  args:
    creates: "{{ esp_path }}/EFI/systemd/systemd-bootx64.efi"

- name: Update systemd-boot binaries on ESP when already installed
  become: yes
  ansible.builtin.command: bootctl update --esp-path="{{ esp_path }}" --no-variables
  register: bootctl_update
  changed_when: "'Updated' in (bootctl_update.stdout | default(''))"
  failed_when:
    - bootctl_update.rc != 0
    - "'Skipping' not in (bootctl_update.stderr | default(''))"
    - "'is up-to-date' not in (bootctl_update.stdout | default(''))"

- name: Create loader directory
  become: yes
  ansible.builtin.file:
    path: "{{ esp_path }}/loader/entries"
    state: directory
    mode: '0755'

- name: Configure loader.conf
  become: yes
  ansible.builtin.copy:
    dest: "{{ esp_path }}/loader/loader.conf"
    content: |
      {{ ih_timeout }} 3
      default @saved
      console-mode auto
      editor no
    mode: '0644'

- name: Include Arch Linux boot entry setup
  ansible.builtin.include_tasks: arch.yaml
  when: ih_family == 'Archlinux'

- name: Include Debian boot entry setup
  ansible.builtin.include_tasks: debian.yaml
  when: ih_family == 'Debian'

- name: Include Fedora boot entry setup
  ansible.builtin.include_tasks: fedora.yaml
  when: ih_family == 'RedHat'

# --- Verification gate: ensure at least one valid boot entry exists ---

- name: Check for boot entries in loader/entries/
  ansible.builtin.find:
    paths: "{{ esp_path }}/loader/entries"
    patterns: "*.conf"
  register: boot_entry_files

- name: Set verification fact
  ansible.builtin.set_fact:
    systemd_boot_verified: "{{ boot_entry_files.matched > 0 }}"

# Reported and flagged rather than failed hard, and the reasoning is worth stating because the
# opposite looks safer than it is. site.yaml imports this role with no block and no rescue, so a
# `fail` here aborts the entire play before a single package is installed: the user asked for a
# bootloader and would lose the whole run over a missing loader entry. And the machine is not left
# unbootable, which is the case that would justify aborting, because the GRUB removal below is gated
# on systemd_boot_verified and therefore does not happen. So the machine still boots exactly as it did
# before, through the bootloader it already had, and what the user did not get is systemd-boot as a
# working boot path. That is a failure to report at the end with a non-zero exit code, not a reason to
# abandon the run.
- name: Report that systemd-boot has no boot entries — GRUB will NOT be removed
  ansible.builtin.debug:
    msg: >-
      [ERROR] systemd-boot was installed to {{ esp_path }} and NO boot entries exist in
      {{ esp_path }}/loader/entries/, so booting through it would land at an empty menu. GRUB has been
      left in place deliberately and the machine still boots the way it did before. Check the
      kernel-install output above, or write an entry by hand, before enabling remove_distro_grub.
  when: not systemd_boot_verified | bool

- name: Record the missing systemd-boot entries in the play summary
  ansible.builtin.set_fact:
    any_role_failed: true
  when: not systemd_boot_verified | bool

# --- Remove GRUB only if verified AND explicitly requested ---

- name: Remove this distro's GRUB installation
  ansible.builtin.include_tasks: remove_grub.yaml
  when:
    - remove_distro_grub | default(false) | bool
    - systemd_boot_verified | bool
