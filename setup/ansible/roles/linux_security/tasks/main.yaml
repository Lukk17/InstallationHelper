---
- name: Determine swap topology
  ansible.builtin.shell: |
    set -o pipefail
    swapon --show --noheadings --raw 2>/dev/null | awk '{print $1, $2, $3}' | head -1
  register: swap_info
  changed_when: false
  failed_when: false
  become: yes

- name: Set swap presence facts
  ansible.builtin.set_fact:
    swap_present: "{{ swap_info.stdout | length > 0 }}"
    swap_device: "{{ (swap_info.stdout.split() | first) if swap_info.stdout | length > 0 else '' }}"
    swap_type: "{{ (swap_info.stdout.split()[1]) if (swap_info.stdout.split() | length) >= 2 else '' }}"
    swap_size: "{{ (swap_info.stdout.split()[2]) if (swap_info.stdout.split() | length) >= 3 else '' }}"

- name: Extract swap partition UUID
  ansible.builtin.command: blkid -s UUID -o value "{{ swap_device }}"
  register: swap_uuid
  changed_when: false
  failed_when: false
  become: yes
  when:
    - swap_present | bool
    - swap_type == 'partition'

- name: Warn if hibernation is requested but swap is unsuitable
  ansible.builtin.debug:
    msg: >-
      Hibernation configuration skipped: swap_present={{ swap_present }},
      swap_type={{ swap_type | default('none') }}. Hibernation requires a swap
      partition (not file/zram) at least as large as RAM.
  when: not (swap_present | bool) or swap_type != 'partition'

- name: Create PolicyKit modern rule for hibernation
  ansible.builtin.copy:
    dest: /etc/polkit-1/rules.d/10-enable-hibernate.rules
    owner: root
    group: root
    mode: '0644'
    content: |
      polkit.addRule(function(action, subject) {
          if ((action.id == "org.freedesktop.upower.hibernate" ||
               action.id == "org.freedesktop.login1.hibernate" ||
               action.id == "org.freedesktop.login1.hibernate-multiple-sessions") &&
              subject.isInGroup("sudo")) {
              return polkit.Result.YES;
          }
          return polkit.Result.NOT_HANDLED;
      });
  become: yes
  when:
    - swap_present | bool
    - swap_type == 'partition'
