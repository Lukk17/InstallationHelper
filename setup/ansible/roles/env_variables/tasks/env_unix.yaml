---
- name: Set Linux Environment Variables
  ansible.builtin.blockinfile:
    path: "{{ non_root_home }}/.bashrc"
    marker: "# {mark} ANSIBLE DEV APPS CONFIG"
    create: yes
    block: |
      export GRADLE_USER_HOME="$HOME/apps_config/.gradle"
      export DOCKER_CONFIG="$HOME/apps_config/.docker"
      export M2_HOME="$HOME/apps_config/.m2"
      export ANDROID_SDK_HOME="$HOME/apps_config/.android"
      export KUBECONFIG="$HOME/apps_config/.kube/config"
      export ANDROID_SDK_ROOT="/opt/android"
      # Pub (Dart/Flutter) installs user-level executables here; pin it to PATH
      # so the "Pub installs executables into $HOME/.pub-cache/bin, which is
      # not on your path" warning never reappears.
      export PUB_CACHE="$HOME/.pub-cache"
      export PATH="/opt/android/cmdline-tools/latest/bin:/opt/android/platform-tools:/opt/android/emulator:$HOME/.pub-cache/bin:$PATH"
  become: yes
  become_user: "{{ non_root_user }}"
  when: ansible_facts['system'] == 'Linux'

- name: Set macOS Environment Variables
  ansible.builtin.blockinfile:
    path: "{{ non_root_home }}/.zshrc"
    marker: "# {mark} ANSIBLE DEV APPS CONFIG"
    create: yes
    block: |
      export GRADLE_USER_HOME="$HOME/apps_config/.gradle"
      export DOCKER_CONFIG="$HOME/apps_config/.docker"
      export M2_HOME="$HOME/apps_config/.m2"
      export ANDROID_SDK_HOME="$HOME/apps_config/.android"
      export KUBECONFIG="$HOME/apps_config/.kube/config"
      export ANDROID_SDK_ROOT="/opt/android"
      # Pub (Dart/Flutter) installs user-level executables here; pin it to PATH
      # so the "Pub installs executables into $HOME/.pub-cache/bin, which is
      # not on your path" warning never reappears.
      export PUB_CACHE="$HOME/.pub-cache"
      export PATH="/opt/android/cmdline-tools/latest/bin:/opt/android/platform-tools:/opt/android/emulator:$HOME/.pub-cache/bin:$PATH"
  become: yes
  become_user: "{{ non_root_user }}"
  when: ih_family == 'Darwin'
