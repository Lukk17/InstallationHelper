---
# Every static variable and every PATH entry a desktop application and a terminal both need lives in
# one file, dev_env_file, ~/.config/environment.d/990-dev.conf. The systemd user manager reads it at
# login, so an application Plasma or GNOME starts sees it, and every shell imports the same file at
# start, so a terminal, an SSH login and a TTY login see it too. env_unix.yaml, nvm_unix.yaml,
# sdkman_unix.yaml, pyenv_unix.yaml and local_llm.yaml each append their own marked block to it.
#
# Until 2026-10-15 these were export lines in ~/apps_config/env.sh, sourced only from ~/.zshrc and
# ~/.bashrc. Plasma starts its session through a non-interactive login zsh, which never reads .zshrc,
# so /proc/<plasmashell>/environ carried none of them and an IDE started from the menu had no
# ANDROID_HOME, JAVA_HOME or KUBECONFIG. See docs/regression_ledger.md and setup/configuration.md,
# "Shell and environment layout".
- name: Ensure the apps_config directory the variables below point into exists (Linux/macOS)
  ansible.builtin.file:
    path: "{{ non_root_home }}/apps_config"
    state: directory
    owner: "{{ non_root_user }}"
    group: "{{ ih_non_root_group }}"
    mode: '0755'
  become: yes

- name: Ensure the projects directory exists (Linux/macOS)
  ansible.builtin.file:
    path: "{{ projects_dir }}"
    state: directory
    owner: "{{ non_root_user }}"
    group: "{{ ih_non_root_group }}"
    mode: '0755'
  become: yes

- name: Ensure the environment.d directory exists (Linux/macOS)
  ansible.builtin.file:
    path: "{{ dev_env_file | dirname }}"
    state: directory
    mode: '0755'
  become: yes
  become_user: "{{ non_root_user }}"

# KEY=VALUE lines only, because systemd reads this file as well as the shells: environment.d expands
# ${HOME} and ${PATH} and strips a pair of double quotes, and a POSIX shell sourcing it under set -a
# does the same, so one file serves both. No `export`, no `~`, no shell syntax beyond that.
- name: Set Dev Apps Environment Variables (Linux/macOS)
  ansible.builtin.blockinfile:
    path: "{{ dev_env_file }}"
    marker: "# {mark} ANSIBLE DEV APPS CONFIG"
    create: yes
    mode: '0644'
    block: |
      GRADLE_USER_HOME=${HOME}/apps_config/.gradle
      DOCKER_CONFIG=${HOME}/apps_config/.docker
      M2_HOME=${HOME}/apps_config/.m2
      KUBECONFIG=${HOME}/apps_config/.kube/config
      # Where source checkouts live, from projects_dir in group_vars/all.yaml. Quoted, so a path with
      # a space survives both systemd and the shell.
      PROJECTS_DIR="{{ projects_dir }}"
      # The SDK location, from the same android_home the installer writes to. ANDROID_HOME is the
      # current name and ANDROID_SDK_ROOT is the deprecated one, and both are set to the same path
      # because Android Studio and the Gradle plugin check the two for consistency when the old one
      # is present. https://developer.android.com/tools/variables
      ANDROID_HOME="{{ android_home }}"
      ANDROID_SDK_ROOT="{{ android_home }}"
      # The user preferences directory, which is a different thing from the SDK. ANDROID_USER_HOME
      # names it outright. ANDROID_SDK_HOME is the legacy variable Android Studio 4.3 and earlier
      # read, and it names the PARENT the .android directory is created under, so it gets
      # apps_config rather than apps_config/.android.
      ANDROID_USER_HOME=${HOME}/apps_config/.android
      ANDROID_SDK_HOME=${HOME}/apps_config
      # Pub (Dart/Flutter) installs user-level executables into ${HOME}/.pub-cache/bin, on PATH below.
      PUB_CACHE=${HOME}/.pub-cache
      # ${HOME}/fvm/bin is FVM's own binary and ${HOME}/fvm/default/bin the SDK its `fvm global`
      # symlink points at, both under FVM's default fvmDir (lib/src/utils/context.dart). The
      # per-channel directory, ~/fvm/versions/<channel>/bin, carries the channel name and so cannot
      # be a fixed entry. docs/regression_ledger.md has why ${HOME}/fvm/bin is here.
      PATH="{{ android_home }}/cmdline-tools/latest/bin:{{ android_home }}/platform-tools:{{ android_home }}/emulator:${HOME}/.pub-cache/bin:${HOME}/fvm/bin:${HOME}/fvm/default/bin:${PATH}"
  become: yes
  become_user: "{{ non_root_user }}"

# zsh reads .zshenv for every shell it starts, login or not, interactive or not, so this is where it
# imports the file above. With setup_zsh that is ~/.config/zsh/.zshenv, which the ~/.zshenv stub
# shell_zsh writes sources, and without it zsh_config_dir is the home directory and this is
# ~/.zshenv itself. `typeset -U` keeps PATH free of duplicates when a shell starts another one, which
# prepends the same entries again, and it comes first so it covers the import. The `(N)` qualifier
# makes an empty directory import nothing rather than fail on an unmatched glob. The last line drops
# the entries that are not a directory yet, ${HOME}/.pub-cache/bin before the first `dart pub global
# activate` and the Android emulator before Android Studio installs it, so a shell's PATH names only
# what is there. The desktop session keeps them, since systemd cannot test a path.
- name: Ensure the zsh configuration directory exists (Linux/macOS)
  ansible.builtin.file:
    path: "{{ zsh_config_dir }}"
    state: directory
    mode: '0755'
  become: yes
  become_user: "{{ non_root_user }}"

- name: Import environment.d into every zsh (Linux/macOS)
  ansible.builtin.blockinfile:
    path: "{{ zsh_config_dir }}/.zshenv"
    marker: "# {mark} ANSIBLE ENVIRONMENT.D IMPORT"
    create: yes
    mode: '0644'
    block: |
      typeset -U path PATH
      for ih_env_conf in "$HOME"/.config/environment.d/*.conf(N); do
        set -a; . "$ih_env_conf"; set +a
      done
      unset ih_env_conf
      path=($^path(N-/))
  become: yes
  become_user: "{{ non_root_user }}"

# bash has no file it reads for every shell, so the import goes at the very top of ~/.bashrc, ahead of
# the early return every distribution's .bashrc carries for a non-interactive shell. Every supported
# distribution's login file, ~/.bash_profile on Arch and Fedora and ~/.profile on Debian, sources
# ~/.bashrc, so a login bash reads it too. No ~/.bash_profile is created here, because on Debian and
# Ubuntu one would make bash skip ~/.profile. bash has no `typeset -U`, so the loop after the import
# rebuilds PATH the way the zsh block above leaves it: each directory once, and only the ones that
# exist.
- name: Import environment.d into every bash (Linux)
  ansible.builtin.blockinfile:
    path: "{{ non_root_home }}/.bashrc"
    marker: "# {mark} ANSIBLE ENVIRONMENT.D IMPORT"
    insertbefore: BOF
    create: yes
    mode: '0644'
    block: |
      for ih_env_conf in "$HOME"/.config/environment.d/*.conf; do
        [ -r "$ih_env_conf" ] && { set -a; . "$ih_env_conf"; set +a; }
      done
      ih_path=
      IFS=: read -r -a ih_dirs <<<"$PATH"
      for ih_dir in "${ih_dirs[@]}"; do
        [ -d "$ih_dir" ] || continue
        case ":$ih_path:" in *":$ih_dir:"*) ;; *) ih_path="${ih_path:+$ih_path:}$ih_dir" ;; esac
      done
      PATH="$ih_path"
      unset ih_env_conf ih_path ih_dirs ih_dir
  become: yes
  become_user: "{{ non_root_user }}"
  when: ansible_facts['system'] == 'Linux'

# --- migration from the ~/apps_config/env.sh layout -------------------------------------------
# A machine provisioned before 2026-10-15 has ~/apps_config/env.sh and a marked line sourcing it in
# ~/.bashrc and ~/.zshrc. Both lines go, wherever they are, and the file is moved into
# shell_layout_backup_dir rather than deleted. lineinfile with state absent leaves a missing file
# alone, which blockinfile does not, so a machine without one of these files reports ok.
- name: Remove the line that sourced the retired ~/apps_config/env.sh (Linux/macOS)
  ansible.builtin.lineinfile:
    path: "{{ item.0 }}"
    regexp: "{{ item.1 }}"
    state: absent
  loop: "{{ shell_startup_files | product(env_variables_retired_lines) | list }}"
  loop_control:
    label: "{{ item.0 }}"
  vars:
    env_variables_retired_lines:
      - '^# (BEGIN|END) ANSIBLE PROJECT ENV SOURCE$'
      - '^\[ -f "\$HOME/apps_config/env\.sh" \] && \. "\$HOME/apps_config/env\.sh"$'
  become: yes
  become_user: "{{ non_root_user }}"

- name: Move the retired ~/apps_config/env.sh into the shell layout backup (Linux/macOS)
  ansible.builtin.shell: |
    set -eu
    mkdir -p "{{ shell_layout_backup_dir }}"
    mv "{{ non_root_home }}/apps_config/env.sh" "{{ shell_layout_backup_dir }}/env.sh.$(date +%Y%m%d%H%M%S)"
  args:
    executable: /bin/bash
    removes: "{{ non_root_home }}/apps_config/env.sh"
  become: yes
  become_user: "{{ non_root_user }}"

# --- migration from ~/.config/environment.d/50-dev.conf -----------------------------------------
# A machine provisioned between 2026-10-15 and 2026-10-18 has the same blocks in 50-dev.conf, which
# systemd reads before /etc/environment, so on Ubuntu its PATH entries never reached the desktop
# session. env_variables and every role that appends a block write it into dev_env_file on this run,
# so the old file is moved into shell_layout_backup_dir rather than left to repeat every entry.
- name: Move the retired ~/.config/environment.d/50-dev.conf into the shell layout backup (Linux/macOS)
  ansible.builtin.shell: |
    set -eu
    mkdir -p "{{ shell_layout_backup_dir }}"
    mv "{{ env_variables_retired_env_file }}" "{{ shell_layout_backup_dir }}/50-dev.conf.$(date +%Y%m%d%H%M%S)"
  args:
    executable: /bin/bash
    removes: "{{ env_variables_retired_env_file }}"
  vars:
    env_variables_retired_env_file: "{{ dev_env_file | dirname }}/50-dev.conf"
  become: yes
  become_user: "{{ non_root_user }}"
