---
- name: Enable Windows Features
  ansible.windows.win_optional_feature:
    name: "{{ item }}"
    state: present
  loop:
    - VirtualMachinePlatform
    - Microsoft-Windows-Subsystem-Linux
    - HypervisorPlatform
    - NetFx3
    - NetFx4-AdvSrvs
    - NetFx4Extended-ASPNET45
    - Containers-DisposableClientVM
    - Microsoft-Hyper-V
    - ServicesForNFS-ClientOnly
  when: enable_hyperv | bool

- name: Setup WSL and Ubuntu
  ansible.windows.win_shell: |
    wsl --update
    wsl --install -d Ubuntu
  when: setup_wsl | bool
  ignore_errors: yes

- name: Import Hibernate Task
  ansible.windows.win_shell: |
    schtasks /Create /XML "{{ playbook_dir }}\..\tasks\Hibernate@2AM.xml" /TN "\Hibernate@2AM"
  when: import_hibernate_task | bool
  ignore_errors: yes

- name: Create Windows Backgrounds Directory
  ansible.windows.win_file:
    path: "{{ ansible_env.PUBLIC }}\\Pictures\\Backgrounds"
    state: directory
  when: set_custom_wallpaper | bool

- name: Copy wallpapers directory for Windows
  ansible.windows.win_copy:
    src: "{{ playbook_dir }}/../wallpapers/{{ default_wallpaper }}"
    dest: "{{ ansible_env.PUBLIC }}\\Pictures\\Backgrounds\\{{ default_wallpaper }}"
  when: set_custom_wallpaper | bool
  ignore_errors: yes

- name: Set Windows Wallpaper
  ansible.windows.win_regedit:
    path: HKCU:\Control Panel\Desktop
    name: Wallpaper
    data: "{{ ansible_env.PUBLIC }}\\Pictures\\Backgrounds\\{{ default_wallpaper }}"
  when: set_custom_wallpaper | bool

- name: Refresh Windows Desktop to apply wallpaper
  ansible.windows.win_shell: |
    RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters
  when: set_custom_wallpaper | bool
  changed_when: false

# VirtualBox and VMware (Docker Desktop is installed via software_installer role)
- name: Install VirtualBox (Windows)
  community.windows.win_chocolatey:
    name: virtualbox
    state: present
  when: install_virtualbox | default(false) | bool

- name: Install VMware Workstation Player (Windows)
  community.windows.win_chocolatey:
    name: vmware-workstation-player
    state: present
  when: install_vmware | default(false) | bool
