---
- name: Check if GNOME Shell is already installed
  ansible.builtin.stat:
    path: /usr/bin/gnome-shell
  register: gnome_shell_stat

# ubuntu-desktop does not exist in Debian, and apt fails the whole task on an unknown
# name, so this could never install GNOME on plain Debian. Ansible reports Ubuntu as the
# Debian family, so one os_family branch cannot carry the difference: the desktop
# metapackage is keyed on ansible_distribution and everything else stays shared. Debian's
# equivalent is gnome-core, which is the desktop without the full gnome task's extras.
# Both names checked with apt-cache policy in debian:trixie and ubuntu:26.04 containers.
# See docs/regression_ledger.md.
- name: Install the GNOME desktop metapackage (Debian family)
  become: yes
  ansible.builtin.apt:
    name: "{{ 'ubuntu-desktop' if ansible_facts['distribution'] == 'Ubuntu' else 'gnome-core' }}"
    state: present
    update_cache: yes
  register: gnome_apt_meta
  retries: 3
  delay: 10
  until: gnome_apt_meta is succeeded
  when:
    - ansible_facts['os_family'] == 'Debian'
    - not gnome_shell_stat.stat.exists

- name: Install GNOME tooling (Debian family)
  become: yes
  ansible.builtin.apt:
    name:
      - gnome-tweaks
      - gnome-shell-extension-manager
    state: present
  register: gnome_apt_tools
  retries: 3
  delay: 10
  until: gnome_apt_tools is succeeded
  when:
    - ansible_facts['os_family'] == 'Debian'
    - not gnome_shell_stat.stat.exists

- name: Install GNOME Desktop (Fedora)
  become: yes
  ansible.builtin.dnf:
    name: "@GNOME Desktop Environment"
    state: present
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - not gnome_shell_stat.stat.exists

- name: Install GNOME Desktop (Archlinux)
  become: yes
  community.general.pacman:
    name:
      - gnome
      - gnome-tweaks
    state: present
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - not gnome_shell_stat.stat.exists

# A machine has exactly one display manager. systemd models that with a single
# /etc/systemd/system/display-manager.service symlink, so enabling a second one fails with "File
# already exists and is a symlink to ...". That happens whenever KDE and GNOME are both enabled:
# kde_plasma_setup enables sddm first and this task then cannot enable gdm.
#
# The wizard cannot produce that combination, its desktop screen offers one choice, but group_vars
# can, and the e2e all-software scenario does exactly that by turning every toggle true. It failed
# there. Detecting it and saying so is right, because silently leaving whichever display manager
# won is confusing, and failing the run over a genuinely ambiguous request is worse.
- name: Check whether another display manager is already enabled
  ansible.builtin.stat:
    path: /etc/systemd/system/display-manager.service
  register: existing_display_manager
  when: ansible_facts['os_family'] in ['RedHat', 'Archlinux']

- name: Enable GDM Service (Fedora/Arch)
  become: yes
  ansible.builtin.systemd:
    name: gdm
    enabled: yes
  when:
    - ansible_facts['os_family'] in ['RedHat', 'Archlinux']
    - not (existing_display_manager.stat.exists | default(false))
      or 'gdm' in (existing_display_manager.stat.lnk_target | default(''))

- name: Report that GDM was left disabled because another display manager owns the machine
  ansible.builtin.debug:
    msg: "[WARN] GDM was not enabled: {{ existing_display_manager.stat.lnk_target | default('another display manager') }} is already the machine's display manager, and systemd allows only one. Both KDE and GNOME appear to be enabled. Pick one in group_vars, or switch by hand with: sudo systemctl enable gdm --force"
  when:
    - ansible_facts['os_family'] in ['RedHat', 'Archlinux']
    - existing_display_manager.stat.exists | default(false)
    - "'gdm' not in (existing_display_manager.stat.lnk_target | default(''))"

