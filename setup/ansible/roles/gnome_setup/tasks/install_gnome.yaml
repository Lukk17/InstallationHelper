---
# The GNOME desktop and its tooling for every family, from install_gnome's companion_packages entry in
# vars/<OS>.yaml, which setup/ansible/verify_install.yaml reads too, so the verification expects exactly
# what this installs. The desktop comes first in every list: Arch's gnome group, Fedora's @gnome-desktop
# group, and on the Debian family the lineage's metapackage, ubuntu-desktop on Ubuntu lineage and
# gnome-core on Debian lineage, which setup/ansible/tasks/load_os_dict.yaml puts in front from
# lineage_companion_packages in vars/Debian.yaml. ubuntu-desktop does not exist in Debian, and ih_base
# rather than the distribution name, because Linux Mint is Ubuntu lineage under another name. Pop!_OS is
# too, but has its own entry under its os-release ID there, gnome-core, because apt cannot install
# ubuntu-desktop against System76's archive.
#
# One package per call through tasks/install_role_packages.yaml, so one that cannot install costs only
# itself and is named. Until 2026-10-18 all four installs here ran only while /usr/bin/gnome-shell was
# absent, so a machine that already had GNOME got no tooling and the verification could expect none of
# it. A package already present costs one call that changes nothing.
- name: Install the GNOME desktop and its tooling
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: "{{ os_dict.companion_packages.gnome }}"
    role_packages_purpose: the GNOME desktop
  when: ih_family in ['Debian', 'RedHat', 'Archlinux']

# GDM comes with the desktop group, so a desktop that did not install leaves nothing to enable below. It
# is already named as NOT installed, and enabling a unit that does not exist would end the role there.
- name: Remember whether the GNOME desktop installed
  ansible.builtin.set_fact:
    gnome_desktop_missing: "{{ (os_dict.companion_packages.gnome | first) in role_packages_missing }}"
  when: ih_family in ['Debian', 'RedHat', 'Archlinux']

# A machine has exactly one display manager. systemd models that with a single
# /etc/systemd/system/display-manager.service symlink, so enabling a second one fails with "File
# already exists and is a symlink to ...". That happens whenever KDE and GNOME are both enabled:
# kde_plasma_setup enables sddm first and this task then cannot enable gdm.
#
# The wizard cannot produce that combination, its desktop screen offers one choice, but group_vars
# can, and the e2e all-software scenario does exactly that by turning every toggle true. It failed
# there. Detecting it and saying so is right, because silently leaving whichever display manager
# won is confusing, and failing the run over a genuinely ambiguous request is worse.
- name: Check whether another display manager is already enabled
  ansible.builtin.stat:
    path: /etc/systemd/system/display-manager.service
  register: existing_display_manager
  when: ih_family in ['RedHat', 'Archlinux']

- name: Enable GDM Service (Fedora/Arch)
  become: yes
  ansible.builtin.systemd:
    name: gdm
    enabled: yes
  when:
    - ih_family in ['RedHat', 'Archlinux']
    - not (gnome_desktop_missing | default(false) | bool)
    - not (existing_display_manager.stat.exists | default(false))
      or 'gdm' in (existing_display_manager.stat.lnk_target | default(''))

# The report is split in two because the same on-disk state means two different things, and only one
# of them costs the user anything.
#
# Both desktops requested: KDE enabled SDDM first, and SDDM offers a GNOME session on its own login
# screen, so GNOME still starts and nothing was lost. Failing the run there would fail it for asking
# a question that has only one possible answer, and it would turn the e2e all-software scenario, which
# turns every toggle true by design, permanently red for no defect.
#
# GNOME requested on its own and something else owns display-manager.service: the login manager GNOME
# ships is not the one running, which is a thing the user asked for and did not get, so the run says
# so and its exit code says so.
- name: Report that GDM was left disabled because KDE's display manager got there first
  ansible.builtin.debug:
    msg: >-
      [WARN] GDM was not enabled:
      {{ existing_display_manager.stat.lnk_target | default('another display manager') }} is already
      the machine's display manager and systemd allows exactly one. Both KDE and GNOME are enabled,
      so this is the only possible outcome, and SDDM offers a GNOME session at its login screen. To
      make GDM the one instead: sudo systemctl enable gdm --force
  when:
    - ih_family in ['RedHat', 'Archlinux']
    - existing_display_manager.stat.exists | default(false)
    - "'gdm' not in (existing_display_manager.stat.lnk_target | default(''))"
    - install_kde_plasma | default(false) | bool

- name: Report that GNOME was installed without its display manager
  ansible.builtin.debug:
    msg: >-
      [ERROR] GDM was NOT enabled and GNOME was the only desktop requested:
      {{ existing_display_manager.stat.lnk_target | default('another display manager') }} already owns
      /etc/systemd/system/display-manager.service and systemd allows exactly one. GNOME is installed
      but the machine's login manager is not the one it ships, so a graphical login may not offer a
      GNOME session at all. Switch it with: sudo systemctl enable gdm --force
  when:
    - ih_family in ['RedHat', 'Archlinux']
    - existing_display_manager.stat.exists | default(false)
    - "'gdm' not in (existing_display_manager.stat.lnk_target | default(''))"
    - not (install_kde_plasma | default(false) | bool)

- name: Record the missing GNOME display manager in the play summary
  ansible.builtin.set_fact:
    any_role_failed: true
  when:
    - ih_family in ['RedHat', 'Archlinux']
    - existing_display_manager.stat.exists | default(false)
    - "'gdm' not in (existing_display_manager.stat.lnk_target | default(''))"
    - not (install_kde_plasma | default(false) | bool)
