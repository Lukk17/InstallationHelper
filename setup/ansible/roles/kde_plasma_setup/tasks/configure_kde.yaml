---
# The Qt and Frameworks development packages here exist for the applet-window-buttons build
# further down this file, not for Konsave, which is pure Python and needs only pipx. They were
# Qt 5 and Frameworks 5 names, matching a widget source that no longer builds anywhere. The
# whole set is now the Frameworks 6 equivalent, and every name was resolved against the real
# index of the distribution it applies to before being written here:
#   Debian trixie and Ubuntu 26.04   apt-cache show inside the pinned e2e base images
#   Fedora 44                        dnf info inside the pinned e2e base image
#   Arch                             pacman -Si
# libkf5plasma-dev and kf5-plasma-devel became libplasma-dev and libplasma-devel, which drop
# the framework prefix entirely because Plasma 6 moved the library out of Frameworks.
- name: Install pipx and the widget build dependencies (Debian)
  become: yes
  ansible.builtin.apt:
    name:
      - pipx
      - g++
      - extra-cmake-modules
      - qt6-base-dev
      - qt6-declarative-dev
      - libkf6coreaddons-dev
      - libkf6declarative-dev
      - libkf6package-dev
      - libkf6svg-dev
      - libkf6i18n-dev
      - libkf6service-dev
      - libkf6configwidgets-dev
      - libkf6kcmutils-dev
      - libplasma-dev
      # libkdecorations2-dev was the Plasma 5 name and exists in neither Debian trixie nor Ubuntu
      # 26.04. Plasma 6 ships libkdecorations3-dev, confirmed present on both with apt-cache policy.
      # apt fails the whole task on an unknown name, so this made the Konsave build dependencies
      # unbuildable across the entire Debian family. See docs/regression_ledger.md.
      - libkdecorations3-dev
      - gettext
      - cmake
    state: present
  when: ih_family == 'Debian'

- name: Install pipx and the widget build dependencies (Fedora)
  become: yes
  ansible.builtin.dnf:
    name:
      - pipx
      - gcc-c++
      - extra-cmake-modules
      - qt6-qtbase-devel
      - qt6-qtdeclarative-devel
      - kf6-kcoreaddons-devel
      - kf6-kdeclarative-devel
      - kf6-kpackage-devel
      - kf6-ksvg-devel
      - kf6-ki18n-devel
      - kf6-kservice-devel
      - kf6-kconfigwidgets-devel
      - kf6-kcmutils-devel
      - libplasma-devel
      - kdecoration-devel
      - gettext
      - cmake
    state: present
  when: ih_family == 'RedHat'

- name: Install pipx and the widget build dependencies (Arch)
  become: yes
  community.general.pacman:
    name:
      - python-pipx
      - gcc
      - extra-cmake-modules
      - qt6-base
      - qt6-declarative
      - kcoreaddons
      - kdeclarative
      - kpackage
      - ksvg
      - ki18n
      - kservice
      - kconfigwidgets
      - kcmutils
      - kuserfeedback
      # plasma-framework5 was the Plasma 5 name and no longer exists in any Arch repository,
      # so this whole task failed and took the KDE configuration with it. Plasma 6 ships the
      # same library as libplasma. Every other name in this list was checked against the Arch
      # package index at the same time and all of them still resolve. Found by the e2e
      # kde-configure-only scenario. See docs/regression_ledger.md.
      - libplasma
      - kdecoration
      - gettext
      - cmake
    state: present
  when: ih_family == 'Archlinux'

- name: Install Konsave via pipx
  ansible.builtin.shell: pipx ensurepath && pipx install konsave
  args:
    creates: "{{ non_root_home }}/.local/bin/konsave"
  become: yes
  become_user: "{{ non_root_user }}"

- name: Probe Konsave profile source file
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../config/lukk_desktop_profile.knsv"
  register: konsave_profile_file

- name: Import and apply Konsave profile
  ansible.builtin.shell: |
    set -o pipefail
    export PATH="$HOME/.local/bin:$PATH"
    konsave -i {{ playbook_dir }}/../config/lukk_desktop_profile.knsv
    konsave -a lukk_desktop_profile
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  when: konsave_profile_file.stat.exists

- name: Copy wallpapers directory for KDE
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../wallpapers"
    dest: "/usr/share/backgrounds/"
  become: yes
  when: set_custom_wallpaper | bool

# Talking to plasmashell over the session bus needs Plasma to be running and a live D-Bus
# session to reach it on. Neither exists when the playbook runs before a first login, over SSH,
# on a headless box, or in a container, and the task had no tolerance for that, so it hard
# failed and took the whole KDE configuration down with it. The wallpaper is a preference that
# can be applied at the next login, so it is not worth losing a run over. Probing first, and
# saying what happened, mirrors how the Syncthing user unit already handles the same problem.
- name: Probe for a running plasmashell on the session bus
  ansible.builtin.command: >-
    dbus-send --session --dest=org.freedesktop.DBus --type=method_call --print-reply
    /org/freedesktop/DBus org.freedesktop.DBus.NameHasOwner string:org.kde.plasmashell
  register: plasmashell_probe
  changed_when: false
  failed_when: false
  become: yes
  become_user: "{{ non_root_user }}"
  when: set_custom_wallpaper | bool

- name: Set KDE Wallpaper
  ansible.builtin.shell: |
    dbus-send --session --dest=org.kde.plasmashell --type=method_call /PlasmaShell org.kde.PlasmaShell.evaluateScript 'string:
    var Desktops = desktops();
    for (i=0;i<Desktops.length;i++) {
            d = Desktops[i];
            d.wallpaperPlugin = "org.kde.image";
            d.currentConfigGroup = Array("Wallpaper", "org.kde.image", "General");
            d.writeConfig("Image", "file:///usr/share/backgrounds/wallpapers/{{ default_wallpaper }}");
    }'
  changed_when: false
  become: yes
  become_user: "{{ non_root_user }}"
  when:
    - set_custom_wallpaper | bool
    - plasmashell_probe.rc | default(1) == 0
    - "'boolean true' in (plasmashell_probe.stdout | default(''))"

- name: Report that the wallpaper was not applied because Plasma is not running
  ansible.builtin.debug:
    msg: "[WARN] KDE wallpaper not applied: plasmashell is not on the session bus, so there is no running Plasma to tell. Expected before a first login, on a headless machine, or in a container. Set it from System Settings, or rerun with --tags kde after logging into Plasma."
  when:
    - set_custom_wallpaper | bool
    - plasmashell_probe.rc | default(1) != 0 or "'boolean true' not in (plasmashell_probe.stdout | default(''))"

# The plasmoid directory is the same on every distribution, unlike the QML plugin directory,
# which is /usr/lib/qt6/qml on Arch, /usr/lib64/qt6/qml on Fedora and
# /usr/lib/x86_64-linux-gnu/qt6/qml on Debian. Probing the plasmoid instead of the plugin
# removes three hardcoded per-distribution paths and the branch that went with them. The
# previous paths pointed at Plasma 5 locations that nothing writes any more, so the probe
# always reported "not installed" and every run rebuilt the widget from scratch.
- name: Probe for installed applet-window-buttons widget
  ansible.builtin.stat:
    path: /usr/share/plasma/plasmoids/org.kde.windowbuttons/metadata.json
  register: applet_window_buttons_installed

- name: Determine if applet-window-buttons needs build
  ansible.builtin.set_fact:
    applet_window_buttons_needs_build: "{{ not (applet_window_buttons_installed.stat.exists | default(false)) }}"

- name: Clone applet-window-buttons repository
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.git:
    repo: "{{ applet_window_buttons_repo }}"
    dest: "{{ non_root_home }}/applet-window-buttons"
    version: "{{ applet_window_buttons_version }}"
    force: no
    update: no
  when: applet_window_buttons_needs_build | bool

# The widget pins itself to C++14, extra-cmake-modules raises that to 17, and the
# KDecoration3 6.7 headers use defaulted comparison operators and the three-way comparison
# operator, both of which need 20. The compile therefore fails inside a system header before
# it reaches any of the widget's own code. -DCMAKE_CXX_STANDARD=20 on the command line cannot
# fix it, because a plain set() in the CMakeLists wins over the cache entry, and appending
# -std=gnu++20 to CMAKE_CXX_FLAGS cannot either, because CMake emits its own -std flag after
# the user flags and the last one on a GCC command line wins. Raising it at the source is the
# only lever that works. Upstream is on C++14 as of v0.14.0.
- name: Raise the widget C++ standard to 20 for the KDecoration3 headers
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.lineinfile:
    path: "{{ non_root_home }}/applet-window-buttons/CMakeLists.txt"
    regexp: '^set\(CMAKE_CXX_STANDARD [0-9]+\)$'
    line: 'set(CMAKE_CXX_STANDARD 20)'
  when: applet_window_buttons_needs_build | bool

- name: Create build directory
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.file:
    path: "{{ non_root_home }}/applet-window-buttons/build"
    state: directory
    mode: '0755'
  when: applet_window_buttons_needs_build | bool

# One task for every family now. The Debian variant used to override KDE_INSTALL_QMLDIR with a
# literal multiarch path, which is exactly what KDE_INSTALL_USE_QT_SYS_PATHS already derives
# from Qt itself, so the override only had a chance to be wrong.
- name: Run CMake
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.command:
    cmd: cmake -DCMAKE_INSTALL_PREFIX=/usr -DKDE_INSTALL_USE_QT_SYS_PATHS=ON ..
    chdir: "{{ non_root_home }}/applet-window-buttons/build"
    creates: "{{ non_root_home }}/applet-window-buttons/build/Makefile"
  when: applet_window_buttons_needs_build | bool

- name: Compile the widget
  ansible.builtin.shell: |
    set -o pipefail
    timeout 900 make -j{{ ansible_processor_vcpus }} </dev/null
  args:
    chdir: "{{ non_root_home }}/applet-window-buttons/build"
    creates: "{{ non_root_home }}/applet-window-buttons/build/libappletdecoration/libappletdecorationplugin.so"
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  async: 1200
  poll: 30
  register: applet_window_buttons_compile
  changed_when: applet_window_buttons_compile.rc == 0
  failed_when:
    - applet_window_buttons_compile.rc is defined
    - applet_window_buttons_compile.rc != 0
  when: applet_window_buttons_needs_build | bool

- name: Install the compiled widget binaries
  become: yes
  ansible.builtin.command:
    cmd: make install
    chdir: "{{ non_root_home }}/applet-window-buttons/build"
  register: applet_window_buttons_install
  changed_when: applet_window_buttons_install.rc == 0
  when: applet_window_buttons_needs_build | bool

- name: Clear KDE QML and system configuration caches
  ansible.builtin.shell: |
    set -o pipefail
    rm -rf "$HOME/.cache/qmlcache" "$HOME"/.cache/ksycoca6*
    kbuildsycoca6 --noincremental
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  when: applet_window_buttons_install is defined and applet_window_buttons_install is changed

# kwriteconfig5 was dropped with Frameworks 5. Arch's kconfig package ships only
# kwriteconfig6 and kreadconfig6, so this failed with command not found on every Arch run that
# reached it, and changed_when: false does not stop Ansible failing a non-zero command.
- name: Set Spectacle Shortcut
  ansible.builtin.command: kwriteconfig6 --file kglobalshortcutsrc --group spectacle --key RectangularRegionScreenShot "Meta+Shift+S,Meta+Shift+Print,Capture Rectangular Region"
  become: yes
  become_user: "{{ non_root_user }}"
  changed_when: false

# Probe whether the non-root user has an ACTIVE login session (graphical or
# otherwise). Without this gate, `systemctl --user restart` on a headless box
# or fresh first-run fails with "Failed to connect to bus" — there is no
# D-Bus user session to talk to.
- name: Probe for active Plasma user session
  ansible.builtin.command: loginctl show-user {{ non_root_user }} -p State --value
  register: kde_user_state
  changed_when: false
  failed_when: false
  become: yes

- name: Restart Plasma global accel service (only when user session is active)
  ansible.builtin.systemd:
    name: plasma-kglobalaccel.service
    scope: user
    state: restarted
  become: yes
  become_user: "{{ non_root_user }}"
  when: (kde_user_state.stdout | default('') | trim) == 'active'

- name: Restart Plasma shell to load the new widget
  ansible.builtin.systemd:
    name: plasma-plasmashell.service
    scope: user
    state: restarted
  become: yes
  become_user: "{{ non_root_user }}"
  when:
    - (kde_user_state.stdout | default('') | trim) == 'active'
    - applet_window_buttons_install is defined and applet_window_buttons_install is changed

