---
- name: Install pipx and build dependencies for Konsave (Debian)
  become: yes
  ansible.builtin.apt:
    name:
      - pipx
      - g++
      - extra-cmake-modules
      - qtbase5-dev
      - qtdeclarative5-dev
      - libkf5declarative-dev
      - libkf5plasma-dev
      - libkdecorations2-dev
      - gettext
      - cmake
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Install pipx and build dependencies for Konsave (Fedora)
  become: yes
  ansible.builtin.dnf:
    name:
      - pipx
      - gcc-c++
      - extra-cmake-modules
      - qt5-qtbase-devel
      - qt5-qtdeclarative-devel
      - kf5-kdeclarative-devel
      - kf5-plasma-devel
      - kdecoration-devel
      - gettext
      - cmake
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install pipx and build dependencies for Konsave (Arch)
  become: yes
  community.general.pacman:
    name:
      - python-pipx
      - gcc
      - extra-cmake-modules
      - qt5-base
      - qt5-declarative
      - kuserfeedback
      - plasma-framework5
      - kdecoration
      - gettext
      - cmake
    state: present
  when: ansible_facts['os_family'] == 'Archlinux'

- name: Install Konsave via pipx
  ansible.builtin.shell: pipx ensurepath && pipx install konsave
  args:
    creates: "{{ non_root_home }}/.local/bin/konsave"
  become: yes
  become_user: "{{ non_root_user }}"

- name: Probe Konsave profile source file
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../config/lukk_desktop_profile.knsv"
  register: konsave_profile_file

- name: Import and apply Konsave profile
  ansible.builtin.shell: |
    set -o pipefail
    export PATH="$HOME/.local/bin:$PATH"
    konsave -i {{ playbook_dir }}/../config/lukk_desktop_profile.knsv
    konsave -a lukk_desktop_profile
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  when: konsave_profile_file.stat.exists

- name: Copy wallpapers directory for KDE
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../wallpapers"
    dest: "/usr/share/backgrounds/"
  become: yes
  when: set_custom_wallpaper | bool

- name: Set KDE Wallpaper
  ansible.builtin.shell: |
    dbus-send --session --dest=org.kde.plasmashell --type=method_call /PlasmaShell org.kde.PlasmaShell.evaluateScript 'string:
    var Desktops = desktops();
    for (i=0;i<Desktops.length;i++) {
            d = Desktops[i];
            d.wallpaperPlugin = "org.kde.image";
            d.currentConfigGroup = Array("Wallpaper", "org.kde.image", "General");
            d.writeConfig("Image", "file:///usr/share/backgrounds/wallpapers/{{ default_wallpaper }}");
    }'
  when: set_custom_wallpaper | bool
  changed_when: false
  become: yes
  become_user: "{{ non_root_user }}"

- name: Probe for installed applet-window-buttons widget
  ansible.builtin.stat:
    path: /usr/lib/x86_64-linux-gnu/qt5/qml/org/kde/plasma/applet_window_buttons
  register: applet_window_buttons_installed
  when: ansible_facts['os_family'] == 'Debian'

- name: Probe for installed applet-window-buttons widget (RedHat/Arch)
  ansible.builtin.stat:
    path: /usr/lib64/qt5/qml/org/kde/plasma/applet_window_buttons
  register: applet_window_buttons_installed_other
  when: ansible_facts['os_family'] in ['RedHat', 'Archlinux']

- name: Determine if applet-window-buttons needs build
  ansible.builtin.set_fact:
    applet_window_buttons_needs_build: >-
      {{ (ansible_facts['os_family'] == 'Debian'
          and not (applet_window_buttons_installed.stat.exists | default(false)))
         or
         (ansible_facts['os_family'] in ['RedHat', 'Archlinux']
          and not (applet_window_buttons_installed_other.stat.exists | default(false))) }}

- name: Clone applet-window-buttons repository
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.git:
    repo: https://github.com/chermnyx/applet-window-buttons.git
    dest: "{{ non_root_home }}/applet-window-buttons"
    version: dumb_5.27_support
    force: no
    update: no
  when: applet_window_buttons_needs_build | bool

- name: Create build directory
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.file:
    path: "{{ non_root_home }}/applet-window-buttons/build"
    state: directory
    mode: '0755'
  when: applet_window_buttons_needs_build | bool

- name: Run CMake with explicit Ubuntu multiarch paths
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.command:
    cmd: cmake -DCMAKE_INSTALL_PREFIX=/usr -DKDE_INSTALL_USE_QT_SYS_PATHS=ON -DKDE_INSTALL_QMLDIR=/usr/lib/x86_64-linux-gnu/qt5/qml ..
    chdir: "{{ non_root_home }}/applet-window-buttons/build"
    creates: "{{ non_root_home }}/applet-window-buttons/build/Makefile"
  when:
    - ansible_facts['os_family'] == 'Debian'
    - applet_window_buttons_needs_build | bool

- name: Run CMake (Fedora/Arch)
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.command:
    cmd: cmake -DCMAKE_INSTALL_PREFIX=/usr -DKDE_INSTALL_USE_QT_SYS_PATHS=ON ..
    chdir: "{{ non_root_home }}/applet-window-buttons/build"
    creates: "{{ non_root_home }}/applet-window-buttons/build/Makefile"
  when:
    - ansible_facts['os_family'] in ['RedHat', 'Archlinux']
    - applet_window_buttons_needs_build | bool

- name: Compile the widget
  ansible.builtin.shell: |
    set -o pipefail
    timeout 900 make -j{{ ansible_processor_vcpus }} </dev/null
  args:
    chdir: "{{ non_root_home }}/applet-window-buttons/build"
    creates: "{{ non_root_home }}/applet-window-buttons/build/applet/plasma_applet_window_appmenu.so"
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  async: 1200
  poll: 30
  register: applet_window_buttons_compile
  changed_when: applet_window_buttons_compile.rc == 0
  failed_when:
    - applet_window_buttons_compile.rc is defined
    - applet_window_buttons_compile.rc != 0
  when: applet_window_buttons_needs_build | bool

- name: Install the compiled widget binaries
  become: yes
  ansible.builtin.command:
    cmd: make install
    chdir: "{{ non_root_home }}/applet-window-buttons/build"
  register: applet_window_buttons_install
  changed_when: applet_window_buttons_install.rc == 0
  when: applet_window_buttons_needs_build | bool

- name: Clear KDE QML and system configuration caches
  ansible.builtin.shell: |
    set -o pipefail
    rm -rf "$HOME/.cache/qmlcache" "$HOME"/.cache/ksycoca5*
    kbuildsycoca5 --noincremental
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  when: applet_window_buttons_install is defined and applet_window_buttons_install is changed

- name: Set Spectacle Shortcut
  ansible.builtin.command: kwriteconfig5 --file kglobalshortcutsrc --group spectacle --key RectangularRegionScreenShot "Meta+Shift+S,Meta+Shift+Print,Capture Rectangular Region"
  become: yes
  become_user: "{{ non_root_user }}"
  changed_when: false

# Probe whether the non-root user has an ACTIVE login session (graphical or
# otherwise). Without this gate, `systemctl --user restart` on a headless box
# or fresh first-run fails with "Failed to connect to bus" — there is no
# D-Bus user session to talk to.
- name: Probe for active Plasma user session
  ansible.builtin.command: loginctl show-user {{ non_root_user }} -p State --value
  register: kde_user_state
  changed_when: false
  failed_when: false
  become: yes

- name: Restart Plasma global accel service (only when user session is active)
  ansible.builtin.systemd:
    name: plasma-kglobalaccel.service
    scope: user
    state: restarted
  become: yes
  become_user: "{{ non_root_user }}"
  when: (kde_user_state.stdout | default('') | trim) == 'active'

- name: Restart Plasma shell to load the new widget
  ansible.builtin.systemd:
    name: plasma-plasmashell.service
    scope: user
    state: restarted
  become: yes
  become_user: "{{ non_root_user }}"
  when:
    - (kde_user_state.stdout | default('') | trim) == 'active'
    - applet_window_buttons_install is defined and applet_window_buttons_install is changed

