---
# The Qt and Frameworks development packages here exist for the applet-window-buttons build
# further down this file, not for Konsave, which is pure Python and needs only pipx, installed
# below from the pipx mapping in vars/<OS>.yaml. They were
# Qt 5 and Frameworks 5 names, matching a widget source that no longer builds anywhere. The
# whole set is now the Frameworks 6 equivalent, and every name was resolved against the real
# index of the distribution it applies to before being written:
#   Debian trixie and Ubuntu 26.04   apt-cache show inside the pinned e2e base images
#   Fedora 44                        dnf info inside the pinned e2e base image
#   Arch                             pacman -Si
# libkf5plasma-dev and kf5-plasma-devel became libplasma-dev and libplasma-devel, which drop
# the framework prefix entirely because Plasma 6 moved the library out of Frameworks.
#
# One package per call through tasks/install_role_packages.yaml, so one that cannot install costs only
# itself and is named. The list is configure_kde_plasma's companion_packages entry in vars/<OS>.yaml,
# which setup/ansible/verify_install.yaml reads too, with the reason for each renamed package beside it.
# A mirror that resets one connection mid-download no longer ends the run either: Debian's
# kde-configure-only cell in the first GitHub sweep died on exactly that, one .deb into eighteen, with
# 'OpenSSL system call error ... Connection reset by peer' from deb.debian.org, and the shared file
# retries every package that failed.
- name: Install the widget build dependencies
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: "{{ os_dict.companion_packages.configure_kde_plasma }}"
    role_packages_purpose: the widget build dependencies
  when: ih_family in ['Debian', 'RedHat', 'Archlinux']

# pipx is install_pipx's package, named once in vars/<OS>.yaml and installed by software_installer.
# That role runs after this one, so Konsave would find no pipx on a fresh machine, and it needs pipx
# even when install_pipx is off. So the same mapping is installed here first rather than a second
# name being written into this file, which is what the three lists above carried until 2026-10-13.
# The pipx entry of companion_packages comes with it, python-filelock on Arch, which pipx imports
# without depending on it.
# On a machine where software_installer already put it there this reports ok. Through
# tasks/install_role_packages.yaml, the retry rule every package manager follows.
- name: Install pipx, which Konsave is installed with
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: "{{ [os_dict.software_mapping.pipx.package] + (os_dict.companion_packages.pipx | default([])) }}"
    role_packages_purpose: pipx, which Konsave is installed with
  when: ih_family in ['Debian', 'RedHat', 'Archlinux']

# The retry rule every package manager follows, four attempts twenty seconds apart, with no refresh
# between them, because pipx asks the Python package index for every install and keeps no copy of it
# a refresh could bring up to date. Skipped when pipx itself did not install, which the shared file
# above has already named.
- name: Install Konsave via pipx
  ansible.builtin.shell: pipx ensurepath && pipx install konsave
  args:
    creates: "{{ non_root_home }}/.local/bin/konsave"
  become: yes
  become_user: "{{ non_root_user }}"
  register: konsave_install
  until: konsave_install.rc | default(0) == 0
  retries: 3
  delay: 20
  when: os_dict.software_mapping.pipx.package not in (role_packages_missing | default([]))

- name: Probe Konsave profile source file
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../config/lukk_desktop_profile.knsv"
  register: konsave_profile_file

# What konsave writes, as its source says, konsave 2.3.0, whose copy code is unchanged since 2.0.2:
# https://raw.githubusercontent.com/Prayag2/konsave/v2.3.0/konsave/funcs.py
#   konsave -i copies the export section, the themes, icons and wallpapers, to the folders conf.yaml
#   inside the profile names, and konsave -a copies only the save section.
#   copy() never deletes a folder. For each file it removes the file of the same name and copies the
#   new one there, a symbolic link of that name included, and leaves every other file alone.
#   A top-level entry that is a plain file is copied over the old one in place, so it writes through
#   a symbolic link.
#   Each new file has the mode the umask gives, because it is copied from what ZipFile.extractall
#   wrote, and each new folder 0777 less the umask.
# So the run's configuration backup takes every file of both sections first. For the save section that
# is every file it names, together with every file already in a folder it writes, which is more than
# konsave touches. The export section holds thousands of icon files, and each path costs a loop item
# in the backup and again in the end-of-run report, so it names an existing file only where konsave
# changes it: other bytes, a mode, owner or group other than the new file of this user's that konsave
# makes, or a symbolic link, which tasks/config_backup.yaml keeps as the link and as the file it points
# to. Where a file does not exist yet it names the first missing folder or file on the way to it,
# which the summary then lists as created. Run as the user konsave runs as, so the umask and the owner
# are the same, with the interpreter running Ansible, which always carries PyYAML, and under --check
# as well, because it only reads and the backup include needs its list.
# e2e/tier1/config_backup_coverage.sh runs this listing, and the backup around it, on the shipped profile.
- name: List the configuration files the Konsave profile writes
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -I
      - -c
      - |
        import json, os, stat, sys, zipfile
        import yaml
        profile, home = sys.argv[1], sys.argv[2]
        places = {'$CONFIG_DIR': home + '/.config', '$SHARE_DIR': home + '/.local/share',
                  '$BIN_DIR': home + '/.local/bin', '$HOME': home}
        mask = os.umask(0)
        os.umask(mask)

        def resolve(section):
            location = str(section.get('location', ''))
            for placeholder, value in places.items():
                location = location.replace(placeholder, value)
            return os.path.normpath(location)

        def holds(path, data):
            info = os.lstat(path)
            if (not stat.S_ISREG(info.st_mode) or stat.S_IMODE(info.st_mode) != 0o666 & ~mask
                    or (info.st_uid, info.st_gid) != (os.getuid(), os.getgid())):
                return False
            with open(path, 'rb') as handle:
                return handle.read() == data

        def first_missing(location, path):
            current, parts = location, os.path.relpath(path, location).split(os.sep)
            while os.path.lexists(current) and parts:
                current = os.path.join(current, parts.pop(0))
            return current

        with zipfile.ZipFile(profile) as archive:
            conf = yaml.safe_load(archive.read('conf.yaml')) or {}
            save, export = conf.get('save') or {}, conf.get('export') or {}
            paths, folders = set(), set()
            for name in archive.namelist():
                parts = name.split('/', 2)
                if len(parts) != 3 or not parts[2] or name.endswith('/'):
                    continue
                if parts[0] == 'save' and parts[1] in save:
                    location = resolve(save[parts[1]])
                    paths.add(os.path.normpath(os.path.join(location, parts[2])))
                    if '/' in parts[2]:
                        folders.add(os.path.normpath(os.path.join(location, parts[2].split('/', 1)[0])))
                elif parts[0] == 'export' and parts[1] in export:
                    location = resolve(export[parts[1]])
                    path = os.path.normpath(os.path.join(location, parts[2]))
                    if not os.path.lexists(path):
                        paths.add(first_missing(location, path))
                    elif not holds(path, archive.read(name)):
                        paths.add(path)
        for folder in folders:
            for root, _, files in os.walk(folder):
                paths.update(os.path.join(root, file) for file in files)
        print(json.dumps(sorted(paths)))
      - "{{ playbook_dir }}/../config/lukk_desktop_profile.knsv"
      - "{{ non_root_home }}"
  register: konsave_profile_targets
  changed_when: false
  check_mode: false
  become: yes
  become_user: "{{ non_root_user }}"
  when:
    - konsave_profile_file.stat.exists
    - os_dict.software_mapping.pipx.package not in (role_packages_missing | default([]))

# konsave -i refuses a profile of a name it has stored already, with "A profile with this name already
# exists" and exit 0, so a second run would apply the copy stored by the first and never copy the
# export section again. The apply below removes the stored copy with konsave -r first, so the profile
# is imported fresh on every run, and these two ask what that copy holds, so the backup below takes it
# before it goes, a profile of that name the user saved with konsave -s included.
- name: Probe the copy of the profile konsave stored on an earlier run
  ansible.builtin.stat:
    path: "{{ non_root_home }}/.config/konsave/profiles/lukk_desktop_profile"
  register: konsave_saved_profile
  become: yes
  become_user: "{{ non_root_user }}"
  when:
    - konsave_profile_file.stat.exists
    - os_dict.software_mapping.pipx.package not in (role_packages_missing | default([]))

- name: List the files of the copy of the profile konsave stored on an earlier run
  ansible.builtin.find:
    paths: "{{ non_root_home }}/.config/konsave/profiles/lukk_desktop_profile"
    recurse: true
    file_type: any
    hidden: true
  register: konsave_saved_profile_files
  become: yes
  become_user: "{{ non_root_user }}"
  when:
    - konsave_profile_file.stat.exists
    - os_dict.software_mapping.pipx.package not in (role_packages_missing | default([]))
    - konsave_saved_profile.stat.isdir | default(false)

- name: Back up the configuration files the Konsave profile writes, before it writes them
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/config_backup.yaml"
    apply:
      tags: [always]
  vars:
    config_backup_paths: >-
      {{ (konsave_profile_targets.stdout | from_json)
         + (konsave_saved_profile_files.files | default([]) | rejectattr('isdir') | map(attribute='path') | list) }}
  when:
    - konsave_profile_file.stat.exists
    - os_dict.software_mapping.pipx.package not in (role_packages_missing | default([]))
  tags: [always]

# konsave catches every error inside itself, prints it as "Konsave: <error>" on stdout, writes it to
# ~/.cache/konsave_log.txt and exits 0, so a profile half applied still ends with "Profile applied
# successfully!". So the task fails on every "Konsave: " line, on either stream, that is not one of the
# progress lines konsave 2.3.0 printed for -r, -i and -a in a throwaway container on 2026-11-14, the
# same lines the kde-full cell of sweep 39850886667 logged for -i and -a. set -e stops the run when a
# step exits non-zero, as konsave does when even its handler fails, for one when ~/.cache is missing.
# konsave -r runs only where the stored copy exists, because elsewhere it reports "No profile saved
# yet." or "Profile not found.". e2e/tier1/konsave_apply_errors.sh runs this task against a fake
# konsave.
- name: Import and apply Konsave profile
  ansible.builtin.shell: |
    set -e -o pipefail
    export PATH="$HOME/.local/bin:$PATH"
    if [[ -d "$HOME/.config/konsave/profiles/lukk_desktop_profile" ]]; then
        konsave -r lukk_desktop_profile
    fi
    konsave -i {{ playbook_dir }}/../config/lukk_desktop_profile.knsv
    konsave -a lukk_desktop_profile
  args:
    executable: /bin/bash
  register: konsave_apply
  failed_when: >-
    konsave_apply.rc != 0
    or (konsave_apply.stdout_lines + konsave_apply.stderr_lines)
       | select('match', '^Konsave: ') | reject('match', konsave_progress_line) | list | length > 0
  vars:
    konsave_progress_line: >-
      ^Konsave: (removing profile\.\.\.|removed profile successfully|Importing profile\. It might take a minute or
      two\.\.\.|Importing "[^"]*"\.\.\.|Profile successfully imported!|copying files\.\.\.|Profile applied
      successfully! Please log-out and log-in to see the changes completely!)$
  become: yes
  become_user: "{{ non_root_user }}"
  when:
    - konsave_profile_file.stat.exists
    - os_dict.software_mapping.pipx.package not in (role_packages_missing | default([]))

- name: Copy wallpapers directory for KDE
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../wallpapers"
    dest: "/usr/share/backgrounds/"
  become: yes
  when: set_custom_wallpaper | bool

# Talking to plasmashell over the session bus needs Plasma to be running and a live D-Bus
# session to reach it on. Neither exists when the playbook runs before a first login, over SSH,
# on a headless box, or in a container, and the task had no tolerance for that, so it hard
# failed and took the whole KDE configuration down with it. The wallpaper is a preference that
# can be applied at the next login, so it is not worth losing a run over. Probing first, and
# saying what happened, mirrors how the Syncthing user unit already handles the same problem.
- name: Probe for a running plasmashell on the session bus
  ansible.builtin.command: >-
    dbus-send --session --dest=org.freedesktop.DBus --type=method_call --print-reply
    /org/freedesktop/DBus org.freedesktop.DBus.NameHasOwner string:org.kde.plasmashell
  register: plasmashell_probe
  changed_when: false
  failed_when: false
  become: yes
  become_user: "{{ non_root_user }}"
  when: set_custom_wallpaper | bool

# Plasma is asked which wallpaper each desktop shows before and after, and the task reports a change when
# the answers differ, or when the answer after names no image wallpaper at all and so proves nothing,
# docs/regression_ledger.md 10.364. The first line of each reply carries a serial number, so it is dropped.
- name: Set KDE Wallpaper
  ansible.builtin.shell: |
    set -eo pipefail
    read_wallpapers() {
      dbus-send --session --dest=org.kde.plasmashell --type=method_call --print-reply /PlasmaShell org.kde.PlasmaShell.evaluateScript 'string:
      var Desktops = desktops();
      for (i=0;i<Desktops.length;i++) {
              d = Desktops[i];
              d.currentConfigGroup = Array("Wallpaper", "org.kde.image", "General");
              print(d.wallpaperPlugin + " " + d.readConfig("Image") + "\n");
      }' | sed -n '2,$p'
    }
    before="$(read_wallpapers || true)"
    dbus-send --session --dest=org.kde.plasmashell --type=method_call /PlasmaShell org.kde.PlasmaShell.evaluateScript 'string:
    var Desktops = desktops();
    for (i=0;i<Desktops.length;i++) {
            d = Desktops[i];
            d.wallpaperPlugin = "org.kde.image";
            d.currentConfigGroup = Array("Wallpaper", "org.kde.image", "General");
            d.writeConfig("Image", "file:///usr/share/backgrounds/wallpapers/{{ default_wallpaper }}");
    }'
    after="$(read_wallpapers || true)"
    if ! grep -q 'org.kde.image' <<<"${after}" || [ "${before}" != "${after}" ]; then
      printf 'ih_changed=wallpaper set\n'
    fi
  args:
    executable: /bin/bash
  register: kde_wallpaper
  changed_when: "'ih_changed=' in (kde_wallpaper.stdout | default(''))"
  become: yes
  become_user: "{{ non_root_user }}"
  when:
    - set_custom_wallpaper | bool
    - plasmashell_probe.rc | default(1) == 0
    - "'boolean true' in (plasmashell_probe.stdout | default(''))"

- name: Report that the wallpaper was not applied because Plasma is not running
  ansible.builtin.debug:
    msg: "[WARN] KDE wallpaper not applied: plasmashell is not on the session bus, so there is no running Plasma to tell. Expected before a first login, on a headless machine, or in a container. Set it from System Settings, or rerun with --tags kde after logging into Plasma."
  when:
    - set_custom_wallpaper | bool
    - plasmashell_probe.rc | default(1) != 0 or "'boolean true' not in (plasmashell_probe.stdout | default(''))"

# The plasmoid directory is the same on every distribution, unlike the QML plugin directory,
# which is /usr/lib/qt6/qml on Arch, /usr/lib64/qt6/qml on Fedora and
# /usr/lib/x86_64-linux-gnu/qt6/qml on Debian. Probing the plasmoid instead of the plugin
# removes three hardcoded per-distribution paths and the branch that went with them. The
# previous paths pointed at Plasma 5 locations that nothing writes any more, so the probe
# always reported "not installed" and every run rebuilt the widget from scratch.
- name: Probe for installed applet-window-buttons widget
  ansible.builtin.stat:
    path: /usr/share/plasma/plasmoids/org.kde.windowbuttons/metadata.json
  register: applet_window_buttons_installed

- name: Determine if applet-window-buttons needs build
  ansible.builtin.set_fact:
    applet_window_buttons_needs_build: "{{ not (applet_window_buttons_installed.stat.exists | default(false)) }}"

- name: Clone applet-window-buttons repository
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.git:
    repo: "{{ applet_window_buttons_repo }}"
    dest: "{{ non_root_home }}/applet-window-buttons"
    version: "{{ applet_window_buttons_version }}"
    force: no
    update: no
  when: applet_window_buttons_needs_build | bool

# The widget pins itself to C++14, extra-cmake-modules raises that to 17, and the
# KDecoration3 6.7 headers use defaulted comparison operators and the three-way comparison
# operator, both of which need 20. The compile therefore fails inside a system header before
# it reaches any of the widget's own code. -DCMAKE_CXX_STANDARD=20 on the command line cannot
# fix it, because a plain set() in the CMakeLists wins over the cache entry, and appending
# -std=gnu++20 to CMAKE_CXX_FLAGS cannot either, because CMake emits its own -std flag after
# the user flags and the last one on a GCC command line wins. Raising it at the source is the
# only lever that works. Upstream is on C++14 as of v0.14.0.
  # Retried, because this reaches the network and a single dropped connection must not cost the
  # run. Four separate transients hit one sweep on 2026-08-22: a broken pipe from deb.debian.org,
  # a connection reset from GitHub on a font, an SSL connect error fetching an AppImage, and a TLS
  # eof from python.org.
  register: applet_window_buttons_clone
  until: applet_window_buttons_clone is succeeded
  retries: 3
  delay: 10
- name: Raise the widget C++ standard to 20 for the KDecoration3 headers
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.lineinfile:
    path: "{{ non_root_home }}/applet-window-buttons/CMakeLists.txt"
    regexp: '^set\(CMAKE_CXX_STANDARD [0-9]+\)$'
    line: 'set(CMAKE_CXX_STANDARD 20)'
  when: applet_window_buttons_needs_build | bool

- name: Create build directory
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.file:
    path: "{{ non_root_home }}/applet-window-buttons/build"
    state: directory
  when: applet_window_buttons_needs_build | bool

# One task for every family now. The Debian variant used to override KDE_INSTALL_QMLDIR with a
# literal multiarch path, which is exactly what KDE_INSTALL_USE_QT_SYS_PATHS already derives
# from Qt itself, so the override only had a chance to be wrong.
- name: Run CMake
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.command:
    cmd: cmake -DCMAKE_INSTALL_PREFIX=/usr -DKDE_INSTALL_USE_QT_SYS_PATHS=ON ..
    chdir: "{{ non_root_home }}/applet-window-buttons/build"
    creates: "{{ non_root_home }}/applet-window-buttons/build/Makefile"
  when: applet_window_buttons_needs_build | bool

- name: Compile the widget
  ansible.builtin.shell: |
    set -o pipefail
    {{ ih_timeout }} 900 make -j{{ ansible_facts['processor_vcpus'] }} </dev/null
  args:
    chdir: "{{ non_root_home }}/applet-window-buttons/build"
    creates: "{{ non_root_home }}/applet-window-buttons/build/libappletdecoration/libappletdecorationplugin.so"
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  async: 1200
  poll: 30
  register: applet_window_buttons_compile
  changed_when: applet_window_buttons_compile.rc == 0
  failed_when:
    - applet_window_buttons_compile.rc is defined
    - applet_window_buttons_compile.rc != 0
  when: applet_window_buttons_needs_build | bool

- name: Install the compiled widget binaries
  become: yes
  ansible.builtin.command:
    cmd: make install
    chdir: "{{ non_root_home }}/applet-window-buttons/build"
  register: applet_window_buttons_install
  changed_when: applet_window_buttons_install.rc == 0
  when: applet_window_buttons_needs_build | bool

- name: Clear KDE QML and system configuration caches
  ansible.builtin.shell: |
    set -o pipefail
    rm -rf "$HOME/.cache/qmlcache" "$HOME"/.cache/ksycoca6*
    kbuildsycoca6 --noincremental
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  when: applet_window_buttons_install is defined and applet_window_buttons_install is changed

# kwriteconfig5 was dropped with Frameworks 5. Arch's kconfig package ships only
# kwriteconfig6 and kreadconfig6, so this failed with command not found on every Arch run that
# reached it, and changed_when: false does not stop Ansible failing a non-zero command.
#
# The key is read before and after the write, and the task reports a change when the two differ,
# docs/regression_ledger.md 10.364.
- name: Set Spectacle Shortcut
  ansible.builtin.shell: |
    set -e
    before="$(kreadconfig6 --file kglobalshortcutsrc --group spectacle --key RectangularRegionScreenShot || true)"
    kwriteconfig6 --file kglobalshortcutsrc --group spectacle --key RectangularRegionScreenShot "Meta+Shift+S,Meta+Shift+Print,Capture Rectangular Region"
    after="$(kreadconfig6 --file kglobalshortcutsrc --group spectacle --key RectangularRegionScreenShot || true)"
    if [ "${before}" != "${after}" ]; then
      printf 'ih_changed=Spectacle shortcut set\n'
    fi
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: spectacle_shortcut
  changed_when: "'ih_changed=' in (spectacle_shortcut.stdout | default(''))"

# Probe whether the non-root user has an ACTIVE login session (graphical or
# otherwise). Without this gate, `systemctl --user restart` on a headless box
# or fresh first-run fails with "Failed to connect to bus" — there is no
# D-Bus user session to talk to.
- name: Probe for active Plasma user session
  ansible.builtin.command: loginctl show-user {{ non_root_user }} -p State --value
  register: kde_user_state
  changed_when: false
  failed_when: false
  become: yes

- name: Restart Plasma global accel service (only when user session is active)
  ansible.builtin.systemd:
    name: plasma-kglobalaccel.service
    scope: user
    state: restarted
  become: yes
  become_user: "{{ non_root_user }}"
  when: (kde_user_state.stdout | default('') | trim) == 'active'

- name: Restart Plasma shell to load the new widget
  ansible.builtin.systemd:
    name: plasma-plasmashell.service
    scope: user
    state: restarted
  become: yes
  become_user: "{{ non_root_user }}"
  when:
    - (kde_user_state.stdout | default('') | trim) == 'active'
    - applet_window_buttons_install is defined and applet_window_buttons_install is changed
