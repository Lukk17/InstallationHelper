---
- name: Install pipx and build dependencies for Konsave (Debian)
  become: yes
  ansible.builtin.apt:
    name:
      - pipx
      - g++
      - extra-cmake-modules
      - qtbase5-dev
      - qtdeclarative5-dev
      - libkf5declarative-dev
      - libkf5plasma-dev
      - libkdecorations2-dev
      - gettext
      - cmake
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Install pipx and build dependencies for Konsave (Fedora)
  become: yes
  ansible.builtin.dnf:
    name:
      - pipx
      - gcc-c++
      - extra-cmake-modules
      - qt5-qtbase-devel
      - qt5-qtdeclarative-devel
      - kf5-kdeclarative-devel
      - kf5-plasma-devel
      - kdecoration-devel
      - gettext
      - cmake
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install pipx and build dependencies for Konsave (Arch)
  become: yes
  community.general.pacman:
    name:
      - python-pipx
      - gcc
      - extra-cmake-modules
      - qt5-base
      - qt5-declarative
      - kuserfeedback
      - plasma-framework5
      - kdecoration
      - gettext
      - cmake
    state: present
  when: ansible_facts['os_family'] == 'Archlinux'

- name: Install Konsave via pipx
  ansible.builtin.shell: pipx ensurepath && pipx install konsave
  args:
    creates: "{{ non_root_home }}/.local/bin/konsave"
  become: yes
  become_user: "{{ non_root_user }}"

- name: Import and apply Konsave profile
  ansible.builtin.shell: |
    export PATH="$HOME/.local/bin:$PATH"
    konsave -i {{ playbook_dir }}/../config/lukk_desktop_profile.knsv
    konsave -a lukk_desktop_profile
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"

- name: Copy wallpapers directory for KDE
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../wallpapers"
    dest: "/usr/share/backgrounds/"
  become: yes
  when: set_custom_wallpaper | bool

- name: Set KDE Wallpaper
  ansible.builtin.shell: |
    dbus-send --session --dest=org.kde.plasmashell --type=method_call /PlasmaShell org.kde.PlasmaShell.evaluateScript 'string:
    var Desktops = desktops();
    for (i=0;i<Desktops.length;i++) {
            d = Desktops[i];
            d.wallpaperPlugin = "org.kde.image";
            d.currentConfigGroup = Array("Wallpaper", "org.kde.image", "General");
            d.writeConfig("Image", "file:///usr/share/backgrounds/wallpapers/{{ default_wallpaper }}");
    }'
  when: set_custom_wallpaper | bool
  changed_when: false
  become: yes
  become_user: "{{ non_root_user }}"

- name: Clone applet-window-buttons repository
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.git:
    repo: https://github.com/chermnyx/applet-window-buttons.git
    dest: "{{ non_root_home }}/applet-window-buttons"
    version: dumb_5.27_support
    force: yes

- name: Create build directory
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.file:
    path: "{{ non_root_home }}/applet-window-buttons/build"
    state: directory

- name: Run CMake with explicit Ubuntu multiarch paths
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.command:
    cmd: cmake -DCMAKE_INSTALL_PREFIX=/usr -DKDE_INSTALL_USE_QT_SYS_PATHS=ON -DKDE_INSTALL_QMLDIR=/usr/lib/x86_64-linux-gnu/qt5/qml ..
    chdir: "{{ non_root_home }}/applet-window-buttons/build"
  when: ansible_facts['os_family'] == 'Debian'

- name: Run CMake (Fedora/Arch)
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.command:
    cmd: cmake -DCMAKE_INSTALL_PREFIX=/usr -DKDE_INSTALL_USE_QT_SYS_PATHS=ON ..
    chdir: "{{ non_root_home }}/applet-window-buttons/build"
  when: ansible_facts['os_family'] in ['RedHat', 'Archlinux']

- name: Compile the widget
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.command:
    cmd: "make -j{{ ansible_processor_vcpus }}"
    chdir: "{{ non_root_home }}/applet-window-buttons/build"

- name: Install the compiled widget binaries
  become: yes
  ansible.builtin.command:
    cmd: make install
    chdir: "{{ non_root_home }}/applet-window-buttons/build"

- name: Clear KDE QML and system configuration caches
  ansible.builtin.shell: |
    rm -rf ~/.cache/qmlcache ~/.cache/ksycoca5*
    kbuildsycoca5 --noincremental
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"

- name: Set Spectacle Shortcut
  ansible.builtin.command: kwriteconfig5 --file kglobalshortcutsrc --group spectacle --key RectangularRegionScreenShot "Meta+Shift+S,Meta+Shift+Print,Capture Rectangular Region"

- name: Restart Plasma global accel service
  ansible.builtin.shell: systemctl --user restart plasma-kglobalaccel.service
  args:
    executable: /bin/bash

- name: Restart Plasma shell to load the new widget
  ansible.builtin.shell: systemctl --user restart plasma-plasmashell.service
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"

