---
- name: Disable Ubuntu default IBus injection for Wayland compatibility
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.copy:
    dest: "{{ non_root_home }}/.xinputrc"
    content: |
      run_im none
    mode: '0644'
  when: ih_family == 'Debian'

- name: Pre-answer display manager prompt for SDDM (Debian)
  become: yes
  ansible.builtin.debconf:
    name: sddm
    question: shared/default-x-display-manager
    value: sddm
    vtype: select
  when: ih_family == 'Debian'

# Two package names in the old list stopped existing when Debian and Ubuntu moved to
# Plasma 6, and a third only ever existed on Ubuntu. apt fails the whole task when any
# name in its list is unknown, so this task could not succeed on either distribution.
#
#   plasma-workspace-wayland                     gone, Wayland is part of plasma-workspace now
#   plasma-look-and-feel-org.kde.breeze.desktop  gone, replaced by the breeze metapackage
#   language-pack-kde-pl                         Ubuntu only, absent from Debian
#
# Ansible reports Ubuntu as the Debian family, so a single family branch cannot express
# that last difference. The shared list is keyed on the family and the difference on
# ih_base, which is Ubuntu lineage rather than the distribution's own name, so Pop!_OS and
# Linux Mint get the language pack and Linux Mint Debian Edition does not. See
# setup/ansible/tasks/derive_os_facts.yaml. Every name in the Debian family's list, now kde_plasma in
# vars/Debian.yaml, was checked with apt-cache policy in both a debian:trixie and an ubuntu:26.04 container. See docs/regression_ledger.md.
#
# Ubuntu ships translated KDE strings as language packs, Debian does not package them at
# all and gets its translations with the applications. Kept separate rather than dropped,
# because losing it would silently change what an Ubuntu user gets.
- name: Install the Polish KDE language pack (Ubuntu only)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages:
      - language-pack-kde-pl
    role_packages_purpose: the Polish KDE translations
  when:
    - ih_family == 'Debian'
    - ih_base == 'ubuntu'

# The packages for every family: the Debian family's shared list, Fedora's @kde-desktop group with sddm
# beside it, and the Arch metapackages. One package per call through tasks/install_role_packages.yaml, so
# one that cannot install costs only itself and is named.
#
# On Fedora the group is named by its id, kde-desktop, whose display name on Fedora 44 is simply "KDE":
# an id is what the packaging system guarantees, and the display name "@GNOME Desktop Environment"
# matched nothing at all for GNOME. sddm is named beside the group, not left to it, because the group
# does not contain it, checked with dnf group info on fedora:44: without it the ownership fix below
# failed with "chown failed: failed to look up user sddm". The verification finds the group among the
# groups dnf records as installed, the way it finds GNOME's @gnome-desktop. Until 2026-10-19 the group
# had its own install task and was verified by /usr/bin/plasmashell alone.
#
# The list is install_kde_plasma's companion_packages entry in vars/<OS>.yaml, which
# setup/ansible/verify_install.yaml reads too. The apt index is the one the
# pre_tasks in site.yaml refreshed through tasks/apt_cache_refresh.yaml, which is why the update_cache
# this task used to carry is not repeated.
#
# Last of the installs on purpose: sddm is in this list, and the task below reads role_packages_missing,
# which only the most recent install sets. With the Ubuntu language pack installed after the Debian list,
# as it was, an Ubuntu sddm that did not install was never noticed there.
- name: Install KDE Plasma Wayland
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: "{{ os_dict.companion_packages.kde_plasma }}"
    role_packages_purpose: the KDE Plasma desktop
  when: ih_family in ['Debian', 'RedHat', 'Archlinux']

# Every SDDM task below works on the display manager, so an sddm that did not install leaves them
# nothing to work on. It is already named as NOT installed, and the first of them to touch it, the
# ownership fix, would otherwise end the role with "failed to look up user sddm".
- name: Remember whether SDDM installed
  ansible.builtin.set_fact:
    kde_sddm_missing: "{{ 'sddm' in role_packages_missing }}"
  when: ih_family in ['Debian', 'RedHat', 'Archlinux']

- name: Set SDDM input method config
  become: yes
  ansible.builtin.blockinfile:
    path: /etc/sddm.conf
    create: yes
    block: |
      [General]
      InputMethod=
    mode: '0644'

- name: Reconfigure SDDM (Debian)
  become: yes
  ansible.builtin.command: dpkg-reconfigure -f noninteractive sddm
  when:
    - ih_family == 'Debian'
    - not (kde_sddm_missing | default(false) | bool)

- name: Fix SDDM directory ownership
  become: yes
  ansible.builtin.file:
    path: /var/lib/sddm
    owner: sddm
    group: sddm
    recurse: yes
  when: not (kde_sddm_missing | default(false) | bool)

# Ask before enabling, because on Fedora the package has already done it under another name.
#
# Plasma 6.5 renamed SDDM to Plasma Login, and Fedora's sddm 0.21 ships plasmalogin.service beside
# sddm.service with a scriptlet that points /etc/systemd/system/display-manager.service at it. So
# enabling the unit called sddm afterwards fails outright: "File
# '/etc/systemd/system/display-manager.service' already exists and is a symlink to
# /usr/lib/systemd/system/plasmalogin.service". Measured on the Fedora kde-full run of 2026-08-21,
# which is the first time this repository ran a desktop scenario outside Arch.
#
# A display manager that is already configured is the desired end state, so this reports it and moves
# on rather than fighting the package's own decision. Arch installs sddm with no scriptlet of that
# kind, so there the symlink is absent and the enable below does the work.
- name: Ask whether a display manager is already configured (Fedora/Arch)
  ansible.builtin.stat:
    path: /etc/systemd/system/display-manager.service
  register: display_manager_link
  when: ih_family in ['RedHat', 'Archlinux']

- name: Say which display manager the distribution already chose (Fedora/Arch)
  ansible.builtin.debug:
    msg: >-
      display-manager.service already points at
      {{ display_manager_link.stat.lnk_target | default('a unit systemd resolved itself') }},
      so sddm is not enabled again. That is the end state this task wants.
  when:
    - ih_family in ['RedHat', 'Archlinux']
    - display_manager_link.stat.exists | default(false)

- name: Enable SDDM Service (Fedora/Arch)
  become: yes
  ansible.builtin.systemd:
    name: sddm
    enabled: yes
  when:
    - ih_family in ['RedHat', 'Archlinux']
    - not (display_manager_link.stat.exists | default(false))
    - not (kde_sddm_missing | default(false) | bool)
