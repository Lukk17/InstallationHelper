---
# --- Passwordless sudo for the invoking user ---
# Without this, sudo on long Ubuntu installs can re-prompt for a password and
# inject "[sudo] password for X:" into the module's captured stdout, breaking
# JSON deserialization ("Module result deserialization failed: No start of
# json char found"). The initial sudo for THIS task is authorised via the -K
# password the wizard captured at start. Mirrors arch_core's pattern.
- name: Configure passwordless sudo for non-root user (Debian/Ubuntu)
  become: true
  ansible.builtin.copy:
    dest: /etc/sudoers.d/99-ansible-user
    content: "{{ non_root_user }} ALL=(ALL) NOPASSWD: ALL\n"
    mode: '0440'
    validate: 'visudo -cf %s'

# --- Enable contrib and non-free repos (Debian) ---

- name: Enable contrib and non-free Debian repositories
  become: yes
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/contrib-non-free.list
    content: |
      deb https://deb.debian.org/debian {{ ih_apt_codename }} contrib non-free non-free-firmware
    mode: '0644'
  when: ansible_facts['distribution'] == 'Debian'

# site.yaml runs this role without a rescue, on purpose, because it is the bootstrap
# everything later depends on. So one transient failure reaching a mirror aborts the whole
# run before a single package is installed. That happened for real on the Flathub task in
# system_core, killing two runs fifteen minutes in with nothing installed. Every task in
# this file that reaches the network therefore retries. The tasks that only write a
# sources.list file deliberately do not, because retrying a local file write three times
# just delays a permanent error.
- name: Update APT cache after enabling contrib/non-free
  become: yes
  ansible.builtin.apt:
    update_cache: yes
  changed_when: false
  register: apt_cache_contrib
  retries: 3
  delay: 10
  until: apt_cache_contrib is succeeded
  when: ansible_facts['distribution'] == 'Debian'

# curl and gpg, for the whole Debian family, before anything reaches for them.
#
# This task installed curl only, gated on the distribution being Debian, and the next block in this
# role then fetched the Antigravity signing key with `curl | gpg` on every Debian-family machine. That
# key now lives in software_installer/tasks/debian_repos.yaml, and every repository key there still
# needs gpg. So on Ubuntu neither tool was installed and the key task died with "curl: command not
# found" followed by "gpg: command not found", 58 seconds into a run that then abandoned every
# remaining role. Measured on the
# ubuntu:26.04 container in the sweep of 2026-08-17, where 18 tasks ran out of 239 on Debian, and the
# verification correctly reported more than twenty packages missing.
#
# gpg was never installed anywhere, on any distribution. Debian's image happened to carry both tools,
# which is why this only surfaced on Ubuntu, and a real desktop usually has them too. That is the
# whole failure mode: a prerequisite that is usually already there.
#
# ca-certificates joins them because a curl over https with no trust store fails the same way, later
# and less clearly.
# One package per call through tasks/install_role_packages.yaml, so one that cannot install costs only
# itself and is named.
- name: Install curl, gpg and certificates before any repository key is fetched (Debian family)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages:
      - curl
      - gnupg
      - ca-certificates
    role_packages_purpose: the tools a repository key is fetched with
  when: ih_family == 'Debian'

# Through tasks/install_role_packages.yaml, the retry rule every package manager follows, and the
# tasks that need snapd skip when it did not install, because the shared file has already named it. The
# list is install_snapd's companion_packages entry in vars/Debian.yaml, which verify_install.yaml reads
# too. Under install_snapd, as on Fedora and Arch, everywhere in the family but Ubuntu itself. Ubuntu
# ships snapd with the system, so there the playbook never installs it, never removes it and never
# touches its socket, and the snap mappings install whatever install_snapd says. Pop!_OS and Linux Mint
# follow install_snapd like Debian. Both answers come from setup/ansible/tasks/snap_availability.yaml,
# which the software installer and the verification read too, so the three cannot disagree about what
# snapd means on this machine.
- name: Decide whether snapd ships with this system (Debian family)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/snap_availability.yaml"
    apply:
      tags: [always]
  when: ih_family == 'Debian'

- name: Install snapd (Debian family, not Ubuntu itself)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: "{{ os_dict.companion_packages.snapd }}"
    role_packages_purpose: the snap daemon
  when:
    - ih_family == 'Debian'
    - install_snapd | default(false) | bool
    - not (ih_snapd_with_system | bool)

- name: Remember whether snapd installed (Debian family, not Ubuntu itself)
  ansible.builtin.set_fact:
    debian_snapd_missing: "{{ 'snapd' in (role_packages_missing | default([])) }}"
  when:
    - ih_family == 'Debian'
    - install_snapd | default(false) | bool
    - not (ih_snapd_with_system | bool)

- name: Enable snapd socket (Debian family, not Ubuntu itself)
  become: yes
  ansible.builtin.systemd:
    name: snapd.socket
    state: started
    enabled: yes
  when:
    - ih_family == 'Debian'
    - install_snapd | default(false) | bool
    - not (ih_snapd_with_system | bool)
    - not (debian_snapd_missing | default(false) | bool)

# NOTE: Removed manual symlink creation - not needed with modern snapd

- name: Ensure /sbin is in PATH for all users (Debian)
  become: yes
  ansible.builtin.copy:
    dest: /etc/profile.d/sbin-path.sh
    content: |
      # Ensure /sbin and /usr/sbin are in PATH (needed for ldconfig, etc.)
      if ! echo "$PATH" | grep -q "/sbin"; then
        export PATH="$PATH:/sbin:/usr/sbin"
      fi
    mode: '0644'

# The Antigravity apt repository used to be set up here, as critical bootstrap with no rescue, so a key
# host that did not answer stopped the whole run before a single package was installed. It lives in
# software_installer/tasks/debian_repos.yaml now, as its own block with a rescue like every other
# third-party repository, and that is the only place it is defined.
