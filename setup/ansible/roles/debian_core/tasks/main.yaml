---
# --- Passwordless sudo for the invoking user ---
# Without this, sudo on long Ubuntu installs can re-prompt for a password and
# inject "[sudo] password for X:" into the module's captured stdout, breaking
# JSON deserialization ("Module result deserialization failed: No start of
# json char found"). The initial sudo for THIS task is authorised via the -K
# password the wizard captured at start. Mirrors arch_core's pattern.
- name: Configure passwordless sudo for non-root user (Debian/Ubuntu)
  become: true
  ansible.builtin.copy:
    dest: /etc/sudoers.d/99-ansible-user
    content: "{{ non_root_user }} ALL=(ALL) NOPASSWD: ALL\n"
    mode: '0440'
    validate: 'visudo -cf %s'

# --- Enable contrib and non-free repos (Debian) ---

- name: Enable contrib and non-free Debian repositories
  become: yes
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/contrib-non-free.list
    content: |
      deb https://deb.debian.org/debian {{ ansible_facts['distribution_release'] }} contrib non-free non-free-firmware
    mode: '0644'
  when: ansible_facts['distribution'] == 'Debian'

# site.yaml runs this role without a rescue, on purpose, because it is the bootstrap
# everything later depends on. So one transient failure reaching a mirror aborts the whole
# run before a single package is installed. That happened for real on the Flathub task in
# system_core, killing two runs fifteen minutes in with nothing installed. Every task in
# this file that reaches the network therefore retries. The tasks that only write a
# sources.list file deliberately do not, because retrying a local file write three times
# just delays a permanent error.
- name: Update APT cache after enabling contrib/non-free
  become: yes
  ansible.builtin.apt:
    update_cache: yes
  changed_when: false
  register: apt_cache_contrib
  retries: 3
  delay: 10
  until: apt_cache_contrib is succeeded
  when: ansible_facts['distribution'] == 'Debian'

# curl and gpg, for the whole Debian family, before anything reaches for them.
#
# This task installed curl only, gated on the distribution being Debian, and the very next block
# fetches the Antigravity signing key with `curl | gpg` on every Debian-family machine. So on Ubuntu
# neither tool was installed and the key task died with "curl: command not found" followed by "gpg:
# command not found", 58 seconds into a run that then abandoned every remaining role. Measured on the
# ubuntu:26.04 container in the sweep of 2026-08-17, where 18 tasks ran out of 239 on Debian, and the
# verification correctly reported more than twenty packages missing.
#
# gpg was never installed anywhere, on any distribution. Debian's image happened to carry both tools,
# which is why this only surfaced on Ubuntu, and a real desktop usually has them too. That is the
# whole failure mode: a prerequisite that is usually already there.
#
# ca-certificates joins them because a curl over https with no trust store fails the same way, later
# and less clearly.
- name: Install curl, gpg and certificates before any repository key is fetched (Debian family)
  become: yes
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - ca-certificates
    state: present
  register: debian_keytools_install
  retries: 3
  delay: 10
  until: debian_keytools_install is succeeded

- name: Install snapd (Debian non-Ubuntu)
  become: yes
  ansible.builtin.apt:
    name: snapd
    state: present
  register: debian_snapd_install
  retries: 3
  delay: 10
  until: debian_snapd_install is succeeded
  when: ih_base != 'ubuntu'

- name: Enable snapd socket (Debian non-Ubuntu)
  become: yes
  ansible.builtin.systemd:
    name: snapd.socket
    state: started
    enabled: yes
  when: ih_base != 'ubuntu'

# NOTE: Removed manual symlink creation - not needed with modern snapd

- name: Ensure /sbin is in PATH for all users (Debian)
  become: yes
  ansible.builtin.copy:
    dest: /etc/profile.d/sbin-path.sh
    content: |
      # Ensure /sbin and /usr/sbin are in PATH (needed for ldconfig, etc.)
      if ! echo "$PATH" | grep -q "/sbin"; then
        export PATH="$PATH:/sbin:/usr/sbin"
      fi
    mode: '0644'

# --- Antigravity APT repository ---

- name: Create APT keyrings directory
  become: yes
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: install_antigravity | default(false) | bool

- name: Download Antigravity APT signing key
  become: yes
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://us-central1-apt.pkg.dev/doc/repo-signing-key.gpg | gpg --dearmor --yes -o /etc/apt/keyrings/antigravity-repo-key.gpg
  args:
    creates: /etc/apt/keyrings/antigravity-repo-key.gpg
    executable: /bin/bash
  register: antigravity_key
  retries: 3
  delay: 10
  until: antigravity_key is succeeded
  when: install_antigravity | default(false) | bool

- name: Add Antigravity APT repository
  become: yes
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/antigravity.list
    content: |
      deb [signed-by=/etc/apt/keyrings/antigravity-repo-key.gpg] {{ antigravity_apt_repo }}/ antigravity-debian main
    mode: '0644'
  when: install_antigravity | default(false) | bool

- name: Update APT cache after adding Antigravity repo
  become: yes
  ansible.builtin.apt:
    update_cache: yes
  register: apt_cache_antigravity
  retries: 3
  delay: 10
  until: apt_cache_antigravity is succeeded
  when: install_antigravity | default(false) | bool
  changed_when: false
