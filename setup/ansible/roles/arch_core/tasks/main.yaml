---
# Use `copy` for consistency with debian_core (and so mode is enforced
# on re-run, not just on create). lineinfile only sets mode on creation.
- name: Configure passwordless sudo for non-root user
  become: yes
  ansible.builtin.copy:
    dest: /etc/sudoers.d/99-ansible-user
    content: "{{ non_root_user }} ALL=(ALL) NOPASSWD: ALL\n"
    mode: '0440'
    validate: 'visudo -cf %s'

# Steam, lib32-* and many other native Arch packages live in the multilib
# repo. Enable it before any pacman invocation so steam install doesn't fail
# with "could not find or read package".
- name: Enable multilib repository in /etc/pacman.conf (Arch)
  become: yes
  ansible.builtin.blockinfile:
    path: /etc/pacman.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK multilib"
    block: |
      [multilib]
      Include = /etc/pacman.d/mirrorlist
  register: multilib_enabled

# Always do a full sync + upgrade. Partial upgrades on rolling-release Arch
# are unsupported and cause download 404s when the local db is stale.
- name: Sync package database and upgrade system (Arch)
  become: yes
  community.general.pacman:
    update_cache: yes
    upgrade: yes

- name: Install unzip and zip
  become: yes
  community.general.pacman:
    name:
      - unzip
      - zip
    state: present

- name: Check if yay is already installed
  ansible.builtin.command: which yay
  register: yay_check
  changed_when: false
  failed_when: yay_check.rc > 1

- name: Install yay build dependencies
  become: yes
  ansible.builtin.package:
    name:
      - git
      - base-devel
      - go
    state: present
  when: yay_check.rc != 0

- name: Ensure clean yay build directory exists
  become: yes
  ansible.builtin.file:
    path: /tmp/yay
    state: absent
  when: yay_check.rc != 0

# site.yaml runs this role without a rescue, on purpose, because it is the bootstrap
# everything later depends on. So a transient failure reaching aur.archlinux.org aborts the
# whole run before a single package is installed. Retries cost nothing when the network is
# healthy and save a forty minute run when it blinks. The same reasoning applies to every
# network operation in this file.
- name: Clone yay AUR helper repository
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.git:
    repo: https://aur.archlinux.org/yay.git
    dest: /tmp/yay
    force: no
    update: no
  register: yay_clone
  retries: 3
  delay: 10
  until: yay_clone is succeeded
  when: yay_check.rc != 0

- name: Build yay package (non-root)
  ansible.builtin.shell: |
    set -o pipefail
    timeout 1500 makepkg -s --noconfirm </dev/null
  args:
    chdir: /tmp/yay
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  when: yay_check.rc != 0
  async: 1800
  poll: 30
  register: yay_build
  changed_when: yay_build.rc == 0
  failed_when:
    - yay_build.rc is defined
    - yay_build.rc != 0

- name: Find built yay package
  ansible.builtin.find:
    paths: /tmp/yay
    patterns: "*.pkg.tar.zst"
    excludes: "*-debug-*"
  register: yay_pkg_file
  when: yay_check.rc != 0

- name: Set yay package path fact
  ansible.builtin.set_fact:
    yay_package_path: "{{ yay_pkg_file.files[0].path if yay_pkg_file.files | length > 0 else '' }}"
  when:
    - yay_check.rc != 0
    - yay_pkg_file is defined
    - yay_pkg_file.files | length > 0

- name: Install built yay package (root)
  ansible.builtin.command: >
    pacman -U --noconfirm {{ yay_package_path }}
  become: yes
  when: yay_package_path is defined and yay_package_path | length > 0



- name: Check if paru is already installed
  ansible.builtin.command: which paru
  register: paru_installed
  changed_when: false
  failed_when: paru_installed.rc > 1

- name: Install paru build dependencies (rust, cargo)
  become: yes
  ansible.builtin.package:
    name:
      - rust
      - cargo
      - git
      - base-devel
    state: present
  when: paru_installed.rc != 0

- name: Ensure clean paru build directory exists
  become: yes
  ansible.builtin.file:
    path: /tmp/paru
    state: absent
  when: paru_installed.rc != 0

- name: Clone paru AUR helper repository
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.git:
    repo: https://aur.archlinux.org/paru.git
    dest: /tmp/paru
    force: no
    update: no
  register: paru_clone
  retries: 3
  delay: 10
  until: paru_clone is succeeded
  when: paru_installed.rc != 0

- name: Build paru package (non-root)
  ansible.builtin.shell: |
    set -o pipefail
    timeout 1800 makepkg -s --noconfirm </dev/null
  args:
    chdir: /tmp/paru
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  when: paru_installed.rc != 0
  async: 2100
  poll: 30
  register: paru_build
  changed_when: paru_build.rc == 0
  failed_when:
    - paru_build.rc is defined
    - paru_build.rc != 0

- name: Find built paru package
  ansible.builtin.find:
    paths: /tmp/paru
    patterns: "*.pkg.tar.zst"
    excludes: "*-debug-*"
  register: paru_pkg_file
  when: paru_installed.rc != 0

- name: Set paru package path fact
  ansible.builtin.set_fact:
    paru_package_path: "{{ paru_pkg_file.files[0].path if paru_pkg_file.files | length > 0 else '' }}"
  when:
    - paru_installed.rc != 0
    - paru_pkg_file is defined
    - paru_pkg_file.files | length > 0

- name: Install built paru package (root)
  ansible.builtin.command: >
    pacman -U --noconfirm {{ paru_package_path }}
  become: yes
  when: paru_package_path is defined and paru_package_path | length > 0



- name: Install snapd via paru
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.command: paru -S --needed --noconfirm snapd
  args:
    creates: /usr/bin/snap
  when: install_snapd | default(false) | bool

# Order matters: snap install core needs snapd.socket bound first. The
# previous order ran `snap install core` immediately after the paru install,
# before snapd.socket was enabled — failed with "no such file or directory"
# on /run/snapd.socket.
- name: Enable and start snapd socket
  become: yes
  ansible.builtin.systemd:
    name: snapd.socket
    state: started
    enabled: yes
  when: install_snapd | default(false) | bool

# A fixed five second pause replaced by asking snapd itself, because the socket being bound is not the
# same thing as snapd being ready to install anything. After a fresh install snapd seeds itself, and
# until that finishes every snap command answers `error: too early for operation, device not yet
# seeded or device model not acknowledged`, which is exit code 10. That is what a real Arch run hits
# when it installs snapd and reaches for a snap moments later, and it is what the container run of
# 2026-08-18 hit: the core snap failed and marked the whole run failed while everything else passed.
#
# `snap wait system seed.loaded` is snapd's own answer to this and blocks until seeding completes.
# Bounded at three minutes, tolerated, and the result is read below rather than assumed, because in a
# container seeding cannot complete at all and a wait that never returns would be worse than the
# failure it replaces.
- name: Wait for snapd to finish seeding before installing any snap
  ansible.builtin.command: timeout 180 snap wait system seed.loaded
  become: yes
  register: snapd_seeded
  changed_when: false
  failed_when: false
  when: install_snapd | default(false) | bool

# rc, not the result's failed key, which failed_when has just rewritten and which
# e2e/tier1/failed_key_reads.sh forbids reading.
- name: Record whether snapd is usable in this environment
  ansible.builtin.set_fact:
    snapd_usable: "{{ (snapd_seeded.rc | default(1)) == 0 }}"
  when: install_snapd | default(false) | bool

- name: Explain that snaps are being skipped because snapd never finished seeding
  ansible.builtin.debug:
    msg: >-
      [WARN] snapd installed but never finished seeding, so no snap can be installed in this run.
      snapd said: {{ (snapd_seeded.stderr | default('') ~ ' ' ~ snapd_seeded.stdout | default('')) | trim | default('nothing', true) }}.
      In a container that is expected, because seeding needs a real boot. On a real machine, run
      `sudo snap wait system seed.loaded` and rerun, or reboot first.
  when:
    - install_snapd | default(false) | bool
    - not (snapd_usable | default(false))

- name: Create snapd symlink for classic mode
  become: yes
  ansible.builtin.file:
    src: /var/lib/snapd/snap
    dest: /snap
    state: link
  when: install_snapd | default(false) | bool

- name: Install snapd core channel
  become: yes
  ansible.builtin.command: snap install core
  changed_when: false
  failed_when: false
  register: snap_core_install
  when:
    - install_snapd | default(false) | bool
    # Not attempted when seeding never finished, because the outcome is known: snap answers "too early
    # for operation" and exits 10. Attempting it anyway turned a container's inability to seed into a
    # failed run, and reported the cause as if the core snap itself were broken.
    - snapd_usable | default(false)

# snap exits 1 for two entirely different things here. `snap install core` on a machine that already
# has it prints `error: snap "core" is already installed, see 'snap help refresh'` and exits 1, and a
# genuine failure, snapd not reachable on its socket being the one this role has actually hit, also
# exits 1. The previous version announced every non-zero rc as "already installed", so the one outcome
# that needs attention was reported as the one that needs none, and nothing anywhere recorded it. The
# text decides now, not the return code.
#
# The message below deliberately avoids the phrase the match looks for, because
# callback_plugins/dual_logger.py drops any line containing it as noise, so a message built out of it
# would never be printed.
- name: Note that the core snap was already present
  ansible.builtin.debug:
    msg: "The core snap is present on this machine already, so snap fetched nothing."
  when:
    - install_snapd | default(false) | bool
    - snap_core_install.rc | default(0) != 0
    - "'already installed' in (snap_core_install.stderr | default('') ~ (snap_core_install.stdout | default('')))"

- name: Report that the core snap could not be installed
  ansible.builtin.debug:
    msg: >-
      [ERROR] The core snap did not install, so every snap package in this run will fail: snap exited
      {{ snap_core_install.rc | default('with no return code') }} saying
      {{ (snap_core_install.stderr | default('') ~ (snap_core_install.stdout | default('')))
         | trim | default('nothing at all', true) }}.
      The usual cause on Arch is snapd.socket not being reachable yet, which the enable and the pause
      above are meant to cover.
  when:
    - install_snapd | default(false) | bool
    - snap_core_install.rc | default(0) != 0
    - "'already installed' not in (snap_core_install.stderr | default('') ~ (snap_core_install.stdout | default('')))"

- name: Record the failed core snap install in the play summary
  ansible.builtin.set_fact:
    any_role_failed: true
  when:
    - install_snapd | default(false) | bool
    - snap_core_install.rc | default(0) != 0
    - "'already installed' not in (snap_core_install.stderr | default('') ~ (snap_core_install.stdout | default('')))"




