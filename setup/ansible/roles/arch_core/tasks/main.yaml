---
- name: Install yay build dependencies
  become: yes
  ansible.builtin.package:
    name:
      - git
      - base-devel
      - go
    state: present

- name: Check if yay source is already cloned
  ansible.builtin.stat:
    path: /tmp/yay/PKGBUILD
  register: yay_pkgbuild

- name: Clone yay AUR helper repository
  ansible.builtin.git:
    repo: https://aur.archlinux.org/yay.git
    dest: /tmp/yay
  when: not yay_pkgbuild.stat.exists

- name: Build and install yay (must not run as root)
  become: no
  ansible.builtin.shell: |
    cd /tmp/yay && makepkg -si --noconfirm
  args:
    creates: /usr/bin/yay

- name: Install snapd via yay
  become: no
  kewlfft.aur.aur:
    name: snapd
    use: yay
    state: present

- name: Create snapd symlink (required on Arch)
  become: yes
  ansible.builtin.file:
    src: /var/lib/snapd/snap
    dest: /snap
    state: link

- name: Enable systemd socket for Snap
  become: yes
  ansible.builtin.systemd:
    name: snapd.socket
    state: started
    enabled: yes
