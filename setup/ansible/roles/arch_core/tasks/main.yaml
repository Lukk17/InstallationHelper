---
# Use `copy` for consistency with debian_core (and so mode is enforced
# on re-run, not just on create). lineinfile only sets mode on creation.
- name: Configure passwordless sudo for non-root user
  become: yes
  ansible.builtin.copy:
    dest: /etc/sudoers.d/99-ansible-user
    content: "{{ non_root_user }} ALL=(ALL) NOPASSWD: ALL\n"
    mode: '0440'
    validate: 'visudo -cf %s'

# Steam, lib32-* and many other native Arch packages live in the multilib
# repo. Enable it before any pacman invocation so steam install doesn't fail
# with "could not find or read package".
#
# Asked first, because a derivative may already have it. Arch itself ships the section commented out,
# so appending a block is right there. CachyOS ships it enabled at line 99 of its own pacman.conf,
# and appending a second [multilib] makes pacman refuse every later call with "error: database
# already registered". That is not a warning it recovers from: the first AUR install after it, paru
# -S snapd, failed outright and took the run down.
#
# Found on the first CachyOS container run this repository has ever done, on 2026-08-20, which is
# exactly the kind of thing that only shows up when a distribution is actually exercised rather than
# assumed to behave like its parent.
#
# The marker on the block below means blockinfile is idempotent by itself. It is the second, distinct
# [multilib] that pacman objects to, and blockinfile cannot see one it did not write.
- name: Ask whether multilib is already enabled (Arch)
  ansible.builtin.command: >-
    awk '/^[[:space:]]*\[multilib\][[:space:]]*$/ { found = 1 } END { exit !found }' /etc/pacman.conf
  register: multilib_already_enabled
  changed_when: false
  failed_when: false

- name: Say so when the distribution already enabled multilib (Arch)
  ansible.builtin.debug:
    msg: >-
      multilib is already enabled in /etc/pacman.conf, so nothing is added. This is normal on
      CachyOS and on any Arch derivative that ships it on.
  when: multilib_already_enabled.rc == 0

- name: Enable multilib repository in /etc/pacman.conf (Arch)
  become: yes
  ansible.builtin.blockinfile:
    path: /etc/pacman.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK multilib"
    block: |
      [multilib]
      Include = /etc/pacman.d/mirrorlist
  register: multilib_enabled
  when: multilib_already_enabled.rc != 0

# Always do a full sync + upgrade. Partial upgrades on rolling-release Arch
# are unsupported and cause download 404s when the local db is stale.
# Split in two, because the two halves answer differently about whether they changed anything.
# Refreshing the package database is an act rather than a state: it downloads three repository indexes
# every time and the module reports changed for it whether or not a single package needed upgrading.
# Arch's idempotency scenario caught it on the first run this repository has ever done, on 2026-08-21,
# with a second pass whose only output was "Synchronizing package databases" and no packages upgraded
# at all. Upgrading is a state the machine converges on, so that half reports honestly.
#
# The same reasoning and the same split as Clean APT cache in site.yaml.
#
# -Sy then -Su in two invocations, which is not the partial upgrade the Arch wiki warns about: that
# warning is against `-Sy <package>`, installing against a freshly refreshed database without
# upgrading. Here the refresh is immediately followed by the full upgrade, so the database and the
# installed set stay in step.
- name: Sync the package database (Arch)
  become: yes
  community.general.pacman:
    update_cache: yes
  changed_when: false

- name: Upgrade the system (Arch)
  become: yes
  community.general.pacman:
    upgrade: yes

# One package per call through tasks/install_role_packages.yaml, so one that cannot install costs only
# itself and is named. The same for every package list in this file.
- name: Install unzip and zip
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages:
      - unzip
      - zip
    role_packages_purpose: the archive tools
  when: ih_family == 'Archlinux'

# Nothing in this playbook calls yay after building it: every Arch User Repository consumer goes
# through paru. So yay is built only when install_yay in group_vars/linux.yaml asks for it, off by
# default, and a yay that cannot be built costs yay and nothing else, rescued in the same shape as the
# paru block below. The moment a task starts using yay, it becomes required: install_yay goes and this
# block runs unconditionally, which e2e/tier1/paru_consumers.sh enforces. Before 2026-10-10 this was
# critical bootstrap with no rescue, so one failed clone from aur.archlinux.org or one failed makepkg
# ended the play before a single package was installed, which is exactly the failure mode the paru build had on a real CachyOS
# machine that day. The failure is still a failure: the rescue sets any_role_failed and names the
# step with an [ERROR] line, so the run exits non-zero and the step is in ~/installation_errors.log.
#
# The clone keeps its retries, because they cost nothing when the network is healthy and save a
# failed run when it blinks.
- name: Build and install yay
  when: install_yay | default(false) | bool
  block:
    - name: Check if yay is already installed
      ansible.builtin.command: which yay
      register: yay_check
      changed_when: false
      failed_when: yay_check.rc > 1

    - name: Install yay build dependencies
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
        apply:
          tags: [always]
      vars:
        role_packages:
          - git
          - base-devel
          - go
        role_packages_purpose: the yay build dependencies
      when:
        - ih_family == 'Archlinux'
        - yay_check.rc != 0

    - name: Confirm the yay build dependencies are present
      ansible.builtin.assert:
        that: role_packages_missing | length == 0
        fail_msg: >-
          {{ role_packages_missing | join(', ') }} did not install, so yay cannot be built.
        quiet: true
      when: yay_check.rc != 0

    - name: Ensure clean yay build directory exists
      become: yes
      ansible.builtin.file:
        path: /tmp/yay
        state: absent
      when: yay_check.rc != 0

    - name: Clone yay AUR helper repository
      become: yes
      become_user: "{{ non_root_user }}"
      ansible.builtin.git:
        repo: https://aur.archlinux.org/yay.git
        dest: /tmp/yay
        force: no
        update: no
      register: yay_clone
      retries: 3
      delay: 10
      until: yay_clone is succeeded
      when: yay_check.rc != 0

    - name: Build yay package (non-root)
      ansible.builtin.shell: |
        set -o pipefail
        {{ ih_timeout }} 1500 makepkg -s --noconfirm </dev/null
      args:
        chdir: /tmp/yay
        executable: /bin/bash
      become: yes
      become_user: "{{ non_root_user }}"
      when: yay_check.rc != 0
      async: 1800
      poll: 30
      register: yay_build
      changed_when: yay_build.rc == 0
      failed_when:
        - yay_build.rc is defined
        - yay_build.rc != 0

    - name: Find built yay package
      ansible.builtin.find:
        paths: /tmp/yay
        patterns: "*.pkg.tar.zst"
        excludes: "*-debug-*"
      register: yay_pkg_file
      when: yay_check.rc != 0

    - name: Set yay package path fact
      ansible.builtin.set_fact:
        yay_package_path: "{{ yay_pkg_file.files[0].path if yay_pkg_file.files | length > 0 else '' }}"
      when:
        - yay_check.rc != 0
        - yay_pkg_file is defined
        - yay_pkg_file.files | length > 0

    - name: Install built yay package (root)
      ansible.builtin.command: >
        pacman -U --noconfirm {{ yay_package_path }}
      become: yes
      when: yay_package_path is defined and yay_package_path | length > 0
  rescue:
    - name: Record that yay could not be built
      ansible.builtin.set_fact:
        any_role_failed: true

    - name: Name the yay step that failed and what it cost
      ansible.builtin.debug:
        msg: >-
          [ERROR] Step '{{ ansible_failed_task.name | default('unknown') }}' failed with:
          {{ ansible_failed_result.msg | default('no message given') }}
          The yay AUR helper could not be built, so only the yay helper itself is missing. Nothing in
          this run uses yay, every Arch User Repository package goes through paru, and everything else
          continues. The run is marked failed.


# Asked outside the block and tagged always, because every Arch User Repository consumer in this
# playbook reads paru_available, and a run limited by --tags to one of them still has to know the
# truth about this machine. tasks/paru_availability.yaml is the one place that answers it.
- name: Decide whether paru is already on this machine
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/paru_availability.yaml"
    apply:
      tags: [always]
  tags: [always]

# paru only serves the Arch User Repository. pacman, flatpak, the npm tools and sdk_manager need
# none of it, so a paru that cannot be built is no longer a reason to stop the run. It used to be:
# this was critical bootstrap with no rescue, and on a real CachyOS machine on 2026-10-10 one failed
# "Build paru package (non-root)" ended the play before a single package was installed.
#
# The failure is still a failure. The rescue below records it exactly the way site.yaml records a
# role failure, any_role_failed and an [ERROR] line naming the step, so the run exits non-zero and
# the step is in ~/installation_errors.log and in the terminal summary. What changes is the cost:
# every consumer reads paru_available, skips its Arch User Repository package, and names it as NOT
# installed in the summary and in the verification, and everything else carries on.
- name: Build and install paru
  block:
    - name: Check if rustup already provides cargo
      ansible.builtin.command: pacman -Q rustup
      register: paru_rustup_installed
      changed_when: false
      failed_when: paru_rustup_installed.rc > 1
      when: not (paru_available | bool)

    - name: Install paru build dependencies (rust, which provides cargo, unless rustup does)
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
        apply:
          tags: [always]
      vars:
        role_packages: "{{ ['git', 'base-devel'] + ([] if paru_rustup_installed.rc == 0 else ['rust']) }}"
        role_packages_purpose: the paru build dependencies
      when:
        - ih_family == 'Archlinux'
        - not (paru_available | bool)

    - name: Confirm the paru build dependencies are present
      ansible.builtin.assert:
        that: role_packages_missing | length == 0
        fail_msg: >-
          {{ role_packages_missing | join(', ') }} did not install, so paru cannot be built.
        quiet: true
      when: not (paru_available | bool)

    - name: Check if rustup has a default toolchain for the build user
      ansible.builtin.command: rustup default
      become: yes
      become_user: "{{ non_root_user }}"
      register: paru_rustup_default
      changed_when: false
      failed_when: paru_rustup_default.rc > 1
      when:
        - not (paru_available | bool)
        - paru_rustup_installed.rc == 0

    - name: Set the stable toolchain as rustup's default for the build user
      ansible.builtin.command: rustup default stable
      become: yes
      become_user: "{{ non_root_user }}"
      register: paru_rustup_stable
      retries: 3
      delay: 10
      until: paru_rustup_stable.rc == 0
      changed_when: paru_rustup_stable.rc == 0
      when:
        - not (paru_available | bool)
        - paru_rustup_installed.rc == 0
        - paru_rustup_default.rc != 0

    - name: Ensure clean paru build directory exists
      become: yes
      ansible.builtin.file:
        path: /tmp/paru
        state: absent
      when: not (paru_available | bool)

    # The repository is a role default only so that the forced-failure scenario can point it at an
    # address on a host under .invalid, which can never resolve, so this clone fails every time and proves
    # the rescue below reports a paru failure rather than swallowing it.
    - name: Clone paru AUR helper repository
      become: yes
      become_user: "{{ non_root_user }}"
      ansible.builtin.git:
        repo: "{{ arch_core_paru_repository }}"
        dest: /tmp/paru
        force: no
        update: no
      register: paru_clone
      retries: 3
      delay: 10
      until: paru_clone is succeeded
      when: not (paru_available | bool)

    - name: Build paru package (non-root)
      ansible.builtin.shell: |
        set -o pipefail
        {{ ih_timeout }} 1800 makepkg -s --noconfirm </dev/null
      args:
        chdir: /tmp/paru
        executable: /bin/bash
      become: yes
      become_user: "{{ non_root_user }}"
      when: not (paru_available | bool)
      async: 2100
      poll: 30
      register: paru_build
      changed_when: paru_build.rc == 0
      failed_when:
        - paru_build.rc is defined
        - paru_build.rc != 0

    - name: Find built paru package
      ansible.builtin.find:
        paths: /tmp/paru
        patterns: "*.pkg.tar.zst"
        excludes: "*-debug-*"
      register: paru_pkg_file
      when: not (paru_available | bool)

    - name: Set paru package path fact
      ansible.builtin.set_fact:
        paru_package_path: "{{ paru_pkg_file.files[0].path if paru_pkg_file.files | length > 0 else '' }}"
      when:
        - not (paru_available | bool)
        - paru_pkg_file is defined
        - paru_pkg_file.files | length > 0

    - name: Install built paru package (root)
      ansible.builtin.command: >
        pacman -U --noconfirm {{ paru_package_path }}
      become: yes
      when:
        - not (paru_available | bool)
        - paru_package_path is defined and paru_package_path | length > 0

    # Asked again rather than assumed from the steps above, because a build that exits zero and
    # leaves no package behind skips the install without an error, and that would otherwise be a
    # paru nobody can call reported as nothing at all.
    - name: Decide again whether paru is on this machine after the build
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/paru_availability.yaml"
      when: not (paru_available | bool)

    - name: Confirm the build left a paru that can be called
      ansible.builtin.assert:
        that: paru_available | bool
        fail_msg: >-
          Every paru build step finished without an error and `command -v paru` still finds
          nothing, so no package was installed. /tmp/paru holds whatever the build left behind.
        quiet: true
  rescue:
    - name: Record that paru could not be built
      ansible.builtin.set_fact:
        any_role_failed: true
        paru_available: false

    - name: Name the paru step that failed and what it cost
      ansible.builtin.debug:
        msg: >-
          [ERROR] Step '{{ ansible_failed_task.name | default('unknown') }}' failed with:
          {{ ansible_failed_result.msg | default('no message given') }}
          paru could not be built, so every Arch User Repository package in this run is skipped and
          reported as NOT installed. Everything else continues. The run is marked failed, and the
          summary at the end names each package that was skipped.

# The retry rule every package manager follows, four attempts twenty seconds apart, with no refresh
# between them, because paru asks the AUR's /rpc endpoint on every call and keeps no index of it, and
# its -y refreshes the pacman sync databases, which before a single install is a partial upgrade.
- name: Install snapd via paru
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.command: paru -S --needed --noconfirm snapd
  args:
    creates: /usr/bin/snap
  register: arch_snapd_paru
  until: arch_snapd_paru.rc | default(0) == 0
  retries: 3
  delay: 20
  when:
    - install_snapd | default(false) | bool
    - paru_available | bool

# snapd comes from the Arch User Repository, so without paru it is not installed. Asked of the disk
# rather than inferred, because an earlier run may already have installed it, and then everything
# below still applies. When it is absent it is named among the skipped packages, and every snapd task
# below waits on this answer, because enabling a socket for a daemon that is not there is a fatal
# error in a role with no rescue of its own.
- name: Ask whether snapd is on this machine
  ansible.builtin.stat:
    path: /usr/bin/snap
  register: arch_snapd_binary
  when: install_snapd | default(false) | bool

- name: Record snapd as NOT installed because paru could not be built
  ansible.builtin.set_fact:
    aur_skipped_without_paru: "{{ aur_skipped_without_paru | default([]) + ['snapd'] }}"
    any_role_failed: true
  when:
    - install_snapd | default(false) | bool
    - not (paru_available | bool)
    - not (arch_snapd_binary.stat.exists | default(false))

# Order matters: snap install core needs snapd.socket bound first. The
# previous order ran `snap install core` immediately after the paru install,
# before snapd.socket was enabled — failed with "no such file or directory"
# on /run/snapd.socket.
- name: Enable and start snapd socket
  become: yes
  ansible.builtin.systemd:
    name: snapd.socket
    state: started
    enabled: yes
  when:
    - install_snapd | default(false) | bool
    - arch_snapd_binary.stat.exists | default(false)

# A fixed five second pause replaced by asking snapd itself, because the socket being bound is not the
# same thing as snapd being ready to install anything. After a fresh install snapd seeds itself, and
# until that finishes every snap command answers `error: too early for operation, device not yet
# seeded or device model not acknowledged`, which is exit code 10. That is what a real Arch run hits
# when it installs snapd and reaches for a snap moments later, and it is what the container run of
# 2026-08-18 hit: the core snap failed and marked the whole run failed while everything else passed.
#
# `snap wait system seed.loaded` is snapd's own answer to this and blocks until seeding completes.
# Bounded at three minutes, tolerated, and the result is read below rather than assumed, because in a
# container seeding cannot complete at all and a wait that never returns would be worse than the
# failure it replaces.
- name: Wait for snapd to finish seeding before installing any snap
  ansible.builtin.command: "{{ ih_timeout }} 180 snap wait system seed.loaded"
  become: yes
  register: snapd_seeded
  changed_when: false
  failed_when: false
  when:
    - install_snapd | default(false) | bool
    - arch_snapd_binary.stat.exists | default(false)

# rc, not the result's failed key, which failed_when has just rewritten and which
# e2e/tier1/failed_key_reads.sh forbids reading.
- name: Record whether snapd is usable in this environment
  ansible.builtin.set_fact:
    snapd_usable: "{{ (snapd_seeded.rc | default(1)) == 0 }}"
  when:
    - install_snapd | default(false) | bool
    - arch_snapd_binary.stat.exists | default(false)

- name: Explain that snaps are being skipped because snapd never finished seeding
  ansible.builtin.debug:
    msg: >-
      [WARN] snapd installed but never finished seeding, so no snap can be installed in this run.
      snapd said: {{ (snapd_seeded.stderr | default('') ~ ' ' ~ snapd_seeded.stdout | default('')) | trim | default('nothing', true) }}.
      In a container that is expected, because seeding needs a real boot. On a real machine, run
      `sudo snap wait system seed.loaded` and rerun, or reboot first.
  when:
    - install_snapd | default(false) | bool
    - arch_snapd_binary.stat.exists | default(false)
    - not (snapd_usable | default(false))

- name: Create snapd symlink for classic mode
  become: yes
  ansible.builtin.file:
    src: /var/lib/snapd/snap
    dest: /snap
    state: link
  when:
    - install_snapd | default(false) | bool
    - arch_snapd_binary.stat.exists | default(false)

# Through tasks/install_role_packages.yaml with snap, the retry rule every package manager follows:
# four attempts twenty seconds apart, no refresh, because snapd keeps no package list. snap exits 1
# for two entirely different things here. `snap install core` on a machine that already has it prints
# `error: snap "core" is already installed, see 'snap help refresh'` and exits 1, and a genuine
# failure also exits 1. This role has hit two: snapd not reachable on its socket, and, in the Arch and
# CachyOS test containers, snapd's startup check failing to set up a loop device for a squashfs image
# (docs/regression_ledger.md 10.37). The shared file counts the already-installed words as installed
# whatever the exit code, and names a genuine failure with what snap said.
#
# Not attempted when seeding never finished, because the outcome is known: snap answers "too early for
# operation" and exits 10. Attempting it anyway turned a container's inability to seed into a failed
# run, and reported the cause as if the core snap itself were broken.
- name: Install snapd core channel
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: [core]
    role_packages_purpose: the snap runtime every snap package needs
    role_packages_manager: snap
  when:
    - ih_family == 'Archlinux'
    - install_snapd | default(false) | bool
    - snapd_usable | default(false)

- name: Report what the core snap's failure means for the rest of the run
  ansible.builtin.debug:
    msg: >-
      [ERROR] The core snap did not install, so every snap package in this run will fail.
      A cause measured in the Arch and CachyOS test containers is snapd's startup check failing to
      mount a squashfs image through a loop device, which snap reports as failed to set up loop
      device, so check that the loop module is loaded, that /dev/loop-control exists and that
      losetup -f names a free /dev/loopN that exists rather than one marked (lost).
  when:
    - install_snapd | default(false) | bool
    - snapd_usable | default(false)
    - "'core' in (role_packages_missing | default([]))"

# Asked outside the block and tagged always, because the pacman loop in software_installer reads
# steam_graphics_stack_aligned, and a run limited by --tags to it still has to know the truth about this
# machine. tasks/steam_graphics_alignment.yaml is the one place that answers it.
- name: Decide whether the 32-bit graphics stack is aligned for Steam
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/steam_graphics_alignment.yaml"
    apply:
      tags: [always]
  tags: [always]

# CachyOS resolves the 32-bit graphics stack to its own git builds, and the run has to agree with it
# before anything asks for a multilib package, or the whole software batch dies.
#
# The chain, traced on the CachyOS image on 2026-08-21. steam depends on the virtual lib32-vulkan-driver
# and on lib32-libgl. The first provider of lib32-vulkan-driver in repository order is
# cachyos-v3/lib32-mesa-git, and lib32-libgl resolves to multilib/lib32-libglvnd which depends on
# lib32-mesa, so both the git and the stable package end up in one transaction. pacman drops the
# stable one, then finds lib32-mesa-git needs mesa, resolves that to mesa-git, and mesa-git conflicts
# with the stable mesa that qemu-full installed earlier in this same run. It stops to ask
# "Remove mesa?", --noconfirm answers no, and the entire batch of thirty-five packages fails.
#
# Naming the stable lib32-mesa as an explicit target does not win, measured: pacman still drops it in
# favour of the git build, because the git build is what satisfies lib32-opengl-driver from the
# repository CachyOS puts first. So there is no way to keep the stable stack and install steam.
#
# Which makes this the honest resolution rather than a workaround: align the graphics stack with what
# the distribution's own repositories prefer, once, up front, and let everything after it resolve
# normally. The y answers below answer the conflict the way a CachyOS user answers it. That is
# deliberate and it is the only prompt in reach: the two packages named here have no provider choice
# to make, so nothing else can be answered by accident. --noconfirm is absent on purpose, because it
# is what makes the question unanswerable.
#
# Gated on the distribution's own ID rather than on ih_base, because Ansible reports Archlinux for
# ansible_distribution on CachyOS and ih_base is archlinux there too. And on ih_steam_requested rather
# than install_steam, because install_gaming_suite brings Steam on CachyOS as well, its mapping there
# being marked brings_steam: true, and tasks/steam_graphics_alignment.yaml decides both in one place.
#
# Verified end to end on the image: with this, `pacman -S --needed --noconfirm steam ...` exits 0 and
# steam 1.0.0.87-1 installs. Without it the same command exits 1 on the conflict.
#
# The alignment is still attempted on every CachyOS run that asks for Steam. What changed on 2026-10-10
# is what a failure costs. The step used to be fatal on purpose, so a CachyOS user who asked for Steam
# would see the run stop and read why, and what that bought was a run that stopped with nothing after
# it installed: arch_core is critical bootstrap with no rescue around it in site.yaml. Now the failure
# is rescued after its retries, recorded the way site.yaml records a role failure, any_role_failed and
# an [ERROR] line naming the step, so the run still exits non-zero and the step is in
# ~/installation_errors.log and the terminal summary. Steam alone is skipped and named as NOT
# installed, by the pacman loop in software_installer and by verify_install.yaml, both reading
# steam_graphics_stack_aligned, and everything else carries on.
- name: Align the 32-bit graphics stack for Steam (CachyOS)
  when:
    - ih_family == 'Archlinux'
    - ih_os_release_id == 'cachyos'
    - ih_steam_requested | bool
  tags: [cachyos, steam]
  block:
    - name: Align the 32-bit graphics stack with the CachyOS repositories (CachyOS)
      become: yes
      #
      # The answers come from a file rather than from `yes |`, for the same reason the Android SDK licence
      # task in roles/sdk_manager/tasks/android_sdk_unix.yaml does it that way. A pipe from `yes` is killed
      # by SIGPIPE the moment pacman exits, and under `set -o pipefail` the pipeline then reports 141
      # whatever pacman did. That is not theoretical here: on 2026-08-28 this task failed three times in a
      # row on a real CachyOS machine where pacman had printed "there is nothing to do" and exited
      # cleanly, and it took the whole run down with it. Reading from a file leaves rc meaning what it
      # says. One package needs at most a handful of answers, and 20 is the headroom.
      #
      # The first attempt installs against the index the system upgrade above was made against, and only
      # a failed attempt refreshes it, in the retry below. A refresh before every attempt, which this
      # task used to do with -Syy, installs against an index newer than the installed system even when
      # nothing was wrong, the partial upgrade the Arch wiki warns about. The retries cover a mirror that
      # is behind the database it serves. The failure recorded in the container on 2026-08-21 was a
      # different thing and the record was wrong about it: it said the v3 index and the v3 files
      # disagree. Re-measured on 2026-08-28, they do not. Both lib32-glibc-2.44+r24+g16be1518495f-1 and
      # lib32-gcc-libs-16.2.1+r23+gd564253eb6c8-1, the exact builds the index names, answer 200 on
      # mirror.cachyos.org and 404 on cdn77.cachyos.org. The index is right and one mirror is missing
      # files, which is what a mirrorlist with more than one entry is for.
      #
      # One package per call, mesa-git first because lib32-mesa-git depends on mesa, which mesa-git
      # provides. This used to be one call naming both, the last batch in the playbook. Measured in
      # cachyos/cachyos-v3 on 2026-10-15, two calls work in either order, with the stable mesa and
      # lib32-mesa installed beforehand or not, each exiting 0 with `pacman -Dk` clean, so
      # e2e/tier1/batched_managers.sh carries no exception for it any more.
      #
      # A failure here is no longer fatal to the run. After the retries below the block's rescue
      # records it, Steam is skipped and named as NOT installed with the reason, and the rest of the run
      # continues. It is still a failure: the run ends failed and the step is named in the summary.
      ansible.builtin.shell: |
        set -o pipefail
        answers="$(mktemp)"
        trap 'rm -f "$answers"' EXIT
        for _ in $(seq 20); do echo y; done > "$answers"
        pacman -S --needed {{ item | quote }} < "$answers"
      args:
        executable: /bin/bash
      loop: [mesa-git, lib32-mesa-git]
      register: cachy_mesa_align
      changed_when:
        - cachy_mesa_align.rc | default(1) == 0
        - "'there is nothing to do' not in (cachy_mesa_align.stdout | default(''))"
      failed_when: false

    - name: Collect the graphics packages whose first alignment attempt failed (CachyOS)
      ansible.builtin.set_fact:
        cachy_mesa_align_failed: >-
          {{ cachy_mesa_align.results
             | selectattr('rc', 'defined')
             | rejectattr('rc', 'equalto', 0)
             | map(attribute='item')
             | list }}

    - name: Wait before retrying the alignment with a refreshed package index (CachyOS)
      ansible.builtin.pause:
        seconds: 20
      when: cachy_mesa_align_failed | length > 0

    # Ansible cannot change a task's arguments between its own retries, so the refresh lives in a
    # second task that runs only for a package whose first attempt failed, in the same order. Its own
    # failure is real: failed_when reads its rc and the block's rescue reports it.
    - name: Retry the alignment after refreshing the package index (CachyOS)
      become: yes
      ansible.builtin.shell: |
        set -o pipefail
        answers="$(mktemp)"
        trap 'rm -f "$answers"' EXIT
        for _ in $(seq 20); do echo y; done > "$answers"
        pacman -Syy && pacman -S --needed {{ item | quote }} < "$answers"
      args:
        executable: /bin/bash
      loop: "{{ cachy_mesa_align_failed }}"
      register: cachy_mesa_align_retry
      changed_when:
        - cachy_mesa_align_retry.rc | default(1) == 0
        - "'there is nothing to do' not in (cachy_mesa_align_retry.stdout | default(''))"
      failed_when: cachy_mesa_align_retry.rc | default(1) != 0
      retries: 2
      delay: 20
      until: cachy_mesa_align_retry.rc | default(1) == 0

    # Asked again rather than assumed from the step above, so the fact the pacman loop reads is the
    # disk's answer and not this task's exit code.
    - name: Decide again whether the 32-bit graphics stack is aligned after the alignment
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/steam_graphics_alignment.yaml"
        apply:
          tags: [always]

    - name: Confirm the alignment left the packages Steam needs
      ansible.builtin.assert:
        that: steam_graphics_stack_aligned | bool
        fail_msg: >-
          pacman finished without an error and `pacman -Q mesa-git lib32-mesa-git` still does not find
          both packages, so Steam's 32-bit graphics dependencies cannot be resolved.
        quiet: true
  rescue:
    - name: Record that the 32-bit graphics stack could not be aligned
      ansible.builtin.set_fact:
        any_role_failed: true
        steam_graphics_stack_aligned: false

    - name: Name the alignment step that failed and what it cost
      ansible.builtin.debug:
        msg: >-
          [ERROR] Step '{{ ansible_failed_task.name | default('unknown') }}' failed with:
          {{ ansible_failed_result.msg | default('no message given') }}
          The CachyOS 32-bit graphics packages could not be aligned, so {{ ih_steam_packages | join(', ') }}
          {{ 'is' if ih_steam_packages | length == 1 else 'are' }} skipped and reported as NOT installed.
          Everything else continues, and the run is marked failed.

