---
- name: Update pacman package database
  become: yes
  ansible.builtin.command: pacman -Sy
  changed_when: false

- name: Install yay build dependencies
  become: yes
  ansible.builtin.package:
    name:
      - git
      - base-devel
      - go
    state: present

- name: Check if yay source is already cloned
  ansible.builtin.stat:
    path: /tmp/yay/PKGBUILD
  register: yay_pkgbuild

- name: Clone yay AUR helper repository
  ansible.builtin.git:
    repo: https://aur.archlinux.org/yay.git
    dest: /tmp/yay
  when: not yay_pkgbuild.stat.exists

- name: Build yay package (non-root)
  ansible.builtin.shell: |
    cd /tmp/yay && makepkg -s --noconfirm
  become: no
  args:
    creates: /tmp/yay/*.pkg.tar.zst

- name: Find built yay package
  ansible.builtin.find:
    paths: /tmp/yay
    patterns: "*.pkg.tar.zst"
    excludes: "*-debug-*"
  register: yay_pkg_file

- name: Install built yay package (root)
  ansible.builtin.command: >
    pacman -U --noconfirm {{ yay_pkg_file.files[0].path }}
  become: yes
  when: yay_pkg_file.files | length > 0

- name: Install snapd via pacman (official repo)
  become: yes
  ansible.builtin.package:
    name: snapd
    state: present

- name: Create snapd symlink (required on Arch)
  become: yes
  ansible.builtin.file:
    src: /var/lib/snapd/snap
    dest: /snap
    state: link

- name: Enable systemd socket for Snap
  become: yes
  ansible.builtin.systemd:
    name: snapd.socket
    state: started
    enabled: yes
