---
- name: Update pacman package database
  become: yes
  ansible.builtin.command: pacman -Sy
  changed_when: false

- name: Install unzip and zip
  become: yes
  community.general.pacman:
    name:
      - unzip
      - zip
    state: present

- name: Check if yay is already installed
  ansible.builtin.command: which yay
  register: yay_check
  changed_when: false
  failed_when: yay_check.rc > 1

- name: Install yay build dependencies
  become: yes
  ansible.builtin.package:
    name:
      - git
      - base-devel
      - go
    state: present
  when: yay_check.rc != 0

- name: Clone yay AUR helper repository
  ansible.builtin.git:
    repo: https://aur.archlinux.org/yay.git
    dest: /tmp/yay
    force: no
    update: no
  when: yay_check.rc != 0

- name: Build yay package (non-root)
  ansible.builtin.shell: |
    cd /tmp/yay && makepkg -s --noconfirm
  become: no
  environment:
    HOME: "{{ ansible_facts['user_dir'] }}"
  args:
    creates: /tmp/yay/*.pkg.tar.zst
  when: yay_check.rc != 0

- name: Find built yay package
  ansible.builtin.find:
    paths: /tmp/yay
    patterns: "*.pkg.tar.zst"
    excludes: "*-debug-*"
  register: yay_pkg_file
  when: yay_check.rc != 0

- name: Set yay package path fact
  ansible.builtin.set_fact:
    yay_package_path: "{{ yay_pkg_file.files[0].path if yay_pkg_file.files | length > 0 else '' }}"
  when:
    - yay_check.rc != 0
    - yay_pkg_file is defined
    - yay_pkg_file.files | length > 0

- name: Install built yay package (root)
  ansible.builtin.command: >
    pacman -U --noconfirm {{ yay_package_path }}
  become: yes
  when: yay_package_path is defined and yay_package_path | length > 0



- name: Check if paru is already installed
  ansible.builtin.command: which paru
  register: paru_installed
  changed_when: false
  failed_when: paru_installed.rc > 1

- name: Install paru build dependencies (rust, cargo)
  become: yes
  ansible.builtin.package:
    name:
      - rust
      - cargo
      - git
      - base-devel
    state: present
  when: paru_installed.rc != 0

- name: Clone paru AUR helper repository
  ansible.builtin.git:
    repo: https://aur.archlinux.org/paru.git
    dest: /tmp/paru
    force: no
    update: no
  when: paru_installed.rc != 0

- name: Build paru package (non-root)
  ansible.builtin.shell: |
    cd /tmp/paru && makepkg -s --noconfirm
  become: no
  environment:
    HOME: "{{ ansible_facts['user_dir'] }}"
  args:
    creates: /tmp/paru/*.pkg.tar.zst
  when: paru_installed.rc != 0

- name: Find built paru package
  ansible.builtin.find:
    paths: /tmp/paru
    patterns: "*.pkg.tar.zst"
    excludes: "*-debug-*"
  register: paru_pkg_file
  when: paru_installed.rc != 0

- name: Set paru package path fact
  ansible.builtin.set_fact:
    paru_package_path: "{{ paru_pkg_file.files[0].path if paru_pkg_file.files | length > 0 else '' }}"
  when:
    - paru_installed.rc != 0
    - paru_pkg_file is defined
    - paru_pkg_file.files | length > 0

- name: Install built paru package (root)
  ansible.builtin.command: >
    pacman -U --noconfirm {{ paru_package_path }}
  become: yes
  when: paru_package_path is defined and paru_package_path | length > 0



- name: Configure passwordless sudo for current user
  become: yes
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/99-ansible-user
    line: "{{ ansible_user_id }} ALL=(ALL) NOPASSWD: ALL"
    create: yes
    mode: '0440'
    validate: 'visudo -cf %s'
  when: install_snapd | default(false) | bool

- name: Install snapd via paru
  ansible.builtin.command: paru -S --needed --noconfirm snapd
  args:
    creates: /usr/bin/snap
  when: install_snapd | default(false) | bool

- name: Install snapd core channel
  become: yes
  ansible.builtin.command: snap install core
  changed_when: false
  failed_when: false
  register: snap_core_install
  when: install_snapd | default(false) | bool

- name: Snap core already installed warning
  ansible.builtin.debug:
    msg: "Snap 'core' is already installed, see 'snap help refresh'"
  when: install_snapd | default(false) | bool and snap_core_install.rc != 0

- name: Wait for snapd to be ready
  pause:
    seconds: 5
  when: install_snapd | default(false) | bool

- name: Create snapd symlink for classic mode
  become: yes
  ansible.builtin.file:
    src: /var/lib/snapd/snap
    dest: /snap
    state: link
  when: install_snapd | default(false) | bool

- name: Enable snapd socket
  become: yes
  ansible.builtin.systemd:
    name: snapd.socket
    state: started
    enabled: yes
  when: install_snapd | default(false) | bool


# Install Flatpak (required for flatpak packages in software_installer)
- name: Check if flatpak is already installed
  ansible.builtin.command: which flatpak
  register: flatpak_check
  changed_when: false
  failed_when: flatpak_check.rc > 1

- name: Install flatpak via pacman
  become: yes
  community.general.pacman:
    name:
      - flatpak
    state: present
  when: flatpak_check.rc != 0

- name: Add Flathub remote if not exists
  become: yes
  ansible.builtin.command: flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
  ignore_errors: true
  when: flatpak_check.rc != 0

