---
# The Chrome, Brave, Sublime Text and VS Code repositories live in one place now, and it is
# software_installer/tasks/fedora_repos.yaml, next to the Kubernetes, Lens and Tailscale ones. They
# were defined here as well, four repositories described twice, and two of the four descriptions
# disagreed: this file called the Chrome repository "Google Chrome" and that one calls it
# "google-chrome". So the two tasks overwrote each other's file on every run and both reported
# changed, for ever, while Brave and VS Code happened to agree and were idempotent by luck.
#
# Found by the first Fedora idempotency run this repository has ever done, on 2026-08-21. The lesson
# is not about descriptions: two definitions of one thing drift, and the only question is when.
#
# antigravity-rpm, the last repository that was still defined here, moved there too on 2026-10-10. Here
# it had no rescue, so one repository that could not be added stopped the whole run, and there it is
# its own block with a rescue like every other third-party repository.

- name: Ensure Snap plugin is installed
  become: yes
  ansible.builtin.dnf:
    name:
      - snapd
    state: present
  register: fedora_snapd_install
  retries: 3
  delay: 10
  until: fedora_snapd_install is succeeded
  when: install_snapd | default(false) | bool

- name: Enable Snapd socket
  become: yes
  ansible.builtin.systemd:
    name: snapd.socket
    state: started
    enabled: yes
  when: install_snapd | default(false) | bool

- name: Create Classic Snap Symlink
  become: yes
  ansible.builtin.file:
    src: /var/lib/snapd/snap
    dest: /snap
    state: link
  when: install_snapd | default(false) | bool
