---
- name: Ensure Snap and Flatpak plugins are installed
  become: yes
  ansible.builtin.dnf:
    name:
      - snapd
      - flatpak
    state: present

- name: Enable Snapd socket
  become: yes
  ansible.builtin.systemd:
    name: snapd.socket
    state: started
    enabled: yes

- name: Create Classic Snap Symlink
  become: yes
  ansible.builtin.file:
    src: /var/lib/snapd/snap
    dest: /snap
    state: link
