---
- name: Add Google Chrome repository (Fedora)
  become: yes
  ansible.builtin.yum_repository:
    name: google-chrome
    description: Google Chrome
    baseurl: https://dl.google.com/linux/chrome/rpm/stable/x86_64
    gpgkey: https://dl.google.com/linux/linux_signing_key.pub
    gpgcheck: yes
    enabled: yes
  when: install_chrome | default(false) | bool

- name: Add Brave Browser repository (Fedora)
  become: yes
  ansible.builtin.yum_repository:
    name: brave-browser
    description: Brave Browser
    baseurl: https://brave-browser-rpm-release.s3.brave.com/x86_64/
    gpgkey: https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
    gpgcheck: yes
    enabled: yes
  when: install_brave | default(false) | bool

- name: Add Microsoft VS Code repository (Fedora)
  become: yes
  ansible.builtin.yum_repository:
    name: vscode
    description: Visual Studio Code
    baseurl: https://packages.microsoft.com/yumrepos/vscode
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc
    gpgcheck: yes
    enabled: yes
  when: install_vscode | default(false) | bool

- name: Add Sublime Text repository (Fedora)
  become: yes
  ansible.builtin.yum_repository:
    name: sublime-text
    description: Sublime Text
    baseurl: https://download.sublimetext.com/rpm/stable/x86_64/
    gpgkey: https://download.sublimetext.com/sublimehq-rpm-pub.gpg
    gpgcheck: yes
    enabled: yes
  when: install_sublime | default(false) | bool

# The yum_repository tasks above only write a .repo file, so they never touch the network
# and get no retries. This one does reach a mirror, and site.yaml runs this role without a
# rescue, so a transient failure here would abort the whole run before anything installs.
- name: Ensure Snap plugin is installed
  become: yes
  ansible.builtin.dnf:
    name:
      - snapd
    state: present
  register: fedora_snapd_install
  retries: 3
  delay: 10
  until: fedora_snapd_install is succeeded
  when: install_snapd | default(false) | bool

- name: Enable Snapd socket
  become: yes
  ansible.builtin.systemd:
    name: snapd.socket
    state: started
    enabled: yes
  when: install_snapd | default(false) | bool

- name: Create Classic Snap Symlink
  become: yes
  ansible.builtin.file:
    src: /var/lib/snapd/snap
    dest: /snap
    state: link
  when: install_snapd | default(false) | bool

# --- Antigravity YUM repository ---

- name: Add Antigravity YUM repository (Fedora)
  become: yes
  ansible.builtin.yum_repository:
    name: antigravity-rpm
    description: Antigravity RPM Repository
    baseurl: "{{ antigravity_yum_repo }}"
    gpgkey: https://us-central1-yum.pkg.dev/doc/repo-signing-key.gpg
    gpgcheck: yes
    enabled: yes
  when: install_antigravity | default(false) | bool

