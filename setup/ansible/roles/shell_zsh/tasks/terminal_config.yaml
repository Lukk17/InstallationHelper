---
# gsettings writes through dconf, which needs a D-Bus session bus. There is none before a first
# login, over SSH, on a headless machine or in a container, and the command fails there. This task
# had no tolerance for that while the Konsole equivalent below already had failed_when: false, so
# the KDE path survived a missing session and the GNOME path failed the whole run. A terminal
# profile preference is not worth losing a run over, and it can be set at the next login.
# See docs/regression_ledger.md.
- name: Configure GNOME Terminal to use ZSH
  ansible.builtin.shell: |
    PROFILE=$(gsettings get org.gnome.Terminal.ProfilesList default | tr -d "'")
    gsettings set org.gnome.Terminal.Legacy.Profile:/org/gnome/terminal/legacy/profiles/:${PROFILE}/ custom-command 'zsh'
    gsettings set org.gnome.Terminal.Legacy.Profile:/org/gnome/terminal/legacy/profiles/:${PROFILE}/ use-custom-command true
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: gnome_terminal_zsh
  changed_when: false
  failed_when: false
  when: install_gnome | default(false) | bool or configure_gnome | default(false) | bool

- name: Report that GNOME Terminal was not reconfigured
  ansible.builtin.debug:
    msg: "[WARN] GNOME Terminal was not switched to zsh: gsettings could not reach a D-Bus session bus, which is expected before a first login, over SSH, on a headless machine or in a container. Log into GNOME and rerun with --tags zsh, or set it in Terminal preferences. Detail: {{ gnome_terminal_zsh.stderr | default('') | trim }}"
  when:
    - install_gnome | default(false) | bool or configure_gnome | default(false) | bool
    - gnome_terminal_zsh is defined
    - not (gnome_terminal_zsh is skipped)
    - gnome_terminal_zsh.rc | default(0) != 0

- name: Find ZSH path for Konsole
  ansible.builtin.command: which zsh
  register: konsole_zsh_path
  changed_when: false
  failed_when: false
  when: install_kde_plasma | default(false) | bool or configure_kde_plasma | default(false) | bool

- name: Ensure Konsole profile directory exists
  ansible.builtin.file:
    path: "{{ non_root_home }}/.local/share/konsole"
    state: directory
    mode: '0755'
  become: yes
  become_user: "{{ non_root_user }}"
  when: install_kde_plasma | default(false) | bool or configure_kde_plasma | default(false) | bool

- name: Configure Konsole default profile to use ZSH
  ansible.builtin.ini_file:
    path: "{{ non_root_home }}/.local/share/konsole/Default.profile"
    section: General
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: '0644'
  loop:
    - { option: "Name", value: "Default" }
    - { option: "Command", value: "{{ konsole_zsh_path.stdout | default('/usr/bin/zsh') }}" }
  become: yes
  become_user: "{{ non_root_user }}"
  when: >
    (install_kde_plasma | default(false) | bool or configure_kde_plasma | default(false) | bool)
    and konsole_zsh_path.rc | default(1) == 0

- name: Set Konsole default profile in konsolerc
  ansible.builtin.ini_file:
    path: "{{ non_root_home }}/.config/konsolerc"
    section: Desktop Entry
    option: DefaultProfile
    value: Default.profile
    mode: '0644'
  become: yes
  become_user: "{{ non_root_user }}"
  when: install_kde_plasma | default(false) | bool or configure_kde_plasma | default(false) | bool

