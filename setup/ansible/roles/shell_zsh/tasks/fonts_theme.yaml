---
# get_url does not create parent directories, and /usr/share/fonts does not exist on
# a Linux install that has never had a font package or a desktop environment. On such
# a machine all four downloads below failed with "Destination /usr/share/fonts does
# not exist", and because setup_zsh defaults to true and is hidden from the wizard's
# checklist, the user could not even turn it off without editing group_vars. Found by
# the e2e smoke scenario, which installs no desktop environment. See
# docs/regression_ledger.md.
- name: Ensure the system font directory exists
  ansible.builtin.file:
    path: /usr/share/fonts
    state: directory
    mode: '0755'
  become: yes
  when: ansible_facts['system'] == 'Linux'

- name: Download Nerd Fonts
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/usr/share/fonts/{{ item.name }}"
    mode: '0644'
  loop:
    - { url: '{{ meslo_regular_url }}', name: 'MesloLGS NF Regular.ttf' }
    - { url: '{{ meslo_bold_url }}', name: 'MesloLGS NF Bold.ttf' }
    - { url: '{{ meslo_italic_url }}', name: 'MesloLGS NF Italic.ttf' }
    - { url: '{{ meslo_bold_italic_url }}', name: 'MesloLGS NF Bold Italic.ttf' }
  become: yes
  notify: Update Font Cache
  when: ansible_facts['system'] == 'Linux'

- name: Download Nerd Fonts (macOS)
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "~/Library/Fonts/{{ item.name }}"
    mode: '0644'
  loop:
    - { url: '{{ meslo_regular_url }}', name: 'MesloLGS NF Regular.ttf' }
    - { url: '{{ meslo_bold_url }}', name: 'MesloLGS NF Bold.ttf' }
    - { url: '{{ meslo_italic_url }}', name: 'MesloLGS NF Italic.ttf' }
    - { url: '{{ meslo_bold_italic_url }}', name: 'MesloLGS NF Bold Italic.ttf' }
  when: ansible_facts['os_family'] == 'Darwin'

- name: Clone Powerlevel10k Theme
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.git:
    repo: https://github.com/romkatv/powerlevel10k.git
    dest: "{{ non_root_home }}/.oh-my-zsh/custom/themes/powerlevel10k"
    depth: 1

