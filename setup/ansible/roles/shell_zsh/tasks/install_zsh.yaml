---
# One package per call through tasks/install_role_packages.yaml, so one that cannot install costs only
# itself and is named. The list is setup_zsh's companion_packages entry in vars/<OS>.yaml, which
# setup/ansible/verify_install.yaml reads too: the shell, curl that Oh-My-Zsh is fetched with, and git
# that oh_my_zsh.yaml clones it with. macOS carries curl and git of its own, so its entry is zsh alone.
- name: Install ZSH, curl and git (Linux)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: "{{ os_dict.companion_packages.setup_zsh }}"
    role_packages_purpose: ZSH, curl and git
  when: ih_family in ['Debian', 'RedHat', 'Archlinux']

# Oh-My-Zsh is cloned with git in oh_my_zsh.yaml, so a git that did not install stops the role here with
# the reason, as the package modules this replaced did.
- name: Stop when git did not install
  ansible.builtin.fail:
    msg: git did not install, so Oh-My-Zsh cannot be cloned. What the package manager said is in the [ERROR] line above.
  when:
    - ih_family in ['Debian', 'RedHat', 'Archlinux']
    - "'git' in (role_packages_missing | default([]))"

- name: Install ZSH (macOS)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: "{{ os_dict.companion_packages.setup_zsh }}"
    role_packages_purpose: ZSH
    role_packages_manager: brew
  when: ih_family == 'Darwin'

# `command -v zsh` is a POSIX shell builtin, not an executable — must run
# inside a shell (ansible.builtin.command invokes execve() directly with
# no shell, so it fails with "Error executing command"). Using `shell:`
# routes through bash where the builtin resolves correctly.
- name: Find ZSH path
  ansible.builtin.shell: command -v zsh
  args:
    executable: /bin/bash
  register: zsh_path
  changed_when: false
  failed_when: zsh_path.rc != 0 or (zsh_path.stdout | default('') | trim) == ''

- name: Change user shell to ZSH
  ansible.builtin.user:
    name: "{{ non_root_user }}"
    shell: "{{ zsh_path.stdout | trim }}"
  become: yes
  when: (zsh_path.stdout | default('') | trim) != ''
