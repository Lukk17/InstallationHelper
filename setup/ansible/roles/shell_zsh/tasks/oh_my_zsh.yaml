---
- name: Ensure git is installed (Debian)
  become: yes
  ansible.builtin.apt:
    name: git
    state: present
  when: ih_family == 'Debian'

- name: Ensure git is installed (Fedora)
  become: yes
  ansible.builtin.dnf:
    name: git
    state: present
  when: ih_family == 'RedHat'

- name: Ensure git is installed (Arch)
  become: yes
  community.general.pacman:
    name: git
    state: present
  when: ih_family == 'Archlinux'

- name: Check if Oh-My-Zsh is already installed
  ansible.builtin.stat:
    path: "{{ non_root_home }}/.oh-my-zsh"
  register: omz_dir

- name: Install Oh-My-Zsh
  ansible.builtin.shell: |
    set -o pipefail
    sh -c "$(curl -fsSL --max-time 120 https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended </dev/null
  args:
    executable: /bin/bash
    creates: "{{ non_root_home }}/.oh-my-zsh/oh-my-zsh.sh"
  become: yes
  become_user: "{{ non_root_user }}"
  register: omz_install
  retries: 3
  delay: 10
  until: omz_install is succeeded
  when: not omz_dir.stat.exists

- name: Copy ZSH configuration files
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../config/{{ item }}"
    dest: "{{ non_root_home }}/{{ item }}"
  loop:
    - ".p10k.zsh"
    - ".zshrc.pre-oh-my-zsh"
    - ".zshrc"
  when: not omz_dir.stat.exists
