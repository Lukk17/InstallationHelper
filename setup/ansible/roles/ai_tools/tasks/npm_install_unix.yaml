---
# Shared helper for installing a global npm package via NVM on any non-Windows OS.
# Linux and macOS both come through here: every caller except bruno_cli routes
# macOS down this path too. Only bruno_cli skips it, because it has a Homebrew
# formula mapped in vars/Darwin.yaml and software_installer handles macOS there.
#
# Required vars (caller must set via include_tasks vars:):
#   npm_pkg            — full npm package spec (e.g. "@anthropic-ai/claude-code")
#   npm_display_name   — human label used in task names and the warn message
#
# Optional vars:
#   npm_install_extra_args — string appended to `npm install -g` (e.g. "--no-audit")
#   npm_replaced_pkg       : an older npm package this one replaces, removed before the install
#                            because both claim the same bin and npm refuses the second with EEXIST
#   npm_replaced_reason    : the words the [INFO] line uses for what was removed and why
#
# Behaviour:
#   1. Probe ~/.nvm/nvm.sh. If absent, emit a [WARN] and skip the install.
#   2. Check `npm list -g <pkg>` to keep the task idempotent.
#   3. When npm_replaced_pkg is set and <pkg> is absent, `npm uninstall -g` it first, and install it
#      again when <pkg> then fails to install, so a failure never leaves neither of them.
#   4. Install under `nvm use --lts` with a 600s wall-clock timeout, run
#      async, under the retry rule every package manager follows, four attempts twenty seconds
#      apart, with no refresh between them: npm keeps no package list to refresh, its cache verifies
#      what it stores and refetches what fails, and its own documentation, npm 11.19.0
#      docs/content/commands/npm-cache.md, says clearing it is only ever for reclaiming disk space.
#
# `chdir: {{ non_root_home }}` on the shell tasks prevents an attacker-controlled
# .npmrc in cwd from redirecting the npm registry — npm walks upward from cwd
# looking for .npmrc, so anchoring cwd at the user's home directory is the
# narrowest safe scope.

# Reset registers between successive include_tasks invocations of this helper.
# Without this, a skipped check task in a later invocation would inherit
# `npm_pkg_check` from the previous tool's run and produce surprising gate logic.
- name: "Reset helper registers for {{ npm_display_name }} (Unix)"
  ansible.builtin.set_fact:
    nvm_script_stat: {}
    npm_pkg_check: {}
    npm_replaced_removal: {}
    npm_pkg_install: {}
    npm_replaced_restore: {}

- name: "Probe NVM installation for {{ npm_display_name }} (Unix)"
  ansible.builtin.stat:
    path: "{{ non_root_home }}/.nvm/nvm.sh"
  register: nvm_script_stat

# Seven command-line tools come through this helper, one include_tasks each, and without NVM every one
# of them installs nothing. That used to be a debug message and nothing else: no exit code, no
# summary entry, and until the dual_logger callback learned to render a debug msg, not even a console
# line. So a run with a failed NVM install reported success and quietly delivered none of Claude
# Code, OpenCode, OpenSpec or the rest.
#
# [ERROR] rather than [WARN] because the user asked for this tool and did not get it, and the marker
# is what routes the line into ~/installation_errors.log.
- name: "Report that {{ npm_display_name }} could not be installed without NVM"
  ansible.builtin.debug:
    msg: >-
      [ERROR] {{ npm_display_name }} was NOT installed. NVM is absent from
      {{ non_root_home }}/.nvm/nvm.sh and it is the only install path this tool has on this OS, so
      nothing was attempted. Either install_nodejs is false, or the NVM install in sdk_manager failed
      earlier in this run and named itself there. Rerun with --tags nvm,ai once that is fixed.
  when: not nvm_script_stat.stat.exists

- name: "Record the missing {{ npm_display_name }} in the play summary"
  ansible.builtin.set_fact:
    any_role_failed: true
    not_installed_with_reason: >-
      {{ (not_installed_with_reason | default([])) + [npm_display_name ~ ' (NVM is not installed)'] }}
  when: not nvm_script_stat.stat.exists

# The check MUST activate the same Node version that the install task will use
# (LTS). Without `nvm use --lts`, sourcing nvm.sh activates the user's default
# alias (which may be a non-LTS current release), the check queries that Node's
# global packages, and we get a false negative or false positive depending on
# what's installed where. Pre-refactor versions of this task had the bug.
- name: "Check if {{ npm_display_name }} is already installed (Unix)"
  ansible.builtin.shell: |
    source {{ non_root_home }}/.nvm/nvm.sh
    nvm use --lts >/dev/null 2>&1
    grep -q -F '{{ npm_pkg }}' <<<"$(npm list -g {{ npm_pkg }} --depth=0 2>/dev/null)"
  args:
    executable: /bin/bash
    chdir: "{{ non_root_home }}"
  become: yes
  become_user: "{{ non_root_user }}"
  register: npm_pkg_check
  changed_when: false
  failed_when: false
  when: nvm_script_stat.stat.exists

# Measured on 2026-10-10 with npm 11.13.0 under Node 24 in a throwaway prefix: with opencode-ai
# installed, `npm install -g @opencode/cli` exits 1 with "EEXIST: file already exists" on bin/opencode
# and changes nothing, so the old package has to go first. `npm uninstall -g` prints
# "removed <n> packages" on stdout when it removed something and "up to date" when the package was
# not there, rc 0 both times, so the stdout line is what says whether this task changed anything.
- name: "Remove {{ npm_replaced_pkg | default('') }}, which {{ npm_display_name }} replaces (Unix)"
  ansible.builtin.shell: |
    set -o pipefail
    source {{ non_root_home }}/.nvm/nvm.sh
    nvm use --lts >/dev/null 2>&1
    npm uninstall -g {{ npm_replaced_pkg | quote }} </dev/null
  args:
    executable: /bin/bash
    chdir: "{{ non_root_home }}"
  become: yes
  become_user: "{{ non_root_user }}"
  register: npm_replaced_removal
  changed_when: "'removed ' in (npm_replaced_removal.stdout | default(''))"
  when:
    - npm_replaced_pkg | default('') | length > 0
    - nvm_script_stat.stat.exists
    - npm_pkg_check.rc | default(1) != 0

- name: "Say that {{ npm_replaced_pkg | default('') }} was removed (Unix)"
  ansible.builtin.debug:
    msg: "[INFO] removed {{ npm_replaced_reason | default(npm_replaced_pkg ~ ', which ' ~ npm_display_name ~ ' replaces') }}"
  when: npm_replaced_removal is changed

# The replaced package is removed before the new one is proven to install, because npm refuses the
# new one while the old one holds the bin. So when the install fails after a removal, the rescue
# installs the replaced package again, and the failure is raised again with what happened to it, so
# the caller's rescue names the step and says whether the earlier CLI is still there. Without this, a
# failed @opencode/cli install left no OpenCode CLI at all on a machine that had a working one.
- name: "Install {{ npm_display_name }} via NVM, and restore what it replaces if it fails (Unix)"
  when:
    - nvm_script_stat.stat.exists
    - npm_pkg_check.rc | default(1) != 0
  block:
    - name: "Install {{ npm_display_name }} via NVM (Unix)"
      ansible.builtin.shell: |
        set -o pipefail
        {{ ih_timeout }} 600 bash -c 'source {{ non_root_home }}/.nvm/nvm.sh && nvm use --lts >/dev/null && npm install -g {% if npm_install_extra_args is defined and npm_install_extra_args | length > 0 %}{{ npm_install_extra_args }} {% endif %}{{ npm_pkg }} </dev/null'
      args:
        executable: /bin/bash
        chdir: "{{ non_root_home }}"
      become: yes
      become_user: "{{ non_root_user }}"
      register: npm_pkg_install
      async: 900
      poll: 15
      retries: 3
      delay: 20
      until: npm_pkg_install is succeeded
  rescue:
    - name: "Install {{ npm_replaced_pkg | default('') }} again, because {{ npm_display_name }} did not install (Unix)"
      ansible.builtin.shell: |
        set -o pipefail
        {{ ih_timeout }} 600 bash -c 'source {{ non_root_home }}/.nvm/nvm.sh && nvm use --lts >/dev/null && npm install -g {{ npm_replaced_pkg | quote }} </dev/null'
      args:
        executable: /bin/bash
        chdir: "{{ non_root_home }}"
      become: yes
      become_user: "{{ non_root_user }}"
      register: npm_replaced_restore
      failed_when: false
      retries: 3
      delay: 20
      until: npm_replaced_restore.rc == 0
      when: npm_replaced_removal is changed

    - name: "Stop {{ npm_display_name }} with what happened to the package it replaces (Unix)"
      ansible.builtin.fail:
        msg: >-
          {{ npm_display_name }} did not install: {{ npm_pkg_install.msg | default('no message given') }}
          {{ npm_pkg_install.stderr | default('') | trim }}
          {% if npm_replaced_removal is changed and (npm_replaced_restore.rc | default(1)) == 0 %}
          {{ npm_replaced_pkg }} had been removed to make room and was installed again, so the earlier
          {{ npm_display_name }} is still on this machine.
          {% elif npm_replaced_removal is changed %}
          {{ npm_replaced_pkg }} had been removed to make room and could not be installed again either,
          so there is no {{ npm_display_name }} on this machine now. npm said:
          {{ (npm_replaced_restore.stderr | default('') ~ ' ' ~ npm_replaced_restore.stdout | default('')) | trim | default('nothing', true) }}
          {% endif %}
