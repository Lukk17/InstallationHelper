---
- name: Install OpenSpec CLI via NVM (Linux/Mac)
  ansible.builtin.shell: |
    . {{ ansible_env.HOME }}/.nvm/nvm.sh
    npm install -g openspec
  args:
    executable: /bin/bash
  when: ansible_os_family != 'Windows'
  ignore_errors: yes

- name: Install OpenSpec CLI via Windows NPM (Windows)
  ansible.windows.win_shell: npm install -g openspec
  when: ansible_os_family == 'Windows'
  ignore_errors: yes