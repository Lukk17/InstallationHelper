---
- name: Check if OpenCode CLI is already installed (Unix)
  ansible.builtin.shell: |
    . {{ non_root_home }}/.nvm/nvm.sh
    npm list -g opencode-ai --depth=0 2>/dev/null | grep -q opencode-ai
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: opencode_check
  changed_when: false
  failed_when: false

- name: Install OpenCode CLI via NVM (Unix)
  ansible.builtin.shell: |
    set -o pipefail
    . {{ non_root_home }}/.nvm/nvm.sh
    npm install -g opencode-ai
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  when: opencode_check.rc != 0
