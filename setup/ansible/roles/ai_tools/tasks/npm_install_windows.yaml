---
# Shared helper for installing a global npm package on Windows.
#
# Required vars (caller must set via include_tasks vars:):
#   npm_pkg            — full npm package spec
#   npm_display_name   — human label
#
# Optional vars:
#   npm_install_extra_args — extra args appended to `npm install -g`
#
# Requires `gather_facts: yes` on the play (default in site.yaml) so that
# `ansible_env.USERPROFILE` is populated.
#
# `chdir: {{ ansible_env.USERPROFILE }}` anchors npm's .npmrc lookup at the
# user profile root, the same defense as the Unix helper. Without this, an
# `.npmrc` in any ancestor of the invoking shell's cwd could redirect the
# registry to a hostile mirror — npm walks upward from cwd looking for one.
#
# This file deliberately does NOT block execution when running elevated;
# Chocolatey tasks elsewhere in the playbook legitimately need elevation,
# so the playbook as a whole supports admin runs. The trade-off (npm-global
# installs landing under %ProgramFiles%\nodejs when run elevated) is
# documented in setup/README_SETUP.md — users are directed to run from a
# non-Administrator shell. See docs/AI_TOOLS_ADDING.md.

# Reset registers between successive include_tasks invocations of this helper.
- name: "Reset helper registers for {{ npm_display_name }} (Windows)"
  ansible.builtin.set_fact:
    npm_where: {}
    npm_pkg_check: {}
    npm_pkg_install: {}

- name: "Check npm availability for {{ npm_display_name }} (Windows)"
  ansible.windows.win_command: where.exe npm
  register: npm_where
  changed_when: false
  failed_when: false

- name: "Check if {{ npm_display_name }} is already installed (Windows)"
  ansible.windows.win_shell: npm list -g {{ npm_pkg }} --depth=0 2>$null
  args:
    chdir: "{{ ansible_env.USERPROFILE }}"
  register: npm_pkg_check
  changed_when: false
  failed_when: false
  when: npm_where.rc == 0

- name: "Install {{ npm_display_name }} via npm (Windows)"
  ansible.windows.win_shell: npm install -g {% if npm_install_extra_args is defined and npm_install_extra_args | length > 0 %}{{ npm_install_extra_args }} {% endif %}{{ npm_pkg }}
  args:
    chdir: "{{ ansible_env.USERPROFILE }}"
  register: npm_pkg_install
  retries: 2
  delay: 15
  until: npm_pkg_install is succeeded
  when:
    - npm_where.rc == 0
    - npm_pkg_check.rc | default(1) != 0 or npm_pkg not in (npm_pkg_check.stdout | default(''))

- name: "Skip {{ npm_display_name }} (Windows, npm missing)"
  ansible.builtin.debug:
    msg: "npm not found on PATH — install Node.js first (sdk_manager role enables nvm via choco). Skipping {{ npm_display_name }}."
  when: npm_where.rc != 0
