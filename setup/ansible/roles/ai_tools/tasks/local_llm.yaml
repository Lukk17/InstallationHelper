---
- name: Clone Stable Diffusion WebUI (Linux/Mac)
  ansible.builtin.git:
    repo: https://github.com/AUTOMATIC1111/stable-diffusion-webui.git
    dest: "{{ ansible_facts['env']['HOME'] }}/stable-diffusion-webui"
  when: ansible_facts['os_family'] != 'Windows' and install_stable_diffusion | bool

- name: Check if LM Studio is already installed (Linux)
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/lms"
  register: lms_installed
  when: ansible_facts['system'] == 'Linux' and install_lm_studio | bool

- name: Install LM Studio via official script (Linux)
  ansible.builtin.shell: |
    curl -fsSL https://lmstudio.ai/install.sh | bash
  args:
    executable: /bin/bash
  when:
    - ansible_facts['system'] == 'Linux'
    - install_lm_studio | bool
    - not (lms_installed.stat.exists | default(false))

