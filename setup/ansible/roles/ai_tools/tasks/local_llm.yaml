---
- name: Clone Stable Diffusion WebUI (Linux/Mac)
  become: yes
  become_user: "{{ non_root_user }}"
  ansible.builtin.git:
    repo: https://github.com/AUTOMATIC1111/stable-diffusion-webui.git
    dest: "{{ non_root_home }}/stable-diffusion-webui"
    version: "{{ stable_diffusion_webui_version }}"
  when: ih_family != 'Windows' and install_stable_diffusion | bool

# ~/.local/bin/lms is not a path the installer has ever written. It puts the CLI in
# <lmstudio home>/bin/lms, where the home is ~/.lmstudio unless ~/.lmstudio-home-pointer names
# another one, which is the indirection the installer itself reads before it reports where lms
# landed. So the old stat could never be true and LM Studio was downloaded and unpacked again on
# every run, a bundle of several hundred megabytes.
#
# That pointer is also why this is a probe rather than a `creates`: the artefact's path is a fact
# about the machine, read at run time, not a constant this file can name. `test -x` rather than
# `test -f` on purpose, so a half unpacked install with a non-executable lms is reinstalled instead
# of being taken for a working one.
  # Retried, because this reaches the network and a single dropped connection must not cost the
  # run. Four separate transients hit one sweep on 2026-08-22: a broken pipe from deb.debian.org,
  # a connection reset from GitHub on a font, an SSL connect error fetching an AppImage, and a TLS
  # eof from python.org.
  register: sd_webui_clone
  until: sd_webui_clone is succeeded
  retries: 3
  delay: 10
- name: Ask where LM Studio put its CLI, if it is installed (Linux)
  ansible.builtin.shell: |
    set -o pipefail
    lms_home="{{ non_root_home }}/.lmstudio"
    pointer="{{ non_root_home }}/.lmstudio-home-pointer"
    if [ -f "$pointer" ]; then
      lms_home="$(cat "$pointer")"
    fi
    test -x "$lms_home/bin/lms"
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: lms_installed
  changed_when: false
  failed_when: false
  when: ansible_facts['system'] == 'Linux' and install_lm_studio | bool

# `{{ ih_timeout }} 600` wraps the whole pipeline so the piped `bash` (which itself
# downloads binaries) can't hang past 10 min. `--max-time 120` only bounds
# curl's transfer, not the bash sub-process.
- name: Install LM Studio via official script (Linux)
  ansible.builtin.shell: |
    set -o pipefail
    export PATH="$PATH:/sbin:/usr/sbin"
    {{ ih_timeout }} 600 bash -c 'curl -fsSL --max-time 120 https://lmstudio.ai/install.sh | bash' </dev/null
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: lm_studio_install
  retries: 2
  delay: 10
  until: lm_studio_install is succeeded
  when:
    - ansible_facts['system'] == 'Linux'
    - install_lm_studio | bool
    - (lms_installed.rc | default(1)) != 0
