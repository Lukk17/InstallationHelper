---
- name: Install OpenCode CLI via NVM (Linux/Mac)
  ansible.builtin.shell: |
    . {{ ansible_env.HOME }}/.nvm/nvm.sh
    npm install -g opencode-ai
  args:
    executable: /bin/bash
  when: ansible_os_family != 'Windows' and install_opencode | bool
  ignore_errors: yes

- name: Install OpenCode CLI via Windows NPM (Windows)
  ansible.windows.win_shell: npm install -g opencode-ai
  when: ansible_os_family == 'Windows' and install_opencode | bool
  ignore_errors: yes
