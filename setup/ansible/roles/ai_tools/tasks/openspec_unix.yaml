---
- name: Check if OpenSpec CLI is already installed (Unix)
  ansible.builtin.shell: |
    . {{ ansible_facts['env']['HOME'] }}/.nvm/nvm.sh
    npm list -g openspec --depth=0 2>/dev/null | grep -q openspec
  args:
    executable: /bin/bash
  register: openspec_check
  changed_when: false
  failed_when: false

- name: Install OpenSpec CLI via NVM (Unix)
  ansible.builtin.shell: |
    set -o pipefail
    . {{ ansible_facts['env']['HOME'] }}/.nvm/nvm.sh
    npm install -g openspec
  args:
    executable: /bin/bash
  when: openspec_check.rc != 0

