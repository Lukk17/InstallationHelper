---
- name: Install Claude Code CLI via npm helper
  ansible.builtin.include_tasks: npm_install_unix.yaml
  vars:
    npm_pkg: "@anthropic-ai/claude-code"
    npm_display_name: "Claude Code"
  when: install_claude_code | default(false) | bool

# Claude Desktop is no longer installed here. Anthropic publishes an apt repository and distributes the
# Linux application only through it, so the mapping in vars/Debian.yaml installs `claude-desktop` like
# any other apt package and debian_repos.yaml adds the repository and verifies its signing key.
#
# What was here before downloaded a file from a content host and installed it with a raw apt-get. That
# URL now answers 404, so the install had been broken for some time and nothing noticed, because the
# toggle was off by default on Linux then and no container run reached it. Found by the pinned-location check
# in tier 2 rather than by a person.

- name: Check if Claude Desktop is installed (Arch Linux)
  ansible.builtin.command: pacman -Q claude-desktop
  register: claude_desktop_arch_check
  changed_when: false
  failed_when: false
  when:
    - install_claude_desktop | default(false) | bool
    - ih_family == 'Archlinux'

- name: Install Claude Desktop via AUR (Arch Linux)
  become: yes
  become_user: "{{ non_root_user }}"
  kewlfft.aur.aur:
    name: claude-desktop
    use: paru
    extra_args: "--noconfirm --skipreview"
    state: present
  # The retry rule every package manager follows, four attempts twenty seconds apart, with no refresh
  # between them, because paru asks the AUR's /rpc endpoint on every call and keeps no index of it.
  register: claude_desktop_aur
  until: claude_desktop_aur is succeeded
  retries: 3
  delay: 20
  when:
    - install_claude_desktop | default(false) | bool
    - ih_family == 'Archlinux'
    - claude_desktop_arch_check.rc != 0
    - paru_available | default(false) | bool

# claude-desktop is an Arch User Repository package, so without paru it is not installed, and it is
# named among the skipped packages in the run's final summary rather than left out silently.
# paru_available comes from setup/ansible/tasks/paru_availability.yaml through arch_core.
- name: Record Claude Desktop as NOT installed because paru could not be built (Arch Linux)
  ansible.builtin.set_fact:
    aur_skipped_without_paru: "{{ aur_skipped_without_paru | default([]) + ['claude-desktop'] }}"
    any_role_failed: true
  when:
    - install_claude_desktop | default(false) | bool
    - ih_family == 'Archlinux'
    - claude_desktop_arch_check.rc != 0
    - not (paru_available | default(false) | bool)

# Through tasks/install_role_packages.yaml, the retry rule every package manager follows, so a cask
# that fails is retried after brew update and named when it never installs. The cask is
# install_claude_desktop's companion_packages entry in vars/Darwin.yaml, which verify_install.yaml reads too.
- name: Install Claude Desktop (macOS)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/install_role_packages.yaml"
    apply:
      tags: [always]
  vars:
    role_packages: "{{ os_dict.companion_packages.claude_desktop }}"
    role_packages_purpose: Claude Desktop
    role_packages_manager: brew_cask
  when:
    - install_claude_desktop | default(false) | bool
    - ih_family == 'Darwin'
