---
- name: Check if Claude Code CLI is already installed (Unix)
  ansible.builtin.shell: |
    set -o pipefail
    source {{ non_root_home }}/.nvm/nvm.sh
    npm list -g @anthropic-ai/claude-code --depth=0 2>/dev/null | grep -q claude-code
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: claude_code_check
  changed_when: false
  failed_when: false

 # Wrap in bash -c so the timeout sub-shell sees the nvm function + the
# Node version's bin/npm on PATH. Sourcing nvm.sh alone doesn't activate
# any Node version unless `default` alias was set — nvm use --lts
# guarantees one is active for this invocation.
- name: Install Claude Code CLI via NPM (Unix)
  ansible.builtin.shell: |
    set -o pipefail
    timeout 600 bash -c 'source {{ non_root_home }}/.nvm/nvm.sh && nvm use --lts >/dev/null && npm install -g @anthropic-ai/claude-code </dev/null'
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  register: claude_code_install
  async: 900
  poll: 15
  retries: 2
  delay: 15
  until: claude_code_install is succeeded
  when: claude_code_check.rc != 0



- name: Check if Claude Desktop is installed (Linux Debian)
  ansible.builtin.stat:
    path: /usr/bin/claude-desktop
  register: claude_desktop_stat
  when:
    - install_claude_desktop | default(false) | bool
    - ansible_facts['os_family'] == 'Debian'

- name: Download Claude Desktop .deb (Linux Debian)
  ansible.builtin.get_url:
    url: "{{ claude_desktop_deb_url }}"
    dest: "{{ non_root_home }}/.lukkInstall/claude-desktop.deb"
    mode: '0644'
    timeout: 60
  become: yes
  become_user: "{{ non_root_user }}"
  register: claude_desktop_download
  retries: 3
  delay: 10
  until: claude_desktop_download is succeeded
  when:
    - install_claude_desktop | default(false) | bool
    - ansible_facts['os_family'] == 'Debian'
    - not (claude_desktop_stat.stat.exists | default(false))

- name: Install Claude Desktop .deb (Linux Debian)
  ansible.builtin.apt:
    deb: "{{ non_root_home }}/.lukkInstall/claude-desktop.deb"
    state: present
  become: yes
  when:
    - install_claude_desktop | default(false) | bool
    - ansible_facts['os_family'] == 'Debian'
    - not (claude_desktop_stat.stat.exists | default(false))

- name: Check if Claude Desktop is installed (Arch Linux)
  ansible.builtin.command: pacman -Q claude-desktop
  register: claude_desktop_arch_check
  changed_when: false
  failed_when: false
  when:
    - install_claude_desktop | default(false) | bool
    - ansible_facts['os_family'] == 'Archlinux'

- name: Install Claude Desktop via AUR (Arch Linux)
  become: yes
  become_user: "{{ non_root_user }}"
  kewlfft.aur.aur:
    name: claude-desktop
    use: paru
    extra_args: "--noconfirm --skipreview"
    state: present
  when:
    - install_claude_desktop | default(false) | bool
    - ansible_facts['os_family'] == 'Archlinux'
    - claude_desktop_arch_check.rc != 0

- name: Install Claude Desktop (macOS)
  community.general.homebrew_cask:
    name: claude
    state: present
  when:
    - install_claude_desktop | default(false) | bool
    - ansible_facts['os_family'] == 'Darwin'

