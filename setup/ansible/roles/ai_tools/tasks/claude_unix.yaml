---
- name: Check if Claude Code CLI is already installed (Unix)
  ansible.builtin.shell: |
    source {{ ansible_env.HOME }}/.nvm/nvm.sh
    npm list -g @anthropic-ai/claude-code --depth=0 2>/dev/null | grep -q claude-code
  args:
    executable: /bin/bash
  register: claude_code_check
  changed_when: false
  failed_when: false

- name: Install Claude Code CLI via NPM (Unix)
  ansible.builtin.shell: |
    set -o pipefail
    source {{ ansible_env.HOME }}/.nvm/nvm.sh && npm install -g @anthropic-ai/claude-code
  args:
    executable: /bin/bash
  when: claude_code_check.rc != 0



- name: Install Claude Desktop (Linux)
  ansible.builtin.shell: |
    set -o pipefail
    curl -sL https://anthropic-claude-desktop-app.s3.amazonaws.com/install.sh | bash
  args:
    executable: /bin/bash
    creates: /usr/bin/claude-desktop
  when: ansible_facts['os_family'] != 'Darwin'

- name: Install Claude Desktop (macOS)
  community.general.homebrew_cask:
    name: claude
    state: present
  when: ansible_facts['os_family'] == 'Darwin'
