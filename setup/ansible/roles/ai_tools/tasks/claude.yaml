---
- name: Install Claude Code CLI (Linux/Mac)
  ansible.builtin.shell: |
    . {{ ansible_env.HOME }}/.nvm/nvm.sh
    npm install -g @anthropic-ai/claude-code
  args:
    executable: /bin/bash
  when: ansible_os_family != 'Windows' and install_claude_code | bool
  ignore_errors: yes

- name: Install Claude Code CLI (Windows)
  ansible.windows.win_shell: npm install -g @anthropic-ai/claude-code
  when: ansible_os_family == 'Windows' and install_claude_code | bool
  ignore_errors: yes

# --- Claude Desktop (Debian) ---

- name: Add Claude Desktop repository and install (Debian)
  become: yes
  ansible.builtin.shell: curl -fsSL https://patrickjaja.github.io/claude-desktop-bin/install.sh | bash
  when: ansible_os_family == 'Debian' and install_claude_desktop | bool

- name: Install Claude Desktop package (Debian)
  become: yes
  ansible.builtin.apt:
    name: claude-desktop-bin
    state: present
    update_cache: yes
  when: ansible_os_family == 'Debian' and install_claude_desktop | bool

# --- Claude Desktop (Arch — AUR) ---

- name: Install Claude Desktop (Arch via AUR)
  become: no
  kewlfft.aur.aur:
    name: claude-desktop-bin
    use: yay
    state: present
  when: ansible_os_family == 'Archlinux' and install_claude_desktop | bool

# --- Claude Desktop (Fedora — alien conversion of official deb) ---

- name: Install alien for deb-to-rpm conversion (Fedora)
  become: yes
  ansible.builtin.dnf:
    name: alien
    state: present
  when: ansible_os_family == 'RedHat' and install_claude_desktop | bool

- name: Download official Claude Desktop deb (Fedora)
  ansible.builtin.get_url:
    url: "{{ claude_desktop_deb_url }}"
    dest: "{{ ansible_env.HOME }}/.lukkInstall/claude-desktop.deb"
    mode: '0644'
  when: ansible_os_family == 'RedHat' and install_claude_desktop | bool

- name: Convert Claude Desktop deb to RPM (Fedora)
  become: yes
  ansible.builtin.command: >
    alien --to-rpm --scripts {{ ansible_env.HOME }}/.lukkInstall/claude-desktop.deb
  args:
    chdir: "{{ ansible_env.HOME }}/.lukkInstall"
  register: alien_convert
  changed_when: true
  when: ansible_os_family == 'RedHat' and install_claude_desktop | bool

- name: Find converted Claude Desktop RPM (Fedora)
  ansible.builtin.find:
    paths: "{{ ansible_env.HOME }}/.lukkInstall"
    patterns: "claude-desktop*.rpm"
  register: claude_rpm
  when: ansible_os_family == 'RedHat' and install_claude_desktop | bool

- name: Install converted Claude Desktop RPM (Fedora)
  become: yes
  ansible.builtin.command: rpm -ivh --force {{ claude_rpm.files[0].path }}
  when: ansible_os_family == 'RedHat' and install_claude_desktop | bool and claude_rpm.files | length > 0
  ignore_errors: yes

# --- Claude Desktop (macOS — official Homebrew Cask) ---

- name: Install Claude Desktop (macOS via Homebrew Cask)
  community.general.homebrew_cask:
    name: claude
    state: present
  when: ansible_os_family == 'Darwin' and install_claude_desktop | bool

# --- Claude Cowork Service (Linux/Mac) ---

- name: Install Go compiler for Cowork Service (Debian)
  become: yes
  ansible.builtin.apt:
    name: golang-go
    state: present
  when: ansible_os_family == 'Debian' and install_claude_cowork | bool

- name: Install Go compiler for Cowork Service (Arch)
  become: yes
  community.general.pacman:
    name: go
    state: present
  when: ansible_os_family == 'Archlinux' and install_claude_cowork | bool

- name: Install Go compiler for Cowork Service (Fedora)
  become: yes
  ansible.builtin.dnf:
    name: golang
    state: present
  when: ansible_os_family == 'RedHat' and install_claude_cowork | bool

- name: Clone Claude Cowork Service repository (Linux/Mac)
  ansible.builtin.git:
    repo: https://github.com/patrickjaja/claude-cowork-service.git
    dest: "{{ ansible_env.HOME }}/claude-cowork-service"
    version: main
    force: yes
  when: ansible_os_family != 'Windows' and install_claude_cowork | bool

- name: Build and install Claude Cowork Service (Linux/Mac)
  become: yes
  ansible.builtin.shell: |
    make
    make install
  args:
    chdir: "{{ ansible_env.HOME }}/claude-cowork-service"
  when: ansible_os_family != 'Windows' and install_claude_cowork | bool

- name: Enable and start Claude Cowork background daemon (Linux)
  ansible.builtin.shell: systemctl --user enable --now claude-cowork
  args:
    executable: /bin/bash
  when: ansible_system == 'Linux' and install_claude_cowork | bool