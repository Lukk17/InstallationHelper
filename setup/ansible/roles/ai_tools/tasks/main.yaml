    - install_lm_studio | default(false) | bool
      or install_stable_diffusion | default(false) | bool
  tags: [local_llm]
  block:
    - name: Import the LM Studio and Stable Diffusion tasks
      ansible.builtin.import_tasks: local_llm.yaml
  rescue:
    - name: Record that a local LLM tool could not be installed
      ansible.builtin.set_fact:
        any_role_failed: true
        not_installed_with_reason: >-
          {{ (not_installed_with_reason | default([]))
             + ['LM Studio or Stable Diffusion (' ~ (ansible_failed_task.name | default('a step')) ~ ' failed)'] }}

    - name: Name the local LLM step that failed
      ansible.builtin.debug:
        msg: >-
          [ERROR] Step '{{ ansible_failed_task.name | default('unknown') }}' failed with:
          {{ ansible_failed_result.msg | default('no message given') }}
          LM Studio or Stable Diffusion, whichever that step belongs to, is NOT installed, and the
          other one may not be either. Every other AI tool continues, and the run is marked failed.
