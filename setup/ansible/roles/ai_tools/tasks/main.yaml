---
- name: Install Claude Code
  ansible.builtin.import_tasks: claude.yaml
  when: install_claude_code | default(false) | bool

- name: Install OpenCode
  ansible.builtin.import_tasks: opencode.yaml
  when: install_opencode | default(false) | bool

- name: Install OpenSpec
  ansible.builtin.import_tasks: openspec.yaml
  when: install_openspec | default(false) | bool

- name: Install local LLM tools
  ansible.builtin.import_tasks: local_llm.yaml
  when:
    - install_lm_studio | default(false) | bool
      or install_stable_diffusion | default(false) | bool
