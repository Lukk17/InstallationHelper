---
# Every tool is its own block with a rescue. Until 2026-10-10 they were seven imports in a row with
# only the role-level rescue in site.yaml around them, so one that failed skipped every one after it:
# a Claude install that broke also cost OpenCode, OpenSpec, Codex, Grok, Bruno CLI and the local LLM
# tools. Now each failure records any_role_failed, adds the tool to the NOT installed list the terminal
# summary in site.yaml prints, and names the step with an [ERROR] line, which is what reaches
# ~/installation_errors.log. The next tool still runs, and the run still ends failed.
# e2e/tier1/rescue_coverage.sh fails the gate for an import here that has no rescue of its own.
- name: Install Claude Code / Desktop
  when:
    - install_claude_code | default(false) | bool
      or install_claude_desktop | default(false) | bool
  tags: [claude]
  block:
    - name: Import the Claude Code and Claude Desktop tasks
      ansible.builtin.import_tasks: claude.yaml
  rescue:
    - name: Record that Claude Code or Claude Desktop could not be installed
      ansible.builtin.set_fact:
        any_role_failed: true
        not_installed_with_reason: >-
          {{ (not_installed_with_reason | default([]))
             + ['Claude Code / Desktop (' ~ (ansible_failed_task.name | default('a step')) ~ ' failed)'] }}

    - name: Name the Claude step that failed
      ansible.builtin.debug:
        msg: >-
          [ERROR] Step '{{ ansible_failed_task.name | default('unknown') }}' failed with:
          {{ ansible_failed_result.msg | default('no message given') }}
          Claude Code or Claude Desktop is NOT installed. Every other AI tool continues, and the run is
          marked failed.

