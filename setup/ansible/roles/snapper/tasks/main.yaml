---
# findmnt is util-linux only — guard so direct role invocation on macOS
# doesn't fail. The site.yaml block also gates on Linux, so this is
# defensive (covers direct ansible-playbook -i roles/snapper invocations).
- name: Detect root filesystem type (Linux only)
  ansible.builtin.command: findmnt -no FSTYPE /
  register: root_fs_type
  changed_when: false
  when: ansible_facts['system'] == 'Linux'

- name: Install snapper (Arch)
  community.general.pacman:
    name: snapper
    state: present
  become: yes
  when:
    - ih_family == 'Archlinux'
    - root_fs_type.stdout == 'btrfs'

- name: Install snapper (Debian)
  ansible.builtin.apt:
    name: snapper
    state: present
    update_cache: yes
  become: yes
  when:
    - ih_family == 'Debian'
    - root_fs_type.stdout == 'btrfs'

- name: Install snapper (RedHat)
  ansible.builtin.dnf:
    name: snapper
    state: present
  become: yes
  when:
    - ih_family == 'RedHat'
    - root_fs_type.stdout == 'btrfs'

- name: Create snapper config for root
  ansible.builtin.command: snapper -c root create-config /
  args:
    creates: /etc/snapper/configs/root
  become: yes
  when: (root_fs_type.stdout | default('')) == 'btrfs'

- name: Read current snapper config for root
  ansible.builtin.command: snapper -c root get-config
  register: snapper_root_config
  changed_when: false
  become: yes
  when: (root_fs_type.stdout | default('')) == 'btrfs'

- name: Apply snapper config values
  ansible.builtin.command: "snapper -c root set-config {{ item.key }}={{ item.value }}"
  become: yes
  loop:
    - { key: 'TIMELINE_CREATE',         value: 'yes' }
    - { key: 'TIMELINE_MIN_AGE',        value: '1800' }
    - { key: 'TIMELINE_LIMIT_HOURLY',   value: '24' }
    - { key: 'TIMELINE_LIMIT_DAILY',    value: '7' }
    - { key: 'TIMELINE_LIMIT_WEEKLY',   value: '4' }
    - { key: 'TIMELINE_LIMIT_MONTHLY',  value: '6' }
  when:
    - root_fs_type.stdout == 'btrfs'
    - snapper_root_config is defined
    - snapper_root_config.stdout is defined
    - ('| ' ~ item.key ~ ' ' ~ ' ' * (28 - item.key | length) ~ '| ' ~ item.value) not in snapper_root_config.stdout
  loop_control:
    label: "{{ item.key }}={{ item.value }}"

- name: Probe for snapper-timeline.timer unit file
  ansible.builtin.stat:
    path: "{{ item }}"
  register: snapper_timer_units
  loop:
    - /usr/lib/systemd/system/snapper-timeline.timer
    - /lib/systemd/system/snapper-timeline.timer
  when:
    - ansible_facts['system'] == 'Linux'
    - (root_fs_type.stdout | default('')) == 'btrfs'

- name: Enable snapper systemd timer
  ansible.builtin.systemd:
    name: snapper-timeline.timer
    enabled: yes
    state: started
  become: yes
  when:
    - ansible_facts['system'] == 'Linux'
    - (root_fs_type.stdout | default('')) == 'btrfs'
    - snapper_timer_units is defined
    - snapper_timer_units.results | selectattr('stat.exists', 'equalto', true) | list | length > 0

- name: Check for existing snapper snapshots
  ansible.builtin.command: snapper -c root list --columns number
  register: snapper_snapshots
  changed_when: false
  become: yes
  when: (root_fs_type.stdout | default('')) == 'btrfs'

- name: Create initial snapshot
  ansible.builtin.command: snapper -c root create -t single --description "Initial Ansible snapshot"
  become: yes
  when:
    - root_fs_type.stdout == 'btrfs'
    - snapper_snapshots is defined
    - (snapper_snapshots.stdout_lines | default([]) | length) <= 2
