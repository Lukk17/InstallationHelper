- name: Install DataGrip via Toolbox
  ansible.builtin.shell: |
    set -o pipefail
    ~/.local/share/JetBrains/Toolbox/bin/jetbrains-toolbox install datagrip
  args:
    executable: /bin/bash
  when:
    - install_jetbrains_toolbox | default(true) | bool
    - not toolbox_binary.stat.exists
