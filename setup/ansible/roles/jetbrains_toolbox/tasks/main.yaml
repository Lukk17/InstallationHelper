---
- name: Check if JetBrains Toolbox is installed
  ansible.builtin.stat:
    path: "{{ non_root_home }}/.local/share/JetBrains/Toolbox/bin/jetbrains-toolbox"
  register: toolbox_binary

- name: Check if JetBrains Toolbox is installed via AUR
  ansible.builtin.command:
    cmd: pacman -Q jetbrains-toolbox
  register: toolbox_aur_check
  changed_when: false
  failed_when: false
  when:
    - ansible_facts['os_family'] == "Archlinux"

- name: Download JetBrains Toolbox tarball
  ansible.builtin.get_url:
    url: "https://data.services.jetbrains.com/products/download?platform=linux&code=TBA"
    dest: /tmp/jetbrains-toolbox.tar.gz
    mode: '0644'
    checksum: "{{ download_checksums.jetbrains_toolbox | default(omit) }}"
    timeout: 60
  become: yes
  become_user: "{{ non_root_user }}"
  register: toolbox_download
  retries: 3
  delay: 10
  until: toolbox_download is succeeded
  when:
    - install_jetbrains_toolbox | default(true) | bool
    - ansible_facts['system'] in ['Linux', 'Darwin']
    - not toolbox_binary.stat.exists
    - ansible_facts['os_family'] != "Archlinux"

- name: Extract and install JetBrains Toolbox (Linux/macOS)
  ansible.builtin.shell: |
    set -o pipefail
    tar -xzf /tmp/jetbrains-toolbox.tar.gz -C /tmp/
    TOOLBOX_DIR=$(find /tmp -maxdepth 1 -name 'jetbrains-toolbox-*' -type d | head -1)
    if [ -n "$TOOLBOX_DIR" ] && [ -f "$TOOLBOX_DIR/jetbrains-toolbox" ]; then
      "$TOOLBOX_DIR/jetbrains-toolbox" --install
    fi
  args:
    executable: /bin/bash
    creates: "{{ non_root_home }}/.local/share/JetBrains/Toolbox/bin/jetbrains-toolbox"
  become: yes
  become_user: "{{ non_root_user }}"
  when:
    - install_jetbrains_toolbox | default(true) | bool
    - ansible_facts['system'] in ['Linux', 'Darwin']
    - not toolbox_binary.stat.exists
    - ansible_facts['os_family'] != "Archlinux"

- name: Probe Toolbox apps directory existence
  ansible.builtin.stat:
    path: "{{ non_root_home }}/.local/share/JetBrains/Toolbox/apps"
  register: toolbox_apps_dir

- name: Probe currently-installed Toolbox IDEs
  ansible.builtin.find:
    paths: "{{ non_root_home }}/.local/share/JetBrains/Toolbox/apps"
    file_type: directory
    depth: 1
  register: toolbox_installed_ides
  changed_when: false
  when: toolbox_apps_dir.stat.exists and toolbox_apps_dir.stat.isdir

- name: Build set of installed Toolbox IDE slugs
  ansible.builtin.set_fact:
    toolbox_installed_slugs: >-
      {{ (toolbox_installed_ides.files | default([]))
         | map(attribute='path')
         | map('basename')
         | map('lower')
         | list }}

# Each IDE install is a ~1 GB download. async+poll plus a hard POSIX
# timeout dodge the 2.19 ansiballz race and prevent indefinite hangs.
- name: Install JetBrains IDEs via Toolbox
  ansible.builtin.shell: |
    set -o pipefail
    timeout 1800 "{{ non_root_home }}/.local/share/JetBrains/Toolbox/bin/jetbrains-toolbox" install {{ item.cli }} </dev/null
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  loop:
    - { cli: 'idea',     match: 'intellij' }
    - { cli: 'pycharm',  match: 'pycharm' }
    - { cli: 'webstorm', match: 'webstorm' }
    - { cli: 'datagrip', match: 'datagrip' }
    - { cli: 'rider',    match: 'rider' }
  loop_control:
    label: "{{ item.cli }}"
  register: toolbox_ide_install
  async: 2100
  poll: 30
  changed_when: toolbox_ide_install.rc | default(0) == 0
  failed_when: false
  when:
    - install_jetbrains_toolbox | default(true) | bool
    - toolbox_binary.stat.exists or (toolbox_download is defined and toolbox_download is changed)
    - toolbox_installed_slugs is not search(item.match)
