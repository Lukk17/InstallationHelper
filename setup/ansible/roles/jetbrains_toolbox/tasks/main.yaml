---
- name: Check if JetBrains Toolbox is installed
  ansible.builtin.stat:
    path: "{{ non_root_home }}/.local/share/JetBrains/Toolbox/bin/jetbrains-toolbox"
  register: toolbox_binary

# Where the tarball is staged and unpacked. One definition, read by the create, download and extract
# tasks below, so the three cannot drift onto different paths.
#
# Not software_installer_stage_dir: that directory is root-owned and mode 0700 by design, and
# everything here runs as the non-root user, who could not even enter it. The user's own
# .lukkInstall is what the other non-root vendor artifacts in this repository already use, it is
# owned by that user rather than world-writable, and site.yaml's post_tasks already remove it at the
# end of a successful run, so nothing here needs its own cleanup task.
#
# The point of moving off /tmp is that both halves of this were predictable paths in a directory
# every local account can write to: /tmp/jetbrains-toolbox.tar.gz, which get_url would have used
# rather than replaced had it already existed, and /tmp/jetbrains-toolbox-*/ which the next task
# locates with `find` and then executes. Planting either one got a local user's code run as this
# user. Lower stakes than the root-installed artifacts elsewhere, and the same defect.
- name: Set the JetBrains Toolbox staging directory
  ansible.builtin.set_fact:
    toolbox_stage_dir: "{{ non_root_home }}/.lukkInstall/jetbrains-toolbox"

- name: Create the private JetBrains Toolbox staging directory
  ansible.builtin.file:
    path: "{{ toolbox_stage_dir }}"
    state: directory
    mode: '0700'
  become: yes
  become_user: "{{ non_root_user }}"
  when:
    - install_jetbrains_toolbox | default(true) | bool
    - ansible_facts['system'] in ['Linux', 'Darwin']
    - not toolbox_binary.stat.exists
    - ih_family != "Archlinux"

# force: true because the download URL names no version at all, so a file left behind by an earlier
# run under a path that now survives a reboot would be installed forever.
- name: Download JetBrains Toolbox tarball
  ansible.builtin.get_url:
    url: "https://data.services.jetbrains.com/products/download?platform=linux&code=TBA"
    dest: "{{ toolbox_stage_dir }}/jetbrains-toolbox.tar.gz"
    force: true
    mode: '0600'
    checksum: "{{ download_checksums.jetbrains_toolbox | default(omit) }}"
    timeout: 60
  become: yes
  become_user: "{{ non_root_user }}"
  register: toolbox_download
  retries: 3
  delay: 10
  until: toolbox_download is succeeded
  when:
    - install_jetbrains_toolbox | default(true) | bool
    - ansible_facts['system'] in ['Linux', 'Darwin']
    - not toolbox_binary.stat.exists
    - ih_family != "Archlinux"

- name: Extract and install JetBrains Toolbox (Linux/macOS)
  ansible.builtin.shell: |
    set -o pipefail
    tar -xzf "{{ toolbox_stage_dir }}/jetbrains-toolbox.tar.gz" -C "{{ toolbox_stage_dir }}/"
    TOOLBOX_DIR=$(find "{{ toolbox_stage_dir }}" -maxdepth 1 -name 'jetbrains-toolbox-*' -type d | head -1)
    if [ -n "$TOOLBOX_DIR" ] && [ -f "$TOOLBOX_DIR/jetbrains-toolbox" ]; then
      "$TOOLBOX_DIR/jetbrains-toolbox" --install
    fi
  args:
    executable: /bin/bash
    creates: "{{ non_root_home }}/.local/share/JetBrains/Toolbox/bin/jetbrains-toolbox"
  become: yes
  become_user: "{{ non_root_user }}"
  when:
    - install_jetbrains_toolbox | default(true) | bool
    - ansible_facts['system'] in ['Linux', 'Darwin']
    - not toolbox_binary.stat.exists
    - ih_family != "Archlinux"

# Toolbox installs the IDEs, not this playbook, and that is deliberate rather than a gap.
#
# What was here until 2026-08-21: a probe of the installed IDE slugs, then five fire-and-forget
# `jetbrains-toolbox install <product>` jobs, a wait, and a reporting task. It never worked. The
# first run on anything resembling a real desktop, the macOS runner in the first stage 3 sweep, had
# all five fail, and the failure had been invisible before that only because no run ever reached it.
#
# It cannot be made to work from a script either. JetBrains' own documentation calls the Toolbox
# command-line interface "very much work-in-progress" and states no requirements for unattended use,
# and four of the five products in that list, IntelliJ IDEA Ultimate, PyCharm Professional, DataGrip
# and Rider, are commercial and need a signed-in JetBrains account before Toolbox will fetch them.
# A provisioning run has no account to sign in with and nobody watching to sign in for it.
#
# So the scope is Toolbox itself, which is what install_jetbrains_toolbox now means: the tool is
# there, logged in or not, and the user picks their IDEs from its window in ten seconds. Roughly five
# gigabytes of downloads that could only fail are gone with it, along with the reporting they needed.
#
# https://www.jetbrains.com/help/toolbox-app/toolbox-app-cli.html
