---
- name: Check if JetBrains Toolbox is installed
  ansible.builtin.stat:
    path: "{{ non_root_home }}/.local/share/JetBrains/Toolbox/bin/jetbrains-toolbox"
  register: toolbox_binary

- name: Check if JetBrains Toolbox is installed via AUR
  ansible.builtin.command:
    cmd: pacman -Q jetbrains-toolbox
  register: toolbox_aur_check
  changed_when: false
  failed_when: false
  when:
    - ansible_facts['os_family'] == "Archlinux"

- name: Download JetBrains Toolbox installer
  ansible.builtin.get_url:
    url: "https://data.services.jetbrains.com/toolbox/shell-downloader/11.0.1/build/11.0.1.sh"
    dest: /tmp/jetbrains-toolbox-installer.sh
    mode: '0755'
  when:
    - install_jetbrains_toolbox | default(true) | bool
    - ansible_facts['system'] in ['Linux', 'Darwin']
    - not toolbox_binary.stat.exists
    - ansible_facts['os_family'] != "Archlinux"

- name: Install JetBrains Toolbox (Linux/macOS)
  ansible.builtin.shell: |
    set -o pipefail
    bash /tmp/jetbrains-toolbox-installer.sh
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  when:
    - install_jetbrains_toolbox | default(true) | bool
    - ansible_facts['system'] in ['Linux', 'Darwin']
    - not toolbox_binary.stat.exists
    - ansible_facts['os_family'] != "Archlinux"

- name: Install IntelliJ IDEA via Toolbox
  ansible.builtin.shell: |
    set -o pipefail
    ~/.local/share/JetBrains/Toolbox/bin/jetbrains-toolbox install idea
  args:
    executable: /bin/bash
  become: yes
  become_user: "{{ non_root_user }}"
  when:
    - install_jetbrains_toolbox | default(true) | bool
    - toolbox_binary.stat.exists
  failed_when: false

