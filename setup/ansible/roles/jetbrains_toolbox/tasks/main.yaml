- name: Install Rider via Toolbox
  ansible.builtin.shell: |
    set -o pipefail
    ~/.local/share/JetBrains/Toolbox/bin/jetbrains-toolbox install rider
  args:
    executable: /bin/bash
  when:
    - install_jetbrains_toolbox | default(true) | bool
    - not toolbox_binary.stat.exists
  failed_when: false