---
# Group that OpenRazer's udev rules grant device access to. Arch carries a
# downstream patch (0001-Use-openrazer-group.patch) replacing upstream's plugdev
# with a dedicated group created by the package's own sysusers.conf. plugdev does
# not exist on Arch at all.
openrazer_device_group: "openrazer"

# Group the docker package creates for daemon socket access. Confirmed by this
# project's own Arch container run log: "Creating group 'docker' with GID 946."
docker_group: "docker"

software_mapping:
  # Browsers
  chrome: { manager: "aur", package: "google-chrome" }
  brave: { manager: "aur", package: "brave-bin" }
  tor: { manager: "flatpak", package: "org.torproject.torbrowser-launcher" }

  # Dev Tools
  git: { manager: "pacman", package: "git" }
  maven: { manager: "pacman", package: "maven" }
  gradle: { manager: "pacman", package: "gradle" }
  postman: { manager: "flatpak", package: "com.getpostman.Postman" }
  openssl: { manager: "pacman", package: "openssl" }
  dbeaver: { manager: "flatpak", package: "io.dbeaver.DBeaverCommunity" }  # Changed: snap failed on Arch
  kubectl: { manager: "pacman", package: "kubectl" }
  minikube: { manager: "pacman", package: "minikube" }
  helm: { manager: "pacman", package: "helm" }
  terraform: { manager: "pacman", package: "terraform" }
  gh: { manager: "pacman", package: "github-cli" }
  jq: { manager: "pacman", package: "jq" }
  uv: { manager: "pacman", package: "uv" }                    # extra, provides uv and uvx
  pipx: { manager: "pacman", package: "python-pipx" }         # extra, pacman -Si python-pipx answered 1.15.0 on 2026-10-13
  go: { manager: "pacman", package: "go" }                     # extra, the same package arch_core builds yay with
  fzf: { manager: "pacman", package: "fzf" }
  ripgrep: { manager: "pacman", package: "ripgrep" }
  lens: { manager: "aur", package: "lens-bin" }
  filezilla: { manager: "pacman", package: "filezilla" }
  putty: { manager: "pacman", package: "putty" }
  rclone: { manager: "pacman", package: "rclone" }           # extra, pacman -Si rclone answered 1.75.2-1 on 2026-10-15, and cachyos-extra-v3 carries the same version
  qastools: { manager: "pacman", package: "qastools" }       # extra, one package with QasMixer, QasHctl and QasConfig, 1.5.0-1 on 2026-10-18, and cachyos-extra-v3 carries the same version


  # IDEs / Editors (JetBrains via AUR)
  jetbrains_toolbox: { manager: "aur", package: "jetbrains-toolbox" }

  # IDEs / Editors

  vscode: { manager: "aur", package: "visual-studio-code-bin" }
  sublime: { manager: "aur", package: "sublime-text-4" }
  arduino: { manager: "flatpak", package: "cc.arduino.IDE2" }   # `arduino` no longer in Arch official repos; use Flathub
  antigravity: { manager: "aur", package: "antigravity" }   # AUR slug: `antigravity` (antigravity-bin does not exist as of 2026-05)
  bruno: { manager: "flatpak", package: "com.usebruno.Bruno" }

  # Communication
  discord: { manager: "flatpak", package: "com.discordapp.Discord" }
  slack: { manager: "flatpak", package: "com.slack.Slack" }
  telegram: { manager: "pacman", package: "telegram-desktop" }
  signal: { manager: "pacman", package: "signal-desktop" }
  zoom: { manager: "aur", package: "zoom" }   # No pacman package. AUR RPC on 2026-10-15: zoom 7.2.1-1, not out of date, maintained, repackages Zoom's own build.
  # whatsapp: removed - not on Flathub

  # Productivity
  obsidian: { manager: "flatpak", package: "md.obsidian.Obsidian" }
  bitwarden: { manager: "flatpak", package: "com.bitwarden.desktop" }
  keepassxc: { manager: "pacman", package: "keepassxc" }
  onlyoffice: { manager: "flatpak", package: "org.onlyoffice.desktopeditors" }

  # AI
  # Version 2 of the desktop app. Flathub's ai.opencode.opencode, mapped here until 2026-10-15, is the version 1 app,
  # 1.18.8 per flathub.org/api/v2/appstream on 2026-10-15. AUR RPC the same day: opencode-desktop-bin 2.0.29-1, not
  # out of date, last modified 2026-10-14, and its PKGBUILD repackages opencode.ai/files/bin/<version>/opencode-desktop-linux-amd64.deb.
  # The CLI is the npm package, not this.
  opencode_desktop: { manager: "aur", package: "opencode-desktop-bin" }
  # Version 1 of the desktop app, installed instead of opencode_desktop when opencode_use_v1 is true, through
  # setup/ansible/tasks/opencode_version.yaml, which is why it has no install_ toggle of its own. 1.18.8 on
  # flathub.org/api/v2/appstream on 2026-10-15, a system installation.
  opencode_desktop_v1: { manager: "flatpak", package: "ai.opencode.opencode" }

  # Media / Design
  vlc: { manager: "pacman", package: "vlc" }
  spotify: { manager: "flatpak", package: "com.spotify.Client" }
  gimp: { manager: "flatpak", package: "org.gimp.GIMP" }
  krita: { manager: "flatpak", package: "org.kde.krita" }
  handbrake: { manager: "pacman", package: "handbrake" }
  audacity: { manager: "flatpak", package: "org.audacityteam.Audacity" }
  rawtherapee: { manager: "pacman", package: "rawtherapee" }

  # Gaming — Heroic Launcher is community-only (not official GOG); no Linux mapping for gog/epic.
  # gaming_suite is Lutris here and the whole CachyOS gaming set on CachyOS, see vars/derivatives/cachyos.yaml.
  steam: { manager: "pacman", package: "steam" }
  gaming_suite: { manager: "pacman", package: "lutris" }                 # extra, pacman -Si lutris answered 0.5.22 on 2026-10-15
  curseforge: { manager: "flatpak", package: "com.overwolf.curseforge" } # Flathub, verified publisher overwolf.com

  # CAD / 3D
  freecad: { manager: "flatpak", package: "org.freecad.FreeCAD" }
  prusaslicer: { manager: "flatpak", package: "com.prusa3d.PrusaSlicer" }

  # Utilities
  teamviewer: { manager: "aur", package: "teamviewer" }
  veracrypt: { manager: "pacman", package: "veracrypt" }
  speedtest: { manager: "pacman", package: "speedtest-cli" }
  syncthing: { manager: "pacman", package: "syncthing" }
  tailscale: { manager: "pacman", package: "tailscale" }
  appimagelauncher: { manager: "aur", package: "appimagelauncher" }

  # Crypto / Crypto Hardware
  boinc: { manager: "pacman", package: "boinc" }
  # gridcoin: installed via custom flatpak bundle task (not on Flathub)
  lynis: { manager: "pacman", package: "lynis" }
  chkrootkit: { manager: "aur", package: "chkrootkit" }
  clamav: { manager: "pacman", package: "clamav" }

  # Alternatives
  hardinfo: { manager: "pacman", package: "hardinfo2", is_alternative_for: "HWMonitor" }
  lm_sensors: { manager: "pacman", package: "lm_sensors", is_alternative_for: "HWInfo" }
  greenenvy: { manager: "flatpak", package: "com.leinardi.gwe", is_alternative_for: "MSI Afterburner" }
  baobab: { manager: "pacman", package: "baobab", is_alternative_for: "WizTree" }
  openrazer: { manager: "pacman", package: "openrazer-daemon" }   # extra/openrazer-daemon depends on openrazer-driver-dkms, so one package pulls the driver too.
  polychromatic: { manager: "flatpak", package: "app.polychromatic.controller", is_alternative_for: "Razer Synapse" }
  # balena_etcher - disabled due to nodejs conflict with AUR. Use AppImage manually or via other method.
  # balena_etcher: { manager: "aur", package: "balena-etcher", is_alternative_for: "Rufus" }
  gputest: { manager: "aur", package: "gputest", is_alternative_for: "FurMark" }

  # Utilities
  gparted: { manager: "pacman", package: "gparted" }
  partitionmanager: { manager: "pacman", package: "partitionmanager" }

  # Virtualization — docker is installed by virtualization_config role
  virt_manager: { manager: "pacman", package: "virt-manager" }
  # Podman Desktop is a GUI front end only, for the Docker engine above. No podman engine, pods,
  # or podman machine, the app's Docker extension talks to /var/run/docker.sock directly. Arch
  # and CachyOS also carry a native podman-desktop package in extra: the flatpak is used here
  # deliberately, on every Linux distribution, so there is one route rather than two. Do not
  # "fix" this to pacman.
  podman_desktop: { manager: "flatpak", package: "io.podman_desktop.PodmanDesktop" }

# The packages a role task installs under a toggle, keyed by the toggle's name without its install_
# prefix, or by its whole name when it has no such prefix (setup_zsh, configure_kde_plasma). Beside a
# software_mapping entry of the same key they are what the role installs next to the mapped package,
# and for a toggle with no mapping they are everything the run installs for it. The role task reads its
# list from here and setup/ansible/verify_install.yaml expects every one of them once the toggle is on,
# so nothing the run installs for a toggle goes unverified. e2e/tier1/verify_wiring.sh fails on a role
# install under a toggle whose list is not read from here, unless e2e/tier1/unverified_role_installs.txt
# names it with the reason. One line per entry in flow style, because the e2e shell checks read these
# lines one at a time.
#
# OpenRazer's kernel headers are not here, because their names come from the kernels installed on the
# machine: setup/ansible/tasks/dkms_header_packages.yaml derives them, for the install and the
# verification alike. CachyOS reads this list too, tasks/load_os_dict.yaml merges only software_mapping.
companion_packages:
  virt_manager: ["qemu-full", "libvirt", "dnsmasq", "nftables", "virtiofsd"]
  docker: ["docker", "docker-buildx", "docker-compose", "iptables"]   # the engine and its plugins, installed by virtualization_config, which explains iptables
  waydroid: ["waydroid"]   # from extra, installed by the waydroid role
  snapper: ["snapper"]   # installed by the snapper role on a btrfs root only, which setup/ansible/tasks/snapper_applicability.yaml decides
  python: ["base-devel", "openssl", "xz", "tk", "curl"]   # what pyenv builds Python against, installed by sdk_manager/tasks/pyenv_unix.yaml, which explains why zlib is absent
  setup_zsh: ["zsh", "curl", "git"]   # the shell, and what Oh-My-Zsh is fetched and cloned with, installed by shell_zsh
  system_core: ["flatpak", "unzip", "zip", "git"]   # installed by system_core/tasks/base_utils.yaml
  kde_plasma: ["plasma-meta", "kde-applications-meta", "sddm"]   # installed by kde_plasma_setup/tasks/install_kde.yaml
  # The applet-window-buttons build dependencies, installed by kde_plasma_setup/tasks/configure_kde.yaml. libplasma, not the Plasma 5 plasma-framework5, which no Arch repository carries any more.
  configure_kde_plasma: ["gcc", "extra-cmake-modules", "qt6-base", "qt6-declarative", "kcoreaddons", "kdeclarative", "kpackage", "ksvg", "ki18n", "kservice", "kconfigwidgets", "kcmutils", "kuserfeedback", "libplasma", "kdecoration", "gettext", "cmake"]
  pipx: ["python-filelock"]   # python-pipx 1.18.4 imports filelock without depending on python-filelock, so pipx install fails with ModuleNotFoundError until it is there. Installed beside the pipx mapping by software_installer/tasks/custom_installs.yaml and kde_plasma_setup/tasks/configure_kde.yaml
  gnome: ["gnome", "gnome-tweaks"]   # gnome is a pacman group, 58 members on 2026-10-18, installed by gnome_setup/tasks/install_gnome.yaml, which the verification counts installed once every member pacman -Sg lists is
