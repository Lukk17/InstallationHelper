---
# Group that OpenRazer's udev rules grant device access to. Fedora has no plugdev
# in the base system, the openSUSE Build Service hardware:razer package creates
# it, and upstream's rule file is unpatched.
openrazer_device_group: "plugdev"

software_mapping:
  # Browsers
  chrome: { manager: "dnf", package: "google-chrome-stable" }
  brave: { manager: "dnf", package: "brave-browser" }
  tor: { manager: "flatpak", package: "org.torproject.torbrowser-launcher" }

  # Dev Tools
  git: { manager: "dnf", package: "git" }
  maven: { manager: "dnf", package: "maven" }
  # gradle: not packaged by Fedora at all, so sdk_manager installs it through SDKMAN.
  # That role keys off this mapping being absent, so adding a gradle entry here turns
  # the SDKMAN path off. Do not add one without checking `dnf info gradle` first.
  postman: { manager: "flatpak", package: "com.getpostman.Postman" }
  openssl: { manager: "dnf", package: "openssl" }
  dbeaver: { manager: "flatpak", package: "io.dbeaver.DBeaverCommunity" }
  kubectl: { manager: "dnf", package: "kubectl" }               # Official k8s.io repo
  # For dnf_url the download location comes from minikube_rpm_url in group_vars/versions.yaml, and
  # `package` is the name rpm records once the package is installed, so verification can look for it
  # the same way it looks for an ordinary dnf package. Measured with `rpm -qp --qf '%{NAME}'` against
  # the real vendor artifact, not guessed from the filename.
  minikube: { manager: "dnf_url", package: "minikube" }
  helm: { manager: "dnf", package: "helm" }                     # Native (Fedora 35+)
  terraform: { manager: "dnf", package: "terraform" }           # Official HashiCorp dnf repo (fedora_repos.yaml)
  gh: { manager: "dnf", package: "gh" }
  jq: { manager: "dnf", package: "jq" }
  fzf: { manager: "dnf", package: "fzf" }
  ripgrep: { manager: "dnf", package: "ripgrep" }
  lens: { manager: "dnf", package: "lens" }                     # Official Lens dnf repo (fedora_repos.yaml)
  filezilla: { manager: "dnf", package: "filezilla" }
  putty: { manager: "dnf", package: "putty" }

  # IDEs / Editors
  vscode: { manager: "dnf", package: "code" }
  sublime: { manager: "dnf", package: "sublime-text" }
  arduino: { manager: "flatpak", package: "cc.arduino.IDE2" }
  # antigravity: installed via custom_installs.yaml (same tarball used on all Linux distros).
  bruno: { manager: "flatpak", package: "com.usebruno.Bruno" }

  # Communication
  discord: { manager: "flatpak", package: "com.discordapp.Discord" }
  slack: { manager: "flatpak", package: "com.slack.Slack" }
  telegram: { manager: "flatpak", package: "org.telegram.desktop" }
  signal: { manager: "flatpak", package: "org.signal.Signal" }

  # Productivity
  obsidian: { manager: "flatpak", package: "md.obsidian.Obsidian" }
  bitwarden: { manager: "flatpak", package: "com.bitwarden.desktop" }
  keepassxc: { manager: "dnf", package: "keepassxc" }
  onlyoffice: { manager: "flatpak", package: "org.onlyoffice.desktopeditors" }

  # Media / Design
  vlc: { manager: "dnf", package: "vlc" }
  spotify: { manager: "flatpak", package: "com.spotify.Client" }
  gimp: { manager: "flatpak", package: "org.gimp.GIMP" }
  krita: { manager: "flatpak", package: "org.kde.krita" }
  handbrake: { manager: "flatpak", package: "fr.handbrake.ghb" }
  audacity: { manager: "flatpak", package: "org.audacityteam.Audacity" }
  rawtherapee: { manager: "dnf", package: "rawtherapee" }

  # Gaming — Heroic Launcher is community-only (not official GOG); no Linux mapping for gog/epic
  steam: { manager: "flatpak", package: "com.valvesoftware.Steam" }

  # CAD / 3D
  freecad: { manager: "flatpak", package: "org.freecad.FreeCAD" }
  prusaslicer: { manager: "flatpak", package: "com.prusa3d.PrusaSlicer" }

  # Utilities
  teamviewer: { manager: "dnf_url", package: "teamviewer" }
  veracrypt: { manager: "dnf_url", package: "veracrypt" }
  speedtest: { manager: "dnf", package: "speedtest-cli" }
  syncthing: { manager: "dnf", package: "syncthing" }             # Native (Fedora 43 ships 1.30.x, Fedora 44+ ships 2.x)
  tailscale: { manager: "dnf", package: "tailscale" }             # Official Tailscale dnf repo, stable channel (fedora_repos.yaml)
  # appimagelauncher: installed via custom_installs.yaml using `rpm -i --nodigest`.
  # The upstream 2.2.0 RPM (last release, from 2020) lacks file digests and
  # dnf5 in Fedora 43+ refuses to install packages without them. rpm itself
  # can bypass the check with --nodigest; dnf can't.

  # Crypto / Crypto Hardware
  boinc: { manager: "dnf", package: "boinc-client" }
  # gridcoin: installed via custom_installs.yaml
  lynis: { manager: "dnf", package: "lynis" }
  chkrootkit: { manager: "dnf", package: "chkrootkit" }
  clamav: { manager: "dnf", package: "clamav" }

  # Alternatives
  boot_repair: { manager: "dnf", package: "grubby" }
  hardinfo: { manager: "dnf", package: "hardinfo2", is_alternative_for: "HWMonitor" }   # Fedora 42+ ships hardinfo2 (active fork). Legacy `hardinfo` is no longer packaged.
  lm_sensors: { manager: "dnf", package: "lm_sensors", is_alternative_for: "HWInfo" }
  greenenvy: { manager: "flatpak", package: "com.leinardi.gwe", is_alternative_for: "MSI Afterburner" }
  baobab: { manager: "dnf", package: "baobab", is_alternative_for: "WizTree" }
  openrazer: { manager: "dnf", package: "openrazer-meta" }   # Not in Fedora proper, comes from the openSUSE Build Service hardware:razer repo (fedora_repos.yaml).
  polychromatic: { manager: "flatpak", package: "app.polychromatic.controller", is_alternative_for: "Razer Synapse" }
  balena_etcher: { manager: "dnf_url", package: "balena-etcher", is_alternative_for: "Rufus" }
  # gputest: custom binary download in custom_installs.yaml

  # Utilities
  gparted: { manager: "dnf", package: "gparted" }
  partitionmanager: { manager: "dnf", package: "kde-partitionmanager" }

  # Virtualization — docker is installed by virtualization_config role
  virt_manager: { manager: "dnf", package: "virt-manager" }
