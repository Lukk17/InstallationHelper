---
# Group that OpenRazer's udev rules grant device access to. Fedora has no plugdev
# in the base system, the openSUSE Build Service hardware:razer package creates
# it, and upstream's rule file is unpatched.
openrazer_device_group: "plugdev"

# Group the docker-ce package creates for daemon socket access. Verified live:
# installing docker-ce from the upstream dnf repo on a fedora:latest (fc44)
# container creates group 'docker' through its sysusers.d entry.
docker_group: "docker"

# Every third-party dnf repository software_installer/tasks/fedora_repos.yaml adds, keyed by the toggle
# that asks for it, so install_<key> decides whether it is set up and the software_mapping entry of the
# same key is the package that needs it. Docker has no mapping entry because virtualization_config
# installs it, and Antigravity has none because custom_installs.yaml installs it from a tarball and the
# repository only carries its later updates, which is what updates_only says.
#
# files is the .repo file that defines the repository, and setup/ansible/tasks/
# repository_availability.yaml reads it to decide whether the repository is on this machine, for the
# playbook and for verify_install.yaml alike. A key rpm_key imported stays imported when the rescue
# runs, because a trusted vendor key with no repository behind it installs nothing. keyrings is a key
# file the block downloads to disk and verifies, which the rescue removes with the .repo file, so a key
# that failed its fingerprint check is fetched and checked again next time rather than left in place.
#
# repo_ids is the id of every enabled repository inside that file, the name dnf knows it by, which
# software_installer/tasks/fedora_repository_check.yaml hands to `dnf makecache --repo`. For a file
# yum_repository writes it is that task's name. For the three files fetched from a vendor it was read
# out of the file itself on 2026-10-10: hashicorp.repo holds [hashicorp] and the disabled
# [hashicorp-test], docker-ce.repo holds [docker-ce-stable] and three disabled test and source
# repositories, and hardware:razer.repo holds [hardware_razer]. Only the enabled ones are listed,
# because naming a disabled one to --repo enables it. An id a vendor later renames makes the check
# answer `No matching repositories`, exit 2, so it fails loudly rather than passing over nothing.
third_party_repositories:
  chrome:
    vendor: "Google Chrome"
    files: ["/etc/yum.repos.d/google-chrome.repo"]
    repo_ids: ["google-chrome"]
  brave:
    vendor: "Brave"
    files: ["/etc/yum.repos.d/brave-browser.repo"]
    repo_ids: ["brave-browser"]
  vscode:
    vendor: "Microsoft VS Code"
    files: ["/etc/yum.repos.d/vscode.repo"]
    repo_ids: ["vscode"]
  sublime:
    vendor: "Sublime Text"
    files: ["/etc/yum.repos.d/sublime-text.repo"]
    repo_ids: ["sublime-text"]
  kubectl:
    vendor: "Kubernetes"
    files: ["/etc/yum.repos.d/kubernetes.repo"]
    repo_ids: ["kubernetes"]
  terraform:
    vendor: "HashiCorp"
    files: ["/etc/yum.repos.d/hashicorp.repo"]
    repo_ids: ["hashicorp"]
  lens:
    vendor: "Lens"
    files: ["/etc/yum.repos.d/lens.repo"]
    repo_ids: ["lens"]
  antigravity:
    vendor: "Antigravity"
    updates_only: true
    files: ["/etc/yum.repos.d/antigravity-rpm.repo"]
    repo_ids: ["antigravity-rpm"]
  docker:
    vendor: "Docker"
    files: ["/etc/yum.repos.d/docker-ce.repo"]
    repo_ids: ["docker-ce-stable"]
  openrazer:
    vendor: "OpenRazer"
    files: ["/etc/yum.repos.d/hardware:razer.repo"]
    repo_ids: ["hardware_razer"]
  tailscale:
    vendor: "Tailscale"
    files: ["/etc/yum.repos.d/tailscale-stable.repo"]
    keyrings: ["/etc/pki/rpm-gpg/RPM-GPG-KEY-tailscale-stable"]
    repo_ids: ["tailscale-stable"]
  # Written by ensure_gum in setup/setup.sh rather than by fedora_repos.yaml, so it has no repository
  # block. The id is the [charm] section that function writes. Nothing reads this entry before a dnf
  # refresh, because dnf on Fedora 44 skips a repository that does not answer, as site.yaml records.
  # It is here so e2e/tier1/availability_facts.sh can hold every .repo file written under setup/ to an
  # entry, and so a vendor whose file it is can be looked up in one place.
  charm:
    vendor: "Charm (gum)"
    added_by: "setup/setup.sh"
    files: ["/etc/yum.repos.d/charm.repo"]
    repo_ids: ["charm"]

software_mapping:
  # Browsers
  chrome: { manager: "dnf", package: "google-chrome-stable" }
  brave: { manager: "dnf", package: "brave-browser" }
  tor: { manager: "flatpak", package: "org.torproject.torbrowser-launcher" }

  # Dev Tools
  git: { manager: "dnf", package: "git" }
  maven: { manager: "dnf", package: "maven" }
  # gradle: not packaged by Fedora at all, so sdk_manager installs it through SDKMAN.
  # That role keys off this mapping being absent, so adding a gradle entry here turns
  # the SDKMAN path off. Do not add one without checking `dnf info gradle` first.
  postman: { manager: "flatpak", package: "com.getpostman.Postman" }
  openssl: { manager: "dnf", package: "openssl" }
  dbeaver: { manager: "flatpak", package: "io.dbeaver.DBeaverCommunity" }
  kubectl: { manager: "dnf", package: "kubectl" }               # Official k8s.io repo
  # For dnf_url the download location comes from minikube_rpm_url in setup/pinned_values/pinned_values.toml, and
  # `package` is the name rpm records once the package is installed, so verification can look for it
  # the same way it looks for an ordinary dnf package. Measured with `rpm -qp --qf '%{NAME}'` against
  # the real vendor artifact, not guessed from the filename.
  minikube: { manager: "dnf_url", package: "minikube" }
  helm: { manager: "dnf", package: "helm" }                     # Native (Fedora 35+)
  terraform: { manager: "dnf", package: "terraform" }           # Official HashiCorp dnf repo (fedora_repos.yaml)
  gh: { manager: "dnf", package: "gh" }
  jq: { manager: "dnf", package: "jq" }
  uv: { manager: "dnf", package: "uv" }                       # Fedora 44 main repo, provides uv and uvx
  pipx: { manager: "dnf", package: "pipx" }                   # Fedora 44, dnf info answered 1.15.0 on 2026-10-13
  go: { manager: "dnf", package: "golang" }                   # Fedora 44, dnf info answered 1.26.9 on 2026-10-13
  fzf: { manager: "dnf", package: "fzf" }
  ripgrep: { manager: "dnf", package: "ripgrep" }
  lens: { manager: "dnf", package: "lens" }                     # Official Lens dnf repo (fedora_repos.yaml)
  filezilla: { manager: "dnf", package: "filezilla" }
  putty: { manager: "dnf", package: "putty" }
  rclone: { manager: "dnf", package: "rclone" }               # Fedora proper, mdapi answered 1.75.2-1.fc44 on 2026-10-15
  qastools: { manager: "dnf", package: "qastools" }             # Fedora proper, a metapackage requiring qasmixer, qashctl and qasconfig, 0.23.0-13.fc44 on 2026-10-18

  # IDEs / Editors
  vscode: { manager: "dnf", package: "code" }
  sublime: { manager: "dnf", package: "sublime-text" }
  arduino: { manager: "flatpak", package: "cc.arduino.IDE2" }
  # antigravity: installed via custom_installs.yaml (same tarball used on all Linux distros).
  bruno: { manager: "flatpak", package: "com.usebruno.Bruno" }

  # Communication
  discord: { manager: "flatpak", package: "com.discordapp.Discord" }
  slack: { manager: "flatpak", package: "com.slack.Slack" }
  telegram: { manager: "flatpak", package: "org.telegram.desktop" }
  signal: { manager: "flatpak", package: "org.signal.Signal" }
  zoom: { manager: "flatpak", package: "us.zoom.Zoom" }   # Zoom publishes no dnf repository, only an .rpm, so Flathub comes first. 7.2.1 on Flathub on 2026-10-15.

  # Productivity
  obsidian: { manager: "flatpak", package: "md.obsidian.Obsidian" }
  bitwarden: { manager: "flatpak", package: "com.bitwarden.desktop" }
  keepassxc: { manager: "dnf", package: "keepassxc" }
  onlyoffice: { manager: "flatpak", package: "org.onlyoffice.desktopeditors" }

  # AI
  # Version 2 of the desktop app, from the vendor's own .rpm, because no package manager carries version 2: Flathub's
  # ai.opencode.opencode, mapped here until 2026-10-15, is the version 1 app (1.18.8), and there is no dnf repository.
  # The location is opencode_desktop_rpm_url in setup/pinned_values/pinned_values.toml. `package` is the rpm Name of
  # the 2.0.29 .rpm, read from its header on 2026-10-15: opencode. The CLI is the npm package.
  # exclude_path sends it down the rpm route instead of dnf: its dependencies through dnf, then rpm -U without that
  # path, through setup/ansible/tasks/install_role_packages.yaml. Its Electron chrome-sandbox has the same build id as
  # the one in lens, so both rpms claim /usr/lib/.build-id/aa/c9a26d3d137c8cedbe1c3f2deab3edd8f39f43 and dnf refused
  # whichever came second, measured on fedora:44 on 2026-10-18. The links are debugging aids nothing at run time reads.
  # e2e/tier2/rpm_file_conflicts.sh fails on any path two packages of the default set claim outside such a field.
  opencode_desktop: { manager: "dnf_url", package: "opencode", exclude_path: "/usr/lib/.build-id" }
  # Version 1 of the desktop app, installed instead of opencode_desktop when opencode_use_v1 is true, through
  # setup/ansible/tasks/opencode_version.yaml, which is why it has no install_ toggle of its own. 1.18.8 on
  # flathub.org/api/v2/appstream on 2026-10-15, a system installation.
  opencode_desktop_v1: { manager: "flatpak", package: "ai.opencode.opencode" }

  # Media / Design
  vlc: { manager: "dnf", package: "vlc" }
  spotify: { manager: "flatpak", package: "com.spotify.Client" }
  gimp: { manager: "flatpak", package: "org.gimp.GIMP" }
  krita: { manager: "flatpak", package: "org.kde.krita" }
  handbrake: { manager: "flatpak", package: "fr.handbrake.ghb" }
  audacity: { manager: "flatpak", package: "org.audacityteam.Audacity" }
  rawtherapee: { manager: "dnf", package: "rawtherapee" }

  # Gaming — Heroic Launcher is community-only (not official GOG); no Linux mapping for gog/epic
  steam: { manager: "flatpak", package: "com.valvesoftware.Steam" }
  gaming_suite: { manager: "flatpak", package: "net.lutris.Lutris" }     # Flathub, verified publisher lutris.net
  curseforge: { manager: "flatpak", package: "com.overwolf.curseforge" } # Flathub, verified publisher overwolf.com

  # CAD / 3D
  freecad: { manager: "flatpak", package: "org.freecad.FreeCAD" }
  prusaslicer: { manager: "flatpak", package: "com.prusa3d.PrusaSlicer" }

  # Utilities
  teamviewer: { manager: "dnf_url", package: "teamviewer" }
  veracrypt: { manager: "dnf_url", package: "veracrypt" }
  speedtest: { manager: "dnf", package: "speedtest-cli" }
  syncthing: { manager: "dnf", package: "syncthing" }             # Native (Fedora 43 ships 1.30.x, Fedora 44+ ships 2.x)
  tailscale: { manager: "dnf", package: "tailscale" }             # Official Tailscale dnf repo, stable channel (fedora_repos.yaml)
  # appimagelauncher: installed via custom_installs.yaml using `rpm -i --nodigest`.
  # The upstream 2.2.0 RPM (last release, from 2020) lacks file digests and
  # dnf5 in Fedora 43+ refuses to install packages without them. rpm itself
  # can bypass the check with --nodigest; dnf can't.

  # Crypto / Crypto Hardware
  boinc: { manager: "dnf", package: "boinc-client" }
  # gridcoin: installed via custom_installs.yaml
  lynis: { manager: "dnf", package: "lynis" }
  chkrootkit: { manager: "dnf", package: "chkrootkit" }
  clamav: { manager: "dnf", package: "clamav" }

  # Alternatives
  boot_repair: { manager: "dnf", package: "grubby" }
  hardinfo: { manager: "dnf", package: "hardinfo2", is_alternative_for: "HWMonitor" }   # Fedora 42+ ships hardinfo2 (active fork). Legacy `hardinfo` is no longer packaged.
  lm_sensors: { manager: "dnf", package: "lm_sensors", is_alternative_for: "HWInfo" }
  greenenvy: { manager: "flatpak", package: "com.leinardi.gwe", is_alternative_for: "MSI Afterburner" }
  baobab: { manager: "dnf", package: "baobab", is_alternative_for: "WizTree" }
  openrazer: { manager: "dnf", package: "openrazer-meta" }   # Not in Fedora proper, comes from the openSUSE Build Service hardware:razer repo (fedora_repos.yaml).
  polychromatic: { manager: "flatpak", package: "app.polychromatic.controller", is_alternative_for: "Razer Synapse" }
  balena_etcher: { manager: "dnf_url", package: "balena-etcher", is_alternative_for: "Rufus" }
  # gputest: custom binary download in custom_installs.yaml

  # Utilities
  gparted: { manager: "dnf", package: "gparted" }
  partitionmanager: { manager: "dnf", package: "kde-partitionmanager" }

  # Virtualization — docker is installed by virtualization_config role
  virt_manager: { manager: "dnf", package: "virt-manager" }
  # Podman Desktop is a GUI front end only, for the Docker engine above. No podman engine, pods,
  # or podman machine, the app's Docker extension talks to /var/run/docker.sock directly.
  podman_desktop: { manager: "flatpak", package: "io.podman_desktop.PodmanDesktop" }

# The packages a role task installs under a toggle, keyed by the toggle's name without its install_
# prefix, or by its whole name when it has no such prefix (setup_zsh, configure_kde_plasma). Beside a
# software_mapping entry of the same key they are what the role installs next to the mapped package,
# and for a toggle with no mapping they are everything the run installs for it. The role task reads its
# list from here and setup/ansible/verify_install.yaml expects every one of them once the toggle is on,
# so nothing the run installs for a toggle goes unverified. e2e/tier1/verify_wiring.sh fails on a role
# install under a toggle whose list is not read from here, unless e2e/tier1/unverified_role_installs.txt
# names it with the reason. One line per entry in flow style, because the e2e shell checks read these
# lines one at a time.
companion_packages:
  openrazer: ["kernel-devel", "kernel-headers"]   # what the OpenRazer DKMS module builds against, installed by software_installer/tasks/fedora_repos.yaml
  # iptables-nft first in both lists, owner decision 85, because otherwise dnf answers the iptables these packages need with iptables-legacy, whose tables load ip6_tables, iptable_filter and iptable_nat into the host kernel. Measured in fedora:44 on 2026-10-19: in the committed order both sets left iptables-legacy installed and the iptables alternative on xtables-legacy-multi, with iptables-nft first iptables-legacy was absent and the alternative was xtables-nft-multi.
  virt_manager: ["iptables-nft", "qemu-kvm", "libvirt", "virt-install", "bridge-utils", "virtiofsd"]
  docker: ["iptables-nft", "docker-ce", "docker-ce-cli", "containerd.io", "docker-buildx-plugin", "docker-compose-plugin"]   # from download.docker.com, which fedora_repos.yaml adds, installed by virtualization_config
  waydroid: ["waydroid"]   # installed by the waydroid role
  snapper: ["snapper"]   # installed by the snapper role on a btrfs root only, which setup/ansible/tasks/snapper_applicability.yaml decides
  snapd: ["snapd"]   # installed by fedora_core
  # What pyenv builds Python against, installed by sdk_manager/tasks/pyenv_unix.yaml. zlib-ng-compat-devel, because Fedora 44 moved to zlib-ng and has no zlib-devel, confirmed with dnf info.
  python: ["gcc", "make", "patch", "zlib-ng-compat-devel", "bzip2-devel", "readline-devel", "sqlite-devel", "openssl-devel", "tk-devel", "libffi-devel", "xz-devel", "curl"]
  setup_zsh: ["zsh", "curl", "git"]   # the shell, and what Oh-My-Zsh is fetched and cloned with, installed by shell_zsh
  system_core: ["flatpak", "unzip", "zip", "patch", "git", "glibc-langpack-pl"]   # installed by system_core/tasks/base_utils.yaml
  kde_plasma: ["@kde-desktop", "sddm"]   # installed by kde_plasma_setup/tasks/install_kde.yaml. @kde-desktop is the dnf group id, display name "KDE" on Fedora 44, which the verification finds among the groups dnf records as installed. sddm is not in the group, checked with dnf group info on fedora:44
  # The applet-window-buttons build dependencies, installed by kde_plasma_setup/tasks/configure_kde.yaml.
  configure_kde_plasma: ["gcc-c++", "extra-cmake-modules", "qt6-qtbase-devel", "qt6-qtdeclarative-devel", "kf6-kcoreaddons-devel", "kf6-kdeclarative-devel", "kf6-kpackage-devel", "kf6-ksvg-devel", "kf6-ki18n-devel", "kf6-kservice-devel", "kf6-kconfigwidgets-devel", "kf6-kcmutils-devel", "libplasma-devel", "kdecoration-devel", "gettext", "cmake"]
  gnome: ["@gnome-desktop"]   # the dnf group id, installed by gnome_setup/tasks/install_gnome.yaml, which the verification finds among the groups dnf records as installed. "@GNOME Desktop Environment" matched nothing on Fedora 44, where the group is named GNOME with the id gnome-desktop, measured with dnf5 5.4.2.1
