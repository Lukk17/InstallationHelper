---
# Group that OpenRazer's udev rules grant device access to. Debian and Ubuntu
# ship plugdev in the base system and keep upstream's rule file unpatched.
openrazer_device_group: "plugdev"

# Group the docker-ce package's postinst script creates for daemon socket access.
# Verified live: installing docker-ce 5:29.8.1 from the upstream apt repo on a
# debian:trixie container creates group 'docker'.
docker_group: "docker"

# Every third-party apt repository software_installer/tasks/debian_repos.yaml adds, keyed by the toggle
# that asks for it, so install_<key> decides whether it is set up and the software_mapping entry of the
# same key is the package that needs it. Docker has no mapping entry because virtualization_config
# installs it, and Antigravity has none because custom_installs.yaml installs it from a tarball and the
# repository only carries its later updates, which is what updates_only says.
#
# files is every sources file that can define the repository, and setup/ansible/tasks/
# repository_availability.yaml reads them to decide whether it is on this machine, for the playbook and
# for verify_install.yaml alike. Chrome has two, because google-chrome-stable rewrites the .list this
# playbook adds into its own .sources on first install. keyrings is what the rescue removes with them,
# so a key that downloaded as something other than a key is fetched again next time.
third_party_repositories:
  chrome:
    vendor: "Google Chrome"
    files: ["/etc/apt/sources.list.d/google-chrome.list", "/etc/apt/sources.list.d/google-chrome.sources"]
    keyrings: ["/etc/apt/keyrings/google-chrome.gpg"]
  brave:
    vendor: "Brave"
    files: ["/etc/apt/sources.list.d/brave-browser.list"]
    keyrings: ["/etc/apt/keyrings/brave-browser-archive-keyring.gpg"]
  vscode:
    vendor: "Microsoft VS Code"
    files: ["/etc/apt/sources.list.d/vscode.list"]
    keyrings: ["/etc/apt/keyrings/packages.microsoft.gpg"]
  sublime:
    vendor: "Sublime Text"
    files: ["/etc/apt/sources.list.d/sublime-text.list"]
    keyrings: ["/etc/apt/keyrings/sublimehq-pub.gpg"]
  kubectl:
    vendor: "Kubernetes"
    files: ["/etc/apt/sources.list.d/kubernetes.list"]
    keyrings: ["/etc/apt/keyrings/kubernetes-apt-keyring.gpg"]
  helm:
    vendor: "Helm"
    files: ["/etc/apt/sources.list.d/helm.list"]
    keyrings: ["/etc/apt/keyrings/helm-apt-keyring.gpg"]
  terraform:
    vendor: "HashiCorp"
    files: ["/etc/apt/sources.list.d/hashicorp.list"]
    keyrings: ["/etc/apt/keyrings/hashicorp-archive-keyring.gpg"]
  gh:
    vendor: "GitHub CLI"
    files: ["/etc/apt/sources.list.d/github-cli.list"]
    keyrings: ["/etc/apt/keyrings/githubcli-archive-keyring.gpg"]
  lens:
    vendor: "Lens"
    files: ["/etc/apt/sources.list.d/lens.list"]
    keyrings: ["/etc/apt/keyrings/lens.gpg"]
  antigravity:
    vendor: "Antigravity"
    updates_only: true
    files: ["/etc/apt/sources.list.d/antigravity.list"]
    keyrings: ["/etc/apt/keyrings/antigravity-repo-key.gpg"]
  docker:
    vendor: "Docker"
    files: ["/etc/apt/sources.list.d/docker.list"]
    keyrings: ["/etc/apt/keyrings/docker.gpg"]
  claude_desktop:
    vendor: "Claude Desktop"
    files: ["/etc/apt/sources.list.d/claude-desktop.list"]
    keyrings: ["/usr/share/keyrings/claude-desktop-archive-keyring.asc"]
  syncthing:
    vendor: "Syncthing"
    files: ["/etc/apt/sources.list.d/syncthing.list"]
    keyrings: ["/etc/apt/keyrings/syncthing-archive-keyring.gpg"]
  tailscale:
    vendor: "Tailscale"
    files: ["/etc/apt/sources.list.d/tailscale.list"]
    keyrings: ["/etc/apt/keyrings/tailscale-archive-keyring.gpg"]
  # The two below are written outside debian_repos.yaml, so added_by names the file that writes them
  # and they have no repository block. They are listed here so the first apt cache refresh of a run
  # checks them like every other repository this project adds, and e2e/tier1/availability_facts.sh
  # fails the gate for any sources file written under setup/ that no entry here names. The charm paths
  # are the ones ensure_gum in setup/setup.sh writes, and the waydroid paths are the ones the script
  # at https://repo.waydro.id writes, read from that script on 2026-10-10.
  charm:
    vendor: "Charm (gum)"
    added_by: "setup/setup.sh"
    files: ["/etc/apt/sources.list.d/charm.list"]
    keyrings: ["/etc/apt/keyrings/charm.gpg"]
  waydroid:
    vendor: "Waydroid"
    added_by: "setup/ansible/roles/waydroid/tasks/main.yaml"
    files: ["/etc/apt/sources.list.d/waydroid.list"]
    keyrings: ["/usr/share/keyrings/waydroid.gpg"]

# The distribution's own sources files, whichever of them this machine has. setup/setup.sh updates the
# package lists from these alone before Ansible starts, and setup/ansible/tasks/apt_cache_refresh.yaml
# treats every other sources file that third_party_repositories does not name as one this project
# does not manage. Debian 13 keeps /etc/apt/sources.list or debian.sources, Ubuntu 24.04 and later
# ubuntu.sources, Pop!_OS the three files pop-os/core ships, and Linux Mint the file mintsources writes.
# contrib-non-free.list is the Debian archive's contrib and non-free components, which debian_core adds.
distribution_sources_files:
  - /etc/apt/sources.list
  - /etc/apt/sources.list.d/debian.sources
  - /etc/apt/sources.list.d/contrib-non-free.list
  - /etc/apt/sources.list.d/ubuntu.sources
  - /etc/apt/sources.list.d/system.sources
  - /etc/apt/sources.list.d/pop-os-apps.sources
  - /etc/apt/sources.list.d/pop-os-release.sources
  - /etc/apt/sources.list.d/official-package-repositories.list

software_mapping:
  # Browsers
  chrome: { manager: "apt", package: "google-chrome-stable" }   # Official Google apt repo, see debian_repos.yaml
  brave: { manager: "apt", package: "brave-browser" }           # Official Brave apt repo
  tor: { manager: "flatpak", package: "org.torproject.torbrowser-launcher" }

  # Dev Tools
  git: { manager: "apt", package: "git" }
  maven: { manager: "apt", package: "maven" }
  # gradle: Debian ships 4.4.1 (2017), far too old to build anything current, so
  # sdk_manager installs it through SDKMAN instead. That role keys off this mapping
  # being absent, so adding a gradle entry here turns the SDKMAN path off.
  postman: { manager: "flatpak", package: "com.getpostman.Postman" }
  openssl: { manager: "apt", package: "openssl" }
  dbeaver: { manager: "flatpak", package: "io.dbeaver.DBeaverCommunity" }
  kubectl: { manager: "apt", package: "kubectl" }               # Official k8s.io repo
  # For apt_url the download location comes from minikube_url in setup/pinned_values/pinned_values.toml, and
  # `package` is the name dpkg records once the .deb is installed, so verification can look for it
  # the same way it looks for an ordinary apt package. Measured with `dpkg-deb -f <file> Package`
  # against the real vendor artifact, not guessed from the filename.
  minikube: { manager: "apt_url", package: "minikube", is_deb_url: true }
  helm: { manager: "apt", package: "helm" }                     # Official Helm apt repo (debian_repos.yaml)
  terraform: { manager: "apt", package: "terraform" }           # Official HashiCorp apt repo (debian_repos.yaml)
  gh: { manager: "apt", package: "gh" }                         # Official GitHub CLI apt repo (debian_repos.yaml)
  jq: { manager: "apt", package: "jq" }
  # uv: Debian trixie and Ubuntu 26.04 carry no uv package (apt-cache policy uv answers nothing on
  # either), so custom_installs.yaml runs Astral's installer into /usr/local/bin instead. That task
  # keys off this mapping being absent, so adding a uv entry here turns the installer off.
  pipx: { manager: "apt", package: "pipx" }                   # apt-cache policy on 2026-10-13: 1.7.1 on trixie, 1.8.0 on Ubuntu 26.04
  go: { manager: "apt", package: "golang-go" }                # the compiler and tools without the docs of golang. 1.24 on trixie, 1.26 on Ubuntu 26.04
  fzf: { manager: "apt", package: "fzf" }
  ripgrep: { manager: "apt", package: "ripgrep" }
  lens: { manager: "apt", package: "lens" }                     # Official Lens apt repo (debian_repos.yaml)
  filezilla: { manager: "apt", package: "filezilla" }
  putty: { manager: "apt", package: "putty" }
  rclone: { manager: "apt", package: "rclone" }                # rclone publishes no apt repository and Flathub has no rclone. 1.60.1 on trixie and Ubuntu 26.04 on 2026-10-15
  qastools: { manager: "apt", package: "qasmixer" }              # trixie and Ubuntu 26.04 have no qastools package, only qasmixer, qashctl and qasconfig, 1.4.0 on both on 2026-10-18. custom_installs.yaml installs the other two

  # IDEs / Editors
  vscode: { manager: "apt", package: "code" }                   # Microsoft apt repo
  sublime: { manager: "apt", package: "sublime-text" }          # Sublime apt repo
  arduino: { manager: "flatpak", package: "cc.arduino.IDE2" }
  # antigravity: installed via custom_installs.yaml — Google's APT pool URLs aren't
  # publicly addressable (404), so we use the official Linux tarball from
  # edgedl.me.gvt1.com and extract to /opt/antigravity.
  bruno: { manager: "flatpak", package: "com.usebruno.Bruno" }

  # Communication
  discord: { manager: "flatpak", package: "com.discordapp.Discord" }
  slack: { manager: "flatpak", package: "com.slack.Slack" }
  telegram: { manager: "flatpak", package: "org.telegram.desktop" }
  signal: { manager: "flatpak", package: "org.signal.Signal" }
  zoom: { manager: "flatpak", package: "us.zoom.Zoom" }   # Zoom publishes no apt repository, only a .deb, so Flathub comes first. 7.2.1 on Flathub on 2026-10-15.
  # whatsapp: not on Flathub (installed via brew/winget on macOS/Windows)

  # Productivity
  obsidian: { manager: "flatpak", package: "md.obsidian.Obsidian" }
  bitwarden: { manager: "flatpak", package: "com.bitwarden.desktop" }
  keepassxc: { manager: "apt", package: "keepassxc" }
  onlyoffice: { manager: "flatpak", package: "org.onlyoffice.desktopeditors" }

  # AI
  # Version 2 of the desktop app, from the vendor's own .deb, because no package manager carries version 2: Flathub's
  # ai.opencode.opencode, mapped here until 2026-10-15, is the version 1 app (1.18.8), there is no opencode-desktop snap
  # and no apt repository. The location is opencode_desktop_url in setup/pinned_values/pinned_values.toml. `package` is
  # what dpkg records, read with the control file of the 2.0.29 .deb on 2026-10-15: Package: opencode. The CLI is the npm package.
  opencode_desktop: { manager: "apt_url", package: "opencode", is_deb_url: true }
  # Version 1 of the desktop app, installed instead of opencode_desktop when opencode_use_v1 is true, through
  # setup/ansible/tasks/opencode_version.yaml, which is why it has no install_ toggle of its own. 1.18.8 on
  # flathub.org/api/v2/appstream on 2026-10-15, a system installation.
  opencode_desktop_v1: { manager: "flatpak", package: "ai.opencode.opencode" }

  # Media / Design
  vlc: { manager: "apt", package: "vlc" }
  spotify: { manager: "flatpak", package: "com.spotify.Client" }
  gimp: { manager: "flatpak", package: "org.gimp.GIMP" }
  krita: { manager: "flatpak", package: "org.kde.krita" }
  handbrake: { manager: "flatpak", package: "fr.handbrake.ghb" }
  audacity: { manager: "flatpak", package: "org.audacityteam.Audacity" }
  rawtherapee: { manager: "apt", package: "rawtherapee" }

  # Gaming — Heroic Launcher is a community frontend, NOT an official GOG/Epic
  # client. The Linux GOG/Epic toggles intentionally have no mapping here; use
  # Lutris, which install_gaming_suite installs, or run the Windows clients via Wine if needed.
  steam: { manager: "flatpak", package: "com.valvesoftware.Steam" }
  gaming_suite: { manager: "flatpak", package: "net.lutris.Lutris" }     # Flathub, verified publisher lutris.net
  curseforge: { manager: "flatpak", package: "com.overwolf.curseforge" } # Flathub, verified publisher overwolf.com

  # CAD / 3D
  freecad: { manager: "flatpak", package: "org.freecad.FreeCAD" }
  prusaslicer: { manager: "flatpak", package: "com.prusa3d.PrusaSlicer" }

  # Utilities
  teamviewer: { manager: "apt_url", package: "teamviewer", is_deb_url: true }
  veracrypt: { manager: "apt_url", package: "veracrypt", is_deb_url: true }
  speedtest: { manager: "apt", package: "speedtest-cli" }
  syncthing: { manager: "apt", package: "syncthing" }             # Official Syncthing apt repo, stable-v2 (debian_repos.yaml)
  tailscale: { manager: "apt", package: "tailscale" }             # Official Tailscale apt repo, stable channel (debian_repos.yaml)
  appimagelauncher: { manager: "apt_url", package: "appimagelauncher", is_deb_url: true }

  # Installed from Anthropic's own apt repository, added in debian_repos.yaml. The vendor distributes
  # the Linux desktop application only that way, and the file this used to download is gone.
  claude_desktop: { manager: "apt", package: "claude-desktop" }

  # Crypto / Crypto Hardware
  boinc: { manager: "apt", package: "boinc-client" }
  # gridcoin: installed via custom_installs.yaml PPA flow
  lynis: { manager: "apt", package: "lynis" }
  chkrootkit: { manager: "apt", package: "chkrootkit" }
  clamav: { manager: "apt", package: "clamav" }

  # Alternatives
  hardinfo: { manager: "apt", package: "hardinfo", is_alternative_for: "HWMonitor" }
  lm_sensors: { manager: "apt", package: "lm-sensors", is_alternative_for: "HWInfo" }
  greenenvy: { manager: "flatpak", package: "com.leinardi.gwe", is_alternative_for: "MSI Afterburner" }
  baobab: { manager: "apt", package: "baobab", is_alternative_for: "WizTree" }
  openrazer: { manager: "apt", package: "openrazer-meta" }   # In Debian proper since bookworm and in Ubuntu universe on every current series, no PPA needed.
  polychromatic: { manager: "flatpak", package: "app.polychromatic.controller", is_alternative_for: "Razer Synapse" }
  balena_etcher: { manager: "apt_url", package: "balena-etcher", is_alternative_for: "Rufus", is_deb_url: true }
  # gputest: custom binary download in custom_installs.yaml

  # Utilities
  gparted: { manager: "apt", package: "gparted" }
  partitionmanager: { manager: "apt", package: "partitionmanager" }

  # Virtualization — docker is installed by virtualization_config role
  # (not via software_installer), so the same role can stat and start
  # docker.service after the package is in place.
  virt_manager: { manager: "apt", package: "virt-manager" }
  # Podman Desktop is a GUI front end only, for the Docker engine above. No podman engine, pods,
  # or podman machine, the app's Docker extension talks to /var/run/docker.sock directly.
  podman_desktop: { manager: "flatpak", package: "io.podman_desktop.PodmanDesktop" }

# The packages a role task installs under a toggle, keyed by the toggle's name without its install_
# prefix, or by its whole name when it has no such prefix (setup_zsh, configure_kde_plasma). Beside a
# software_mapping entry of the same key they are what the role installs next to the mapped package,
# and for a toggle with no mapping they are everything the run installs for it. The role task reads its
# list from here and setup/ansible/verify_install.yaml expects every one of them once the toggle is on,
# so nothing the run installs for a toggle goes unverified. e2e/tier1/verify_wiring.sh fails on a role
# install under a toggle whose list is not read from here, unless e2e/tier1/unverified_role_installs.txt
# names it with the reason. One line per entry in flow style, because the e2e shell checks read these
# lines one at a time.
#
# qemu-system-x86, not qemu-kvm, which has no installation candidate on Debian trixie or Ubuntu 26.04:
# Debian resolves the virtual name to its one provider and exits 0, Ubuntu 26.04 exits 100 with
# "Package 'qemu-kvm' has no installation candidate". qemu-system-x86 is what qemu-kvm was the
# transitional name for, 1:10.0.11 on Debian and 1:10.2.1 on Ubuntu, measured on 2026-08-21.
companion_packages:
  qastools: ["qashctl", "qasconfig"]   # trixie and Ubuntu 26.04 build QasMixer, QasHctl and QasConfig as three packages, the mapping installs qasmixer
  virt_manager: ["qemu-system-x86", "libvirt-daemon-system", "libvirt-clients", "virtinst", "bridge-utils", "virtiofsd"]
  docker: ["docker-ce", "docker-ce-cli", "containerd.io", "docker-buildx-plugin", "docker-compose-plugin"]   # from download.docker.com, which debian_repos.yaml adds, installed by virtualization_config
  waydroid: ["waydroid"]   # from repo.waydro.id, which the waydroid role adds before installing it
  snapper: ["snapper"]   # installed by the snapper role on a btrfs root only, which setup/ansible/tasks/snapper_applicability.yaml decides
  snapd: ["snapd"]   # installed by debian_core on Debian lineage only, because Ubuntu lineage ships snapd with the system and the playbook neither installs nor removes it there, see tasks/snap_availability.yaml
  # What pyenv builds Python against, installed by sdk_manager/tasks/pyenv_unix.yaml. libncurses-dev, because trixie and Ubuntu 26.04 carry no libncursesw5-dev, confirmed with apt-cache policy.
  python: ["build-essential", "libssl-dev", "zlib1g-dev", "libbz2-dev", "libreadline-dev", "libsqlite3-dev", "libncurses-dev", "xz-utils", "tk-dev", "libxml2-dev", "libxmlsec1-dev", "libffi-dev", "liblzma-dev", "curl"]
  setup_zsh: ["zsh", "curl", "git"]   # the shell, and what Oh-My-Zsh is fetched and cloned with, installed by shell_zsh
  system_core: ["flatpak", "unzip", "zip", "git", "locales"]   # installed by system_core/tasks/base_utils.yaml, locales before the locale is generated
  # KDE Plasma for Debian and Ubuntu alike, installed by kde_plasma_setup/tasks/install_kde.yaml. Ubuntu's Polish KDE language pack is installed beside it and is no entry here, because this file serves both.
  kde_plasma: ["kde-standard", "plasma-workspace", "systemsettings", "plasma-desktop", "kde-config-sddm", "kde-config-gtk-style", "kde-config-gtk-style-preview", "breeze", "qt5-style-kvantum", "qt6-style-kvantum", "sddm-theme-breeze", "sddm"]
  # The applet-window-buttons build dependencies, installed by kde_plasma_setup/tasks/configure_kde.yaml. libkdecorations3-dev, the Plasma 6 name, because neither trixie nor Ubuntu 26.04 carries libkdecorations2-dev, confirmed with apt-cache policy.
  configure_kde_plasma: ["g++", "extra-cmake-modules", "qt6-base-dev", "qt6-declarative-dev", "libkf6coreaddons-dev", "libkf6declarative-dev", "libkf6package-dev", "libkf6svg-dev", "libkf6i18n-dev", "libkf6service-dev", "libkf6configwidgets-dev", "libkf6kcmutils-dev", "libplasma-dev", "libkdecorations3-dev", "gettext", "cmake"]
  gnome: ["gnome-tweaks", "gnome-shell-extension-manager"]   # installed by gnome_setup/tasks/install_gnome.yaml after the lineage's desktop metapackage below

# The companion_packages that differ between the two lineages this file serves, under the ih_base
# setup/ansible/tasks/derive_os_facts.yaml derives, ubuntu or debian. setup/ansible/tasks/load_os_dict.yaml
# puts each list in front of the companion_packages entry of the same key, which therefore has to exist.
# ubuntu-desktop does not exist in Debian, and gnome-core is Debian's desktop without the full gnome
# task's extras, both checked with apt-cache policy in debian:trixie and ubuntu:26.04.
lineage_companion_packages:
  ubuntu:
    gnome: ["ubuntu-desktop"]
  debian:
    gnome: ["gnome-core"]
