---
software_mapping:
  # Browsers
  chrome: { manager: "apt", package: "google-chrome-stable" }
  brave: { manager: "apt", package: "brave-browser" }
  tor: { manager: "flatpak", package: "org.torproject.torbrowser-launcher" }

  # Dev Tools
  git: { manager: "apt", package: "git" }
  maven: { manager: "apt", package: "maven" }
  gradle: { manager: "apt", package: "gradle" }
  postman: { manager: "flatpak", package: "com.getpostman.Postman" }
  openssl: { manager: "apt", package: "openssl" }
  dbeaver: { manager: "flatpak", package: "io.dbeaver.DBeaverCommunity" }  # Changed: more reliable
  kubectl: { manager: "snap", package: "kubectl", classic: true }
  minikube: { manager: "apt_url", package: "minikube_{{ minikube_version }}_amd64.deb", is_deb_url: true }
  lens: { manager: "snap", package: "lens", classic: true }
  filezilla: { manager: "apt", package: "filezilla" }
  putty: { manager: "apt", package: "putty" }

  # IDEs / Editors
  # intellij: removed - use JetBrains Toolbox instead
  vscode: { manager: "snap", package: "code", classic: true }
  sublime: { manager: "apt", package: "sublime-text" }
  arduino: { manager: "snap", package: "arduino" }
  antigravity: { manager: "apt_url", package: "antigravity.deb", is_deb_url: true }
  bruno: { manager: "flatpak", package: "com.usebruno.Bruno" }

  # Communication
  discord: { manager: "flatpak", package: "com.discordapp.Discord" }
  slack: { manager: "flatpak", package: "com.slack.Slack" }
  # teams: removed - not on Flathub
  telegram: { manager: "snap", package: "telegram-desktop" }
  signal: { manager: "snap", package: "signal-desktop" }
  # whatsapp: removed - not on Flathub

  # Productivity
  obsidian: { manager: "flatpak", package: "md.obsidian.Obsidian" }
  bitwarden: { manager: "flatpak", package: "com.bitwarden.desktop" }
  keepassxc: { manager: "snap", package: "keepassxc" }
  # trello: removed - not on Flathub
  onlyoffice: { manager: "flatpak", package: "org.onlyoffice.desktopeditors" }

  # Media / Design
  vlc: { manager: "snap", package: "vlc" }
  spotify: { manager: "flatpak", package: "com.spotify.Client" }
  gimp: { manager: "flatpak", package: "org.gimp.GIMP" }
  krita: { manager: "flatpak", package: "org.kde.krita" }
  handbrake: { manager: "apt", package: "handbrake" }
  audacity: { manager: "snap", package: "audacity" }
  rawtherapee: { manager: "apt", package: "rawtherapee" }

  # Gaming
  steam: { manager: "snap", package: "steam" }
  gog: { manager: "flatpak", package: "com.heroicgameslauncher.hgl" }
  epic: { manager: "flatpak", package: "com.heroicgameslauncher.hgl" }
  
  # CAD / 3D
  freecad: { manager: "flatpak", package: "org.freecadweb.FreeCAD" }
  prusaslicer: { manager: "snap", package: "prusa-slicer" }

  # Utilities
  teamviewer: { manager: "apt_url", package: "teamviewer_amd64.deb", is_deb_url: true }
  veracrypt: { manager: "apt_url", package: "veracrypt.deb", is_deb_url: true }
  speedtest: { manager: "apt", package: "speedtest-cli" }
  appimagelauncher: { manager: "apt_url", package: "{{ appimage_launcher_url }}", is_deb_url: true }

  # Crypto / Crypto Hardware
  exodus: { manager: "apt_url", package: "exodus.deb", is_deb_url: true }
  boinc: { manager: "apt", package: "boinc-client" }
  gridcoin: { manager: "apt", package: "gridcoinresearch" }
  lynis: { manager: "apt", package: "lynis" }
  chkrootkit: { manager: "apt", package: "chkrootkit" }
  clamav: { manager: "apt", package: "clamav" }

  # Alternatives
  hardinfo: { manager: "apt", package: "hardinfo", is_alternative_for: "HWMonitor" }
  lm_sensors: { manager: "apt", package: "lm-sensors", is_alternative_for: "HWInfo" }
  greenenvy: { manager: "flatpak", package: "com.leinardi.gwe", is_alternative_for: "MSI Afterburner" }
  baobab: { manager: "apt", package: "baobab", is_alternative_for: "WizTree" }
  polychromatic: { manager: "apt", package: "polychromatic", is_alternative_for: "Razer Cortex" }
  balena_etcher: { manager: "apt_url", package: "balena-etcher", is_alternative_for: "Rufus", is_deb_url: true }
  gputest: { manager: "apt", package: "gputest", is_alternative_for: "FurMark" }

  # Virtualization
  virt_manager: { manager: "apt", package: "virt-manager" }
  docker: { manager: "apt", package: "docker.io" }

