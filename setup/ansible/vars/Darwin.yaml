---
# Where both OpenCode desktop versions keep the app: OpenCode.app, bundle id ai.opencode.desktop, read from the
# v1.19.1 app archive and from the opencode-desktop cask on 2026-10-15. tasks/opencode_version.yaml reads it.
opencode_desktop_app: "/Applications/OpenCode.app"

software_mapping:
  # Browsers
  chrome: { manager: "brew_cask", package: "google-chrome" }
  brave: { manager: "brew_cask", package: "brave-browser" }
  tor: { manager: "brew_cask", package: "tor-browser" }

  # Dev Tools
  git: { manager: "brew", package: "git" }
  maven: { manager: "brew", package: "maven" }
  gradle: { manager: "brew", package: "gradle" }
  postman: { manager: "brew_cask", package: "postman" }
  openssl: { manager: "brew", package: "openssl@3" }
  dbeaver: { manager: "brew_cask", package: "dbeaver-community" }
  kubectl: { manager: "brew", package: "kubernetes-cli" }
  minikube: { manager: "brew", package: "minikube" }
  k3d: { manager: "brew", package: "k3d" }
  helm: { manager: "brew", package: "helm" }
  terraform: { manager: "brew", package: "hashicorp/tap/terraform" }
  gh: { manager: "brew", package: "gh" }
  jq: { manager: "brew", package: "jq" }
  uv: { manager: "brew", package: "uv" }
  pipx: { manager: "brew", package: "pipx" }
  go: { manager: "brew", package: "go" }
  fzf: { manager: "brew", package: "fzf" }
  ripgrep: { manager: "brew", package: "ripgrep" }
  lens: { manager: "brew_cask", package: "lens" }
  # Note: there is no maintained Homebrew cask for FileZilla on macOS, so the
  # `filezilla` toggle maps to Cyberduck instead — Cyberduck is the standard
  # free macOS FTP/SFTP/S3 client (homebrew-cask `cyberduck`, 29k+ installs/yr).
  # Users who specifically need FileZilla can download it directly from
  # https://filezilla-project.org/ — keep `install_filezilla: false` in that case.
  filezilla: { manager: "brew_cask", package: "cyberduck" }

  # IDEs / Editors
  vscode: { manager: "brew_cask", package: "visual-studio-code" }
  sublime: { manager: "brew_cask", package: "sublime-text" }
  arduino: { manager: "brew_cask", package: "arduino-ide" }
  antigravity: { manager: "brew_cask", package: "antigravity" }   # Google's own DMG from storage.googleapis.com, Apple Silicon and Intel builds, needs macOS 13 or newer. The app updates itself.
  jetbrains_toolbox: { manager: "brew_cask", package: "jetbrains-toolbox" }   # JetBrains' own DMG, Apple Silicon and Intel builds. Toolbox installs the IDEs, see roles/jetbrains_toolbox, which is the Linux route.
  bruno: { manager: "brew_cask", package: "bruno" }
  bruno_cli: { manager: "brew", package: "bruno-cli" }

  # Communication
  discord: { manager: "brew_cask", package: "discord" }
  slack: { manager: "brew_cask", package: "slack" }
  teams: { manager: "brew_cask", package: "microsoft-teams" }
  zoom: { manager: "brew_cask", package: "zoom" }   # 7.2.2 on formulae.brew.sh on 2026-10-15, updates itself.
  telegram: { manager: "brew_cask", package: "telegram" }
  signal: { manager: "brew_cask", package: "signal" }
  whatsapp: { manager: "brew_cask", package: "whatsapp" }

  # Productivity
  obsidian: { manager: "brew_cask", package: "obsidian" }
  bitwarden: { manager: "brew_cask", package: "bitwarden" }
  keepassxc: { manager: "brew_cask", package: "keepassxc" }
  onlyoffice: { manager: "brew_cask", package: "onlyoffice" }

  # AI
  chatgpt: { manager: "brew_cask", package: "chatgpt" }   # Official OpenAI build from persistent.oaistatic.com (arm64 + x86_64), needs macOS 12 or newer
  opencode_desktop: { manager: "brew_cask", package: "opencode-desktop" }   # Version 2, 2.0.29 on formulae.brew.sh on 2026-10-15, OpenCode.app in /Applications, needs macOS 13 or newer. The CLI is the npm package, not this cask.
  # opencode_desktop_v1: Homebrew has no version 1 cask, so when opencode_use_v1 is true macos_install.yaml installs the
  # vendor DMG from the GitHub release instead, see opencode_desktop_v1_macos_*_dmg_url in setup/pinned_values/pinned_values.toml.
  lm_studio: { manager: "brew_cask", package: "lm-studio", requires_architecture: "arm64" }   # Element Labs' own DMG, Apple Silicon only, needs macOS 12 or newer. The cask declares depends_on arch: :arm64, so an Intel Mac skips it with a note, through tasks/architecture_availability.yaml. Linux takes the vendor script in roles/ai_tools.

  # Peripherals
  # synapse: installed via macos_install.yaml (official .pkg from dl.razerzone.com). Razer publishes no
  # Homebrew cask, and supports Apple Silicon on macOS 15 Sequoia or newer only.

  # Media / Design
  vlc: { manager: "brew_cask", package: "vlc" }
  spotify: { manager: "brew_cask", package: "spotify" }
  gimp: { manager: "brew_cask", package: "gimp" }
  krita: { manager: "brew_cask", package: "krita" }
  handbrake: { manager: "brew_cask", package: "handbrake-app" }
  audacity: { manager: "brew_cask", package: "audacity" }
  rawtherapee: { manager: "brew_cask", package: "rawtherapee" }

  # Gaming
  steam: { manager: "brew_cask", package: "steam" }
  ea_app: { manager: "brew_cask", package: "ea" }
  gog: { manager: "brew_cask", package: "gog-galaxy" }
  epic: { manager: "brew_cask", package: "epic-games" }
  curseforge: { manager: "brew_cask", package: "curseforge" }

  # CAD / 3D
  freecad: { manager: "brew_cask", package: "freecad" }
  prusaslicer: { manager: "brew_cask", package: "prusaslicer" }

  # Utilities
  teamviewer: { manager: "brew_cask", package: "teamviewer" }
  veracrypt: { manager: "brew_cask", package: "veracrypt" }
  speedtest: { manager: "brew", package: "speedtest-cli" }
  syncthing: { manager: "brew_cask", package: "syncthing-app" }   # Official syncthing-macos bundle (cask renamed from `syncthing`)
  tailscale: { manager: "brew_cask", package: "tailscale-app" }   # Official GUI app cask. The bare `tailscale` formula is the headless daemon plus CLI and conflicts with this cask.
  lynis: { manager: "brew", package: "lynis" }

  # Crypto
  boinc: { manager: "brew_cask", package: "boinc" }
  # gridcoin: installed via macos_install.yaml (DMG from github.com/gridcoin-community)

  # Alternatives
  stats: { manager: "brew_cask", package: "stats", is_alternative_for: "HWMonitor" }
  grandperspective: { manager: "brew_cask", package: "grandperspective", is_alternative_for: "WizTree" }
  lulu: { manager: "brew_cask", package: "lulu", is_alternative_for: "GlassWire" }
  balena_etcher: { manager: "brew_cask", package: "balenaetcher", is_alternative_for: "Rufus" }

  # Virtualization
  utm: { manager: "brew_cask", package: "utm" }
  docker: { manager: "brew_cask", package: "docker-desktop" }        # Docker Desktop, the same product Windows gets. macOS has no Linux kernel, so the engine runs in a virtual machine whichever tool provides it.
  virtualbox: { manager: "brew_cask", package: "virtualbox" }   # Oracle's own installer package, an Apple Silicon build and an Intel build. On Apple Silicon it runs arm64 guests only, so an x86 guest image will not boot there.
  # macOS does not have VMware Workstation Player (Windows/Linux only). The closest
  # equivalent was VMware Fusion, but the `vmware-fusion` cask no longer exists in
  # homebrew-cask: Broadcom moved the download behind a portal login, which is the same
  # reason the Windows auto-download broke. Searching the full cask index for "vmware"
  # now returns only vagrant-vmware-utility. Left mapped-out rather than deleted so the
  # next person does not re-add a name that cannot resolve. Use UTM instead, which is
  # already mapped above, or install Fusion by hand from Broadcom's portal.
  # vmware: { manager: "brew_cask", package: "vmware-fusion" }
