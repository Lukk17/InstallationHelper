---
# ih_snap_skipped: the requested mappings that install through snap while install_snapd is off, each with
# the reason. Answered once, here, and read by every task that needs it. dynamic_install.yaml includes
# this file, drops these mappings from what it hands to snap and names each one, and site.yaml names them
# again at the end of the run, so a user who turned snapd off learns which applications that cost.
#
# install_snapd off means the playbook does not use snap at all on any family, Ubuntu included, where
# snapd ships with the system. The wizard in setup/setup.sh tells the same story before the run: its
# checklist names the toggles that need snapd on this machine, read from the same mappings, and
# e2e/tier1/snap_dependents_menu.sh and e2e/tier1/snap_dependents_summary.sh hold both to the mappings.
# The list is derived from manager snap in vars/<OS>.yaml and nothing else, so a new snap mapping is
# named without anyone remembering to add it here.
- name: Decide which requested mappings need snapd while install_snapd is off
  ansible.builtin.set_fact:
    ih_snap_skipped: >-
      {{ {} if (install_snapd | default(false) | bool)
         else dict(ih_snap_keys_requested
                   | zip(ih_snap_keys_requested
                         | map('regex_replace', '^.*$', 'it installs through snap, and install_snapd is off'))) }}
  vars:
    ih_snap_keys: >-
      {{ os_dict.software_mapping | default({}) | dict2items
         | selectattr('value.manager', 'equalto', 'snap')
         | map(attribute='key') | list }}
    ih_snap_keys_requested: >-
      {{ ih_snap_keys
         | zip(query('ansible.builtin.vars', *(ih_snap_keys | map('regex_replace', '^', 'install_')),
                     default=false) | map('bool'))
         | selectattr('1') | map(attribute='0') | list }}
