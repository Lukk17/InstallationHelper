# Pinned versions, download locations and vendor identifiers for the whole repository.
#
# One source, one reader. Every runtime that needs a value here goes through setup/pinned_values,
# which resolves the {{ ref }} chains and hands back finished strings: the Ansible vars plugin at
# setup/ansible/vars_plugins/pinned_values.py, PinnedValues.psm1 for PowerShell, and
# pinned_values.sh for shell callers. Nothing else may parse this file, and e2e/tier1/pinned_values.sh
# fails the gate if anything starts to, because three separate hand-written parsers of the YAML this
# replaced is what made the migration necessary.
#
# Rules the reader enforces, so a bad edit here fails at load rather than at install time:
#
# 1. Every value is a quoted string. Unquoted, android_api_level and antigravity_build arrive as
#    integers, a two-component version such as 9.70 arrives as a float that has lost its trailing
#    zero, and a three-component one such as 1.13.3 is not a valid TOML number at all. A version is
#    text that happens to contain digits, never a number.
# 2. A {{ ref }} names another key in this file. The file is closed: nothing here may reference an
#    Ansible fact or a runtime value. A value that depends on the host belongs in group_vars, which
#    is where android_home went.
# 3. References may chain, and a cycle is an error naming the keys in it.
# 4. No value is empty. The reader hands back an empty string as faithfully as any other value,
#    because absence and emptiness are different answers, so it is e2e/tier1/pinned_values.sh that
#    fails on one: an empty download location makes the dispatcher skip without a word.
#
# Bumping a pin: the comments below name where to verify each one. Verify, then bump, then run the
# gate, because e2e/tier2/resolve_pinned_urls.sh asks every download location whether it still exists.

[pins]
appimage_launcher_version = "2.2.0"
appimage_launcher_file = "appimagelauncher_{{ appimage_launcher_version }}-travis995.0f91801.bionic_amd64.deb"
appimage_launcher_rpm_file = "appimagelauncher-{{ appimage_launcher_version }}-travis995.0f91801.x86_64.rpm"
# Google Antigravity downloads come from Google's official CDN, edgedl.me.gvt1.com.
# `gvt1.com` is Google Video Transcoding — Google-owned, same CDN that delivers
# Chrome itself. Not third-party.
# Update `antigravity_version` / `antigravity_build` to the latest from
# https://antigravity.google/download.
antigravity_version = "1.13.3"
antigravity_build = "4533425205018624"
antigravity_cdn_base = "https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/{{ antigravity_version }}-{{ antigravity_build }}"
antigravity_linux_tarball_url = "{{ antigravity_cdn_base }}/linux-x64/Antigravity.tar.gz"
# NOTE: Google's APT/YUM pool paths are not publicly addressable (return 404
# even though the apt repo metadata lists them). Linux installs use the
# tarball above instead — see custom_installs.yaml.
teamviewer_file = "teamviewer_amd64.deb"
veracrypt_version = "1.26.24"
veracrypt_file = "veracrypt-{{ veracrypt_version }}-Ubuntu-24.04-amd64.deb"
# Aurora Store moved off files.auroraoss.com (DNS no longer resolves) to
# auroraoss.com/downloads/AuroraStore/Latest/latest.apk — a rolling redirect
# that always returns the newest stable APK. Aurora Droid project is
# discontinued upstream; install via Aurora Store's repo browser instead.
aurora_store_file = "latest.apk"
gridcoin_version = "5.5.0.0"
gridcoin_flatpak_url = "https://github.com/gridcoin-community/Gridcoin-Research/releases/download/{{ gridcoin_version }}/gridcoin-{{ gridcoin_version }}-x86_64.flatpak"
# Lens Desktop ships via downloads.k8slens.dev (apt/yum repos). Free for
# personal use; install via the official apt/dnf repos on Linux (set up in
# debian_repos.yaml / fedora_repos.yaml) — package name `lens`. No AppImage
# fallback: the previous URL was not stable; if you really need a portable
# binary, download from https://lenshq.io/download manually.
gputest_version = "0.7.0"
gputest_url = "https://ozone3d.net/gputest/dl/GpuTest_Linux_x64_{{ gputest_version }}.zip"
# Razer ships evergreen installer URLs with no version in the path, both reached
# from razer.com via the rzr.to short links (cortex-download, synapse-4-mac-download).
razer_synapse_macos_pkg_url = "https://dl.razerzone.com/drivers/Synapse4/mac/RazerSynapseInstaller.pkg"
# Fedora has no OpenRazer package; upstream ships it from the openSUSE Build Service.
openrazer_fedora_repo_url = "https://openrazer.github.io/hardware:razer.repo"
# The key that signs both the Tailscale Fedora packages and the repository metadata. fedora_repos.yaml
# downloads it and refuses it unless its one primary key has this fingerprint, because the metadata
# check runs dnf with -y, which would otherwise accept whatever the URL served. Measured on 2026-10-11
# with `gpg --show-keys --with-colons` on the downloaded file: one primary key,
# "Tailscale Inc. (Package repository signing key) <info@tailscale.com>", created 2020-02-25. Before
# changing either value, download the key again and read its fingerprint the same way.
tailscale_fedora_key_url = "https://pkgs.tailscale.com/stable/fedora/repo.gpg"
tailscale_fedora_key_fingerprint = "2596A99EAAB33821893C0A79458CA832957F5868"
balena_etcher_version = "2.1.6"
balena_etcher_url = "https://github.com/balena-io/etcher/releases/download/v{{ balena_etcher_version }}/balena-etcher_{{ balena_etcher_version }}_amd64.deb"
balena_etcher_rpm_url = "https://github.com/balena-io/etcher/releases/download/v{{ balena_etcher_version }}/balena-etcher-{{ balena_etcher_version }}-1.x86_64.rpm"
teamviewer_rpm_url = "https://download.teamviewer.com/download/linux/teamviewer.x86_64.rpm"
# No CentOS Stream 9 RPM is published. The CentOS-8 build works on Fedora 38+
# and RHEL/CentOS 8/9 (verified against veracrypt.io download manifest).
veracrypt_rpm_url = "https://launchpad.net/veracrypt/trunk/{{ veracrypt_version }}/+download/veracrypt-{{ veracrypt_version }}-CentOS-8-x86_64.rpm"
# OpenCode desktop, version 2. No package manager carries version 2 on Debian, Ubuntu, Fedora or Windows: Flathub,
# winget's SST.OpenCodeDesktop and Chocolatey's opencode-desktop are all version 1, read on 2026-10-15. The vendor
# serves every release under one path per version and keeps the old ones, 2.0.1 still answered 200 on 2026-10-15.
# Verify the newest with `curl -fsSL https://opencode.ai/update/api/latest/desktop/opencode`, which is the same
# endpoint the AUR opencode-desktop-bin package checks. The Windows installer is signed by Anomaly Innovations, Inc.
opencode_desktop_version = "2.0.29"
opencode_desktop_base = "https://opencode.ai/files/bin/{{ opencode_desktop_version }}"
opencode_desktop_url = "{{ opencode_desktop_base }}/opencode-desktop-linux-amd64.deb"
opencode_desktop_rpm_url = "{{ opencode_desktop_base }}/opencode-desktop-linux-x86_64.rpm"
opencode_desktop_win_installer_url = "{{ opencode_desktop_base }}/opencode-desktop-win-x64.exe"
# OpenCode desktop, version 1, read on the Mac only, when opencode_use_v1 is true. Homebrew's opencode-desktop cask is
# version 2 and there is no version 1 cask, read on formulae.brew.sh on 2026-10-15. Linux takes version 1 from Flathub
# and Windows from winget. The anomalyco/opencode GitHub releases carry version 1 only, v1.19.1 is the newest there,
# published 2026-10-15, and both DMGs hold OpenCode.app with bundle id ai.opencode.desktop, needing macOS 12 or newer.
opencode_desktop_v1_version = "1.19.1"
opencode_desktop_v1_base = "https://github.com/anomalyco/opencode/releases/download/v{{ opencode_desktop_v1_version }}"
opencode_desktop_v1_macos_arm64_dmg_url = "{{ opencode_desktop_v1_base }}/opencode-desktop-mac-arm64.dmg"
opencode_desktop_v1_macos_x86_64_dmg_url = "{{ opencode_desktop_v1_base }}/opencode-desktop-mac-x64.dmg"
# Minikube versions are real semver tags (e.g. v1.38.1); 'latest' is a redirect
# alias and not a real release filename. Pin a real release. Verify latest via
# https://github.com/kubernetes/minikube/releases/latest.
minikube_version = "v1.38.1"
minikube_deb_version = "1.38.1-0"
minikube_file = "minikube_{{ minikube_deb_version }}_amd64.deb"
minikube_rpm_file = "minikube-{{ minikube_deb_version }}.x86_64.rpm"
# Kubernetes community apt/dnf repo minor stream. pkgs.k8s.io maintains a
# directory per minor. v1.36 is the current stable as of 2026-04 (1.34 EOL 2026-10-27).
kubernetes_repo_minor = "v1.36"

# Java SDKMAN versions (Temurin builds — verify against
# `https://api.sdkman.io/2/candidates/java/linuxx64/versions/list` before bumping)
java11_id = "11.0.31-tem"
java17_id = "17.0.19-tem"
java21_id = "21.0.11-tem"
java25_id = "25.0.3-tem"
default_java = "{{ java21_id }}"

# Gradle SDKMAN version, used only on the OSes whose own repositories cannot supply
# a usable Gradle: Debian ships 4.4.1 and Fedora ships none. Verify against
# `https://api.sdkman.io/2/candidates/gradle/linuxx64/versions/list` before bumping.
# This tracks SDKMAN's own default rather than the newest release, because Gradle 10
# is a major version that many existing builds are not ready for.
gradle_id = "9.7.0"

# Python Pyenv versions
python310_id = "3.10.20"
python311_id = "3.11.15"
python312_id = "3.12.13"
python313_id = "3.13.13"
default_python = "{{ python311_id }}"

# Node NVM version
nvm_version = "0.40.4"

# Flutter via FVM
flutter_channel = "stable"

# Android SDK (update build number from https://developer.android.com/studio#command-line-tools-only)
android_cmdline_tools_build = "14742923"
android_build_tools_version = "35.0.0"
android_api_level = "35"

# Stable Diffusion WebUI (AUTOMATIC1111) — pinned to avoid HEAD drift each run.
# Bump after testing; supply-chain risk if left unpinned.
stable_diffusion_webui_version = "v1.10.1"

# applet-window-buttons, the Plasma panel widget kde_plasma_setup builds from source.
# psifidotos/applet-window-buttons and the chermnyx fork this used to clone are both
# Plasma 5 / KDE Frameworks 5 projects, and the fork is archived upstream. Every current
# release of all four supported Linux families ships Plasma 6 with Frameworks 6 only, so
# neither can configure any more. moodyhunter/applet-window-buttons6 is the Plasma 6 port
# and is what OpenMandriva packages. Verify the newest tag at
# https://github.com/moodyhunter/applet-window-buttons6/tags before bumping.
applet_window_buttons_repo = "https://github.com/moodyhunter/applet-window-buttons6.git"
applet_window_buttons_version = "v0.14.0"

# Fonts
meslo_regular_url = "https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Regular.ttf"
meslo_bold_url = "https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Bold.ttf"
meslo_italic_url = "https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Italic.ttf"
meslo_bold_italic_url = "https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Bold%20Italic.ttf"

# Download Links
appimage_launcher_url = "https://github.com/TheAssassin/AppImageLauncher/releases/download/v{{ appimage_launcher_version }}/{{ appimage_launcher_file }}"
appimagelauncher_url = "{{ appimage_launcher_url }}"
appimage_launcher_rpm_url = "https://github.com/TheAssassin/AppImageLauncher/releases/download/v{{ appimage_launcher_version }}/{{ appimage_launcher_rpm_file }}"
# Antigravity Linux: install via the vendor's apt or yum repository, which is what gets auto-updates.
# The repository is registered by debian_core and fedora_core rather than by debian_repos.yaml and
# fedora_repos.yaml, which is where this comment used to send the reader.
#
# These two bases exist as pins because both roles were writing the same URL literally, so one address
# lived in two files and a change would have had to be made twice. Verified live rather than assumed:
# the Debian Release file answers 200. The package pool paths beneath it are a different matter, see
# the note further up.
antigravity_apt_repo = "https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev"
antigravity_yum_repo = "https://us-central1-yum.pkg.dev/projects/antigravity-auto-updater-dev/antigravity-rpm"
# For live USB or repo-less installs, the Linux tarball at edgedl.me.gvt1.com is
# available — see antigravity_linux_tarball_url above.
gridcoin_win_installer_url = "https://github.com/gridcoin-community/Gridcoin-Research/releases/download/{{ gridcoin_version }}/gridcoin-{{ gridcoin_version }}-win64-setup.exe"
gridcoin_macos_dmg_url = "https://github.com/gridcoin-community/Gridcoin-Research/releases/download/{{ gridcoin_version }}/gridcoin-{{ gridcoin_version }}-macos-x86_64.dmg"
teamviewer_url = "https://download.teamviewer.com/download/linux/{{ teamviewer_file }}"
veracrypt_url = "https://launchpad.net/veracrypt/trunk/{{ veracrypt_version }}/+download/{{ veracrypt_file }}"
aurora_store_url = "https://auroraoss.com/downloads/AuroraStore/Latest/{{ aurora_store_file }}"
# Legacy VMware URL. Broadcom moved the download behind a Support Portal login, so it needs an
# authenticated session and nothing in this repository fetches it. Kept as the record of where the
# installer lives. Install VirtualBox instead, or drive the Broadcom portal by hand.
vmware_url = "https://support.broadcom.com/group/ecx/productdownloads?subfamily=VMware%20Workstation%20Player"
minikube_url = "https://github.com/kubernetes/minikube/releases/download/{{ minikube_version }}/{{ minikube_file }}"
minikube_rpm_url = "https://github.com/kubernetes/minikube/releases/download/{{ minikube_version }}/{{ minikube_rpm_file }}"

# ShellCheck for the tier 1 gate, which downloads the asset for its own shell's platform into
# e2e/.cache/ and refuses it unless the SHA-256 matches, so every machine checks with the same rules.
# Verify the newest stable tag with `gh api repos/koalaman/shellcheck/releases/latest`. The release
# publishes no checksum file, so each hash is measured with sha256sum on the downloaded asset and
# compared with the `digest` GitHub's API reports for it. Both agreed for v0.11.0 on 2026-10-11.
shellcheck_version = "0.11.0"
shellcheck_release_base = "https://github.com/koalaman/shellcheck/releases/download/v{{ shellcheck_version }}"
shellcheck_linux_x86_64_url = "{{ shellcheck_release_base }}/shellcheck-v{{ shellcheck_version }}.linux.x86_64.tar.gz"
shellcheck_linux_x86_64_sha256 = "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6"
shellcheck_linux_aarch64_url = "{{ shellcheck_release_base }}/shellcheck-v{{ shellcheck_version }}.linux.aarch64.tar.gz"
shellcheck_linux_aarch64_sha256 = "68a8133197a50beb8803f8d42f9908d1af1c5540d4bb05fdfca8c1fa47decefc"
shellcheck_macos_x86_64_url = "{{ shellcheck_release_base }}/shellcheck-v{{ shellcheck_version }}.darwin.x86_64.tar.gz"
shellcheck_macos_x86_64_sha256 = "c2c15e08df0e8fbc374c335b230a7ee958c313fa5714817a59aa59f1aa594f51"
shellcheck_macos_aarch64_url = "{{ shellcheck_release_base }}/shellcheck-v{{ shellcheck_version }}.darwin.aarch64.tar.gz"
shellcheck_macos_aarch64_sha256 = "339b930feb1ea764467013cc1f72d09cd6b869ebf1013296ba9055ab2ffbd26f"
shellcheck_windows_x86_64_url = "{{ shellcheck_release_base }}/shellcheck-v{{ shellcheck_version }}.zip"
shellcheck_windows_x86_64_sha256 = "8a4e35ab0b331c85d73567b12f2a444df187f483e5079ceffa6bda1faa2e740e"

# The gate container every e2e tier runs in, built from e2e/gate/Dockerfile by e2e/gate/provision.sh.
# PowerShell: verify the newest stable tag with `gh api repos/PowerShell/PowerShell/releases/latest`,
# whose `digest` per asset is the SHA-256 pinned here. v7.6.7 checked on 2026-10-15.
gate_pwsh_version = "7.6.7"
gate_pwsh_release_base = "https://github.com/PowerShell/PowerShell/releases/download/v{{ gate_pwsh_version }}"
gate_pwsh_linux_x86_64_url = "{{ gate_pwsh_release_base }}/powershell-{{ gate_pwsh_version }}-linux-x64.tar.gz"
gate_pwsh_linux_x86_64_sha256 = "6896f9e3a6b0a354bf470835a96da76d2f801cd50dcf047ad7c4563bf93bf431"
gate_pwsh_linux_aarch64_url = "{{ gate_pwsh_release_base }}/powershell-{{ gate_pwsh_version }}-linux-arm64.tar.gz"
gate_pwsh_linux_aarch64_sha256 = "ba465efdfb0984c1c5dc5ed9eb0b79a7e91a1b52c45f99377058c0659b84d3f1"
# Pester stays on major 5, which e2e/tier1/windows_pester.sh and the CI job both ask for. Verify the
# newest 5.x on https://www.powershellgallery.com/packages/Pester, then measure the package with
# sha256sum. 5.9.1 measured on 2026-10-15.
gate_pester_version = "5.9.1"
gate_pester_url = "https://www.powershellgallery.com/api/v2/package/Pester/{{ gate_pester_version }}"
gate_pester_sha256 = "8dd4060fc3bc895f05bd655e4ab82abe346de54a4e6415dfb727cc8378672b69"
# Python tools for the gate, from PyPI. ansible-core must stay inside the range setup/setup.sh
# enforces, which provision.sh asserts while the image builds. Checked on PyPI on 2026-10-15.
gate_ansible_core_version = "2.21.5"
gate_yamllint_version = "1.38.0"
gate_ansible_lint_version = "26.10.1"

[checksums]
# Download integrity checksums. Populate with `sha256:<hex>` strings to enforce verification on the
# get_url tasks that fetch a vendor artifact. Empty or missing means no enforcement, which is where
# every entry stands today, so no vendor download in this repository is verified.
#
# Keys name the artifact, not the toggle, and every consumer follows that rule. For the six vendor
# .deb files dispatched from dynamic_install.yaml the key is the toggle name with `_deb` appended,
# because the toggle is what names the file. The examples below are the real key names, so populating
# one is a matter of pasting a hash beside it.
# jetbrains_toolbox = "sha256:..."
# antigravity_linux = "sha256:..."
# gridcoin_flatpak = "sha256:..."
# gridcoin_macos = "sha256:..."
# gputest = "sha256:..."
# razer_synapse_macos = "sha256:..."
# appimagelauncher_rpm = "sha256:..."
# minikube_deb = "sha256:..."
# teamviewer_deb = "sha256:..."
# veracrypt_deb = "sha256:..."
# appimagelauncher_deb = "sha256:..."
# balena_etcher_deb = "sha256:..."
# opencode_desktop_deb = "sha256:..."
