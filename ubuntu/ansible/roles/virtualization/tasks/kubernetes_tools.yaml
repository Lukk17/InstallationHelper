---
- name: Download and Install Minikube
  ansible.builtin.apt:
    deb: "{{ minikube_url }}"
  become: yes
  when: install_minikube | bool

- name: Download Kind
  ansible.builtin.get_url:
    url: "{{ kind_url }}"
    dest: /usr/local/bin/kind
    mode: '0755'
  become: yes
  when: install_kind | bool
