---
- name: Setup Dash-to-Dock
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop:
    - { key: "/org/gnome/shell/extensions/dash-to-dock/dock-position", value: "'LEFT'" }
    - { key: "/org/gnome/shell/extensions/dash-to-dock/transparency-mode", value: "'FIXED'" }
    - { key: "/org/gnome/shell/extensions/dash-to-dock/dash-max-icon-size", value: "55" }
    - { key: "/org/gnome/shell/extensions/dash-to-dock/intellihide", value: "true" }
  become: no
