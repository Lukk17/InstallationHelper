---
- name: Create Templates directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/Templates"
    state: directory
    mode: '0755'
  become: no

- name: Create basic template files
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/Templates/{{ item }}"
    state: touch
    mode: '0644'
  loop:
    - file
    - text.txt
    - Document.docx
    - Presentation.pptx
    - Spreadsheet.xlsx
  become: no
