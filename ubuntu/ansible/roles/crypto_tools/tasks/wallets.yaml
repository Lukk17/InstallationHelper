---
- name: Install Exodus Wallet
  ansible.builtin.apt:
    deb: "{{ exodus_url }}"
  become: yes

- name: Download Ledger Live AppImage
  ansible.builtin.get_url:
    url: "{{ ledger_live_url }}"
    dest: "{{ ansible_env.HOME }}/.lukkInstall/{{ ledger_live_file }}"
    mode: '0755'
  become: no

- name: Download Trezor Suite AppImage
  ansible.builtin.get_url:
    url: "{{ trezor_suite_url }}"
    dest: "{{ ansible_env.HOME }}/.lukkInstall/{{ trezor_suite_file }}"
    mode: '0755'
  become: no
