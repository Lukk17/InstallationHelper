  stage3_windows_defaults:
    name: "Windows default apps"
    needs: [stage1_gate, stage2_verdict]
    if: "!cancelled() && needs.stage1_gate.outputs.ok == 'true'"
    runs-on: windows-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The wizard's last phase installs Ansible inside WSL, and a runner has WSL with no
      # distribution registered, so it correctly reported "there is nothing to install Ansible into"
      # and failed the cell. Registering one is the honest fix: it exercises the real path instead of
      # teaching the wizard to forgive an empty WSL, which is a state a user should hear about.
      #
      # --no-launch on purpose. Without it the first launch stops at a prompt for a username and
      # password, which in a job nobody is watching is an unbounded hang, and that is the same
      # reasoning WindowsSettings.ps1 already carries for its own WSL install.
      #
      # Failure here is reported and does not stop the job, because a runner image where WSL cannot
      # register is a fact about the runner, and the wizard's own message about it is the thing under
      # test either way.
      # Every Windows job installs real software onto a runner whose C: drive is mostly full of
      # toolchains none of this needs. The "every application turned on" cell died at 73 minutes on
      # 2026-08-22 with "System.IO.IOException: There is not enough space on the disk", while writing
      # the runner's own diagnostic log, which is what a full disk looks like from the outside: not a
      # failed install, a dead runner.
      #
      # So the preinstalled toolchains go first. Every path here is something the image ships and
      # nothing in this repository uses: the Android SDK the image carries, which is not the one
      # setup.ps1 installs at C:\tools\android, four language runtimes, and the parts of the
      # hosted tool cache holding Go, Java, Ruby and PyPy builds.
      #
      # The tool cache is pruned rather than emptied, and what it keeps is deliberate. The first
      # version removed all of C:\hostedtoolcache\windows, and the run then filled with
      # "Python was not found" and "Unable to create process using
      # C:\hostedtoolcache\windows\Python\3.14.7\x64\python.exe\", because the runner's PATH still
      # pointed into a cache it no longer had. Node lives there too and npm needs it. Nothing
      # failed over it, but a log full of noise about a deleted interpreter is how a real message
      # gets missed. Free space is printed before and after rather than
      # asserted, because the number is a property of the image and changes without notice, and a
      # figure in a log is what the next reader needs.
      #
      # continue-on-error, because a path that has moved or a delete that is refused is not a reason
      # to fail a cell that has not installed anything yet. The wizard reports the disk itself if it
      # runs out anyway.
      - name: Make room on the runner, which ships full of toolchains this does not use
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          function Show-Free([string] $When) {
            $drive = Get-PSDrive -Name C
            Write-Host ("{0}: {1:N1} GB free of {2:N1} GB on C:" -f $When,
              ($drive.Free / 1GB), (($drive.Free + $drive.Used) / 1GB))
          }
          Show-Free 'before'
          # Measured on the all apps cell of run 32864564543: this list freed 17 GB, taking the
          # runner from 29.2 to 46.1 GB free, and the software set still exhausted it. `wsl --install`
          # said so outright with Wsl/InstallDistro/0x80070070, and the two failures either side of it
          # were the same cause in disguise, an access violation from the Arduino installer and the
          # Android SDK dying at 85 per cent while unzipping. Neither of those mentions disk.
          #
          # So the larger items were added below the original eleven. Visual Studio alone is roughly
          # 14 GB on this image.
          #
          # Node and Python stay. The CLI tools phase calls npm directly and the pinned values reader
          # can fall back to Python, so removing either would trade a disk problem for a missing tool.
          $targets = @(
            'C:\Android',
            'C:\Program Files (x86)\Android',
            'C:\hostedtoolcache\windows\Go',
            'C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk',
            'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\PyPy',
            'C:\Miniconda',
            'C:\ghcup',
            'C:\Julia',
            'C:\Program Files\MongoDB',
            'C:\Program Files\Microsoft SDKs\Azure',
            'C:\Program Files\Microsoft Visual Studio',
            'C:\Program Files (x86)\Microsoft Visual Studio',
            'C:\Program Files\Microsoft SQL Server',
            'C:\Program Files (x86)\Microsoft SQL Server',
            'C:\Program Files\dotnet',
            'C:\Program Files (x86)\Windows Kits',
            'C:\Program Files\LLVM',
            'C:\Program Files\R',
            'C:\SeleniumWebDrivers',
            'C:\Program Files\PostgreSQL'
          )
          foreach ($path in $targets) {
            if (Test-Path -LiteralPath $path) {
              $size = (Get-ChildItem -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue |
                       Measure-Object -Property Length -Sum).Sum
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host ("  removed {0} ({1:N1} GB)" -f $path, ($size / 1GB))
            } else {
              Write-Host "  absent, nothing to remove: $path"
            }
          }
          Show-Free 'after'

      - name: Register Ubuntu inside WSL, which a bare runner has none of
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          wsl --set-default-version 2 2>&1 | Write-Host
          wsl --install --distribution Ubuntu-26.04 --no-launch 2>&1 | Write-Host
          Write-Host "wsl --install exited $LASTEXITCODE"
          wsl --list --verbose 2>&1 | Write-Host

      - name: Run the bootstrap wizard, toggles as shipped
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path (Join-Path $env:RUNNER_TEMP 'wizard-run.log') -Force | Out-Null
          try {
            & ./setup/setup.ps1 -NonInteractive -AllowAdministrator -SkipSystemUpgrade
            if ($LASTEXITCODE -ne 0) { throw "setup.ps1 exited $LASTEXITCODE" }
          } finally {
            Stop-Transcript | Out-Null
          }

      - name: Collect wizard log artefacts
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'wizard-logs') | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'wizard-run.log') (Join-Path $env:RUNNER_TEMP 'wizard-logs') -ErrorAction SilentlyContinue
          # NEVER RUN IN CI: a verification step is being added to setup.ps1 in a concurrent
          # change, and its log file name is not known yet. This assumes it follows the same
          # installation_*.log convention already used on Linux and macOS, under the Windows
          # analogue of $HOME. If that assumption is wrong, this glob finds nothing and the
          # upload step below warns rather than failing the job.
          Get-ChildItem -Path $env:USERPROFILE -Filter 'installation_*.log' -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination (Join-Path $env:RUNNER_TEMP 'wizard-logs') -ErrorAction SilentlyContinue

      - name: Upload wizard log artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stage3-windows-defaults-${{ github.run_id }}
          path: ${{ runner.temp }}\wizard-logs\
          if-no-files-found: warn
          retention-days: 14

