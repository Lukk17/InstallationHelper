    # Casks target current macOS: rawtherapee refuses to install on anything older than Tahoe, which
    # is macOS 26, and it took the whole cask batch of the 2026-08-22 sweep down with it on a
    # macos-14 runner. Homebrew supports the newest few releases and casks follow, so testing on a
    # 2023 image guarantees more of this. macos-26 is a documented GitHub-hosted label.
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
