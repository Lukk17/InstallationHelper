    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      # The exit code carries the whole answer now, and there is no output beside it. An earlier
      # version always exited 0 and answered only through an output, so the run showed a green tick
      # beside a red stage, which is exactly the shape of misreporting this repository keeps paying
      # for. A bypassed stage still exits 0, because being told to skip it is not a failure.
      - id: gate
        env:
          START_FROM: ${{ inputs.start_from_stage }}
          STAGE1_OK: ${{ needs.stage1_gate.outputs.ok }}
          # One string holding every cell's result, so the verdict does not need to name
          # forty-eight variables. A cell that was skipped by the dispatch filter contributes
          # 'skipped', which is not a failure.
          CELL_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          if [[ "${STAGE1_OK}" != "true" ]]; then
